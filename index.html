anglios mesentéricos:","ops":{"a":"Drenan la linfa de la mucosa intestinal hacia los ganglios mesentéricos","b":"Vierten la linfa procesada por los ganglios hacia el bazo","c":"Transportan los antígenos dérmicos a los ganglios mesentéricos","d":"Todas son ciertas","e":"Todas son falsas"},"cor":"a","razones":{"a":"CORRECTA: aferente = de ENTRADA; llevan la linfa (con antígenos y DCs) desde el territorio drenado — aquí la {{mucosa intestinal}} — hacia el ganglio mesentérico.","b":"Falsa: la linfa que sale del ganglio va por el vaso {{eferente}} hacia el conducto torácico y de ahí a la sangre — el bazo NO recibe linfa (filtra sangre).","c":"Falsa: los antígenos {{dérmicos}} drenan a los ganglios regionales de la piel (p. ej. inguinales/axilares), no a los mesentéricos, que drenan el intestino.","d":"Falsa: solo la a es cierta — b y c contienen errores de {{dirección}} y de territorio de drenaje.","e":"Falsa: la opción {{a}} es verdadera, luego no pueden ser todas falsas."},"expl":"Cada ganglio filtra la linfa de SU territorio: aferentes entran por la cápsula con antígenos del tejido drenado; la eferente sale por el hilio hacia el conducto torácico. El bazo queda fuera del circuito linfático: filtra sangre.","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (circulación linfática)","nota":null},{"k":"EX25-13","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T2 · Anatomía del sistema inmune","sub":"Cordones medulares del ganglio vs médula tímica","idioma":"castellano","enun":"¿Cuál de estos tipos celulares NO puede encontrarse nunca en los cordones medulares de los ganglios?","ops":{"a":"Linfocitos T vírgenes","b":"Linfocitos T activados","c":"mTECs","d":"Linfocitos B vírgenes","e":"Ninguna de las anteriores se encuentra en los cordones medulares"},"cor":"c","razones":{"a":"Falsa: los linfocitos T vírgenes recirculan por todo el ganglio (entran por las {{HEV}}) y pueden hallarse de paso en la médula ganglionar.","b":"Falsa: los linfocitos T activados y las células efectoras transitan por la médula del ganglio de camino a la linfa {{eferente}}.","c":"CORRECTA: las mTECs son células epiteliales de la médula del {{TIMO}} (expresan AIRE para la selección negativa) — no existen fuera del timo, jamás en un ganglio.","d":"Falsa: en los cordones medulares del ganglio hay linfocitos, macrófagos y sobre todo {{células plasmáticas}}; los B pueden encontrarse allí de paso.","e":"Falsa: los cordones medulares SÍ contienen células — típicamente {{células plasmáticas}}, macrófagos y linfocitos."},"expl":"Trampa de localización: 'medular' aparece en dos órganos distintos. Los cordones medulares del GANGLIO alojan células plasmáticas, macrófagos y linfocitos en tránsito; las mTECs (epitelio tímico medular, AIRE+) son exclusivas del TIMO.","nivel":"SALE_SEGURO","reina":"R9","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (ganglio) / TEMA 9 (mTECs, timo)","nota":null},{"k":"EX25-14","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T2 · Anatomía del sistema inmune","sub":"Centro germinal — funciones exclusivas","idioma":"castellano","enun":"¿Cuál de las siguientes funciones se lleva a cabo SOLO en los centros germinales?","ops":{"a":"Activación de los macrófagos","b":"Maduración de los timocitos","c":"Selección negativa de los linfocitos B","d":"Cambio de isotipo","e":"Producción de inmunoglobulinas"},"cor":"d","razones":{"a":"Falsa: los macrófagos se activan en cualquier {{tejido}} inflamado (IFNγ, PAMPs) — nada exclusivo del centro germinal.","b":"Falsa: los timocitos maduran en el {{timo}}, órgano linfoide primario — no pisan el centro germinal.","c":"Falsa: la selección negativa B ocurre en la {{médula ósea}} (sobre los B inmaduros autorreactivos), no en el centro germinal.","d":"CORRECTA: el cambio de {{isotipo}} (junto con la hipermutación somática y la maduración por afinidad) es exclusivo de la reacción del centro germinal, con ayuda Tfh y AID.","e":"Falsa: las inmunoglobulinas las secretan las células plasmáticas también FUERA del CG — sobre todo en la {{médula ósea}} y los cordones medulares."},"expl":"Exclusivo del centro germinal: hipermutación somática + cambio de isotipo + maduración por afinidad (selección por FDCs y ayuda Tfh, enzima AID). La secreción de Ig ocurre donde haya células plasmáticas, dentro o fuera del CG.","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (centro germinal)","nota":null},{"k":"EX25-15","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T2 · Anatomía del sistema inmune","sub":"Folículos, manto, centroblastos y centrocitos","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"Los folículos primarios contienen centros germinales","b":"Los centros germinales contienen los folículos secundarios","c":"El manto contiene linfocitos B activados","d":"Los centroblastos no proliferan","e":"Los centrocitos no proliferan"},"cor":"e","razones":{"a":"Falsa: el folículo primario es de B {{vírgenes}} en reposo, SIN centro germinal; cuando se forma el CG pasa a llamarse folículo secundario.","b":"Falsa: la relación de continente-contenido está invertida — es el folículo {{secundario}} el que CONTIENE el centro germinal.","c":"Falsa: el manto es la corona de linfocitos B {{vírgenes}} desplazados que rodea el centro germinal, no B activados.","d":"Falsa: los centroblastos de la zona {{oscura}} son precisamente las células en proliferación intensa (y en hipermutación somática).","e":"CORRECTA: los centrocitos de la zona {{clara}} NO proliferan — son seleccionados por afinidad sobre las FDCs con ayuda de los Tfh."},"expl":"Folículo 2º ⊃ centro germinal, rodeado por el manto (B vírgenes). Dentro del CG: zona oscura = centroblastos (proliferan, hipermutan) → zona clara = centrocitos (no proliferan, se seleccionan por afinidad sobre FDCs).","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (folículo secundario / centro germinal)","nota":null},{"k":"EX25-16","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T2 · Anatomía del sistema inmune","sub":"Células secretoras de inmunoglobulinas","idioma":"castellano","enun":"¿Cuál de estas células es capaz de secretar inmunoglobulinas?","ops":{"a":"Centrocitos","b":"Centroblastos","c":"Células plasmáticas","d":"Centroblastos y células plasmáticas","e":"Ninguna de las anteriores"},"cor":"c","razones":{"a":"Falsa: los centrocitos expresan el BCR de {{membrana}} (con él compiten por el antígeno en las FDCs), pero no secretan Ig soluble.","b":"Falsa: los centroblastos proliferan e hipermutan, pero su Ig sigue siendo de {{membrana}} — todavía no son células secretoras.","c":"CORRECTA: solo las células {{plasmáticas}} (B diferenciados terminalmente) secretan inmunoglobulina soluble en grandes cantidades.","d":"Falsa: sobra el centroblasto — de la pareja solo la célula {{plasmática}} secreta.","e":"Falsa: sí hay una secretora en la lista: la célula {{plasmática}}."},"expl":"La secreción de anticuerpos es exclusiva de la célula plasmática (splicing alternativo: de Ig de membrana a Ig secretada). Centroblastos y centrocitos son estadios del centro germinal con BCR de membrana.","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (centro germinal → células plasmáticas)","nota":null},{"k":"EX25-17","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T9 · Ontogenia linfocitos B y T","sub":"Ontogenia B — selección negativa medular","idioma":"castellano","enun":"La selección negativa en la médula ósea:","ops":{"a":"Afecta a los pre-B","b":"Afecta a los pro-B","c":"Afecta a los B inmaduros","d":"Afecta a las células estromales","e":"Afecta a los FDCs"},"cor":"c","razones":{"a":"Falsa: el pre-B solo expresa el {{pre-BCR}} (cadena pesada + cadena ligera sustituta) — aún no tiene un BCR completo que probar contra lo propio.","b":"Falsa: el pro-B está {{reordenando}} la cadena pesada — sin receptor en membrana no puede haber selección.","c":"CORRECTA: la selección negativa recae sobre el B {{inmaduro}}, que ya expresa {{IgM}} de membrana completa — si liga autoantígeno con fuerza: deleción, edición del receptor o anergia.","d":"Falsa: las células estromales son el {{nicho}} que da soporte y citocinas (IL-7) a la ontogenia — no son objeto de selección.","e":"Falsa: las FDCs (células dendríticas foliculares) viven en los {{folículos}} de los órganos secundarios y no participan en la selección medular."},"expl":"Solo puede seleccionarse a quien ya tiene receptor completo: el B inmaduro (IgM+ de membrana) es el estadio sometido a selección negativa en la médula ósea; puede salvarse por edición del receptor (re-reordenamiento de cadena ligera, requiere RAG).","nivel":"SALE_SEGURO","reina":"R9","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (ontogenia B — selección negativa)","nota":null},{"k":"EX25-18","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T10 · Citocinas y quimiocinas","sub":"Citocinas activadoras de NK","idioma":"castellano","enun":"Señala cuál de las siguientes citocinas está implicada en la activación de las NK:","ops":{"a":"IL-10","b":"IL-9","c":"IL-13","d":"IL-5","e":"Ninguna de las anteriores"},"cor":"e","razones":{"a":"Falsa: la IL-10 es la citocina {{antiinflamatoria}}/reguladora por excelencia (inhibe macrófagos y la presentación) — no activa NK.","b":"Falsa: la IL-9 es del perfil {{Th2}} — actúa sobre mastocitos, no sobre las NK.","c":"Falsa: la IL-13 es Th2 — induce {{moco}} y colabora en la respuesta antihelmintos/alergia, no activa NK.","d":"Falsa: la IL-5 es Th2 — su diana son los {{eosinófilos}} (producción y activación).","e":"CORRECTA: ninguna de las listadas activa NK; las activadoras reales son {{IL-12, IL-15 e IL-18}} (y también IL-2)."},"expl":"Las NK se activan por IL-12 (de macrófagos/DCs, que además induce IFNγ), IL-15 (también su desarrollo) e IL-18, más IL-2. Las cuatro opciones ofrecidas son citocinas Th2/reguladoras — de ahí el 'ninguna'.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (citocinas de la innata / NK)","nota":"Giro 'ninguna de las anteriores' sobre la clásica 'IL-12 activa NK' (2017 q2, 2020 q32). Apuesta nº5 de PATRONES §4."},{"k":"EX25-19","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T3 · Inmunidad innata","sub":"Biología del neutrófilo","idioma":"castellano","enun":"Los neutrófilos:","ops":{"a":"Tienen gránulos microbicidas","b":"Son fagocíticos","c":"Expresan lisozima","d":"Pueden expresar NADPH oxidasa","e":"Todas son verdad"},"cor":"e","razones":{"a":"Cierta: sus gránulos primarios (azurófilos) y secundarios contienen {{defensinas}}, mieloperoxidasa, lactoferrina y lisozima — armamento microbicida preformado.","b":"Cierta: el neutrófilo es el fagocito {{más abundante}} de la sangre y el primero en llegar al foco de infección.","c":"Cierta: la {{lisozima}} de sus gránulos degrada el peptidoglicano de la pared bacteriana.","d":"Cierta: la {{NADPH oxidasa}} se ensambla en la membrana del fagosoma y dispara el estallido oxidativo (O₂·⁻ → H₂O₂ → HOCl).","e":"CORRECTA: {{todas}} las anteriores son verdaderas — describen al neutrófilo de manual."},"expl":"El neutrófilo reúne todo el arsenal microbicida: fagocitosis, gránulos preformados (defensinas, MPO, lisozima, lactoferrina), estallido oxidativo por NADPH oxidasa y, además, NETosis.","nivel":"PUEDE_SALIR","reina":"R19","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (fagocitos — neutrófilo)","nota":null},{"k":"EX25-24","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T8 · Igs, BCR y TCR","sub":"IgE — receptores y funciones","idioma":"castellano","enun":"Las IgEs:","ops":{"a":"Activan el ADCC","b":"Promueven la activación de la vía clásica del complemento","c":"Se unen al componente secretor","d":"Se unen a receptores FcγRI","e":"Ninguna de las anteriores"},"cor":"a","razones":{"a":"CORRECTA: la IgE media ADCC (citotoxicidad celular dependiente de anticuerpo) de los {{eosinófilos}} frente a {{helmintos}}, a través de sus receptores Fcε.","b":"Falsa: la vía clásica la activan {{IgM e IgG}} (unión de C1q a sus Fc); la IgE NO fija complemento.","c":"Falsa: el componente secretor se asocia a la {{IgA dimérica}} (deriva del receptor poli-Ig del enterocito), no a la IgE.","d":"Falsa: los FcγRI (CD64) ligan {{IgG}}; el receptor de alta afinidad de la IgE es el {{FcεRI}} de mastocitos y basófilos.","e":"Falsa: la opción a es verdadera — la IgE sí participa en {{ADCC}} antiparasitaria."},"expl":"IgE: no fija complemento, no viaja con componente secretor; su nicho es la respuesta antihelmintos y la alergia — sensibiliza mastocitos/basófilos vía FcεRI y arma a los eosinófilos para ADCC vía Fcε.","nivel":"SALE_SEGURO","reina":"R4","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (IgE — 'implicada en la respuesta a parásitos (helmintos)', ADCC)","nota":"En el PDF de Wuolah figura 'IgE-ds' (errata de la reconstrucción por 'IgEs')."},{"k":"EX25-25","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T8 · Igs, BCR y TCR","sub":"RSS — recombinación V(D)J","idioma":"castellano","enun":"Señala la afirmación correcta respecto a las inmunoglobulinas:","ops":{"a":"Las RSS flanquean los segmentos V y J de las cadenas ligeras que se han de recombinar","b":"Las RSS están formadas por un heptámero y un nonámero separados por una secuencia espaciadora de 12 bp","c":"Las RSS están formadas por un heptámero y un nonámero separados por una secuencia espaciadora de 23 bp","d":"Las RSS flanquean los segmentos V y D y J de las cadenas pesadas que se han de recombinar","e":"Ninguna de las anteriores es verdadera"},"cor":"d","razones":{"a":"Dudosa/cierta a medias: en las cadenas ligeras las RSS efectivamente flanquean los segmentos {{V y J}} — tal como está redactada también sería verdadera (pregunta ambigua en la reconstrucción).","b":"Falsa por incompleta: el espaciador no es siempre de 12 bp — hay DOS tipos de RSS, con espaciador de {{12 O 23}} pb (regla 12/23: solo recombinan RSS de espaciador distinto).","c":"Falsa por incompleta: mismo error que la b — decir 'siempre {{23}} bp' ignora que existen los dos tipos de espaciador.","d":"CORRECTA (propuesta): en la cadena pesada las RSS flanquean los tres tipos de segmento — {{V, D y J}} — que han de recombinarse (la pesada es la única con segmentos D).","e":"Falsa: al menos la d (y posiblemente la a) es verdadera."},"expl":"RSS = secuencia señal de recombinación: heptámero + nonámero separados por espaciador de 12 o 23 pb (dos tipos; regla 12/23). Flanquean todos los segmentos a recombinar: V-J en cadenas ligeras y V-D-J en la pesada.","nivel":"SALE_SEGURO","reina":"R6","clave":"razonada","conf":"BAJA","diapo":"TEMA 8 (RSS, espaciadores 12/23 bp)","nota":"PREGUNTA AMBIGUA tal como está reconstruida: a y d parecen ambas verdaderas. Se propone d (más completa: incluye los segmentos D exclusivos de la pesada), pero sin clave oficial la confianza es BAJA. Lo seguro para el examen: dos tipos de RSS (12 vs 23 pb) y regla 12/23."},{"k":"EX25-26","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T8 · Igs, BCR y TCR","sub":"Maquinaria V(D)J — RAG","idioma":"castellano","enun":"RAG-2:","ops":{"a":"Es una DNA polimerasa","b":"Es una endonucleasa","c":"Es una DNA ligasa","d":"Es una tirosina-kinasa","e":"Es una serina-treonina-kinasa"},"cor":"b","razones":{"a":"Falsa: la polimerasa 'sin molde' de la V(D)J es la {{TdT}} (desoxinucleotidil transferasa terminal), que añade los nucleótidos N — no RAG.","b":"CORRECTA: el complejo RAG1/RAG2 es una {{endonucleasa}} — reconoce las RSS y corta el DNA de doble cadena, iniciando la recombinación V(D)J.","c":"Falsa: la ligación final de los extremos la hace la maquinaria de reparación {{NHEJ}} (unión de extremos no homólogos: DNA ligasa IV, Ku…), no RAG.","d":"Falsa: las tirosina-kinasas del temario ({{Lck, ZAP-70}}) pertenecen a la señalización del TCR, no a la recombinación.","e":"Falsa: RAG-2 no fosforila nada — su función es {{cortar DNA}} junto a RAG-1."},"expl":"Reparto de papeles en la V(D)J: RAG1/2 = endonucleasa que corta en las RSS (inicia); Artemis abre las horquillas; TdT añade nucleótidos N; Ku/DNA-ligasa IV (NHEJ) reparan y unen. AID no participa (es de hipermutación y switch).","nivel":"SALE_SEGURO","reina":"R6","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (recombinasa RAG1/RAG2)","nota":null},{"k":"EX25-27","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T8 · Igs, BCR y TCR","sub":"Cambio de isotipo — unidireccionalidad (locus IGH)","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"Un linfocito B que secrete IgAs puede cambiar de isotipo para que su progenie produzca IgGs","b":"Un linfocito B que secrete IgGs puede cambiar de isotipo para que su progenie produzca IgMs","c":"Un linfocito B que secrete IgGs puede cambiar de isotipo para que su progenie produzca IgDs","d":"Un linfocito B que secrete IgEs puede cambiar de isotipo para que su progenie produzca IgGs","e":"Un linfocito B que secrete IgEs puede cambiar de isotipo para que su progenie produzca IgAs"},"cor":"e","razones":{"a":"Falsa: el switch funciona por {{deleción}} del DNA intermedio — desde Cα (sobre todo Cα2, al final del locus) los genes Cγ ya se han eliminado: no se puede volver a IgG.","b":"Falsa: {{Cμ}} (IgM) es el primer gen del locus y se deleciona con el primer switch — jamás se puede regresar a IgM.","c":"Falsa: a {{IgD}} ni siquiera se llega por switch clásico (Cδ se coexpresa con Cμ por splicing alternativo); desde IgG es imposible retroceder.","d":"Falsa: los genes {{Cγ}} están AGUAS ARRIBA de Cε en el locus — al llegar a IgE ya se delecionaron: no hay vuelta a IgG.","e":"CORRECTA: {{Cα2}} es el último gen del locus IGH, aguas abajo de Cε — desde IgE todavía se puede saltar 'hacia delante' a IgA."},"expl":"Orden del locus IGH: Cμ-Cδ-Cγ3-Cγ1-Cα1-Cγ2-Cγ4-Cε-Cα2. El switch deleciona todo lo intermedio → solo se avanza, nunca se retrocede. Único salto posible desde IgE: a IgA (Cα2). Este concepto se recicló casi literal como Q5 del examen 2026.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (cambio de isotipo, locus IGH)","nota":"Reciclada casi literal en 2026 (Q5) — estreno 2025 convertido ya en temario examinable (PATRONES §6)."},{"k":"EX25-28","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T9 · Ontogenia linfocitos B y T","sub":"Ontogenia T — proT/preT y selecciones","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"Un timocito proT ya ha reordenado exitosamente la cadena β o δ del TCR","b":"Un timocito preT ya ha reordenado exitosamente la cadena α o γ del TCR","c":"Un linfocito T inmaduro ya ha superado la selección negativa","d":"Un linfocito T maduro todavía ha de someterse a la selección negativa","e":"Ninguna de las anteriores"},"cor":"e","razones":{"a":"Falsa: el proT está {{todavía reordenando}} — quien ya reordenó con éxito la cadena β (y expresa el pre-TCR con pTα) es el {{preT}}.","b":"Falsa: el preT ha reordenado la cadena {{β}}; la cadena α se reordena DESPUÉS, inducida por la señal del pre-TCR.","c":"Falsa: el T inmaduro aún tiene por delante las selecciones — la negativa ocurre en la {{médula tímica}} (mTECs con AIRE, DCs) antes de ser maduro.","d":"Falsa: el T maduro que sale del timo YA {{superó}} la selección negativa — por definición es autotolerante.","e":"CORRECTA: {{ninguna}} es correcta — cada opción invierte el orden real de reordenamientos o selecciones."},"expl":"Secuencia tímica: proT (reordenando β) → preT (β reordenada + pTα = pre-TCR, que induce el reordenamiento de α) → DP (selección positiva, corteza/cTECs) → selección negativa (médula, mTECs-AIRE/DCs) → T maduro SP autotolerante.","nivel":"SALE_SEGURO","reina":"R8","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (ontogenia T)","nota":null},{"k":"EX25-29","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T11 · Moléculas de adhesión","sub":"Moléculas de adhesión — selectinas, integrinas, adresinas","idioma":"castellano","enun":"Señala la afirmación INCORRECTA:","ops":{"a":"GlyCAM-1 es un factor de adhesión débil","b":"ICAM-1 se expresa en el endotelio inflamado","c":"MAdCAM es una integrina","d":"La P-selectina se expresa en el endotelio pulmonar","e":"VLA-4 es una integrina de expresión tardía"},"cor":"c","razones":{"a":"Cierta: GlyCAM-1 es un ligando mucínico de la {{L-selectina}} en las HEV — media el rodamiento, una adhesión {{débil}} y reversible.","b":"Cierta: ICAM-1 (ligando de la integrina {{LFA-1}}) se induce en el endotelio {{inflamado}} por TNF/IL-1 para la adhesión firme.","c":"CORRECTA (es la incorrecta): MAdCAM-1 NO es una integrina — es una {{ADRESINA}} vascular de las mucosas (superfamilia Ig/mucina), ligando de la integrina α4β7.","d":"Cierta: la P-selectina (preformada en los cuerpos de {{Weibel-Palade}}) se expresa en endotelio activado, incluido el pulmonar.","e":"Cierta: VLA significa literalmente '{{Very Late Antigen}}' — integrina de expresión/activación tardía tras la activación del linfocito."},"expl":"Tres familias que no hay que mezclar: selectinas (lectinas C, rodamiento débil) con ligandos mucínicos (GlyCAM-1, CD34, PSGL-1); integrinas (LFA-1, VLA-4, α4β7 — adhesión firme); y adresinas/superfamilia Ig como ligandos endoteliales (ICAM-1, VCAM-1, MAdCAM-1).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 11 (tabla de moléculas de adhesión)","nota":null},{"k":"EX25-30","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T10 · Citocinas y quimiocinas","sub":"Citocinas de la respuesta Th2","idioma":"castellano","enun":"¿Cuál de los siguientes factores NO está implicado en la respuesta Th2?","ops":{"a":"IL-2","b":"IL-4","c":"Histamina","d":"IL-9","e":"IL-5"},"cor":"a","razones":{"a":"CORRECTA: la IL-2 es la citocina de {{proliferación}} T general (autocrina, todas las subpoblaciones) — no forma parte del perfil efector Th2.","b":"Falsa (SÍ es Th2): la {{IL-4}} es LA citocina definitoria de Th2 — induce su diferenciación (GATA-3) y el switch a IgE.","c":"Falsa (SÍ implicada): la {{histamina}} liberada por mastocitos/basófilos degranulados es el efector final de la vía Th2/IgE.","d":"Falsa (SÍ es Th2): la IL-9 actúa sobre los {{mastocitos}} dentro del programa Th2.","e":"Falsa (SÍ es Th2): la IL-5 recluta y activa {{eosinófilos}} — pilar de la respuesta antihelmintos/alérgica."},"expl":"Perfil Th2 (GATA-3): IL-4, IL-5, IL-9, IL-13 → IgE, mastocitos, basófilos y eosinófilos (con histamina como mediador efector). La IL-2 es un factor de crecimiento T pan-subpoblación, no un marcador Th2.","nivel":"SALE_SEGURO","reina":"R12","clave":"razonada","conf":"ALTA","diapo":"TEMA 10/T12 (subpoblaciones Th y sus citocinas)","nota":null},{"k":"EX25-31","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T12 · Activación linfocitaria","sub":"Coestimulación — CD28","idioma":"castellano","enun":"¿Cuál de las siguientes es una molécula co-estimuladora de la actividad de Th y Tc?","ops":{"a":"CD28","b":"CD8","c":"CD4","d":"CD3γ","e":"CD3ε"},"cor":"a","razones":{"a":"CORRECTA: {{CD28}} es LA molécula coestimuladora del linfocito T (Th y Tc) — liga {{B7}} (CD80/86) en la APC y aporta la señal 2.","b":"Falsa: CD8 es un {{correceptor}} — se une al MHC de clase I y refuerza la señal 1, no es coestimulación.","c":"Falsa: CD4 es el {{correceptor}} que liga MHC de clase II — misma categoría que CD8, señal 1.","d":"Falsa: CD3γ forma parte del complejo CD3, que {{transduce}} la señal 1 del TCR (ITAMs) — no da señal 2.","e":"Falsa: CD3ε es otra cadena del complejo {{CD3}} — transducción de la señal 1, no coestimulación."},"expl":"Tres categorías que el profesor mezcla adrede: coestimuladoras (CD28-B7, CD40L, ICOS = señal 2), correceptores (CD4-MHC-II, CD8-MHC-I = refuerzan señal 1) y transductores (complejo CD3 con sus ITAMs = señal 1).","nivel":"SALE_SEGURO","reina":"R17","clave":"razonada","conf":"ALTA","diapo":"TEMA 12 (señales de activación / coestimulación)","nota":"En el PDF de Wuolah las opciones d/e figuran como 'CD3C' y 'CD3E' (erratas por CD3γ y CD3ε)."},{"k":"EX25-32","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T6 · APCs (presentadoras)","sub":"Presentación cruzada","idioma":"castellano","enun":"La presentación cruzada de antígenos:","ops":{"a":"No requiere la infección de la APC que la efectúa","b":"Implica la presentación de antígenos conformacionales por parte de las APCs","c":"Implica la presentación de antígenos lineales por parte de las APCs","d":"Requiere la infección de las APC que la lleva a cabo","e":"Solo pueden realizarla las FDCs"},"cor":"a","razones":{"a":"CORRECTA: es justo su gracia — la DC capta antígeno {{exógeno}} (restos de células infectadas/tumorales) y lo presenta por {{MHC de clase I}} a los Tc SIN estar ella misma infectada.","b":"Falsa: lo presentado en MHC son siempre PÉPTIDOS {{lineales}} procesados; los epítopos conformacionales solo los reconoce el BCR/anticuerpo.","c":"Dudosa como 'la mejor': aunque los péptidos presentados son lineales, esta opción no define la presentación cruzada — la clave distintiva es la ausencia de {{infección}} de la APC (opción a). (Ver nota_estudio.)","d":"Falsa: es exactamente lo contrario — si la APC estuviera infectada usaría la vía {{endógena}} clásica; la cruzada existe para presentar sin infectarse.","e":"Falsa: las FDCs NO son APCs (retienen antígeno nativo para los B); la presentación cruzada la hacen sobre todo las {{DCs}} convencionales."},"expl":"Presentación cruzada: la DC introduce antígenos exógenos en la vía del MHC-I para activar linfocitos Tc frente a virus que no la infectan y frente a tumores — sin necesidad de infectarse ella misma.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 6 (presentación cruzada)","nota":"La c ('antígenos lineales') es técnicamente compatible pero no es el rasgo definitorio; el precedente histórico (B14-1º q30) apunta a la a como respuesta esperada. En el PDF 'APA' es errata por 'APC'."},{"k":"EX25-33","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T12 · Activación linfocitaria","sub":"Señalización — Jun/AP-1 (+ miscelánea)","idioma":"castellano","enun":"¿Cuál de las siguientes afirmaciones NO es verdad?","ops":{"a":"El componente secretor es parte del receptor Poli-Ig","b":"PECAM facilita la diapedesis de los leucocitos","c":"Jun es una tirosina-kinasa","d":"MECL-1 pertenece al MAC","e":"HLA-DR presenta péptidos de 13-18 aa"},"cor":"c","razones":{"a":"Cierta: el componente secretor deriva de la degradación parcial del receptor {{poli-Ig}} del enterocito, que transporta la IgA dimérica a la luz mucosa.","b":"Cierta: PECAM-1 (CD31), en las uniones interendoteliales, facilita la {{diapedesis}} (migración transendotelial) de los leucocitos.","c":"CORRECTA (es la falsa): Jun NO es una kinasa — es un {{factor de transcripción}} que, con Fos, forma el complejo {{AP-1}} en la activación del linfocito T.","d":"Problemática: tal como está transcrita también es falsa — MECL-1 es una subunidad del {{inmunoproteasoma}} inducible por interferones, no del MAC; probable errata de la reconstrucción (el original diría 'al inmunoproteasoma', que es cierto).","e":"Cierta según la diapo del profesor: HLA-DR (MHC de clase II, surco abierto) presenta péptidos largos — el rango '13-18 aa' cae dentro del intervalo {{13-25}} aa que dan otras fuentes."},"expl":"Lo troncal aquí: Jun+Fos = AP-1, factor de transcripción de la señal TCR (no kinasa); MECL-1 y LMP2 son subunidades del inmunoproteasoma inducidas por IFN; el MHC-II presenta péptidos largos (13-25 aa) por tener el surco abierto.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"BAJA","diapo":"TEMA 7 ('MECL-1, inducible por interferones… subunidad del proteasoma') / TEMA 12 (AP-1)","nota":"Confianza BAJA por defecto de la reconstrucción: la d, tal como está escrita ('MECL-1 pertenece al MAC'), TAMBIÉN es falsa. Se propone c asumiendo que el original decía 'MECL-1 pertenece al inmunoproteasoma' (verdadero). Ojo también con la e: 13-18 aa se usó como distractor plausible; el rango canónico de clase II es 13-25 aa."},{"k":"H17-01","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T2 · Anatomía del sistema inmune","sub":"FDCs — localización y función en el centro germinal","idioma":"castellano","enun":"Las FDCs:","ops":{"a":"Se localizan en el timo.","b":"Participan en la selección de los centrocitos con BCRs madurados por afinidad.","c":"Se encuentran en los centros germinales.","d":"A y B son correctas.","e":"B y C son correctas."},"cor":"e","razones":{"a":"Falsa: las FDCs (células dendríticas foliculares) viven en los {{folículos}} de los órganos linfoides secundarios; en el {{timo}} no hay FDCs jamás — es el distractor favorito del profesor.","b":"Verdadera (pero incompleta como opción única): las FDCs retienen antígeno en forma de inmunocomplejos y seleccionan los {{centrocitos}} cuyo BCR ha ganado afinidad tras la hipermutación somática.","c":"Verdadera (pero incompleta como opción única): las FDCs residen en los {{centros germinales}} de los folículos secundarios.","d":"Falsa: combina la verdadera B con la falsa A ({{timo}}); las FDCs nunca están en órganos linfoides primarios.","e":"CORRECTA: B y C son ciertas — FDCs en los {{centros germinales}}, seleccionando centrocitos madurados por {{afinidad}}; A (timo) es falsa."},"expl":"Las FDCs no son hematopoyéticas ni APCs clásicas: viven en los centros germinales, retienen inmunocomplejos y seleccionan los centrocitos con BCR de alta afinidad. Nunca están en el timo ni participan en la selección tímica.","nivel":"SALE_SEGURO","reina":"R24","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-02","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T10 · Citocinas y quimiocinas","sub":"Citocinas activadoras de NK — IL-12","idioma":"castellano","enun":"¿Qué citocina estimula la activación de NKs?","ops":{"a":"IL-4","b":"IL-12","c":"IL-10","d":"TGFβ","e":"EPO"},"cor":"b","razones":{"a":"Falsa: la IL-4 es la citocina firma de la respuesta {{Th2}} (activa B, cambio a IgE); no activa NK.","b":"CORRECTA: la {{IL-12}}, producida por macrófagos y DCs, activa a las NK (junto con {{IL-15 e IL-18}}) y además induce la diferenciación Th1.","c":"Falsa: la IL-10 es {{antiinflamatoria}}/inmunosupresora (Treg, macrófagos); frena, no activa.","d":"Falsa: el TGFβ es {{inmunosupresor}} (con IL-6/IL-23 participa en Th17, y en Treg); no estimula NK.","e":"Falsa: la EPO (eritropoyetina) es una citocina {{hematopoyética}} que estimula la eritropoyesis, sin papel en NK."},"expl":"Las NK se activan por IL-12 (la clásica de examen), y también por IL-15, IL-18 e IL-2. La IL-12 la producen macrófagos/DCs y además polariza a Th1 — es el eje innato-adaptativo favorito del profesor.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":"Concepto reciclado en 2020 q32 y 2025 Q18 (allí con giro: la respuesta era 'ninguna' porque ofrecía varias válidas). Apuesta nº5 para la recuperación."},{"k":"H17-03","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T2 · Anatomía del sistema inmune","sub":"Bazo — PALS (zona T)","idioma":"castellano","enun":"Los linfocitos del PALS:","ops":{"a":"Son T principalmente","b":"Son B principalmente","c":"Están todos activados","d":"Son todos vírgenes","e":"Todas son falsas"},"cor":"a","razones":{"a":"CORRECTA: el PALS (vaina linfoide periarteriolar) del bazo es la zona {{T}} — linfocitos T rodeando la arteriola central.","b":"Falsa: los B se concentran en los {{folículos}} y en la zona {{marginal}} del bazo, no en el PALS.","c":"Falsa: absoluto imposible — el PALS contiene mezcla de T {{vírgenes}} y activados en tránsito.","d":"Falsa: otro absoluto — también circulan por el PALS células T ya {{activadas}} y de memoria.","e":"Falsa: no puede serlo porque la A es cierta."},"expl":"En el bazo: PALS = zona T (alrededor de la arteriola central); folículos = zona B; zona marginal = B de zona marginal y macrófagos. Preguntado en ≥3 convocatorias.","nivel":"SALE_SEGURO","reina":"R24","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-04","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T7 · MHC y presentación","sub":"Vía exógena MHC-II — CLIP","idioma":"castellano","enun":"Señala la molécula que sustituye al péptido antigénico en el surco del MHC de clase II:","ops":{"a":"DO","b":"pTα","c":"Calnexina","d":"CLIP","e":"Tapasina"},"cor":"d","razones":{"a":"Falsa: HLA-DO es un {{regulador de HLA-DM}}; modula el intercambio pero no ocupa el surco.","b":"Falsa: pTα es la cadena sustituta del {{pre-TCR}} en la ontogenia T — nada que ver con el MHC.","c":"Falsa: la calnexina es una {{chaperona}} del retículo endoplásmico; ni siquiera pertenece al complejo de carga del MHC-I (trampa de nombre parecido a calreticulina).","d":"CORRECTA: {{CLIP}} es el fragmento residual de la cadena invariante (Ii) que queda ocupando el surco del MHC-II hasta que {{HLA-DM}} cataliza su intercambio por el péptido antigénico.","e":"Falsa: la tapasina pertenece al complejo de carga del {{MHC de clase I}} (vía endógena), no a la vía del MHC-II."},"expl":"Vía exógena: la cadena invariante Ii bloquea el surco del MHC-II; las catepsinas S/L la degradan dejando CLIP; HLA-DM cataliza el cambio CLIP→péptido (HLA-DO regula a DM). Es el concepto individual más repetido del 1P.","nivel":"SALE_SEGURO","reina":"R2","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-05","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T7 · MHC y presentación","sub":"Unión péptido-MHC II — residuos ancla","idioma":"castellano","enun":"Los residuos ancla de los péptidos cargados en el MHC de clase II:","ops":{"a":"Suelen localizarse en los extremos del péptido.","b":"Tienen una posición variable en función del alelo del MHC.","c":"Suelen localizarse en el extremo C-terminal del péptido.","d":"Suelen ubicarse en el extremo N-terminal del péptido.","e":"Se encuentran siempre en el centro del péptido."},"cor":"b","razones":{"a":"Falsa: en el MHC-II el surco es {{abierto}} y los extremos del péptido cuelgan fuera; los anclajes están distribuidos a lo largo, no en los extremos.","b":"CORRECTA: en el MHC-II los residuos ancla se reparten a lo largo del péptido y su posición depende del {{alelo}} concreto (el polimorfismo del surco cambia los bolsillos de anclaje).","c":"Falsa: anclarse por el extremo {{C-terminal}} es más propio de la descripción de los péptidos del MHC-I (extremos fijados en surco cerrado), no del II.","d":"Falsa: tampoco el extremo {{N-terminal}} es el punto de anclaje característico del MHC-II.","e":"Falsa: el 'siempre' la delata — la posición no es fija, varía con el {{alelo}}."},"expl":"MHC-II: surco abierto, péptidos largos (13-25 aa) en conformación extendida, residuos ancla distribuidos en posiciones que dependen del alelo. Contrasta con MHC-I: surco cerrado, 8-11 aa, extremos fijados.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-06","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T8 · Igs, BCR y TCR","sub":"Exclusión alélica — BCR y TCR","idioma":"castellano","enun":"La exclusión alélica:","ops":{"a":"Promueve la expresión de los dos alelos.","b":"Afecta al MHC de tipo I.","c":"Afecta al MHC de tipo II.","d":"Afecta al TCR y al BCR.","e":"Todas son ciertas."},"cor":"d","razones":{"a":"Falsa: es justo lo contrario — la exclusión alélica {{silencia}} el segundo alelo cuando el primero se reordena con éxito; solo se expresa {{uno}}.","b":"Falsa: el MHC de clase I se expresa de forma {{codominante}} (los dos alelos de HLA-A, -B y -C a la vez).","c":"Falsa: ídem para el MHC de clase II — expresión {{codominante}} de ambos alelos.","d":"CORRECTA: la exclusión alélica afecta a los receptores de antígeno ({{BCR y TCR}}): garantiza que cada linfocito exprese un receptor de una única {{especificidad}} (monoclonalidad).","e":"Falsa: solo la D es cierta."},"expl":"Exclusión alélica = solo BCR/TCR: reordenado un alelo con éxito, el otro se silencia → un linfocito, una especificidad. El HLA, en cambio, es codominante. Reciclada en 2025 Q4 y 2026 Q23.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-07","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T7 · MHC y presentación","sub":"Vía exógena — complejo Ii-MHC II (3Ii+3α+3β)","idioma":"castellano","enun":"El complejo Ii-MHC de clase II consta de:","ops":{"a":"3Ii+3α+3β2 microglobulina","b":"2Ii+2α+2β2 microglobulina","c":"3Ii+3α+3β","d":"2Ii+2α+2β","e":"1Ii+1α+1β"},"cor":"c","razones":{"a":"Falsa: la {{β2-microglobulina}} pertenece al MHC de clase I, no al II — la cadena β del MHC-II es una cadena transmembrana propia.","b":"Falsa: doble error — ni la estequiometría es de 2 ni el MHC-II lleva {{β2-microglobulina}}.","c":"CORRECTA: el complejo es un nonámero de {{3}} cadenas invariantes (Ii, trímero) con {{3}} heterodímeros αβ de MHC-II: {{3Ii+3α+3β}}.","d":"Falsa: la estequiometría no es de dos — la cadena invariante trimeriza y recluta {{tres}} heterodímeros αβ.","e":"Falsa: no es un complejo 1:1:1; la Ii forma un {{trímero}} de base."},"expl":"La cadena invariante (Ii) trimeriza y cada monómero recluta un heterodímero αβ de MHC-II → nonámero 3Ii+3α+3β que sale del RE hacia la vía endocítica. Dato de diapositiva puro, ya preguntado literal.","nivel":"SALE_SEGURO","reina":"R2","clave":"oficial","conf":"ALTA","diapo":null,"nota":"En el OCR del corpus la cadena invariante aparece como 'li' (ele-i); es Ii (i mayúscula + i), cadena invariante."},{"k":"H17-08","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T7 · MHC y presentación","sub":"Procesamiento antigénico — ERAAP y catepsina L","idioma":"castellano","enun":"ERAAP y la catepsina L tienen en común que:","ops":{"a":"Las dos son chaperonas","b":"Las dos participan en la vía citosólica del procesamiento antigénico.","c":"Las dos participan en la vía endocítica del procesamiento antigénico.","d":"Las dos cortan péptidos o proteínas.","e":"Pertenecen al complejo de carga"},"cor":"d","razones":{"a":"Falsa: ninguna es chaperona — las chaperonas de estas vías son {{calnexina, calreticulina}} y ERp57; ERAAP y catepsina L son enzimas {{proteolíticas}}.","b":"Falsa: solo ERAAP trabaja en la vía endógena/citosólica (recorta péptidos en el {{retículo endoplásmico}}); la catepsina L es lisosomal.","c":"Falsa: solo la catepsina L es de la vía {{endocítica}} (degrada la cadena invariante y antígenos en el lisosoma); ERAAP no.","d":"CORRECTA: es lo único que comparten — ambas son enzimas que {{cortan}} péptidos o proteínas: ERAAP es una {{aminopeptidasa}} del RE que recorta péptidos para el MHC-I, y la catepsina L una {{proteasa}} lisosomal de la vía del MHC-II.","e":"Falsa: el complejo de carga del MHC-I lo forman {{tapasina, TAP, calreticulina y ERp57}} — ninguna de las dos preguntadas."},"expl":"ERAAP (aminopeptidasa del RE, vía endógena/MHC-I) y catepsina L (proteasa lisosomal, vía endocítica/MHC-II) trabajan en vías distintas; su único punto común es la actividad proteolítica.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-09","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T8 · Igs, BCR y TCR","sub":"Recombinación V(D)J — nucleótidos N y TdT","idioma":"castellano","enun":"Los nucleótidos N:","ops":{"a":"Surgen por la actividad de la TdT","b":"Surgen por la actividad de RAG1/RAG2","c":"Surgen por la actividad de la DNA ligasa.","d":"Surgen por la actividad de la quimasa","e":"Surgen por la actividad del AICD."},"cor":"a","razones":{"a":"CORRECTA: la {{TdT}} (desoxinucleotidil-transferasa terminal) es una polimerasa {{sin molde}} que añade nucleótidos N al azar en las uniones V(D)J → diversidad de unión.","b":"Falsa: RAG1/RAG2 es la {{endonucleasa}} que corta el DNA en las RSS e inicia la recombinación; no añade nucleótidos.","c":"Falsa: la DNA ligasa {{sella}}/une los extremos al final de la reparación; no inserta nucleótidos nuevos.","d":"Falsa: la quimasa es una proteasa de los gránulos del {{mastocito}} — distractor de otro tema.","e":"Falsa: AID/AICDA actúa en la {{hipermutación somática}} y el cambio de isotipo del centro germinal, no en la V(D)J."},"expl":"Diversidad de unión: RAG corta en las RSS, Artemis abre las horquillas (nucleótidos P) y la TdT añade nucleótidos N sin molde. AID es de centro germinal, no de V(D)J. Bloque preguntado en las 7 convocatorias.","nivel":"SALE_SEGURO","reina":"R6","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-10","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T9 · Ontogenia linfocitos B y T","sub":"Ontogenia B — oportunidades de reordenamiento","idioma":"castellano","enun":"¿Cuántas oportunidades para reordenar de forma exitosa su BCR tiene un precursor de linfocitos B?","ops":{"a":"4 para la cadena pesada y 2 para la ligera.","b":"2 para la cadena pesada y 2 para la ligera.","c":"4 para la cadena pesada y 4 para la ligera.","d":"2 para la cadena pesada y 4 para la ligera.","e":"1 para la cadena pesada y 1 para la ligera."},"cor":"d","razones":{"a":"Falsa: invierte los números — la pesada solo tiene {{2}} intentos (un locus por cromosoma) y la ligera {{4}}.","b":"Falsa: la ligera tiene más de 2 intentos porque hay {{dos loci}} distintos (κ y λ) en dos cromosomas cada uno.","c":"Falsa: la pesada solo tiene un locus ({{IGH}}) → máximo 2 intentos, uno por cromosoma.","d":"CORRECTA: cadena pesada = {{2}} oportunidades (1 locus IGH × 2 cromosomas); cadena ligera = {{4}} ({{2κ + 2λ}}: dos loci × dos cromosomas).","e":"Falsa: cada locus está en {{dos}} cromosomas homólogos — como mínimo hay 2 intentos para la pesada."},"expl":"Pesada: 1 locus (IGH) en 2 cromosomas = 2 intentos. Ligera: 2 loci (κ y λ) en 2 cromosomas = 4 intentos (primero κ, si falla λ). Pregunta casi literal en 3 convocatorias — apuesta fuerte para la recuperación.","nivel":"SALE_SEGURO","reina":"R7","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-11","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T8 · Igs, BCR y TCR","sub":"IgA secretora — componente secretor","idioma":"castellano","enun":"¿Cuál de las siguientes inmunoglobulinas se estabiliza por el componente secretor?","ops":{"a":"IgG1κ","b":"IgG4λ1","c":"IgG3λ3","d":"IgAκ","e":"IgEλ1"},"cor":"d","razones":{"a":"Falsa: la IgG es monomérica y {{sérica}}; no se transporta por el receptor poli-Ig ni lleva componente secretor.","b":"Falsa: ídem — ninguna subclase de {{IgG}} lleva componente secretor.","c":"Falsa: ídem; la cadena ligera (λ3) es irrelevante — lo que importa es el {{isotipo}} de cadena pesada.","d":"CORRECTA: la {{IgA}} dimérica (unida por cadena {{J}}) se transporta a través del epitelio por el receptor {{poli-Ig}}; el fragmento del receptor que queda unido = componente secretor, que la {{estabiliza}} frente a proteasas en las mucosas.","e":"Falsa: la IgE es monomérica, sérica y va unida a {{FcεRI}} de mastocitos/basófilos; sin componente secretor."},"expl":"El componente secretor deriva de la degradación parcial del receptor poli-Ig tras la transcitosis y estabiliza la IgA dimérica secretora en mucosas. La IgM pentamérica también lleva cadena J, pero la pregunta clásica siempre apunta a IgA.","nivel":"SALE_SEGURO","reina":"R5","clave":"oficial","conf":"ALTA","diapo":"TEMA 8, slide 22 (IgA)","nota":null},{"k":"H17-12","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T8 · Igs, BCR y TCR","sub":"Receptor poli-Ig — enterocitos","idioma":"castellano","enun":"El receptor poli-Ig se expresa en:","ops":{"a":"Las mTECs","b":"Los linfocitos Th0","c":"Las plaquetas","d":"Las cTECs","e":"Los enterocitos"},"cor":"e","razones":{"a":"Falsa: las mTECs son epitelio {{medular tímico}} (selección negativa, AIRE) — nada que ver con el transporte de Ig en mucosas.","b":"Falsa: los Th0 son linfocitos T; el receptor poli-Ig es de células {{epiteliales}}, no de linfocitos.","c":"Falsa: las plaquetas no transportan inmunoglobulinas a través de epitelios.","d":"Falsa: las cTECs son epitelio {{cortical tímico}} (selección positiva) — mismo distractor tímico que la a.","e":"CORRECTA: el receptor poli-Ig se expresa en el polo {{basolateral}} de las células epiteliales de mucosas ({{enterocitos}}) y transporta la IgA dimérica por {{transcitosis}} hasta el polo apical/luz."},"expl":"El receptor poli-Ig es epitelial: capta la IgA dimérica en el polo basolateral del enterocito, la transcita y la libera a la luz con el componente secretor unido. Pareja inseparable de la pregunta del componente secretor.","nivel":"SALE_SEGURO","reina":"R5","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-13","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T9 · Ontogenia linfocitos B y T","sub":"Selección positiva tímica — timocitos DP","idioma":"castellano","enun":"La selección positiva:","ops":{"a":"Implica la actividad de la TdT","b":"Se produce en órganos linfoides secundarios encapsulados","c":"Actúa sobre linfocitos maduros","d":"Afecta a timocitos DP","e":"Afecta a timocitos DN"},"cor":"d","razones":{"a":"Falsa: la TdT actúa antes, durante la {{recombinación V(D)J}}; la selección positiva testa el TCR ya formado, no lo genera.","b":"Falsa: la selección tímica ocurre en el timo, que es un órgano linfoide {{primario}} (aunque sí encapsulado).","c":"Falsa: actúa sobre timocitos {{inmaduros}} en desarrollo, no sobre células ya maduras en periferia.","d":"CORRECTA: la selección positiva afecta a los timocitos {{DP}} (dobles positivos CD4+CD8+) en la {{corteza}} tímica, mediada por las {{cTECs}}: sobreviven los que reconocen MHC propio con afinidad moderada.","e":"Falsa: los DN (dobles negativos) aún están {{reordenando}} el TCR — todavía no tienen receptor completo que seleccionar."},"expl":"Selección positiva: timocitos DP, corteza, cTECs (restricción por MHC propio). Selección negativa: médula tímica, mTECs (AIRE), DCs y macrófagos. Preguntado en 6 convocatorias.","nivel":"SALE_SEGURO","reina":"R9","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-14","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T11 · Moléculas de adhesión","sub":"Moléculas de adhesión — ligandos de integrinas","idioma":"castellano","enun":"¿Cuál de las siguientes moléculas se une a una integrina?","ops":{"a":"ICAM-1","b":"VLA-4","c":"LFA-1","d":"CD34","e":"PSGL-1"},"cor":"a","razones":{"a":"CORRECTA: {{ICAM-1}} es una molécula de la superfamilia de las Ig en el endotelio que actúa como {{ligando}} de la integrina {{LFA-1}} del leucocito — se une A una integrina sin serlo ella.","b":"Falsa (trampa): VLA-4 {{ES}} una integrina (α4β1) — la pregunta pide el ligando, no la integrina misma; su pareja es VCAM-1.","c":"Falsa (trampa): LFA-1 {{ES}} una integrina (αLβ2); su ligando es ICAM-1.","d":"Falsa: CD34 es una {{adresina}}/sialomucina de las HEV, ligando de la {{L-selectina}} — pareja de selectina, no de integrina.","e":"Falsa: PSGL-1 es el ligando de la {{P-selectina}} (rodamiento), no de integrinas."},"expl":"Parejas de la tabla de adhesión: LFA-1 (integrina)↔ICAM-1; VLA-4 (integrina)↔VCAM-1; L-selectina↔CD34/GlyCAM-1; P-selectina↔PSGL-1. Cae exactamente 1 pregunta de esta tabla por examen — leer bien si piden la integrina o su ligando.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-15","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T10 · Citocinas y quimiocinas","sub":"Quimiocinas — eje CXCL13/CXCR5 (B→folículo)","idioma":"castellano","enun":"¿Cuál de las siguientes moléculas promueve la migración de linfocitos B a los folículos?","ops":{"a":"IL-10","b":"CXCL13","c":"CCR7","d":"CCL19","e":"CCL21"},"cor":"b","razones":{"a":"Falsa: la IL-10 es una citocina {{antiinflamatoria}}, no una quimiocina — no dirige migración.","b":"CORRECTA: {{CXCL13}}, producida por las {{FDCs}} del folículo, atrae a los linfocitos B que expresan el receptor {{CXCR5}}.","c":"Falsa: CCR7 es un {{receptor}} (no una quimiocina) y además dirige a T y DCs a la {{zona T}}/paracórtex.","d":"Falsa: CCL19 es ligando de {{CCR7}} — organiza la zona {{T}}, no los folículos B.","e":"Falsa: CCL21, el otro ligando de {{CCR7}}, también es de la zona {{T}} (estroma y HEV)."},"expl":"Dos ejes que hay que tener automatizados: CXCL13 (FDCs)→CXCR5 (B) = folículo; CCL19/CCL21→CCR7 (T, DCs) = zona T. Ojo al distractor 'CCR21', que no existe (2025 Q11).","nivel":"SALE_SEGURO","reina":"R15","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-16","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T11 · Moléculas de adhesión","sub":"Miscelánea de conceptos — sinónimos y trampas de nomenclatura","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"Diapédesis y transcitosis no son sinónimos.","b":"Cadena J y segmento J son sinónimos.","c":"BCR y TCR son PRRs","d":"La cola del BCR pertenece a la región CDR","e":"La L-selectina se expresa en los HEV"},"cor":"a","razones":{"a":"CORRECTA: la {{diapédesis}} es la migración del leucocito ENTRE las células endoteliales (extravasación); la {{transcitosis}} es el transporte de una molécula A TRAVÉS de la célula (ej. IgA por el enterocito). Procesos distintos.","b":"Falsa: la cadena {{J}} es un polipéptido que une los monómeros de IgA/IgM; el segmento {{J}} ('joining') es un segmento génico de la recombinación V(D)J. Mismo nombre, cosas distintas.","c":"Falsa: BCR y TCR son receptores de {{antígeno}} de la inmunidad adaptativa, generados por recombinación; los {{PRRs}} son receptores innatos de línea germinal (TLRs, NLRs…).","d":"Falsa: las {{CDR}} (regiones determinantes de complementariedad) están en la región {{variable}} que une antígeno; la cola/dominio citoplasmático del BCR está en el otro extremo.","e":"Falsa: la {{L-selectina}} está en el {{linfocito}} virgen; las HEV expresan sus ligandos (adresinas: {{GlyCAM-1, CD34}})."},"expl":"Pregunta-cajón de trampas de nomenclatura: diapédesis≠transcitosis, cadena J≠segmento J, BCR/TCR≠PRR, y la L-selectina va en el linfocito (las HEV llevan las adresinas).","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-17","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T12 · Activación linfocitaria","sub":"Funciones de los linfocitos Th","idioma":"castellano","enun":"Los linfocitos Th participan directa o indirectamente en:","ops":{"a":"Activación de las APCs","b":"La activación de linfocitos Tc","c":"La activación de linfocitos B","d":"Se diferencian en el timo","e":"Todas son verdad"},"cor":"e","razones":{"a":"Verdadera: el Th activa APCs vía {{CD40L}}-CD40 e IFNγ (licencia a la DC, activa macrófagos).","b":"Verdadera: el Th ayuda a los Tc mediante {{IL-2}} y activando/licenciando a la DC presentadora.","c":"Verdadera: es la ayuda clásica — {{CD40L}} + citocinas para la activación B, el cambio de isotipo y el centro germinal.","d":"Verdadera: como todo linfocito T, el Th se diferencia en el {{timo}}.","e":"CORRECTA: {{todas}} son ciertas — el Th es el director de orquesta: activa APCs, Tc y B, y madura en el timo."},"expl":"El Th es el coordinador central de la respuesta adaptativa: ayuda a B (CD40L+citocinas), a Tc (IL-2, licencia de DC) y activa APCs; su desarrollo es tímico. Cuando todas las opciones son funciones reales, la respuesta es 'todas'.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-18","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T9 · Ontogenia linfocitos B y T","sub":"Ontogenia B — cadena ligera sustituta y pre-BCR","idioma":"castellano","enun":"La cadena ligera sustituta del BCR:","ops":{"a":"Promueve la expresión del FcR","b":"Promueve la supervivencia de los timocitos preT","c":"Promueve la supervivencia de los timocitos proT","d":"Promueve la supervivencia de los linfocitos preB","e":"Promueve la supervivencia de los linfocitos proB"},"cor":"d","razones":{"a":"Falsa: la cadena ligera sustituta forma parte del {{pre-BCR}}; no tiene relación con los receptores Fc.","b":"Falsa: en los timocitos el papel equivalente lo hace {{pTα}} en el pre-TCR, no la cadena ligera sustituta (que es del linaje B).","c":"Falsa: mismo error de linaje — los proT son células {{T}}; la cadena ligera sustituta es exclusiva del desarrollo {{B}}.","d":"CORRECTA: la cadena ligera sustituta (VpreB+λ5) se empareja con la cadena pesada µ recién reordenada formando el {{pre-BCR}}, cuya señal da {{supervivencia}} y expansión al linfocito {{pre-B}}.","e":"Falsa: el pro-B todavía {{no ha reordenado}} la cadena pesada — no puede formar pre-BCR; el checkpoint es en el estadio pre-B."},"expl":"Checkpoint del pre-BCR: cadena pesada µ + cadena ligera sustituta (VpreB/λ5) → sobrevive el pre-B. Paralelo en T: cadena β + pTα = pre-TCR → sobrevive el pre-T. Pro = aún no reordenó; pre = ya reordenó la primera cadena.","nivel":"SALE_SEGURO","reina":"R8","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-19","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T12 · Activación linfocitaria","sub":"Correceptores — CD8 y linfocito Tc","idioma":"castellano","enun":"La expresión de CD8:","ops":{"a":"Es necesaria para la activación del linfocito Th","b":"Es necesaria para la activación del linfocito Tc","c":"Es necesaria para la recombinación somática","d":"Es necesaria para la hipermutación somática","e":"Es necesaria para el cambio de isotipo"},"cor":"b","razones":{"a":"Falsa: el correceptor del Th es {{CD4}}, que se une al MHC de clase {{II}}.","b":"CORRECTA: {{CD8}} es el correceptor del linfocito Tc — se une a la región no polimórfica del MHC de clase {{I}} y acerca la kinasa {{Lck}} al TCR, imprescindible para la activación.","c":"Falsa: la recombinación V(D)J depende de {{RAG1/RAG2}} y ocurre antes, en el desarrollo; no requiere CD8.","d":"Falsa: la hipermutación somática es de linfocitos {{B}} en el centro germinal (enzima {{AID}}).","e":"Falsa: el cambio de isotipo también es de linfocitos {{B}} (AID + ayuda {{CD40L}}); CD8 no pinta nada."},"expl":"CD4 y CD8 son correceptores: CD4→MHC-II (Th), CD8→MHC-I (Tc); ambos reclutan Lck. Los procesos de B (V(D)J aparte, hipermutación, switch) son distractores de linaje. Ojo: en 2026 Q3 el profesor rotó esta misma pregunta hacia 'CD8 no es coestimuladora, es correceptor'.","nivel":"SALE_SEGURO","reina":"R17","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-20","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T8 · Igs, BCR y TCR","sub":"Recombinación V(D)J — estructura de las RSS","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"Hay dos tipos de RSSs en función de la secuencia del heptámero","b":"Hay tres tipos de RSSs en función de las secuencias espaciadoras","c":"Hay dos tipos de RSSs en función de las secuencias espaciadoras","d":"La revisión del receptor no requiere la actividad de RAG","e":"La edición del receptor requiere la actividad de AICD"},"cor":"c","razones":{"a":"Falsa: el heptámero (y el nonámero) están {{conservados}} en todas las RSS; lo que varía es el espaciador.","b":"Falsa: no son tres — son {{dos}} tipos de espaciador, de {{12 o 23}} pares de bases.","c":"CORRECTA: las RSS constan de heptámero + nonámero separados por un espaciador de {{12 o 23}} pb → dos tipos, y la recombinación sigue la regla {{12/23}} (solo se une una RSS-12 con una RSS-23).","d":"Falsa: la revisión/edición del receptor es un {{nuevo reordenamiento}} de la cadena ligera — requiere reexpresar {{RAG}}.","e":"Falsa: la edición del receptor usa {{RAG}}, no AID/AICDA (que es de hipermutación somática y switch)."},"expl":"RSS = heptámero + espaciador (12 o 23 pb, dos tipos) + nonámero; regla 12/23. La RSS es DNA, no proteína (trampa de 2026 Q14: no forma parte de la recombinasa). La edición del receptor requiere RAG, nunca AID.","nivel":"SALE_SEGURO","reina":"R6","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-21","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T10 · Citocinas y quimiocinas","sub":"Quimiotaxis — maquinaria de señalización","idioma":"castellano","enun":"Señala la molécula que no participa en el mecanismo de migración quimiotáctica:","ops":{"a":"Ca2+","b":"p56lck","c":"citoesqueleto","d":"Proteína G","e":"Fosfolipasa C"},"cor":"b","razones":{"a":"Participa: el flujo de {{Ca²⁺}} intracelular es parte de la señal quimiotáctica tras la PLC.","b":"CORRECTA (no participa): {{p56lck}} es la tirosina-kinasa asociada a {{CD4/CD8}} en la señalización del TCR — es de activación linfocitaria, no de quimiotaxis.","c":"Participa: la reorganización del {{citoesqueleto}} de actina es lo que ejecuta el movimiento celular.","d":"Participa: los receptores de quimiocinas señalizan por {{proteína G}} (GPCR de 7 dominios transmembrana).","e":"Participa: la {{fosfolipasa C}} genera IP3/DAG aguas abajo de la proteína G."},"expl":"Quimiotaxis: receptor 7TM → proteína G → PLC → Ca²⁺ → citoesqueleto. La p56lck pertenece a otra vía (señal 1 del TCR). El profesor mezcla ambas vías a propósito — en 2026 Q29 hizo la rotación inversa (p56lck sí, en el TCR).","nivel":"SALE_SEGURO","reina":"R14","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-22","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T10 · Citocinas y quimiocinas","sub":"Señalización de receptores de citocinas — JAK/STAT","idioma":"castellano","enun":"Señala la molécula que no participe en la señalización de los receptores de citocinas de clase I o II:","ops":{"a":"STAT6","b":"JAK2","c":"PKC","d":"STAT1","e":"STAT3"},"cor":"c","razones":{"a":"Participa: STAT6 media la señal de la {{IL-4}} (vía Th2) — es un STAT canónico de estos receptores.","b":"Participa: las {{JAK}} son las kinasas asociadas al receptor que fosforilan y activan a los STATs.","c":"CORRECTA (no participa): la {{PKC}} (proteína kinasa C) es de la vía {{DAG}}/PLC (señalización del TCR y otros), no de la vía JAK/STAT de los receptores de citocinas de clase I/II.","d":"Participa: STAT1 media la señal de los {{interferones}} (receptores de clase II).","e":"Participa: STAT3 media señales como la de {{IL-10}} e IL-6."},"expl":"Receptores de citocinas de clase I (IL-2, IL-4…) y clase II (interferones, IL-10) señalizan por JAK→STAT. PKC no pertenece a esa vía. Recordar también: el receptor de TNF NO usa JAK/STAT.","nivel":"SALE_SEGURO","reina":"R13","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-23","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T12 · Activación linfocitaria","sub":"Señalización del TCR — ZAP-70","idioma":"castellano","enun":"Señala el mecanismo necesario para la activación de linfocitos Th:","ops":{"a":"Unión de ATP a la proteína G","b":"Fosforilación de CD4","c":"Fosforilación de p561ck","d":"Unión de CD3 al MHC","e":"Fosforilación de ZAP-70"},"cor":"e","razones":{"a":"Falsa: las proteínas G unen {{GTP}}, no ATP — y además son de la vía de las quimiocinas, no de la señal 1 del TCR.","b":"Falsa: CD4 no se fosforila para activar — su papel es unirse al MHC-II y {{acercar}} la kinasa Lck al complejo TCR-CD3.","c":"Falsa (según la clave oficial): la Lck se regula por fosforilación/desfosforilación, pero el mecanismo que el profesor marca como imprescindible en su esquema es la fosforilación de {{ZAP-70}}, el paso siguiente.","d":"Falsa: CD3 no toca el MHC — quien contacta el MHC-péptido es el {{TCR}} (y el correceptor CD4); CD3 {{transduce}} la señal vía ITAMs.","e":"CORRECTA: la cascada es CD3-{{ITAMs}} fosforilados por Lck → reclutamiento de {{ZAP-70}} (por sus dominios SH2) → fosforilación/activación de ZAP-70 → señalización distal (LAT, PLCγ, NFAT)."},"expl":"Señal 1 del TCR: Lck (asociada a CD4/CD8) fosforila los ITAMs de CD3 → ZAP-70 se ancla por SH2 y es fosforilada/activada → cascada distal. CD3 nunca une MHC y las proteínas G usan GTP.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":"En el OCR 'p561ck' es p56lck (Lck). La opción c es defendible en sentido amplio (Lck también se regula por fosforilación), pero la clave oficial marca e, coherente con el esquema de diapositiva."},{"k":"H17-24","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T12 · Activación linfocitaria","sub":"Señalización — dominios SH2","idioma":"castellano","enun":"Los dominios de SH2:","ops":{"a":"Tienen gran afinidad por las glicoproteínas","b":"Tienen gran afinidad por las lipoproteínas","c":"Tienen gran afinidad por los residuos de tirosina fosforilados","d":"Tienen gran afinidad por los residuos de tirosina, serina y treonina fosforilados","e":"Tienen gran afinidad por los residuos de serina fosforilados"},"cor":"c","razones":{"a":"Falsa: los dominios SH2 no reconocen azúcares/glicoproteínas — reconocen un aminoácido modificado concreto.","b":"Falsa: tampoco reconocen lípidos ni lipoproteínas.","c":"CORRECTA: los dominios SH2 se unen específicamente a residuos de {{tirosina fosforilada}} (fosfotirosinas) — así ZAP-70 se ancla a los {{ITAMs}} fosforilados de CD3, y los STATs al receptor de citocinas.","d":"Falsa: incluir serina y treonina lo estropea — el SH2 es selectivo SOLO de {{tirosina}} fosforilada.","e":"Falsa: la fosfoserina la reconocen otros dominios (ej. 14-3-3), no el SH2."},"expl":"SH2 = módulo lector de fosfotirosinas. Es el mecanismo de acoplamiento de ZAP-70 a los ITAMs y de los STATs a las JAK. Solo tirosina — las opciones que añaden serina/treonina son el distractor.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-25","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T4 · Complemento","sub":"Inhibidores del complemento — C4bBP","idioma":"castellano","enun":"La C4bBP:","ops":{"a":"Es una convertasa de la vía de las lectinas de la activación del complemento","b":"Es una serina-proteasa","c":"Es una hidrolasa ácida","d":"Forma parte del MAC","e":"Es un inhibidor de la vía clásica y de las lectinas de activación del complemento"},"cor":"e","razones":{"a":"Falsa: la C3-convertasa de la vía clásica/lectinas es {{C4b2b}}; la C4bBP hace lo contrario — la desmonta.","b":"Falsa: las serina-proteasas del complemento son {{C1r/C1s, MASP-1/2 y el factor D}}; la C4bBP no tiene actividad proteasa propia.","c":"Falsa: las hidrolasas ácidas son enzimas {{lisosomales}} — otro compartimento y otro tema.","d":"Falsa: el MAC lo forman {{C5b-C9}}; la C4bBP actúa mucho antes, sobre C4b.","e":"CORRECTA: la C4bBP (C4b-binding protein) se une a {{C4b}} y lo inactiva (desplaza C2b y es cofactor del factor I) → inhibe la vía {{clásica y la de las lectinas}}, las dos que usan C4."},"expl":"C4bBP inhibe solo clásica+lectinas (actúa sobre C4b, que la alternativa no usa). La tabla completa de reguladores: C1INH (el más estrecho), C4bBP (clásica+lectinas), factor H/factor I/DAF/CR1 (las tres vías), proteína S-vitronectina (MAC).","nivel":"SALE_SEGURO","reina":"R1","clave":"oficial","conf":"ALTA","diapo":"TEMA 4, slide 9 (llista de reguladors)","nota":null},{"k":"H17-26","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T1 · Introducción a la inmunología","sub":"Innata vs adaptativa — expansión clonal","idioma":"castellano","enun":"¿Cuál de las siguientes características es exclusiva de la inmunidad adaptativa?","ops":{"a":"Expansión clonal","b":"No reacción a autoantígenos","c":"Producción de citocinas","d":"Producción de quimiocinas","e":"Todas las anteriores"},"cor":"a","razones":{"a":"CORRECTA: la {{expansión clonal}} (proliferación del clon específico tras reconocer SU antígeno) solo existe donde hay receptores clonales — es exclusiva de la {{adaptativa}}, junto con la memoria y la alta diversidad.","b":"Falsa: la no autorreactividad es propia de {{ambas}} — de hecho la innata NO reacciona contra lo propio por diseño (los PRRs reconocen PAMPs microbianos).","c":"Falsa: las citocinas las producen {{ambos}} brazos (macrófagos, NK… y también linfocitos).","d":"Falsa: ídem para las quimiocinas — compartidas.","e":"Falsa: solo la A es exclusiva."},"expl":"Exclusivos de la adaptativa: expansión clonal, memoria, alta diversidad, contracción. Compartidos (distractores clásicos): citocinas, quimiocinas, distinción propio/no-propio. La familia innata-vs-adaptativa es la más reciclada de todo el histórico.","nivel":"SALE_SEGURO","reina":"R11","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-27","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T4 · Complemento","sub":"Termolabilidad del complemento — 56 °C","idioma":"castellano","enun":"¿Cuál de los siguientes factores se inactiva a 56 ˚C?","ops":{"a":"LPS","b":"Polisacáridos bacterianos","c":"Ca2+","d":"Proteínas del complemento","e":"Todos los anteriores"},"cor":"d","razones":{"a":"Falsa: el LPS es {{termoestable}} — resiste temperaturas muy superiores (por eso los pirógenos endotóxicos son tan difíciles de eliminar).","b":"Falsa: los polisacáridos bacterianos también son {{termoestables}} (no se desnaturalizan como las proteínas).","c":"Falsa: un ion ({{Ca²⁺}}) no puede 'inactivarse' por calor.","d":"CORRECTA: las proteínas del complemento son {{termolábiles}}: calentar el suero a {{56 °C}} (30 min) las inactiva — es el método clásico de 'descomplementar' el suero en el laboratorio.","e":"Falsa: solo el complemento se inactiva."},"expl":"Dato de laboratorio clásico: suero calentado a 56 °C 30 min = complemento inactivado (así lo descubrió la escuela de Bordet). LPS y polisacáridos son termoestables.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-28","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T1 · Introducción a la inmunología","sub":"Memoria inmunológica — inmunidad adquirida","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"La memoria inmunológica no afecta a los linfocitos Th1","b":"La memoria inmunológica es característica de la inmunidad innata","c":"La memoria inmunológica es característica de la inmunidad adquirida","d":"La memoria inmunológica no afecta a los linfocitos B-2","e":"Todas son falsas"},"cor":"c","razones":{"a":"Falsa: los Th1 (como todo linfocito {{T}} convencional) generan células de memoria.","b":"Falsa: la innata {{carece de memoria}} — responde igual (inmediata, horas) en cada encuentro.","c":"CORRECTA: la {{memoria}} es un rasgo definitorio de la inmunidad {{adquirida/adaptativa}}: la respuesta secundaria es más rápida, mayor y de más afinidad.","d":"Falsa: los B-2 (los B convencionales, foliculares) son precisamente los que generan memoria y células plasmáticas de larga vida tras el {{centro germinal}}.","e":"Falsa: la C es verdadera."},"expl":"Memoria = adaptativa (T y B convencionales, incluidos Th1 y B-2). La innata no tiene memoria — su fuerza es la inmediatez. Otra variante más de la familia innata-vs-adaptativa.","nivel":"SALE_SEGURO","reina":"R11","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-29","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T2 · Anatomía del sistema inmune","sub":"Células estromales y selección — FDCs, mTECs, cTECs","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"Las mTECs son de origen hematopoyético","b":"La selección negativa de los timocitos solo se lleva a término en la médula tímica","c":"Las cTECs no expresan MHC de clase II","d":"Las FDCs seleccionan los linfocitos B que han madurado por afinidad en el centro germinal","e":"Las células estromales de la médula ósea son de origen linfoide"},"cor":"d","razones":{"a":"Falsa: las mTECs son células {{epiteliales}} (endodermo), no derivan de la célula madre hematopoyética.","b":"Falsa: el 'solo' la mata — aunque la selección negativa es típica de la {{médula}} tímica (mTECs+AIRE, DCs), también puede darse en la {{corteza}} si la señal es demasiado fuerte.","c":"Falsa: las cTECs expresan MHC de clase {{I y II}} — imprescindible para la selección {{positiva}} de los DP.","d":"CORRECTA: las {{FDCs}} retienen antígeno en el centro germinal y seleccionan los centrocitos cuyo BCR ha ganado {{afinidad}} tras la hipermutación somática.","e":"Falsa: el estroma de la médula ósea es de origen {{mesenquimal}}, no linfoide; da soporte y citocinas a la hematopoyesis."},"expl":"Células no hematopoyéticas de soporte: mTECs/cTECs (epitelio tímico), FDCs (mesenquimales, foliculares), estroma medular (mesenquimal). Las FDCs seleccionan B por afinidad en el CG — misma idea que la q1 de este examen, reformulada.","nivel":"SALE_SEGURO","reina":"R24","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-30","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T2 · Anatomía del sistema inmune","sub":"Folículos linfoides — localización","idioma":"castellano","enun":"Los folículos:","ops":{"a":"Son estructuras linfoides exclusivas de la médula ósea","b":"Se encuentran sólo en los órganos linfoides primarios","c":"Forman parte del MALT, del bazo y los ganglios","d":"Se encuentran en la región paracortical de los ganglios","e":"Todas son falsas"},"cor":"c","razones":{"a":"Falsa: la médula ósea es órgano linfoide {{primario}} — no organiza folículos B.","b":"Falsa: es al revés — los folículos son la seña de los órganos linfoides {{secundarios}}.","c":"CORRECTA: los folículos (zona {{B}}) existen en todos los órganos linfoides {{secundarios}}: ganglios (corteza), bazo (pulpa blanca) y {{MALT}} (placas de Peyer, amígdalas…).","d":"Falsa: la paracorteza del ganglio es la zona {{T}}; los folículos están en la {{corteza}} externa.","e":"Falsa: la C es cierta."},"expl":"Folículo = unidad B de los órganos linfoides secundarios (ganglio-corteza, bazo-pulpa blanca, MALT). En el ganglio: corteza=B, paracorteza=T, médula=células plasmáticas.","nivel":"SALE_SEGURO","reina":"R24","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-31","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T3 · Inmunidad innata","sub":"Mastocitos — productos de secreción","idioma":"castellano","enun":"Señala la molécula que sea secretada por mastocitos:","ops":{"a":"IFNγ","b":"MECL-1","c":"NADPH oxidasa","d":"Proteína básica principal","e":"IL-3"},"cor":"e","razones":{"a":"Falsa: el IFNγ lo secretan {{Th1, Tc y NK}} — no es producto del mastocito.","b":"Falsa: MECL-1 es una subunidad del {{inmunoproteasoma}} — ni siquiera es una molécula secretada.","c":"Falsa: la NADPH oxidasa es una {{enzima de membrana}} del fagocito (estallido oxidativo); no se secreta.","d":"Falsa: la proteína básica principal (PBP/MBP) es de los gránulos del {{eosinófilo}}, no del mastocito — el distractor de célula equivocada favorito del profesor.","e":"CORRECTA: el mastocito secreta citocinas como la {{IL-3}} (además de IL-4, IL-5, TNF, histamina, proteasas como triptasa y {{quimasa}})."},"expl":"Mastocito: histamina, triptasa/quimasa, TNF, IL-3/IL-4/IL-5. La PBP y la ECP son del eosinófilo — el profesor rota esta asignación de gránulo-célula constantemente (2026 Q12 preguntó ECP).","nivel":"SALE_SEGURO","reina":"R20","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-32","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T3 · Inmunidad innata","sub":"Estallido oxidativo — fagocitos","idioma":"castellano","enun":"¿Cuál de las siguientes células realiza el estallido oxidativo?","ops":{"a":"FDCs","b":"Fagocitos","c":"Mastocitos","d":"Células M","e":"Basófilos"},"cor":"b","razones":{"a":"Falsa: las FDCs son células estromales {{no hematopoyéticas}} que retienen inmunocomplejos — no fagocitan ni matan.","b":"CORRECTA: el estallido oxidativo es de los {{fagocitos}} (neutrófilos y macrófagos): {{NADPH oxidasa}} → anión superóxido → SOD → {{H₂O₂}} → MPO → HOCl.","c":"Falsa: el mastocito mata poco y mal — su arma es la {{degranulación}} (histamina, mediadores), no las especies reactivas de oxígeno.","d":"Falsa: las células M son epitelio del {{MALT}} que transporta antígeno a las placas de Peyer — no son fagocitos asesinos.","e":"Falsa: el basófilo es un granulocito de alergia/parásitos ({{histamina}}), sin estallido oxidativo relevante."},"expl":"Estallido oxidativo = neutrófilos y macrófagos (fagocitos). Cadena completa: NADPH oxidasa → O₂·⁻ → SOD → H₂O₂ → MPO → HOCl. Preguntado en 6 convocatorias, con la cadena molecular en 2026 Q18.","nivel":"SALE_SEGURO","reina":"R19","clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-33","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T3 · Inmunidad innata","sub":"Factores humorales de la innata vs receptores celulares","idioma":"castellano","enun":"¿Cuál de los siguientes no es un factor humoral de la inmunidad innata?","ops":{"a":"Pentraxinas","b":"Colectinas","c":"Lisozima","d":"TLR4","e":"Defensinas"},"cor":"d","razones":{"a":"Es humoral: las pentraxinas (ej. {{PCR}}, proteína C reactiva) son proteínas solubles de fase aguda que opsonizan.","b":"Es humoral: las colectinas (ej. {{MBL}}, lectina de unión a manosa) son PRRs {{solubles}} que activan la vía de las lectinas.","c":"Es humoral: la lisozima es una enzima secretada (lágrimas, saliva) que rompe el {{peptidoglicano}}.","d":"CORRECTA (no es humoral): {{TLR4}} es un receptor de {{membrana}} celular (reconoce LPS) — es un PRR celular, no un factor soluble.","e":"Es humoral: las defensinas son péptidos {{antimicrobianos}} secretados por epitelios y neutrófilos."},"expl":"Humoral de la innata = soluble: pentraxinas (PCR), colectinas (MBL), ficolinas, lisozima, defensinas, complemento. Los TLR son PRRs celulares (de membrana/endosoma). Distinguir PRR soluble vs PRR celular.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-34","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T5 · Inmunógenos y antígenos","sub":"Haptenos — definición y tamaño","idioma":"castellano","enun":"¿Cuál de las siguientes moléculas es un hapteno?","ops":{"a":"Un péptido de 1000Da","b":"Una proteína de 120 kDa","c":"Una glicoproteína de 10 kDa","d":"Una lipoproteína de 60 kDa","e":"Ninguna de las anteriores"},"cor":"a","razones":{"a":"CORRECTA: un hapteno es una molécula pequeña (≈{{<1 kDa}} = 1000 Da) que es reconocible por anticuerpos pero {{no inmunogénica}} por sí sola — necesita unirse a una proteína {{transportadora}} (carrier) para inducir respuesta.","b":"Falsa: 120 kDa es una proteína grande — inmunógeno {{completo}} de manual, no hapteno.","c":"Falsa: 10 kDa ya supera con mucho el rango de hapteno.","d":"Falsa: 60 kDa — ídem, inmunógeno completo.","e":"Falsa: la a cumple la definición."},"expl":"Hapteno = molécula pequeña (~≤1 kDa) con antigenicidad (la une el anticuerpo) pero sin inmunogenicidad propia; la gana conjugada a un carrier. A más tamaño y complejidad, más inmunogénico.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-35","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T5 · Inmunógenos y antígenos","sub":"Superantígenos — estimulación policlonal T","idioma":"castellano","enun":"Los superantígenos:","ops":{"a":"Son antígenos de alto peso molecular","b":"Son conglomerados de haptenos","c":"Provocan la estimulación policlonal de linfocitos T","d":"Interactúan con la región Fc el BCR","e":"Todas son verdad"},"cor":"c","razones":{"a":"Falsa: 'super' no va de tamaño — son proteínas bacterianas/víricas de tamaño normal; lo excepcional es su {{mecanismo}} de unión.","b":"Falsa: no tienen nada que ver con los haptenos — son proteínas completas (ej. {{enterotoxinas}} estafilocócicas).","c":"CORRECTA: puentean la presentación normal uniendo el MHC-II con la cadena {{Vβ}} del TCR {{por fuera del surco}}, sin procesamiento → activan un gran porcentaje de clones T = estimulación {{policlonal}} (tormenta de citocinas, shock tóxico).","d":"Falsa: actúan sobre el {{TCR}} (Vβ) y el MHC-II, no sobre el BCR ni sobre regiones Fc.","e":"Falsa: solo la C es cierta."},"expl":"Superantígeno: une MHC-II y región Vβ del TCR por fuera del surco, sin procesar → activación policlonal masiva de T (síndrome del shock tóxico). Ni alto peso molecular ni haptenos.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-36","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T5 · Inmunógenos y antígenos","sub":"Antígenos T-independientes (TI-2)","idioma":"castellano","enun":"¿Cuál de las siguientes opciones se ajusta más a un antígeno T-independiente?","ops":{"a":"Una proteína","b":"Un polisacárido con epítopos repetidos","c":"Una glicoproteína","d":"Una inmunoglobulina","e":"Ninguna de las anteriores"},"cor":"b","razones":{"a":"Falsa: las proteínas son el prototipo de antígeno {{T-dependiente}} — se procesan y presentan en MHC-II para recibir ayuda Th.","b":"CORRECTA: los polisacáridos con {{epítopos repetidos}} entrecruzan masivamente muchos {{BCRs}} a la vez → activan al B {{sin ayuda T}} (TI-2). Típico de cápsulas bacterianas; respuesta mayoritariamente IgM, poca memoria.","c":"Falsa: su parte proteica la hace procesable y presentable → comportamiento {{T-dependiente}}.","d":"Falsa: una Ig es una proteína — T-dependiente.","e":"Falsa: la b es el ejemplo de libro."},"expl":"TI-2 = polisacáridos con epítopos repetidos que entrecruzan BCRs y activan B sin Th (cápsulas de neumococo, etc.): respuesta IgM, sin centro germinal ni memoria robusta. Las proteínas son T-dependientes.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":null,"nota":null},{"k":"H17-37","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T3 · Inmunidad innata","sub":"Células NK — moléculas de superficie","idioma":"castellano","enun":"Señala la molécula que no se expresa en una célula NK:","ops":{"a":"KIR","b":"B7","c":"KAR","d":"MHC clase I","e":"CD56"},"cor":"b","razones":{"a":"Se expresa: los {{KIR}} son los receptores {{inhibidores}} de la NK — reconocen MHC-I propio y frenan la lisis ('missing self').","b":"CORRECTA (no se expresa): {{B7}} (CD80/86) es la molécula {{coestimuladora}} de las APCs (DCs, macrófagos, B) — la NK no es una APC profesional.","c":"Se expresa: los {{KAR}} son los receptores {{activadores}} (ej. NKG2D, cuyo ligando es {{MICA}}).","d":"Se expresa: el MHC de clase I está en {{todas}} las células nucleadas — la NK incluida.","e":"Se expresa: {{CD56}} (junto con CD16) es EL marcador fenotípico de la NK."},"expl":"Fenotipo NK: CD56+, CD16+, KIR (inhibidores, leen MHC-I), KAR/NKG2D (activadores, ligando MICA) y, como célula nucleada, MHC-I propio. B7 es de APCs — la NK no coestimula linfocitos T vírgenes.","nivel":"PUEDE_SALIR","reina":null,"clave":"oficial","conf":"ALTA","diapo":"TEMA 3 (NK: CD16/CD56)","nota":null},{"k":"H17-38","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T4 ·
