Complemento","sub":"Inhibidores del complemento — espectro de acción","idioma":"castellano","enun":"Señala la molécula que inhibe todas las vías de activación del complemento:","ops":{"a":"Factor D","b":"Factor H","c":"Proteína S","d":"Properdina","e":"C1INH"},"cor":"c","razones":{"a":"Falsa: el factor D es una serina-proteasa {{activadora}} de la vía alternativa (corta el factor B) — lo contrario de un inhibidor.","b":"Discutible pero no la de la clave: el factor H es cofactor del factor I e inactiva {{C3b}}, con papel principal como regulador de la vía {{alternativa}}; en el esquema del profesor no es la de espectro total.","c":"CORRECTA (clave oficial): la proteína S ({{vitronectina}}) inhibe el ensamblaje del {{MAC}} (bloquea C5b-7) — y como el MAC es el tramo final {{común}} a las tres vías, es el inhibidor de efecto sobre todas ellas (mismo razonamiento que la Q6 del examen 2025).","d":"Falsa: la properdina hace lo contrario — {{ESTABILIZA}} la C3-convertasa alternativa (C3bBb); es el distractor recurrente de esta familia.","e":"Falsa: el C1INH es el de espectro MÁS {{ESTRECHO}}: solo vía {{clásica y lectinas}} (disocia C1r₂s₂ y las MASP)."},"expl":"Espectros de los reguladores: C1INH = solo clásica+lectinas (el más estrecho); C4bBP = clásica+lectinas; factor H/I, DAF, CR1 = las 3 vías a nivel de convertasas; proteína S (vitronectina) = MAC, el tramo final común → el efecto más amplio en el esquema del profesor. Properdina estabiliza, no inhibe.","nivel":"SALE_SEGURO","reina":"R1","clave":"oficial","conf":"MEDIA","diapo":"TEMA 4, slide 9 (llista: C1-INH, C4-BP, DAF, CR1, protein S-vitronectin)","nota":"Clave marcada como dudosa en el corpus (posible desplazamiento OCR hacia Factor H, b). Tras verificar, la clave c NO parece desplazada: es coherente con el criterio del profesor en 2025 Q6 (vitronectina = espectro más amplio por inhibir el MAC, tramo final común) y la proteína S figura en su lista de reguladores de diapositiva. Se mantiene c. Matiz Abbas: estrictamente el factor H también inhibe (vía alternativa/C3b), pero no encaja como 'todas las vías' mejor que la proteína S en el marco del profe."},{"k":"H17-39","examen":"📜 Abril 2017 (clave oficial)","real":0,"origen":"ABRIL-2017","tema":"T8 · Igs, BCR y TCR","sub":"Receptores Fc — afinidad por IgG3","idioma":"castellano","enun":"De los siguientes receptores, ¿cuál de ellos une IgG3 con más afinidad?","ops":{"a":"FcεRI","b":"FcγRIII","c":"FcγRII","d":"FcαRI","e":"poliIg-Rc"},"cor":"c","razones":{"a":"Falsa: el FcεRI es el receptor de {{alta afinidad para IgE}} (mastocitos, basófilos) — no une IgG.","b":"Candidata del consenso: el {{FcγRIII}} (CD16) es el receptor de las NK que media la {{ADCC}} con IgG1/IgG3 — los apuntes y el análisis del proyecto lo dan como la respuesta esperable.","c":"CORRECTA según la clave oficial transcrita: el FcγRII (CD32) une {{IgG}} (baja afinidad, complejos inmunes); la clave lo marca, aunque el consenso del proyecto apunta a FcγRIII.","d":"Falsa: el FcαRI (CD89) une {{IgA}}, no IgG.","e":"Falsa: el receptor poli-Ig transporta {{IgA dimérica}} (e IgM) a través del epitelio — no es receptor de IgG."},"expl":"Lo seguro para el examen: FcεRI=IgE (alta afinidad), FcαRI=IgA, poli-IgR=IgA dimérica; los FcγR unen IgG, y de ellos el FcγRIII (CD16) es el de la ADCC de las NK con IgG1/IgG3. La letra oficial de 2017 (FcγRII) probablemente esté desplazada — quedarse con el mapa de receptores más que con la letra.","nivel":"SALE_SEGURO","reina":"R4","clave":"oficial","conf":"BAJA","diapo":"TEMA 3 (NK: FcγRIII/CD16 i ADCC)","nota":"⚠️ CLAVE PROBABLEMENTE DESPLAZADA. La hoja oficial transcrita marca c (FcγRII), pero el consenso de apuntes/otros años y el propio análisis del proyecto (PATRONES §5: '2017 q39 FcγRIII-IgG3') apuntan a b (FcγRIII, CD16 — el de la ADCC, con afinidad por IgG1/IgG3 superior a la del FcγRII). Se respeta la clave oficial (c) por mandato, pero para estudiar: FcγRIII."},{"k":"H20-01","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T7 · MHC y presentación","sub":"Inmunoevasinas — evasión vírica de MHC I","idioma":"castellano","enun":"De las siguientes opciones, ¿cuál es una inmunoevasina?","ops":{"a":"Receptor Fc con acción inhibidora.","b":"Molécula no propia que induce respuesta alérgica.","c":"Molécula propia que interfiere con el procesamiento antigénico.","d":"Toda molécula no propia que se asocia a un PRR.","e":"Molécula vírica que inhibe la respuesta inmune."},"cor":"e","razones":{"a":"Falsa: los receptores Fc inhibidores (como {{FcγRIIB}}) son moléculas propias reguladoras del propio sistema inmune, no proteínas víricas de evasión.","b":"Falsa: una molécula no propia que induce respuesta alérgica es un {{alérgeno}}, concepto sin relación con la evasión vírica.","c":"Falsa: la inmunoevasina no es una molécula propia sino {{vírica}}; aunque sí interfiere con el procesamiento antigénico, su origen es el virus.","d":"Falsa: toda molécula no propia que se une a un PRR es un {{PAMP}} (patrón molecular asociado a patógeno), que activa la inmunidad en vez de evadirla.","e":"CORRECTA: las inmunoevasinas son proteínas producidas por {{virus}} para evitar la reacción inmunitaria; la mayoría interfieren con la presentación antigénica por {{MHC de clase I}} (bloqueo de TAP, retención del MHC I en el RE, degradación del MHC I...)."},"expl":"Inmunoevasina = proteína vírica que inhibe la respuesta inmune, sobre todo bloqueando la presentación por MHC I: interfieren con TAP (Herpes simplex, HCMV), con la tapasina, o degradan el MHC I como ubiquitina-ligasas.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 7 (MHC), slide 32 — IMMUNOEVASINES","nota":null},{"k":"H20-02","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T7 · MHC y presentación","sub":"Vía exógena — HLA-DM y carga del péptido en MHC II","idioma":"castellano","enun":"¿Cuál de las siguientes sería la molécula responsable de transferir el péptido al surco del MHC de clase II?","ops":{"a":"DM","b":"Cadena invariante","c":"Calreticulina","d":"Clanexina","e":"Erp57"},"cor":"a","razones":{"a":"CORRECTA: {{HLA-DM}} cataliza la salida del {{CLIP}} del surco del MHC II y facilita la carga (transferencia) del péptido antigénico en su lugar, dentro del compartimento MIIC.","b":"Falsa: la cadena invariante (Ii) hace lo contrario — {{bloquea}} el surco del MHC II en el RE para que no cargue péptidos endógenos; su fragmento residual es el CLIP, que precisamente debe ser retirado por DM.","c":"Falsa: la calreticulina es una {{chaperona}} del complejo de carga del {{MHC de clase I}} en el RE, no de la vía de clase II.","d":"Falsa: la calnexina es una chaperona del plegamiento inicial del {{MHC de clase I}} (y de la cadena α de MHC II en el RE), pero no transfiere péptidos al surco de clase II.","e":"Falsa: ERp57 es una tiol-oxidorreductasa del complejo de carga del {{MHC de clase I}} (junto a calreticulina y tapasina)."},"expl":"En la vía exógena, HLA-DM retira el CLIP y cataliza la carga del péptido en el surco del MHC II. Calnexina/calreticulina/ERp57/tapasina pertenecen al complejo de carga del MHC I (vía endógena).","nivel":"SALE_SEGURO","reina":"R2","clave":"estudiante","conf":"ALTA","diapo":"TEMA 7 (MHC) — vía exógena / HLA-DM","nota":"'Clanexina' es errata de OCR/fuente por 'calnexina'. Anotación del estudiante en la opción d: 'Para MHC I: calreticulina, ERP57 y tapasina. Para MHC II: calnexina y catepsinas'."},{"k":"H20-03","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T3 · Inmunidad innata","sub":"TLRs y sus ligandos — ARN vírico bicatenario","idioma":"castellano","enun":"¿Cuál de los siguientes receptores reconoce ARN vírico bicatenario?","ops":{"a":"TLR7.","b":"TLR2.","c":"TLR10.","d":"MBL.","e":"TLR3"},"cor":"e","razones":{"a":"Falsa: TLR7 (endosomal) reconoce ARN vírico {{monocatenario}} (ssRNA), no bicatenario.","b":"Falsa: TLR2 (de membrana, con TLR1/TLR6) reconoce {{lipoproteínas}}, peptidoglicano de Gram+, lipoarabinomanano y zymosan — componentes de pared, no ácidos nucleicos.","c":"Falsa: TLR10 es un TLR de función/ligando {{mal definido}} (posible papel inhibidor); no reconoce ARN bicatenario.","d":"Falsa: MBL (lectina de unión a manosa) es una {{colectina}} soluble que reconoce manosa/fucosa en superficies microbianas y activa la vía de las {{lectinas}} del complemento; no es un TLR ni reconoce ARN.","e":"CORRECTA: {{TLR3}}, endosomal, reconoce ARN de {{doble cadena}} (dsRNA) vírico y señaliza vía TRIF induciendo interferones de tipo I."},"expl":"TLRs endosomales de ácidos nucleicos: TLR3 = dsRNA, TLR7/8 = ssRNA, TLR9 = DNA CpG. Las diapos del profe (T3, slide 29) asignan explícitamente 'RNA doble cadena' a TLR3.","nivel":"SALE_SEGURO","reina":"R16","clave":"razonada","conf":"MEDIA","diapo":"TEMA 3 (Immunitat Innata), slide 29 — receptors toll-like","nota":"El enunciado del corpus dice 'ARN vírico bacteriano', casi seguro errata de OCR por 'ARN vírico bicatenario' — con esa lectura la respuesta es TLR3 (e). Si realmente dijera 'monocatenario', sería TLR7 (a). Confianza MEDIA solo por la errata del enunciado."},{"k":"H20-04","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T3 · Inmunidad innata","sub":"Interferones y estado antivírico / mediadores inflamatorios","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"El estado antivírico se consigue gracias a la acción de los interferones.","b":"Los leucotrienos disminuyen la permeabilidad vascular.","c":"La IL-6 inhibe la producción de proteínas de fase aguda.","d":"La C3 convertasa de la vía alternativa se estabiliza gracias a la acción del Factor D.","e":"El IPS es un antígeno T Independiente de tipo 2."},"cor":"a","razones":{"a":"CORRECTA: los {{interferones de tipo I}} (IFN-α/β) inducen en las células vecinas un {{estado antivírico}}: enzimas que degradan ARN y bloquean la síntesis proteica y la replicación vírica.","b":"Falsa: los leucotrienos (derivados del ácido araquidónico) {{aumentan}} la permeabilidad vascular y causan broncoconstricción; no la disminuyen.","c":"Falsa: la IL-6 {{estimula}} en el hígado la producción de proteínas de fase aguda (PCR, MBL, fibrinógeno...), junto con IL-1 y TNF-α; no la inhibe.","d":"Falsa: la C3 convertasa alternativa (C3bBb) se estabiliza por la {{properdina}} (factor P); el Factor D es una {{proteasa}} que corta el Factor B unido a C3b, no un estabilizador.","e":"Falsa: el LPS es el antígeno T-independiente de {{tipo 1}} prototípico (activa por su actividad mitógena/PAMP); los TI-2 son polisacáridos con {{epítopos repetitivos}} que entrecruzan el BCR."},"expl":"Los IFN de tipo I inducen el estado antivírico en células vecinas. Distractores clásicos: properdina (no Factor D) estabiliza la C3 convertasa alternativa; IL-6 activa (no inhibe) la fase aguda; LPS es TI-1, no TI-2.","nivel":"PUEDE_SALIR","reina":null,"clave":"estudiante","conf":"ALTA","diapo":"TEMA 3 (Immunitat Innata) — interferons","nota":"'IPS' en la opción e es errata de la fuente por 'LPS'. La respuesta a se dedujo 'por descarte según anotaciones' del estudiante y coincide con la teoría."},{"k":"H20-05","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T8 · Igs, BCR y TCR","sub":"Subclases de IgG — complemento, ADCC y placenta","idioma":"castellano","enun":"Una IgG3:","ops":{"a":"Activa el complemento, pero no activa ADCC (Citotoxicidad dependiente de Anticuerpos).","b":"No activa complemento.","c":"Activa complemento y se transfiere al feto.","d":"En las mucosas se secreta como pentámero.","e":"Consta de 4 dominios CH por cada cadena pesada."},"cor":"c","razones":{"a":"Falsa: {{IgG1 e IgG3}} son precisamente las subclases que mejor inducen ADCC (citotoxicidad celular dependiente de anticuerpo) vía FcγRIII de las NK; IgG3 sí activa ADCC.","b":"Falsa: IgG3 es el {{mejor activador}} del complemento de todas las IgG (orden clásico: IgG3 > IgG1 > IgG2; IgG4 no activa).","c":"CORRECTA: IgG3 activa el {{complemento}} (vía clásica, la subclase más potente) y atraviesa la {{placenta}} vía FcRn ({{IgG1, IgG3 e IgG4}} la cruzan con facilidad).","d":"Falsa: el pentámero de mucosas no existe como tal — la Ig secretada en mucosas es la {{IgA dimérica}} (IgA secretora); el pentámero es la {{IgM}} sérica.","e":"Falsa: la cadena pesada γ tiene {{3}} dominios CH (como IgA e IgD); son {{IgM e IgE}} (cadenas μ y ε) las que tienen 4 dominios CH."},"expl":"IgG3: máxima activación del complemento, induce ADCC, cruza la placenta y tiene 3 dominios CH (bisagra larga). El trío placenta/complemento/ADCC por subclases de IgG es reciclaje puro del profe.","nivel":"SALE_SEGURO","reina":"R4","clave":"estudiante","conf":"ALTA","diapo":"TEMA 8 (Igs, BCR i TCR) — subclasses IgG","nota":null},{"k":"H20-06","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T5 · Inmunógenos y antígenos","sub":"Interacción antígeno-anticuerpo — epítopo/paratopo, afinidad","idioma":"castellano","enun":"La interacción antígeno-anticuerpo:","ops":{"a":"Nunca se produce por medio de enlaces covalentes.","b":"Es más fuerte cuanta más afinidad exista entre ambos.","c":"Se produce entre el epítopo y paratopo.","d":"Resulta en la formación de inmunocomplejos.","e":"Todas las anteriores son verdad."},"cor":"e","razones":{"a":"Verdadera (pero incompleta como respuesta): la unión Ag-Ac es siempre por enlaces {{no covalentes}} y reversibles (puentes de hidrógeno, fuerzas electrostáticas, Van der Waals, hidrofóbicas).","b":"Verdadera (pero incompleta): a mayor {{afinidad}} (fuerza de unión de un paratopo por su epítopo), más fuerte y estable es la interacción.","c":"Verdadera (pero incompleta): el anticuerpo une el {{epítopo}} (determinante antigénico) mediante su {{paratopo}} (sitio de unión formado por las CDR de VH y VL).","d":"Verdadera (pero incompleta): la unión de anticuerpos a antígenos multivalentes forma {{inmunocomplejos}} (complejos antígeno-anticuerpo).","e":"CORRECTA: las cuatro afirmaciones anteriores son ciertas — unión {{no covalente}}, más fuerte a más afinidad, entre epítopo y paratopo, y con formación de inmunocomplejos."},"expl":"La interacción Ag-Ac es no covalente y reversible, entre epítopo y paratopo; su fuerza depende de la afinidad (y avidez si es multivalente) y genera inmunocomplejos.","nivel":"PUEDE_SALIR","reina":"R22","clave":"razonada","conf":"ALTA","diapo":"TEMA 5 (Immunògens i Antígens)","nota":null},{"k":"H20-07","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T12 · Activación linfocitaria","sub":"Señalización del TCR — CD3, ITAMs, ZAP-70","idioma":"castellano","enun":"Señala la opción correcta:","ops":{"a":"CD3 a través de la fosforilación de sus motivos ITAM inicia la señalización del TCR.","b":"CD4 tiene motivos ITAM.","c":"La fosforilación de los ITAMs de CD3 inhibe ZAP-70.","d":"CD3 participa en el reconocimiento del antígeno por parte del TCR.","e":"La primera señal de activación linfocitaria está mediada por las moléculas coestimuladoras."},"cor":"a","razones":{"a":"CORRECTA: la fosforilación (por {{Lck}}) de los motivos {{ITAM}} (motivo de activación del inmunorreceptor basado en tirosina) de las cadenas de CD3 y ζ es el paso que inicia la señalización intracelular del TCR.","b":"Falsa: CD4 es un correceptor que une MHC II y lleva asociada la quinasa {{Lck}} en su cola citoplasmática, pero {{no tiene ITAMs}} — los ITAMs están en CD3 y en las cadenas ζ.","c":"Falsa: los ITAMs fosforilados {{reclutan}} (no inhiben) a {{ZAP-70}} a través de sus dominios SH2; ZAP-70 se activa entonces por fosforilación vía Lck y propaga la señal.","d":"Falsa: CD3 no reconoce antígeno — se encarga de la {{transducción de señales}} y de la expresión/estabilización del TCR en membrana; el reconocimiento del péptido-MHC lo hacen las cadenas α/β del {{TCR}}.","e":"Falsa: la {{primera señal}} es la interacción TCR–péptido/MHC; la {{segunda señal}} la dan las moléculas coestimuladoras (CD28–B7), y una tercera señal la aportan las citocinas."},"expl":"Secuencia de activación del TCR: reconocimiento péptido-MHC por TCRαβ (señal 1) → Lck fosforila los ITAMs de CD3/ζ → reclutamiento y activación de ZAP-70 → cascada (LAT, PLCγ...). La coestimulación es la señal 2, no la 1.","nivel":"PUEDE_SALIR","reina":null,"clave":"estudiante","conf":"ALTA","diapo":"TEMA 12 (Activació Limfocitària)","nota":null},{"k":"H20-08","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T3 · Inmunidad innata","sub":"Inflamación — TNF-α y activación endotelial","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"Los mastocitos suelen estar en circulación.","b":"El TNFalpha activa el endotelio.","c":"El inflamasoma se activa por la unión de un PAMP/DAMP al TLR correspondiente.","d":"Los linfocitos Th1 producen IL-4.","e":"Los macrófagos M2 producen IL-1beta."},"cor":"b","razones":{"a":"Falsa: los mastocitos son células {{residentes en tejidos}}, típicamente rodeando los {{vasos sanguíneos}} y bajo epitelios; el equivalente circulante es el basófilo.","b":"CORRECTA: el {{TNF-α}} (con IL-1) {{activa el endotelio}}: induce moléculas de adhesión (selectinas, ICAM/VCAM) y aumenta la permeabilidad, facilitando la extravasación leucocitaria.","c":"Falsa: el inflamasoma (p. ej. {{NLRP3}}) es un sensor {{citosólico}} de tipo NLR que activa caspasa-1 para madurar IL-1β; no se activa por unión de PAMP/DAMP a un {{TLR}} (los TLR son receptores de membrana/endosoma con vía propia NF-κB).","d":"Falsa: los Th1 producen {{IFN-γ}} (e IL-2); la {{IL-4}} es la citocina firma de los {{Th2}}.","e":"Falsa: los macrófagos M2 (antiinflamatorios/reparadores) secretan {{IL-10}} y TGF-β; la IL-1β proinflamatoria es propia de los macrófagos {{M1}}."},"expl":"TNF-α e IL-1 son las citocinas que activan el endotelio para el reclutamiento leucocitario. No confundir inflamasoma (sensor NLR citosólico → caspasa-1 → IL-1β) con la vía de los TLR.","nivel":"PUEDE_SALIR","reina":null,"clave":"estudiante","conf":"ALTA","diapo":"TEMA 3 (Immunitat Innata) — inflamació","nota":null},{"k":"H20-09","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T6 · APCs (presentadoras)","sub":"Células dendríticas maduras — migración y presentación","idioma":"castellano","enun":"Las DCs maduras:","ops":{"a":"Migran de los tejidos a los ganglios regionales.","b":"Solo pueden activar linfocitos Th efectores.","c":"Se caracterizan por captar antígeno, pero no presentarlo a los Th vírgenes.","d":"Expresan muy poco MHC de clase II en la membrana celular.","e":"Migran de los ganglios regionales a los tejidos."},"cor":"a","razones":{"a":"CORRECTA: tras captar antígeno y madurar, la DC migra (guiada por {{CCR7}} hacia CCL19/CCL21) desde el tejido periférico a los {{ganglios linfáticos regionales}}, donde presenta a los linfocitos T vírgenes.","b":"Falsa: las DC maduras son las únicas APC capaces de activar linfocitos T {{vírgenes}} (naïve); no se limitan a los Th efectores.","c":"Falsa: es al revés — la DC {{madura}} pierde capacidad de captación pero es experta en {{presentar}} antígeno a Th vírgenes; la que capta mucho y presenta poco es la DC {{inmadura}}.","d":"Falsa: la maduración implica un gran {{aumento}} de MHC de clase II en superficie (concentraciones altas), junto con las coestimuladoras B7.","e":"Falsa: el sentido de la migración es {{tejido → ganglio}}, no del ganglio a los tejidos."},"expl":"DC inmadura = centinela en tejido (capta mucho, presenta poco). DC madura = migra vía linfa al ganglio regional (CCR7) con MHC II y B7 altos, y activa T vírgenes. Concepto reina que reaparece en 2025 y 2026.","nivel":"SALE_SEGURO","reina":"R18","clave":"razonada","conf":"ALTA","diapo":"TEMA 6 (APCs) — maduració de les DC","nota":null},{"k":"H20-10","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T6 · APCs (presentadoras)","sub":"Coestimulación — B7 en las DCs","idioma":"castellano","enun":"¿Cuál de las siguientes es una molécula coestimuladora que se expresa en las DCs?","ops":{"a":"B7","b":"CD28","c":"CD40L","d":"CD3","e":"Todas las anteriores"},"cor":"a","razones":{"a":"CORRECTA: {{B7}} (B7.1/CD80 y B7.2/CD86) se expresa en la DC madura y da la {{segunda señal}} al unirse a CD28 del linfocito T; en las DC se expresan también CD40, 4-1BBL e ICAM.","b":"Falsa: CD28 es el receptor de B7 pero se expresa en el {{linfocito T}}, no en la DC.","c":"Falsa: CD40L (CD154) se expresa en el {{linfocito T activado}}; en la DC lo que hay es su receptor, {{CD40}}.","d":"Falsa: CD3 no es coestimuladora — es el módulo de {{transducción de señales}} del complejo TCR, exclusivo de los linfocitos T.","e":"Falsa: solo B7 cumple la condición; CD28 y CD40L están en el {{T}}, y CD3 ni siquiera es coestimuladora."},"expl":"Pares de coestimulación con la orientación correcta: B7 (DC) ↔ CD28 (T); CD40 (DC) ↔ CD40L (T). Saber en qué célula está cada molécula es exactamente lo que pregunta el profe.","nivel":"SALE_SEGURO","reina":"R17","clave":"estudiante","conf":"ALTA","diapo":"TEMA 6 (APCs) — molècules coestimuladores","nota":null},{"k":"H20-11","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T10 · Citocinas y quimiocinas","sub":"Receptores de citocinas — clases I/II y JAK/STAT","idioma":"castellano","enun":"Señala la opción correcta:","ops":{"a":"IL-2 tiene un receptor de clase II.","b":"Los receptores de clase II señalizan a través proteínas adaptadoras como dominios TIR.","c":"Las citocinas con receptores del tipo I y II señalizan a través de kinasas JAK y factores STAT.","d":"El receptor de TNFalpha señaliza a través de JAK/STAT.","e":"Los receptores de interferones son los de clase I."},"cor":"c","razones":{"a":"Falsa: el receptor de IL-2 es de {{clase I}} (hematopoyetina, con la cadena común {{γc}}); los de clase II son los de interferones e IL-10.","b":"Falsa: los dominios {{TIR}} son propios de los {{TLR}} y del receptor de IL-1 (adaptador MyD88), no de los receptores de citocinas de clase II.","c":"CORRECTA: los receptores de citocinas de tipo I y II carecen de actividad quinasa propia y señalizan mediante quinasas {{JAK}} asociadas que fosforilan factores {{STAT}}, los cuales dimerizan y van al núcleo.","d":"Falsa: el receptor de TNF-α pertenece a la familia {{TNFR}} y señaliza vía adaptadores {{TRADD/TRAF}} → NF-κB (o caspasas), no por JAK/STAT.","e":"Falsa: los receptores de interferones son el prototipo de la {{clase II}}, no de la clase I."},"expl":"Clase I (hematopoyetinas: IL-2, IL-6...) y clase II (IFNs, IL-10) → JAK/STAT. Familia TNFR → TRAF/NF-κB. Familia IL-1/TLR → dominios TIR/MyD88. Emparejar familia de receptor con vía es reciclaje fijo.","nivel":"SALE_SEGURO","reina":"R13","clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (Citocines i quimiocines) — receptors de citocines","nota":null},{"k":"H20-12","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T8 · Igs, BCR y TCR","sub":"IgA secretora — componente secretor","idioma":"castellano","enun":"El componente secretor:","ops":{"a":"Es un subproducto del cambio de isotipo de IgE a IgA.","b":"Forma parte de las IgAs diméricas.","c":"Es un producto de degradación parcial del FcRgamma.","d":"Forma parte de la cadena J en las IgAs diméricas.","e":"Forma parte de las IgM pentaméricas."},"cor":"b","razones":{"a":"Falsa: no tiene nada que ver con el cambio de isotipo — el componente secretor procede del {{receptor poli-Ig}} de la célula epitelial, no de la recombinación de clase.","b":"CORRECTA: el componente secretor es el fragmento extracelular del {{receptor poli-Ig}} que queda unido a la {{IgA dimérica}} tras la transcitosis a través del epitelio, formando la IgA secretora y protegiéndola de las proteasas de la luz.","c":"Falsa: deriva del receptor {{poli-Ig}} (pIgR) del epitelio mucoso, no del FcRγ.","d":"Falsa: la {{cadena J}} es una proteína distinta, producida por la propia {{célula plasmática}}, que une los monómeros del dímero; el componente secretor no forma parte de ella.","e":"Falsa: la IgM pentamérica sérica lleva cadena J pero {{no}} componente secretor (este se adquiere en el transporte transepitelial de la IgA dimérica)."},"expl":"IgA secretora = dímero de IgA + cadena J (de la célula plasmática) + componente secretor (resto del receptor poli-Ig del epitelio tras la transcitosis). Distinguir cadena J de componente secretor es el truco habitual.","nivel":"SALE_SEGURO","reina":"R5","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (Igs, BCR i TCR) — IgA secretora","nota":null},{"k":"H20-13","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T9 · Ontogenia linfocitos B y T","sub":"Desarrollo B — cadena ligera sustituta y pre-BCR","idioma":"castellano","enun":"La cadena ligera substituta se expresa en:","ops":{"a":"Los centrocitos del centro germinal.","b":"Los linfocitos B en la zona marginal.","c":"Las células plasmáticas.","d":"Los linfocitos pre-B.","e":"Los centroblastos en su fase replicativa."},"cor":"d","razones":{"a":"Falsa: los centrocitos son células B {{maduras}} en selección dentro del centro germinal — ya tienen BCR completo con cadena ligera reordenada.","b":"Falsa: los B de zona marginal son linfocitos {{maduros}} del bazo con BCR completo; la cadena sustituta es exclusiva del desarrollo temprano en médula ósea.","c":"Falsa: las células plasmáticas son el estadio final {{secretor de anticuerpos}}; hace tiempo que sustituyeron la cadena sustituta por una cadena ligera real.","d":"CORRECTA: el linfocito {{pre-B}} expresa el {{pre-BCR}} = cadena pesada μ recién reordenada + cadena ligera sustituta ({{VpreB + λ5}}); si señaliza, valida la cadena pesada y dispara la proliferación y la exclusión alélica.","e":"Falsa: los centroblastos son B del centro germinal en {{hipermutación somática}}, con BCR completo — no expresan cadena sustituta."},"expl":"La cadena ligera sustituta (VpreB/λ5) forma el pre-BCR con la cadena μ en el estadio pre-B de la médula ósea; es el control de calidad de la cadena pesada. Análogo en T: pTα con el pre-TCR.","nivel":"SALE_SEGURO","reina":"R8","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (Limfòcits B i T) — pre-BCR","nota":null},{"k":"H20-14","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T3 · Inmunidad innata","sub":"Inmunidad innata humoral — defensinas, colectinas, pentraxinas","idioma":"castellano","enun":"Señala la opción correcta:","ops":{"a":"Los NLR reconocen ARN vírico bicatenario.","b":"Las colectinas tienen un dominio de fibrinógeno.","c":"Las defensinas son citocinas.","d":"Las defensinas participan de la respuesta innata de tipo humoral.","e":"Las pentraxinas son lectinas de tipo C."},"cor":"d","razones":{"a":"Falsa: los NLR son sensores citosólicos de {{peptidoglicano}} y señales de daño (NOD1/2, NLRP3-inflamasoma); el ARN bicatenario lo reconocen {{TLR3}} y los RLR (RIG-I/MDA5).","b":"Falsa: las colectinas (MBL, SP-A, SP-D) tienen dominio de {{colágeno}} + dominio {{lectina}} de tipo C; el dominio de tipo fibrinógeno es el rasgo de las {{ficolinas}}.","c":"Falsa: las defensinas no son citocinas — son {{péptidos antimicrobianos}} catiónicos que perforan membranas microbianas; no señalizan como mediadores entre células inmunes.","d":"CORRECTA: las defensinas (α y β, en epitelios y gránulos de neutrófilos/Paneth) son factores {{solubles}} y por tanto forman parte de la inmunidad innata {{humoral}} (junto a complemento, lisozima, colectinas, pentraxinas...).","e":"Falsa: las pentraxinas (PCR, SAP) reconocen {{fosforilcolina}} y tienen estructura pentamérica propia; las lectinas de tipo C (dependientes de Ca²⁺) son las {{colectinas}} y los receptores de manosa."},"expl":"Familias humorales de la innata: defensinas (péptidos antimicrobianos), colectinas (colágeno + lectina C: MBL), ficolinas (dominio fibrinógeno), pentraxinas (PCR). Cada familia con su dominio: pregunta de emparejar.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (Immunitat Innata) — defensines i factors solubles","nota":null},{"k":"H20-15","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T12 · Activación linfocitaria","sub":"Activación T — vía calcio/calcineurina → NFAT","idioma":"castellano","enun":"Señala aquel factor de transcripción que se active gracias al aumento de calcio durante la activación del linfocito T:","ops":{"a":"NFAT","b":"STAT","c":"IRFs","d":"AP-1","e":"NFkB"},"cor":"a","razones":{"a":"CORRECTA: el IP3 libera {{Ca²⁺}} del RE; el calcio activa la {{calcineurina}} (fosfatasa), que desfosforila {{NFAT}} permitiendo su entrada al núcleo (diana de la ciclosporina/tacrolimus).","b":"Falsa: los STAT se activan por fosforilación vía quinasas {{JAK}} asociadas a receptores de citocinas, no por calcio.","c":"Falsa: los IRF (factores reguladores de interferón) se activan en las vías de los {{TLR}}/sensores de ácidos nucleicos para inducir {{interferones}}, no por la señal de calcio del TCR.","d":"Falsa: AP-1 (Fos/Jun) se activa por la vía del {{DAG}} → PKC/Ras → {{MAP quinasas}}, la rama paralela a la del calcio.","e":"Falsa: NF-κB se activa por la rama {{PKCθ}} → degradación de {{IκB}}, no por el aumento de calcio."},"expl":"PLCγ genera IP3 y DAG: la rama IP3→Ca²⁺→calcineurina activa NFAT; la rama DAG→PKC/Ras activa NF-κB y AP-1. 'Calcio = NFAT' es la asociación que pide el profe (en 2026 reapareció como opción 'Pujada del Ca²⁺').","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 12 (Activació Limfocitària) — vies de senyalització","nota":null},{"k":"H20-16","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T5 · Inmunógenos y antígenos","sub":"Factores que determinan la inmunogenicidad","idioma":"castellano","enun":"Señala cuál de las siguientes condiciones sería más inmunogénica:","ops":{"a":"Fosfolípido administrado de forma oral en una única dosis.","b":"Proteína de 1000 alaninas desnaturalizada y administrada de forma intradérmica, dosis única.","c":"Proteína desnaturalizada de 1000 aminoácidos variados, administrada a dosis repetidas de forma intradérmica.","d":"Proteína desnaturalizada y particulada de 1000 aminoácidos variados, administrada a dosis repetidas de forma intradérmica.","e":"Péptido de 10 alaninas, administración intradérmicamente dosis única."},"cor":"d","razones":{"a":"Falsa: los lípidos son poco inmunogénicos (lo más inmunogénico son las {{proteínas}}), la vía {{oral}} tiende a inducir tolerancia y una dosis única ayuda poco.","b":"Falsa: un homopolímero de {{alaninas}} carece de complejidad química — sin diversidad de aminoácidos apenas hay epítopos, por grande que sea.","c":"Falsa solo por comparación: cumple tamaño, complejidad, vía y dosis repetidas, pero le falta la forma {{particulada}}, que aumenta aún más la captación por APCs — la opción d la supera.","d":"CORRECTA: reúne todos los factores pro-inmunogénicos — {{proteína}} grande (1000 aa), composición {{variada}} (complejidad), forma {{particulada}} (mejor fagocitosis), vía {{intradérmica}} (rica en DCs) y dosis {{repetidas}}.","e":"Falsa: un péptido de 10 residuos es demasiado {{pequeño}} (bajo peso molecular) y además homopolímero de alaninas — mínima inmunogenicidad."},"expl":"Inmunogenicidad ↑ con: naturaleza proteica, tamaño grande, complejidad química, forma particulada/agregada, distancia filogenética, vía intradérmica/subcutánea y dosis repetidas con adyuvante. La opción que suma más factores gana.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 5 (Immunògens i Antígens) — factors d'immunogenicitat","nota":null},{"k":"H20-17","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T8 · Igs, BCR y TCR","sub":"Subclases de IgG — IgG4: placenta sí, ADCC no","idioma":"castellano","enun":"De las siguientes inmunoglobulinas, señala la que pueda atravesar la placenta, pero no inducir ADCC (Citotoxicidad dependiente de Anticuerpos):","ops":{"a":"IgE.","b":"IgG1.","c":"IgG2.","d":"IgG3.","e":"IgG4."},"cor":"e","razones":{"a":"Falsa: la IgE {{no atraviesa}} la placenta (solo las IgG lo hacen vía FcRn); su papel es la defensa antiparasitaria y la alergia.","b":"Falsa: IgG1 cruza la placenta pero es uno de los {{mejores inductores de ADCC}} (junto a IgG3) vía FcγRIII — no cumple la segunda condición.","c":"Falsa: IgG2 no induce ADCC de forma relevante, pero es la subclase que {{peor atraviesa}} la placenta — falla la primera condición según el esquema del curso.","d":"Falsa: IgG3 cruza la placenta pero induce {{ADCC}} potentemente — no cumple.","e":"CORRECTA: {{IgG4}} atraviesa fácilmente la placenta ({{IgG1, IgG3 e IgG4}} la cruzan bien) y en cambio {{no induce ADCC}} ni activa complemento."},"expl":"Esquema del curso: ADCC = IgG1 e IgG3; placenta fácil = IgG1, IgG3, IgG4. La única que cruza placenta sin hacer ADCC es IgG4 (que tampoco fija complemento). Repetida casi literal en Abril 2016 #20.","nivel":"SALE_SEGURO","reina":"R4","clave":"estudiante","conf":"ALTA","diapo":"TEMA 8 (Igs, BCR i TCR) — subclasses IgG","nota":null},{"k":"H20-18","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T9 · Ontogenia linfocitos B y T","sub":"Reacción de centro germinal — maduración de afinidad y cambio de isotipo","idioma":"castellano","enun":"La reacción de centro germinal:","ops":{"a":"Se produce en los folículos cuando estos son primarios.","b":"Requiere la actividad de Tc y FDCs.","c":"Implica hipermutación somática en la zona constante de BCR.","d":"Tiene como objetivo incrementar la afinidad de BCR por el antígeno y adecuar mejor la parte efectora del anticuerpo al tipo de patógeno.","e":"Todas las anteriores."},"cor":"d","razones":{"a":"Falsa: el centro germinal define al folículo {{secundario}}; el folículo primario es el que está en reposo, sin centro germinal.","b":"Falsa: requiere linfocitos {{Tfh}} (T colaboradores foliculares, CD4) y FDCs — no linfocitos {{Tc}} citotóxicos.","c":"Falsa: la hipermutación somática (por {{AID}}) afecta a las regiones {{variables}} (V) del BCR, que son las que unen antígeno; la región constante cambia por otro proceso (cambio de isotipo).","d":"CORRECTA: la reacción de centro germinal combina {{maduración de afinidad}} (hipermutación somática + selección por FDCs/Tfh, en regiones V) y {{cambio de isotipo}} (adecuar la parte efectora Fc al patógeno).","e":"Falsa: a, b y c contienen errores (folículo primario, Tc, zona constante), así que 'todas' no puede ser."},"expl":"Centro germinal (folículo secundario): centroblastos en zona oscura hipermutant las regiones V, centrocitos seleccionados por FDCs y Tfh en zona clara, más cambio de isotipo. Resultado: más afinidad + Fc adecuado.","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (Limfòcits B i T) — reacció de centre germinal","nota":null},{"k":"H20-19","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T1 · Introducción a la inmunología","sub":"Linajes hematopoyéticos — NK como linfoide no-linfocito clásico","idioma":"castellano","enun":"De los siguientes tipos celulares, ¿cuál es el linaje linfoide, pero no es un linfocito?","ops":{"a":"Megacariocitos.","b":"Neutrófilos.","c":"Natural Killer.","d":"Eosinófilos.","e":"Mastocitos."},"cor":"c","razones":{"a":"Falsa: los megacariocitos (precursores de {{plaquetas}}) son de linaje {{mieloide}}.","b":"Falsa: los neutrófilos son granulocitos de linaje {{mieloide}}.","c":"CORRECTA: la célula {{NK}} deriva del progenitor {{linfoide}} común, pero es una célula de la inmunidad {{innata}} sin receptor de antígeno específico (sin TCR/BCR ni recombinación VDJ) — por eso el curso la separa de los linfocitos T y B clásicos.","d":"Falsa: los eosinófilos son granulocitos {{mieloides}}.","e":"Falsa: los mastocitos derivan del linaje {{mieloide}} y residen en tejidos."},"expl":"Todas las demás opciones son mieloides; la NK es la única de linaje linfoide. El matiz 'no es un linfocito' se refiere a que carece de receptor antigénico específico (innata), aunque morfológicamente sea un linfocito grande granular.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 1 (Introducció) — llinatges hematopoètics","nota":"Estrictamente la NK se considera hoy un 'linfocito innato'; la pregunta juega con que no es un linfocito T/B con receptor específico. Por descarte de linajes, c es la única posible. Confianza MEDIA por esa ambigüedad conceptual."},{"k":"H20-20","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T3 · Inmunidad innata","sub":"Mediadores preformados — histamina del mastocito","idioma":"castellano","enun":"¿Cuál de los siguientes es un factor preformado de la inmunidad innata?","ops":{"a":"TNF alfa.","b":"IL-1 beta.","c":"IL-8.","d":"Histamina.","e":"IL-3."},"cor":"d","razones":{"a":"Falsa: el TNF-α es una citocina que se sintetiza {{de novo}} tras la activación (transcripción inducida por NF-κB) para poner en marcha la inflamación.","b":"Falsa: la IL-1β requiere síntesis inducida como pro-IL-1β y además maduración por la {{caspasa-1}} del inflamasoma — doblemente no preformada.","c":"Falsa: la IL-8 ({{CXCL8}}, quimiocina de neutrófilos) se transcribe tras la activación celular, no está almacenada de antemano.","d":"CORRECTA: la {{histamina}} está almacenada preformada en los {{gránulos}} de mastocitos y basófilos y se libera en segundos por degranulación, causando {{vasodilatación}} y aumento de permeabilidad.","e":"Falsa: la IL-3 es una citocina hematopoyética producida por síntesis {{inducida}} (linfocitos T activados), no un mediador granular preformado."},"expl":"Preformado = almacenado en gránulos listo para liberar (histamina, proteasas, heparina del mastocito). Las citocinas (TNF, IL-1β, IL-8...) son mediadores de síntesis nueva, más lentos.","nivel":"PUEDE_SALIR","reina":null,"clave":"estudiante","conf":"ALTA","diapo":"TEMA 3 (Immunitat Innata) — mastòcits i histamina","nota":"Respuesta deducida 'por descarte según anotaciones' del estudiante; coincide plenamente con la teoría."},{"k":"H20-21","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T1 · Introducción a la inmunología","sub":"Inmunidad innata vs adaptativa — expansión clonal","idioma":"castellano","enun":"De los siguientes mecanismos, ¿cuál crees que no se aplica a la inmunidad innata?","ops":{"a":"Distinción entre lo propio y lo no propio.","b":"Actuación inmediata.","c":"Diversidad de receptores limitada.","d":"Expansión clonal.","e":"Baja especificidad de receptores."},"cor":"d","razones":{"a":"Aplica a la innata: los {{PRRs}} reconocen PAMPs microbianos ausentes en las células propias — la innata sí distingue propio de no propio (a su manera, sin especificidad fina).","b":"Aplica a la innata: su rasgo distintivo es la actuación {{inmediata}} (minutos-horas), sin necesidad de expansión previa.","c":"Aplica a la innata: usa un repertorio {{limitado}} de receptores codificados en línea germinal (unos cientos), frente a los millones de la adaptativa.","d":"CORRECTA (no se aplica): la {{expansión clonal}} tras el reconocimiento del antígeno es exclusiva de la inmunidad {{adaptativa}} (linfocitos T y B con receptor específico); la innata responde sin seleccionar clones.","e":"Aplica a la innata: sus receptores reconocen {{patrones}} moleculares compartidos, es decir, tienen baja especificidad comparada con TCR/BCR."},"expl":"Innata: inmediata, receptores germinales limitados, baja especificidad, sin memoria ni expansión clonal. Adaptativa: específica, con expansión clonal y memoria. La familia de preguntas innata-vs-adaptativa es la más reciclada del histórico.","nivel":"SALE_SEGURO","reina":"R11","clave":"razonada","conf":"ALTA","diapo":"TEMA 1 (Introducció) — innata vs adaptativa","nota":null},{"k":"H20-22","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T8 · Igs, BCR y TCR","sub":"Isotipo, alotipo e idiotipo","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"Solo hay isotipos para las cadenas pesadas de las inmunoglobulinas, pero no para las ligeras.","b":"El isotipo se refiere a la parte constante de la inmunoglobulina.","c":"El isotipo de una inmunoglobulina se define en fusión de la región Fab.","d":"Isotipo e idiotipo son sinónimos.","e":"El alotipo de una inmunoglobulina se define en función de la región Fab."},"cor":"b","razones":{"a":"Falsa: también las cadenas ligeras tienen isotipos — {{kappa (κ) y lambda (λ)}} — definidos por su región constante.","b":"CORRECTA: el isotipo viene determinado por la región {{constante}} de la cadena pesada (μ, δ, γ, α, ε → IgM, IgD, IgG, IgA, IgE) y de la ligera (κ, λ); es {{igual en todos los individuos}} de la especie.","c":"Falsa: la región Fab contiene las regiones {{variables}} de unión al antígeno; lo que se define ahí es el {{idiotipo}}, no el isotipo.","d":"Falsa: isotipo = clase por región {{constante}} (común a la especie); idiotipo = determinantes únicos de las regiones {{variables}} de cada clon. Son conceptos opuestos, no sinónimos.","e":"Falsa: el alotipo son variantes {{alélicas}} (polimorfismos) de las regiones constantes entre individuos de la misma especie, no algo definido por la región Fab."},"expl":"Isotipo = clase, por la región constante (igual en toda la especie; existe para H y para L: κ/λ). Alotipo = variantes alélicas de la constante entre individuos. Idiotipo = determinantes de la región variable propios de cada clon.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (Igs, BCR i TCR) — isotip/al·lotip/idiotip","nota":"'en fusión de' en la opción c es errata de la fuente por 'en función de'."},{"k":"H20-23","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T4 · Complemento","sub":"Anafilotoxinas C3a/C5a — funciones","idioma":"castellano","enun":"Señala la afirmación falsa respecto a las anafilotoxinas:","ops":{"a":"Requieren de la acción de proteasas/convertasas para formarse.","b":"Incrementan la permeabilidad vascular.","c":"Inducen degranulación de los mastocitos.","d":"Opsonizan los microbios que recubren.","e":"Tienen efectos quimiotácticos."},"cor":"d","razones":{"a":"Verdadera: C3a y C5a son los fragmentos pequeños liberados cuando las {{convertasas}} cortan C3 y C5 — sin proteólisis no hay anafilotoxina.","b":"Verdadera: aumentan la {{permeabilidad vascular}} (directamente y vía histamina del mastocito), contribuyendo a la inflamación.","c":"Verdadera: C3a y sobre todo {{C5a}} inducen la {{degranulación}} de mastocitos y basófilos (liberación de histamina).","d":"FALSA (la que hay que señalar): las anafilotoxinas son fragmentos {{solubles}} que difunden y señalizan — no se quedan sobre el microbio; la opsonización del complemento la hace {{C3b}} (reconocido por CR1).","e":"Verdadera: {{C5a}} es uno de los quimiotácticos más potentes para neutrófilos (también C3a en menor grado)."},"expl":"C3a/C5a (anafilotoxinas): inflamación — permeabilidad vascular, degranulación de mastocitos, quimiotaxis (C5a el más potente). La opsonina del complemento es C3b, no las anafilotoxinas.","nivel":"SALE_SEGURO","reina":"R23","clave":"razonada","conf":"ALTA","diapo":"TEMA 4 (El complement) — anafilotoxines","nota":null},{"k":"H20-24","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T3 · Inmunidad innata","sub":"Mecanismos microbicidas — ETosis/NETosis","idioma":"castellano","enun":"¿Cuál de los siguientes es un mecanismo microbicida extracelular que implica la muerte del fagocito?","ops":{"a":"ETOsis.","b":"Estallido oxidativo – MPO dependiente.","c":"Estallido oxidativo – MPO independiente.","d":"Lisis enzimática lisosomal.","e":"Producción de Proteína Básica Principal."},"cor":"a","razones":{"a":"CORRECTA: en la {{ETosis}} (NETosis en neutrófilos) la célula expulsa {{trampas extracelulares}} de cromatina descondensada cargadas de proteínas antimicrobianas, atrapando microbios a costa de la {{muerte}} del propio fagocito.","b":"Falsa: el estallido oxidativo MPO-dependiente (H₂O₂ + {{mieloperoxidasa}} → ácido hipocloroso) ocurre dentro del {{fagolisosoma}} y no implica per se la muerte del fagocito.","c":"Falsa: la vía MPO-independiente (radicales de la {{NADPH oxidasa}}) también es intracelular/fagosomal y no mata al fagocito.","d":"Falsa: la lisis por enzimas {{lisosomales}} (proteasas, lisozima) es digestión intrafagosomal — mecanismo intracelular clásico.","e":"Falsa: la proteína básica principal (MBP) es el arma de los {{eosinófilos}}, liberada por degranulación contra helmintos, sin implicar la muerte del propio eosinófilo como mecanismo definitorio."},"expl":"ETosis/NETosis: el neutrófilo lanza redes de ADN + histonas + enzimas al exterior y muere en el proceso — el único mecanismo microbicida extracelular 'suicida' de la lista. Repetida en 2016 #10 y doble en 2026.","nivel":"SALE_SEGURO","reina":"R21","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (Immunitat Innata) — NETosi","nota":null},{"k":"H20-25","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T8 · Igs, BCR y TCR","sub":"Recombinación V(D)J — RAG1/RAG2","idioma":"castellano","enun":"En la recombinación VDJ:","ops":{"a":"Se reordena la parte constante de las inmunoglobulinas.","b":"Interviene AICD (AID).","c":"Las proteínas Ku añaden los nucleótidos P.","d":"RAG 1 y RAG 2 inician el proceso.","e":"Artemis es una polimerasa independiente de molde que añade nucleótidos N."},"cor":"d","razones":{"a":"Falsa: la recombinación V(D)J reordena los segmentos de la región {{variable}} (V, D, J); la región constante se modifica después, en el {{cambio de isotipo}}.","b":"Falsa: AID actúa en la periferia (centro germinal) en la {{hipermutación somática}} y el {{cambio de isotipo}}, no en la recombinación V(D)J de la médula/timo.","c":"Falsa: las proteínas Ku70/Ku80 {{sujetan los extremos}} rotos del ADN (vía NHEJ); los nucleótidos {{P}} se generan al abrir las horquillas ({{Artemis}}), no los añade Ku.","d":"CORRECTA: la recombinasa {{RAG1/RAG2}} reconoce las {{RSS}} y corta el ADN generando las roturas de doble cadena — es la endonucleasa que inicia el proceso.","e":"Falsa: Artemis es una {{endonucleasa}} que abre las horquillas; la polimerasa independiente de molde que añade nucleótidos {{N}} es la {{TdT}}."},"expl":"Reparto de papeles en V(D)J: RAG1/2 corta en las RSS (inicia), Artemis abre horquillas (nucleótidos P), TdT añade nucleótidos N sin molde, Ku/ligasa IV reparan. AID no interviene (es de hipermutación/cambio de isotipo). El bloque más fiable del examen.","nivel":"SALE_SEGURO","reina":"R6","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (Igs, BCR i TCR) — recombinació V(D)J","nota":null},{"k":"H20-26","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T8 · Igs, BCR y TCR","sub":"Secuencias señal de recombinación (RSS)","idioma":"castellano","enun":"Las RSSs constan de:","ops":{"a":"Un heptámero y un nonámero separados por una secuencia espaciadora de 25 nucleótidos.","b":"2 nonámeros separados por una secuencia espaciadora de 12 o 23 nucleótidos.","c":"2 heptámeros separados por una secuencia espaciadora de 12 nucleótidos.","d":"2 heptámeros separados por un nonámero.","e":"Un heptámero y un nonámero separados por una secuencia espaciadora de 12 o 23 nucleótidos."},"cor":"e","razones":{"a":"Falsa: los componentes son correctos (heptámero + nonámero) pero el espaciador es de {{12 o 23}} nucleótidos, nunca de 25.","b":"Falsa: no hay dos nonámeros — cada RSS tiene {{un heptámero y un nonámero}}.","c":"Falsa: no hay dos heptámeros, y el espaciador puede ser de 12 {{o de 23}}.","d":"Falsa: el heptámero y el nonámero no se separan entre sí por otro elemento conservado sino por un {{espaciador}} no conservado de longitud fija.","e":"CORRECTA: cada RSS = {{heptámero}} (junto al segmento codificante) + espaciador de {{12 o 23}} nucleótidos (1 o 2 vueltas de hélice) + {{nonámero}}; la recombinación sigue la regla {{12/23}} (solo se unen RSS de espaciadores distintos)."},"expl":"RSS = heptámero + espaciador de 12 o 23 pb + nonámero, flanqueando cada segmento V, D, J. La regla 12/23 asegura que se una V con D y D con J en el orden correcto. Repetida literal en Abril 2017 q20.","nivel":"SALE_SEGURO","reina":"R6","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (Igs, BCR i TCR) — RSS","nota":null},{"k":"H20-27","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T9 · Ontogenia linfocitos B y T","sub":"Edición del receptor — tolerancia central","idioma":"castellano","enun":"Señala la afirmación falsa respecto de la edición del receptor:","ops":{"a":"Se desencadena para evitar la apoptosis de linfocitos autoreactivos.","b":"Ocurre en órganos linfoides primarios.","c":"Puede afectar tanto a TCRs como BCRs.","d":"Requiere la acción de RAG1.","e":"Ocurre a nivel de pre-BCR y pre-TCR."},"cor":"e","razones":{"a":"Verdadera: la edición da al linfocito {{autorreactivo}} una segunda oportunidad — cambia la especificidad del receptor y así evita la {{deleción clonal}} (apoptosis).","b":"Verdadera: sucede en la {{médula ósea}} (B) y el {{timo}} (T), los órganos linfoides primarios, durante la tolerancia central.","c":"Verdadera según el curso: las diapos y el examen de 2016 recogen que la selección negativa tímica puede evitarse por edición del {{TCR}}, además de la clásica edición del BCR.","d":"Verdadera: la edición exige {{reactivar los genes RAG}} (RAG1/RAG2) para reordenar de nuevo, típicamente una nueva cadena ligera.","e":"FALSA (la que hay que señalar): la edición ocurre en el linfocito {{inmaduro}} que ya expresa un receptor {{completo}} (IgM de membrana / TCRαβ en DP) y resulta autorreactivo — no en los estadios pre-BCR/pre-TCR, donde aún no hay especificidad antigénica que editar."},"expl":"La edición del receptor rescata linfocitos autorreactivos inmaduros (BCR/TCR ya completo) reactivando RAG y reordenando de nuevo (sobre todo cadenas ligeras) en médula ósea/timo. En el estadio pre-receptor no hay autorreactividad que corregir.","nivel":"SALE_SEGURO","reina":"R10","clave":"razonada","conf":"MEDIA","diapo":"TEMA 9 (Limfòcits B i T), slide 10 — edició del receptor","nota":"Abbas restringe la edición sobre todo a células B; pero el propio curso (Abril 2016 #23: 'la selecció negativa al timus es pot evitar per edició del TCR') da por buena la opción c, dejando e como la falsa. Confianza MEDIA por esa tensión entre libro y curso."},{"k":"H20-28","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T7 · MHC y presentación","sub":"Vía exógena MHC II — qué es falso","idioma":"castellano","enun":"Respecto de la vía exógena de presentación antigénica, ¿cuál de las siguientes afirmaciones es falsa?","ops":{"a":"Presenta antígenos proteicos en su estado nativo.","b":"Activa la respuesta adaptativa contra patógenos extracelulares.","c":"No depende de la Tapasina.","d":"Requiere de la catepsina S.","e":"Es estimulada por interferón gamma."},"cor":"a","razones":{"a":"FALSA (la que hay que señalar): el MHC nunca presenta la proteína {{nativa}} — la vía exógena degrada el antígeno endocitado a {{péptidos}} en el compartimento endosomal/lisosomal antes de cargarlos en el MHC II (el reconocimiento de antígeno nativo es cosa del BCR).","b":"Verdadera: la vía exógena presenta antígenos {{extracelulares}} captados por endocitosis/fagocitosis a los linfocitos {{Th CD4+}}, orquestando la respuesta contra patógenos extracelulares.","c":"Verdadera: la {{tapasina}} pertenece al complejo de carga del {{MHC I}} (vía endógena); la vía exógena no la necesita.","d":"Verdadera: la {{catepsina S}} degrada la cadena invariante hasta dejar el {{CLIP}} en el surco del MHC II — proteasa clave de la vía.","e":"Verdadera: el {{IFN-γ}} incrementa la expresión de MHC II (vía CIITA) y la maquinaria de procesamiento, estimulando la presentación."},"expl":"Vía exógena: antígeno extracelular endocitado → proteólisis por catepsinas (S degrada la Ii hasta CLIP) → HLA-DM carga el péptido → presentación a CD4. Siempre péptidos procesados, nunca proteína nativa; tapasina es de la vía endógena.","nivel":"SALE_SEGURO","reina":"R2","clave":"razonada","conf":"ALTA","diapo":"TEMA 7 (MHC) — via exògena","nota":null},{"k":"H20-29","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T10 · Citocinas y quimiocinas","sub":"Citocinas hematopoyéticas — IL-5 y eosinófilos","idioma":"castellano","enun":"¿Cuál de los siguientes factores es una citocina implicada en la producción de eosinófilos?","ops":{"a":"IL-1.","b":"IL-2.","c":"IL-8.","d":"IL-5.","e":"IFNgamma."},"cor":"d","razones":{"a":"Falsa: la IL-1 es una citocina {{proinflamatoria}} (fiebre, activación endotelial, fase aguda), sin papel en la eosinofilopoyesis.","b":"Falsa: la IL-2 es el factor de crecimiento de los {{linfocitos T}} (expansión clonal), no de los eosinófilos.","c":"Falsa: la IL-8 (CXCL8) es la quimiocina que recluta {{neutrófilos}}; no produce eosinófilos.","d":"CORRECTA: la {{IL-5}} (citocina firma del eje {{Th2}}) estimula la producción, diferenciación y activación de los {{eosinófilos}} en la médula ósea.","e":"Falsa: el IFN-γ es la citocina {{Th1}} activadora de macrófagos; incluso antagoniza las respuestas Th2/eosinofílicas."},"expl":"IL-5 = eosinófilos (producción y activación), dentro del programa Th2 junto a IL-4 (IgE) e IL-13. Asociación citocina-célula diana que el profe pregunta de forma directa.","nivel":"PUEDE_SALIR","reina":"R12","clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (Citocines i quimiocines) — IL-5","nota":null},{"k":"H20-30","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T7 · MHC y presentación","sub":"Evasión microbiana — inhibición de TAP y MHC I","idioma":"castellano","enun":"¿Cuál de los siguientes mecanismos de evasión microbiana a la inmunidad innata afecta directamente a la presentación antigénica por MHC de clase I?","ops":{"a":"LPS resistente a las defensinas.","b":"Producción de elastasa microbiana.","c":"Inhibición de TAP1/2.","d":"Producción de catalasa microbiana.","e":"Inhibición de convertasas."},"cor":"c","razones":{"a":"Falsa: modificar el LPS para resistir {{defensinas}} evade los péptidos antimicrobianos de barrera, sin tocar la presentación antigénica.","b":"Falsa: la elastasa microbiana degrada componentes tisulares y péptidos del huésped, pero no interfiere con la maquinaria del {{MHC}}.","c":"CORRECTA: bloquear {{TAP1/2}} impide el transporte de péptidos del citosol al {{RE}}, de modo que el MHC de clase I no puede cargarse — estrategia típica de virus herpes (inmunoevasinas como ICP47 de HSV).","d":"Falsa: la {{catalasa}} microbiana neutraliza el {{H₂O₂}} del estallido oxidativo del fagocito — evasión de la muerte intracelular, no de la presentación.","e":"Falsa: inhibir las convertasas evade el {{complemento}}, sin relación con el MHC I."},"expl":"TAP transporta los péptidos del proteasoma al RE para cargarlos en MHC I; su inhibición (HSV, CMV) deja a la célula infectada 'invisible' para los CD8. Único mecanismo de la lista que toca la vía endógena.","nivel":"PUEDE_SALIR","reina":"R3","clave":"razonada","conf":"ALTA","diapo":"TEMA 7 (MHC), slide 32 — immunoevasines / TAP","nota":null},{"k":"H20-31","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T3 · Inmunidad innata","sub":"Barreras — la tos como barrera física/mecánica","idioma":"castellano","enun":"La tos:","ops":{"a":"Es una barrera anatómica física.","b":"Es una barrera anatómica química.","c":"Es una barrera anatómica biológica.","d":"Actúa opsonizando los patógenos.","e":"Todas son falsas."},"cor":"a","razones":{"a":"CORRECTA: la tos es un mecanismo {{físico/mecánico}} de expulsión que arrastra microbios y moco fuera de la vía aérea, como los cilios o el flujo de orina — el curso la clasifica entre las barreras {{mecánicas}}.","b":"Falsa: las barreras químicas son sustancias — {{lisozima}}, pH ácido gástrico, defensinas, ácidos grasos de la piel — no actos mecánicos como toser.","c":"Falsa: la barrera biológica es la {{microbiota}} comensal que compite con los patógenos; la tos no entra en esa categoría.","d":"Falsa: opsonizar es recubrir el patógeno con {{opsoninas}} (C3b, IgG, PCR) para facilitar la fagocitosis — nada que ver con la tos.","e":"Falsa: la opción a es verdadera, luego 'todas son falsas' no puede serlo."},"expl":"Clasificación de barreras: físicas/mecánicas (piel, moco-cilios, tos, flujos), químicas (lisozima, pH, defensinas), biológicas (microbiota). En Abril 2016 #33 el propio curso confirmó: 'la tos, la piel, sí son barreras mecánicas'.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (Immunitat Innata) — barreres","nota":null},{"k":"H20-32","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T10 · Citocinas y quimiocinas","sub":"IL-12 — activación de NK y diferenciación Th1","idioma":"castellano","enun":"¿Cuál de las siguientes citocinas activa NKs, promueve diferenciación a Th1 y se secreta por macrófagos?","ops":{"a":"IL-12.","b":"TNFalfa.","c":"IL-15.","d":"IL-1 beta.","e":"IL-2."},"cor":"a","razones":{"a":"CORRECTA: la {{IL-12}}, secretada por {{macrófagos}} y DCs, cumple las tres condiciones — activa las {{NK}} (producción de IFN-γ) y dirige la diferenciación de los CD4 vírgenes a {{Th1}}.","b":"Falsa: el TNF-α lo secretan macrófagos, pero su papel es la {{inflamación}} y activación endotelial — no dirige la diferenciación Th1 ni es el activador clásico de NK.","c":"Falsa: la IL-15 estimula la proliferación/supervivencia de {{NK}} y T de memoria, pero no es la inductora de la diferenciación {{Th1}}.","d":"Falsa: la IL-1β es proinflamatoria ({{fiebre}}, endotelio, fase aguda); no polariza a Th1 ni activa NK específicamente.","e":"Falsa: la IL-2 la producen los {{linfocitos T}} (no los macrófagos) y su función central es la expansión clonal T."},"expl":"IL-12 (macrófagos/DC) es el puente innata→adaptativa: activa NK e induce Th1 (con IFN-γ en bucle positivo). El trío 'NK + Th1 + macrófago' apunta inequívocamente a IL-12; repetida en Abril 2017 q2.","nivel":"SALE_SEGURO","reina":"R12","clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (Citocines i quimiocines) — IL-12","nota":null},{"k":"H20-33","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T12 · Activación linfocitaria","sub":"Respuesta Th1 — activación de macrófagos","idioma":"castellano","enun":"La respuesta del tipo Th1:","ops":{"a":"Activa la actividad microbicida de los macrófagos.","b":"Induce respuestas alérgicas.","c":"Inhibe la respuesta contra virus.","d":"Activa eosinófilos.","e":"Es inducida por IL-4."},"cor":"a","razones":{"a":"CORRECTA: el Th1, vía {{IFN-γ}} (y CD40L), produce la {{activación clásica}} de los macrófagos — potencia su capacidad microbicida frente a patógenos intracelulares (micobacterias, Leishmania...).","b":"Falsa: las respuestas alérgicas (IgE, mastocitos) son territorio {{Th2}} (IL-4/IL-13), no Th1.","c":"Falsa: el Th1 {{favorece}} la respuesta antivírica (IFN-γ, ayuda a los CD8/Tc y NK); no la inhibe.","d":"Falsa: los eosinófilos los activa la {{IL-5}} del programa {{Th2}}.","e":"Falsa: la diferenciación Th1 la induce la {{IL-12}} (+IFN-γ, vía T-bet); la IL-4 induce {{Th2}}."},"expl":"Th1 (inducido por IL-12, factor T-bet, secreta IFN-γ) = activación de macrófagos, Tc y NK contra intracelulares. Th2 (IL-4, GATA3) = alergia, eosinófilos, helmintos. Confirmada en 2016 #35: 'Th1 promou l'activació de Tc, macròfags, NKs'.","nivel":"SALE_SEGURO","reina":"R12","clave":"razonada","conf":"ALTA","diapo":"TEMA 12 (Activació Limfocitària) — subpoblacions Th","nota":null},{"k":"H20-34","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T9 · Ontogenia linfocitos B y T","sub":"Anticuerpos naturales, B-1 y antígenos T-independientes","idioma":"castellano","enun":"Señala la afirmación falsa:","ops":{"a":"Los anticuerpos naturales son siempre IgGs.","b":"Los antígenos T- independientes son resistentes a la degradación.","c":"Los linfocitos B-1 son de origen fetal.","d":"Los linfocitos B maduros coexpresan BCRs IgM e IgD.","e":"Las FDCs no son APCs."},"cor":"a","razones":{"a":"FALSA (la que hay que señalar): los anticuerpos naturales son mayoritariamente {{IgM}} polirreactivas de baja afinidad, producidas por los linfocitos {{B-1}} (y B de zona marginal) sin inmunización previa — no son 'siempre IgG'.","b":"Verdadera: los antígenos T-independientes (típicamente {{polisacáridos}}) son resistentes a la degradación y persisten, permitiendo el entrecruzamiento masivo del BCR.","c":"Verdadera: los B-1 se originan durante la vida {{fetal}} y se automantienen en cavidades peritoneal/pleural.","d":"Verdadera: el B maduro virgen coexpresa {{IgM e IgD}} de membrana (mismo ARN, splicing alternativo).","e":"Verdadera: las FDCs (células dendríticas foliculares) {{no}} son APCs — no expresan MHC II para presentar a T; solo {{retienen inmunocomplejos}} en su superficie para seleccionar B en el centro germinal."},"expl":"Anticuerpos naturales = IgM de los B-1 (origen fetal), sin exposición antigénica previa. Y el clásico del profe: las FDC no son APC (no presentan por MHC II), solo exponen inmunocomplejos a los B.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (Limfòcits B i T) — B-1 i anticossos naturals","nota":null},{"k":"H20-35","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T7 · MHC y presentación","sub":"MHC — MIC-A/MIC-B no son del inmunoproteasoma","idioma":"castellano","enun":"Señala la afirmación falsa:","ops":{"a":"La cadena invariante no forma parte del complejo de carga.","b":"HLA-DP presenta antígenos de hasta 30 aminoácidos de longitud máxima.","c":"HLA-DQ tiene un surco que acomoda epítopos lineales.","d":"MIC-A y MIC-B forman parte de inmunoproteasoma.","e":"MASP-2 se asocia a MBL."},"cor":"d","razones":{"a":"Verdadera: el {{complejo de carga}} (tapasina, calreticulina, ERp57, TAP) es de la vía del {{MHC I}}; la cadena invariante pertenece a la vía del MHC II y no forma parte de él.","b":"Verdadera según el esquema del curso: el surco {{abierto}} del MHC II (HLA-DP/DQ/DR) admite péptidos largos, de ~13 hasta unos {{30}} aminoácidos.","c":"Verdadera: todo MHC presenta péptidos {{lineales}} (los epítopos conformacionales son cosa del BCR/anticuerpos), y el surco de HLA-DQ no es excepción.","d":"FALSA (la que hay que señalar): {{MIC-A y MIC-B}} son moléculas de estrés, ligandos del receptor {{NKG2D}} de las NK — no tienen nada que ver con el inmunoproteasoma, cuyas subunidades inducibles son {{LMP2 y LMP7}}.","e":"Verdadera: {{MASP-2}} es la serín-proteasa asociada a {{MBL}} que corta C4 y C2 en la vía de las lectinas."},"expl":"MIC-A/MIC-B = ligandos de estrés para NKG2D (NK); inmunoproteasoma = proteasoma con LMP2/LMP7 inducidas por IFN-γ. Las otras cuatro afirmaciones son ciertas dentro del esquema del curso.","nivel":"PUEDE_SALIR","reina":"R3","clave":"razonada","conf":"MEDIA","diapo":"TEMA 7 (MHC)","nota":"La opción b (límite de 30 aa para MHC II) es discutible según la fuente que se use (algunos textos dicen 'sin límite claro'), pero d es inequívocamente falsa, así que la respuesta no peligra. Confianza MEDIA solo por esa ambigüedad del distractor."},{"k":"H20-36","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T9 · Ontogenia linfocitos B y T","sub":"Oportunidades de reordenamiento de cadena ligera","idioma":"castellano","enun":"¿Cuántas oportunidades hay para obtener una cadena ligera con su región variable reordenada con éxito?","ops":{"a":"2 oportunidades para el locus kappa y 1 para el lambda.","b":"4 oportunidades: 2 para el kappa y 2 para el lambda.","c":"4 oportunidades: 1 para el locus gamma y 2 para el lambda.","d":"2 oportunidades: 1 para el locus kappa y 1 para el lambda.","e":"4 oportunidades para el locus lambda."},"cor":"b","razones":{"a":"Falsa: hay dos {{alelos}} de cada locus — 2 kappa y también {{2}} lambda, no 1.","b":"CORRECTA: cada célula tiene {{2 alelos κ}} + {{2 alelos λ}} = {{4}} oportunidades; primero se intenta κ (ambos alelos) y, si fallan, λ (ambos alelos).","c":"Falsa: no existe un locus 'gamma' de cadena ligera — los loci de cadena ligera son {{κ y λ}} (γ es una cadena pesada).","d":"Falsa: cuenta solo un alelo por locus; al ser diploides son {{dos alelos}} de κ y dos de λ.","e":"Falsa: las 4 oportunidades se reparten entre {{los dos loci}} (2κ + 2λ), no todas en lambda."},"expl":"2 alelos κ + 2 alelos λ = 4 oportunidades de reordenar una cadena ligera funcional (κ primero; si fracasa, λ; si fracasan las 4, apoptosis). Pregunta repetida casi literal en 2017 q10 y 2016 #21 — lleva dos convocatorias descansando.","nivel":"SALE_SEGURO","reina":"R7","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (Limfòcits B i T) — reordenament cadenes lleugeres","nota":null},{"k":"H20-37","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T1 · Introducción a la inmunología","sub":"Historia de la inmunología — Steinman y las DCs","idioma":"castellano","enun":"¿Cuál de los siguientes investigadores descubrió las células dendríticas?","ops":{"a":"P. Doherty","b":"T. Tonegawa","c":"J. Bordet","d":"R. Steinmann","e":"C. Milstein"},"cor":"d","razones":{"a":"Falsa: Peter Doherty (con Zinkernagel) descubrió la {{restricción por MHC}} del reconocimiento por linfocitos T.","b":"Falsa: Susumu Tonegawa descubrió el mecanismo genético de la {{diversidad de anticuerpos}} (recombinación somática V(D)J).","c":"Falsa: Jules Bordet descubrió el {{complemento}} (alexina).","d":"CORRECTA: Ralph {{Steinman}} descubrió las {{células dendríticas}} (1973, con Cohn) y recibió el Nobel en 2011.","e":"Falsa: César Milstein (con Köhler) desarrolló los {{anticuerpos monoclonales}} (hibridomas)."},"expl":"Parejas descubridor-hallazgo que recicla el profe: Steinman = DCs; Bordet = complemento; Tonegawa = diversidad de Igs; Doherty/Zinkernagel = restricción MHC; Milstein/Köhler = monoclonales.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 1 (Introducció) — història","nota":null},{"k":"H20-38","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T4 · Complemento","sub":"Inhibidores del complemento — C4bBP no toca la vía alternativa","idioma":"castellano","enun":"¿Cuál de los siguientes factores no inhibe la vía alternativa del complemento?","ops":{"a":"Factor HRF","b":"DAF","c":"CR1","d":"Factor 1","e":"C4bBP"},"cor":"e","razones":{"a":"Falsa (sí la inhibe): HRF (factor de restricción homóloga) bloquea el {{MAC}} (C9), tramo terminal común al que también llega la vía alternativa — la frena.","b":"Falsa (sí la inhibe): {{DAF}} (CD55) acelera la disociación de las C3-convertasas de {{las tres vías}} (clásica, lectinas y alternativa); su déficit causa {{HPN}}.","c":"Falsa (sí la inhibe): {{CR1}} actúa como cofactor del Factor I y disocia convertasas de {{las tres vías}}.","d":"Falsa (sí la inhibe): el {{Factor I}} degrada C3b (y C4b) con sus cofactores — inactiva también la vía alternativa.","e":"CORRECTA (no la inhibe): {{C4bBP}} se une a {{C4b}}, componente exclusivo de las vías {{clásica y de las lectinas}}; como la vía alternativa no usa C4, C4bBP no la toca."},"expl":"Regla de espectros: DAF, CR1, Factor H y Factor I inhiben las 3 vías; C1INH y C4bBP solo clásica + lectinas (actúan sobre C1/C4b, ausentes en la alternativa); Factor S y HRF/CD59 inhiben el MAC terminal. Concepto reina R1, 6 convocatorias.","nivel":"SALE_SEGURO","reina":"R1","clave":"estudiante","conf":"ALTA","diapo":"TEMA 4 (El complement) — reguladors","nota":"'Factor 1' en la opción d es el Factor I. HRF actúa sobre el MAC (tramo final común), por lo que se cuenta como inhibidor también de la vía alternativa; la única que no puede tocarla es C4bBP, como dedujo el estudiante."},{"k":"H20-39","examen":"📜 Abril 2020","real":0,"origen":"ABRIL-2020","tema":"T12 · Activación linfocitaria","sub":"Coestimulación — el T virgen necesita más señal","idioma":"castellano","enun":"De las siguientes células, ¿cuál necesita más coestimulación/energía de activación para activarse?","ops":{"a":"Th virgen.","b":"Th efector.","c":"Tc efector.","d":"Th memoria periférica.","e":"Todos necesitan el mismo nivel de energía/coestimulación para activarse."},"cor":"a","razones":{"a":"CORRECTA: el linfocito {{Th virgen}} tiene el umbral de activación más alto — requiere presentación por {{DC madura}} con fuerte coestimulación ({{B7–CD28}}) además de la señal 1; sin señal 2 cae en {{anergia}}.","b":"Falsa: el Th efector ya está diferenciado y responde con {{poca o ninguna}} coestimulación — puede activarse ante APCs no profesionales.","c":"Falsa: el Tc efector actúa sobre cualquier célula diana que muestre péptido-MHC I, {{sin necesitar}} coestimulación adicional.","d":"Falsa: las células de memoria tienen umbral de activación {{reducido}} — responden más rápido y con menos señal que las vírgenes.","e":"Falsa: los umbrales son claramente {{distintos}} — máximo en el virgen, mínimo en efectores y memoria."},"expl":"Jerarquía de umbrales: virgen (necesita DC madura + coestimulación B7-CD28 potente) >> memoria y efectores (umbral bajo, poca o ninguna coestimulación). Es la base de por qué solo la DC activa respuestas primarias.","nivel":"SALE_SEGURO","reina":"R17","clave":"razonada","conf":"ALTA","diapo":"TEMA 12 (Activació Limfocitària) — coestimulació","nota":null},{"k":"B14A-01","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T2 · Anatomía del sistema inmune","sub":"Bazo — vascularización de la pulpa blanca","idioma":"catalan","enun":"L'arteria trabecular","ops":{"a":"Es la que irriga la totalitat de la melsa","b":"Es divideix generant diferents artèries esplèniques","c":"Deriva en el vas limfàtic eferent","d":"Deriva en el tracte toràcic","e":"Es divideix generant diverses arterioles centrals"},"cor":"e","razones":{"a":"Falsa: la que irriga la totalidad del bazo es la {{arteria esplénica}}, que entra por el hilio; las trabeculares son sus ramas que viajan por las trabéculas.","b":"Falsa: es al revés — la {{arteria esplénica}} se divide en arterias trabeculares, no las trabeculares en esplénicas.","c":"Falsa: el bazo {{no tiene vasos linfáticos aferentes}}; una arteria nunca 'deriva' en un vaso linfático — son sistemas distintos.","d":"Falsa: el {{conducto torácico}} es el gran colector linfático del organismo; no tiene continuidad con las arterias esplénicas.","e":"CORRECTA: cada arteria trabecular da ramas llamadas {{arteriolas centrales}}, alrededor de las cuales se organiza la pulpa blanca ({{PALS}} de linfocitos T)."},"expl":"Secuencia vascular del bazo: arteria esplénica → arterias trabeculares → arteriolas centrales (rodeadas por el PALS) → arteriolas foliculares que drenan al seno marginal.","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 2, slide 19","nota":null},{"k":"B14A-02","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T9 · Ontogenia linfocitos B y T","sub":"Selección tímica — positiva sobre timocitos DP","idioma":"catalan","enun":"Quina de les següents afirmacions és correcta?:","ops":{"a":"El timo expressa AIRE","b":"Les cTECs són APCs","c":"La selecció positiva dels timòcits afecta als DN","d":"La selecció positiva dels timòcits afecta als DP","e":"Totes són falses"},"cor":"d","razones":{"a":"Discutible: AIRE sí se expresa en el timo (en las {{mTECs}} de la médula, para la selección negativa), así que literalmente es cierta; pero la respuesta canónica del examen es la d (ver nota).","b":"Falsa como 'APC profesional': las cTECs presentan MHC-péptido para la {{selección positiva}}, pero no son células presentadoras profesionales (esas son DC, macrófago y linfocito B).","c":"Falsa: los timocitos {{DN (dobles negativos)}} están reordenando la cadena β del TCR; aún no tienen TCR completo, luego no pueden ser seleccionados positivamente.","d":"CORRECTA: la selección positiva actúa en la {{corteza}} tímica sobre los timocitos {{DP (CD4+CD8+)}}, mediada por las {{cTECs}}: sobrevive el que reconoce MHC propio con afinidad moderada.","e":"Falsa: la d es correcta (y la a también es defendible), así que 'todas son falsas' no se sostiene."},"expl":"Selección positiva: corteza, timocitos DP, cTECs. Selección negativa: médula, mTECs (que expresan AIRE), DCs y macrófagos. La nota al margen del apuntador (DN/DP) apunta a la d.","nivel":"SALE_SEGURO","reina":"R9","clave":"razonada","conf":"MEDIA","diapo":"TEMA 2, slide 16 (AIRE en mTECs); TEMA 9 (selecciones)","nota":"Pregunta defectuosa: la opción a ('el timo expresa AIRE') también es cierta según las diapos (AIRE en mTECs, TEMA 2 slide 16). Se elige d por ser la respuesta canónica y repetida (misma pregunta en Abril 2017 q13) y por la nota al margen DN/DP del apuntador."},{"k":"B14A-03","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T2 · Anatomía del sistema inmune","sub":"Ganglios linfáticos — composición celular","idioma":"catalan","enun":"Els ganglis regionals","ops":{"a":"Drenen la limfa procedent del timus","b":"Contenen només limfòcits madurs","c":"Contenen limfòcits immadurs","d":"Contenen timòcits","e":"Contenen cèl·lules M"},"cor":"b","razones":{"a":"Falsa: los ganglios regionales drenan la linfa de los {{tejidos periféricos}} de su territorio; el timo no exporta linfocitos por linfa sino por {{vía sanguínea}}.","b":"CORRECTA: los órganos linfoides secundarios solo albergan linfocitos {{maduros}} (vírgenes que entran por las {{HEV}} y activados que llegan por linfáticos aferentes).","c":"Falsa: los linfocitos inmaduros están en los órganos {{primarios}} (médula ósea para B, timo para T), no en los ganglios.","d":"Falsa: los timocitos existen exclusivamente en el {{timo}}; cuando salen ya son linfocitos T maduros.","e":"Falsa: las células M son epiteliales especializadas de las {{placas de Peyer}} (MALT intestinal), no de los ganglios."},"expl":"Primarios (médula ósea, timo) = generación y maduración; secundarios (ganglio, bazo, MALT) = solo linfocitos ya maduros que buscan su antígeno.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 2, slides 4 i 29","nota":null},{"k":"B14A-04","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T3 · Inmunidad innata","sub":"Moléculas de inmunidad innata vs adaptativa","idioma":"catalan","enun":"Quina de les següents molècules no pertany a la immunitat innata?","ops":{"a":"MBL","b":"Pentraxina","c":"Factor H","d":"Factor B","e":"RAG-2"},"cor":"e","razones":{"a":"Falsa (sí es innata): la MBL (lectina de unión a manosa) es un {{PRR soluble}} que inicia la vía de las {{lectinas}} del complemento.","b":"Falsa (sí es innata): las pentraxinas (como la {{PCR}}, proteína C reactiva) son proteínas de fase aguda que opsonizan y activan complemento.","c":"Falsa (sí es innata): el Factor H es un {{regulador/inhibidor}} de la vía alternativa del complemento — sistema innato.","d":"Falsa (sí es innata): el Factor B forma la {{C3 convertasa alternativa}} (C3bBb) del complemento.","e":"CORRECTA: RAG-2 es la recombinasa de la {{recombinación V(D)J}} de BCR y TCR — maquinaria exclusiva de la inmunidad {{adaptativa}}."},"expl":"Todo lo que sea complemento, lectinas y proteínas de fase aguda es innato; RAG-1/RAG-2 generan la diversidad de receptores de linfocitos, sello de la adaptativa.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 3 / TEMA 4","nota":null},{"k":"B14A-05","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T3 · Inmunidad innata","sub":"TLRs y sus ligandos — TLR9/CpG","idioma":"catalan","enun":"Quina de les següents molècules és reconeguda per un TLR?","ops":{"a":"Transferrina","b":"DAG","c":"Àcid araquidònic","d":"Manosa","e":"CpG DNA no metil·lat"},"cor":"e","razones":{"a":"Falsa: la transferrina es la proteína transportadora de {{hierro}} del plasma — molécula propia, no un PAMP.","b":"Falsa: el DAG (diacilglicerol) es un {{segundo mensajero}} intracelular de la señalización (activa PKC), no un ligando de TLR.","c":"Falsa: el ácido araquidónico es el precursor de {{prostaglandinas y leucotrienos}} — mediador lipídico propio, no reconocido por TLRs.","d":"Falsa: la manosa la reconocen el {{receptor de manosa}} (lectina tipo C) y la MBL, no un TLR.","e":"CORRECTA: el DNA {{CpG no metilado}}, típico de bacterias, es el ligando de {{TLR9}} (TLR endosómico)."},"expl":"Tabla de TLRs a saber entera: TLR3-dsRNA, TLR7/8-ssRNA, TLR9-CpG DNA no metilado, TLR4-LPS, TLR1/2-triacil y TLR6/2-diacil-lipopéptidos, TLR5-flagelina.","nivel":"SALE_SEGURO","reina":"R16","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (TLRs)","nota":null},{"k":"B14A-06","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T3 · Inmunidad innata","sub":"Estallido oxidativo — anión superóxido","idioma":"catalan","enun":"L'esclat oxidatiu produeix","ops":{"a":"El catió peròxid","b":"L'anió NO","c":"L'anió superòxid","d":"INFγ","e":"IL-4"},"cor":"c","razones":{"a":"Falsa: 'catión peróxido' no existe como tal; lo que se genera después es {{peróxido de hidrógeno}} (H₂O₂) por la superóxido dismutasa, y no es un catión.","b":"Falsa: el óxido nítrico (NO) lo produce la {{iNOS}} (óxido nítrico sintasa inducible) en una vía distinta, no el estallido oxidativo de la NADPH oxidasa; y como 'anión NO' está mal formulado.","c":"CORRECTA: la {{NADPH oxidasa}} (complejo phox) transfiere electrones al O₂ y genera el {{anión superóxido}} (O₂⁻), primer ROS del estallido.","d":"Falsa: el IFNγ es una {{citocina}} (activadora de macrófagos, Th1), no una especie reactiva del oxígeno.","e":"Falsa: la IL-4 es la citocina firma de la respuesta {{Th2}}, nada que ver con los ROS."},"expl":"Cadena del estallido oxidativo: NADPH oxidasa → O₂⁻ (superóxido) → SOD → H₂O₂ → mieloperoxidasa (+Cl⁻) → HOCl (hipoclorito).","nivel":"SALE_SEGURO","reina":"R19","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (fagocitosis/killing)","nota":null},{"k":"B14A-07","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T3 · Inmunidad innata","sub":"Mediadores del mastocito — histamina","idioma":"catalan","enun":"Assenyala la molècula que produeixi broncoconstricció","ops":{"a":"TNT-α","b":"Prostaglandina D2","c":"Histamina","d":"GM-CSF","e":"IL-2"},"cor":"c","razones":{"a":"Falsa: TNF-α (errata 'TNT' en el original) es una citocina {{proinflamatoria}} (fiebre, activación endotelial, shock séptico), no un broncoconstrictor directo clásico.","b":"Discutible: la prostaglandina D2 también contrae el músculo liso bronquial, pero la respuesta canónica del curso es la {{histamina}} (ver nota).","c":"CORRECTA: la histamina, liberada por los gránulos del {{mastocito}}, actúa sobre receptores {{H1}} produciendo broncoconstricción, vasodilatación y aumento de permeabilidad vascular.","d":"Falsa: GM-CSF es un factor {{hematopoyético}} (estimula colonias de granulocitos y macrófagos), sin efecto contráctil bronquial.","e":"Falsa: la IL-2 es el factor de {{proliferación}} de los linfocitos T activados."},"expl":"La histamina es el mediador preformado por excelencia de la degranulación mastocitaria: broncoconstricción + vasodilatación + permeabilidad (base de la fase inmediata de la alergia).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 3 (mastocitos)","nota":"Errata OCR: 'TNT-α' = TNF-α. La PGD2 también es broncoconstrictora (pregunta imperfecta), pero la histamina es la respuesta esperada y se repite en Biotec 2014-2º q2."},{"k":"B14A-08","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T1 · Introducción a la inmunología","sub":"Innata vs adaptativa — componentes humoral y celular en ambas","idioma":"catalan","enun":"Assenyala l'afirmació correcta","ops":{"a":"Tots els patògens son unicel·lulars","b":"Tant la immunitat adaptativa com la innata tenen un component humoral","c":"Només la immunitat adaptativa té un component humoral","d":"Només la immunitat adaptativa té un component cel·lular","e":"Cap de les anteriors es veritat"},"cor":"b","razones":{"a":"Falsa: hay patógenos pluricelulares, como los {{helmintos}} (gusanos parásitos); y los virus ni siquiera son células.","b":"CORRECTA: la innata tiene humoral ({{complemento}}, pentraxinas, MBL)
