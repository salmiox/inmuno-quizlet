{"a":"Sí implica: la hipermutación somática introduce {{mutaciones puntuales}} en el DNA de la región V de las Ig mediante la enzima {{AID}}.","b":"Sí implica: la ETosis consiste en expulsar trampas extracelulares de {{DNA}} (cromatina) decorado con proteínas granulares para atrapar microbios.","c":"Sí implica: la edición del receptor es un nuevo {{reordenamiento VDJ}} de la cadena ligera en el DNA de un linfocito B autorreactivo.","d":"Sí implica: el cambio de isotipo es una {{recombinación por deleción}} del DNA entre regiones switch, mediada también por {{AID}}.","e":"CORRECTA: los cuatro mecanismos operan sobre {{DNA}} — mutación (SHM), recombinación (edición, switch) o expulsión de cromatina ({{ETosis}})."},"expl":"Pregunta trampa: la ETosis, aunque no es un mecanismo genético, usa físicamente el DNA como trampa extracelular; por eso todos los mecanismos listados implican ácidos nucleicos.","nivel":"SALE_SEGURO","reina":"R21","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 — NETOSI/ETOSI (extracellular traps of DNA/protein)","nota":null},{"k":"EX26-03","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T12 · Activación linfocitaria","sub":"Moléculas coestimuladoras vs correceptores","idioma":"catalan","enun":"De les següents, quina no és una molècula coestimuladora?:","ops":{"a":"41BBL","b":"CD40L","c":"ICOSL","d":"CD8","e":"CD28"},"cor":"d","razones":{"a":"Es coestimuladora: 4-1BBL (en la APC) se une a {{4-1BB (CD137)}} del linfocito T y transmite señal coestimuladora de la familia {{TNF}}.","b":"Es coestimuladora: CD40L (CD154) del linfocito T une {{CD40}} de la APC/linfocito B — coestimulación bidireccional clave para la activación de B y el cambio de isotipo.","c":"Es coestimuladora: ICOSL une {{ICOS}} del T activado; es esencial para los {{T foliculares (Tfh)}} y la reacción de centro germinal.","d":"CORRECTA (no lo es): CD8 es un {{correceptor}} — se une a la región invariante del {{MHC de clase I}} y acerca la quinasa p56lck al TCR. Estabiliza el reconocimiento del antígeno (señal 1), no aporta señal 2.","e":"Es coestimuladora: CD28 es EL coestimulador prototípico del linfocito T — une {{B7-1/B7-2 (CD80/CD86)}} y aporta la {{señal 2}}."},"expl":"Coestimulación = señal 2 (CD28–B7, ICOS–ICOSL, CD40–CD40L, 4-1BB–4-1BBL). CD4 y CD8 son correceptores: forman parte de la señal 1 al unirse al MHC junto con el TCR.","nivel":"SALE_SEGURO","reina":"R17","clave":"razonada","conf":"ALTA","diapo":"TEMA 12 — coestimulació i receptors d'Ag","nota":null},{"k":"EX26-04","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T7 · MHC y presentación","sub":"Polimorfismo y codominancia del HLA de clase I","idioma":"catalan","enun":"Assenyala l'afirmació correcta, assumint que els al·lels paterns i materns són diferents:","ops":{"a":"Hi han 6 possibles molècules de HLA-A per persona","b":"Hi han 6 possibles molècules de HLA de tipus I per persona","c":"La cadena β2 microglobulina és molt polimòrfica","d":"Els receptors poli-Ig s'expressen al pol apical de l'epiteli de la mucosa","e":"Les FDCs es localitzen a la regió PALS de la melsa"},"cor":"b","razones":{"a":"Falsa: de HLA-A solo hay {{2}} moléculas por persona (alelo paterno + materno, expresión codominante). Las 6 salen de sumar los TRES loci, no de un solo locus.","b":"CORRECTA: con alelos paternos y maternos distintos, los 3 loci clásicos de clase I ({{HLA-A, HLA-B, HLA-C}}) × 2 alelos codominantes = {{6}} moléculas de clase I distintas.","c":"Falsa: la β2-microglobulina es {{invariante}} (no polimórfica) — ni siquiera está codificada en el complejo HLA, sino en el cromosoma {{15}}.","d":"Falsa: el receptor poli-Ig se expresa en el polo {{basolateral}} del epitelio mucoso (capta la IgA dimérica desde la lámina propia); en el polo apical lo que se libera es la IgA secretora con el {{componente secretor}}.","e":"Falsa: las FDCs (células dendríticas foliculares) están en los {{folículos}} (zona B); la PALS del bazo es la vaina linfoide  hacia genes CH situados corriente abajo. Desde IgE (Cε) solo queda disponible Cα (IgA).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 8 — canvi d'isotip (ordre dels gens CH)","nota":null},{"k":"EX26-06","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T8 · Igs, BCR y TCR","sub":"Funciones efectoras por isotipo — IgG1","idioma":"catalan","enun":"Quin isotip pot travessar la placenta, activar complement i degranular NKs?:","ops":{"a":"IgG4","b":"IgG1","c":"IgE","d":"IgG2","e":"IgM"},"cor":"b","razones":{"a":"Falsa: IgG4 cruza la placenta pero {{no activa complemento}} (no fija C1q) y es mala mediadora de ADCC (citotoxicidad celular dependiente de anticuerpo).","b":"CORRECTA: IgG1 hace las tres cosas — cruza la placenta vía {{FcRn}}, fija {{C1q}} activando la vía clásica del complemento, y su Fc es reconocida por {{CD16 (FcγRIII)}} de las NK para la ADCC (degranulación).","c":"Falsa: la IgE no cruza la placenta ni activa complemento; degranula {{mastocitos y basófilos}} (vía FcεRI), no NKs.","d":"Falsa: IgG2 cruza mal la placenta y activa débilmente el complemento; su especialidad son los antígenos {{polisacarídicos}}.","e":"Falsa: la IgM es la mejor {{activadora de complemento}}, pero es un pentámero demasiado grande para {{cruzar la placenta}} y no media ADCC por NK."},"expl":"IgG1 (y en menor medida IgG3) es el isotipo 'todoterreno': transporte placentario (FcRn), activación de la vía clásica (C1q) y ADCC por NK (FcγRIII/CD16).","nivel":"SALE_SEGURO","reina":"R4","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 — funcions efectores dels isotips (subclasses IgG)","nota":null},{"k":"EX26-07","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T8 · Igs, BCR y TCR","sub":"Idiotipo de un anticuerpo — CDRs","idioma":"catalan","enun":"Dels següents assenyala la part que formi part de l'idiotip d'un anticòs:","ops":{"a":"Regió frontissa","b":"Regió Fc","c":"CDR","d":"Regió CH1","e":"Cadena J"},"cor":"c","razones":{"a":"Falsa: la región bisagra es una zona {{constante}} que da flexibilidad entre Fab y Fc; es igual dentro de cada isotipo, no define la especificidad del clon.","b":"Falsa: la región Fc es {{constante}} — determina el isotipo y las funciones efectoras, no la especificidad antigénica del anticuerpo.","c":"CORRECTA: el idiotipo es el conjunto de determinantes antigénicos propios de la región {{variable}} de un clon concreto — y reside sobre todo en los {{CDR}} (regiones determinantes de complementariedad), que forman el {{parátopo}}.","d":"Falsa: CH1 es el primer dominio {{constante}} de la cadena pesada (parte del Fab pero no de la zona variable): compartido por todos los anticuerpos del mismo isotipo.","e":"Falsa: la cadena J es un polipéptido accesorio que une los monómeros de {{IgM pentamérica e IgA dimérica}}; no tiene nada que ver con la especificidad."},"expl":"Isotipo = región constante (clase); alotipo = variantes alélicas entre individuos; idiotipo = determinantes únicos de la región variable de cada clon, concentrados en los CDR.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 8 — estructura de les Ig (isotip/al·lotip/idiotip)","nota":null},{"k":"EX26-08","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"Anafilotoxinas — degranulación de basófilos por C5a","idioma":"catalan","enun":"Quina de les següents molècules pot induir degranulació dels basòfils?:","ops":{"a":"IgG2+antigen","b":"Properdina","c":"IgG4+antigen","d":"C5a","e":"HLA-DM"},"cor":"d","razones":{"a":"Falsa: los basófilos degranulan por entrecruzamiento de {{IgE}} sobre su receptor {{FcεRI}}; la IgG2 no entrecruza receptores activadores del basófilo.","b":"Falsa: la properdina es el único regulador POSITIVO del complemento — {{estabiliza}} la C3-convertasa de la vía {{alternativa}}; no degranula células.","c":"Falsa: la IgG4 es un isotipo 'antiinflamatorio' que ni fija complemento ni degranula basófilos; incluso puede {{bloquear}} la degranulación al competir con la IgE por el antígeno.","d":"CORRECTA: C5a es la {{anafilotoxina}} más potente del complemento — induce degranulación directa de {{mastocitos y basófilos}} (liberación de histamina), además de ser quimiotáctica para neutrófilos.","e":"Falsa: HLA-DM es una molécula intracelular de la vía {{exógena}} de presentación (intercambio de {{CLIP}}); no toca a los basófilos."},"expl":"Las anafilotoxinas C3a y C5a (C5a > C3a) degranulan mastocitos y basófilos sin necesidad de IgE — de ahí su nombre: reproducen una 'anafilaxia' por vía del complemento.","nivel":"SALE_SEGURO","reina":"R23","clave":"razonada","conf":"ALTA","diapo":"TEMA 4 — anafilotoxines C3a/C5a","nota":null},{"k":"EX26-09","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T8 · Igs, BCR y TCR","sub":"IgA secretora — componente secretor y receptor poli-Ig","idioma":"catalan","enun":"Assenyala l'afirmació falsa:","ops":{"a":"El component secretor prové de la degradació parcial de la regió Fab d'una IgA","b":"Les IgAs dimèriques són la forma més abundant d'IgAs a les mucoses","c":"La dimerització de les IgAs es produeix utilitzant la cadena J","d":"Les IgMs són les immunoglobulines que primer s'expressen als limfòcits B","e":"Les IgEs són les immunoglobulines menys abundants a la sang"},"cor":"a","razones":{"a":"CORRECTA (es la falsa): el componente secretor NO viene de la IgA — es el fragmento extracelular del {{receptor poli-Ig}} de la célula epitelial, que queda unido a la IgA tras la {{transcitosis}} y la proteólisis del receptor.","b":"Verdadera: en las mucosas domina la IgA {{dimérica}} (secretora); la monomérica predomina en el {{suero}}.","c":"Verdadera: la {{cadena J}} une los dos monómeros de IgA (y los cinco de IgM) y además es necesaria para que el receptor {{poli-Ig}} las reconozca.","d":"Verdadera: la {{IgM}} (de membrana) es la primera Ig que expresa el linfocito B durante la ontogenia, seguida de la coexpresión con {{IgD}}.","e":"Verdadera: la IgE es la Ig {{menos abundante}} del suero (del orden de ng/mL) — está mayoritariamente unida a los FcεRI de mastocitos y basófilos."},"expl":"El componente secretor es un 'recuerdo' del receptor poli-Ig del epitelio (no un derivado de la propia IgA): protege a la IgA secretora de la proteólisis en la luz mucosa.","nivel":"SALE_SEGURO","reina":"R5","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 — cadena J i component secretor (IgA secretora)","nota":null},{"k":"EX26-10","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"Lisis enzimática en el fagolisosoma del macrófago","idioma":"catalan","enun":"La lisi enzimàtica de microbis fagocitats per macròfags:","ops":{"a":"No depèn de l'activitat de l'immunoproteasoma","b":"Es potencia per l'ajut dels Th1","c":"S'activa per IFNγ","d":"S'activa per l'acidificació del lisosoma","e":"Totes són veritat"},"cor":"e","razones":{"a":"Verdadera: el inmunoproteasoma degrada proteínas {{citosólicas}} para la vía endógena de presentación; la digestión del microbio fagocitado ocurre en el {{fagolisosoma}}, un compartimento independiente.","b":"Verdadera: los {{Th1}} activan clásicamente al macrófago (vía IFNγ + CD40L), potenciando su capacidad {{microbicida}}.","c":"Verdadera: el {{IFNγ}} es la citocina activadora del macrófago (fenotipo {{M1}}): aumenta enzimas lisosomales, NADPH oxidasa e iNOS.","d":"Verdadera: las hidrolasas lisosomales son {{hidrolasas ácidas}} — funcionan de forma óptima al {{acidificarse}} el fagolisosoma (bomba de protones).","e":"CORRECTA: las cuatro afirmaciones son ciertas — digestión ácida en fagolisosoma, independiente del inmunoproteasoma, y potenciada por el eje {{Th1–IFNγ}}."},"expl":"La destrucción del microbio fagocitado combina mecanismos oxidativos y enzimáticos en el fagolisosoma ácido; el eje Th1/IFNγ 'sobrecarga' esta maquinaria (activación clásica M1).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 3 — fagocitosi i mort intracel·lular","nota":"Pregunta tipo 'totes són veritat': cada opción individual es defendible como cierta, pero el formato invita a la trampa — confianza MEDIA (coincide con el mapeo)."},{"k":"EX26-11","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T7 · MHC y presentación","sub":"MHC de clase I — longitud de los péptidos (8-11 aa)","idioma":"catalan","enun":"Assenyala l'opció correcta:","ops":{"a":"HLA DQ i HLA DP són molt poc polimòrfics","b":"HLA A es carrega amb pèptids de 8-11 aminoàcids de llargada","c":"HLA B es carrega amb pèptids facilitats per HLA-DO","d":"HLA DP pertany a la superfamília de les lectines de tipus C","e":"Totes són falses"},"cor":"b","razones":{"a":"Falsa: HLA-DQ y HLA-DP son moléculas {{clásicas de clase II}} y, como tales, muy {{polimórficas}} (las poco polimórficas son las no clásicas: HLA-DM, HLA-DO, HLA-E/F/G).","b":"CORRECTA: el surco de la clase I está {{cerrado}} por los extremos, así que HLA-A acomoda péptidos cortos de {{8-11}} aminoácidos (los de clase II, con surco abierto, admiten {{13-25}}).","c":"Falsa: HLA-B (clase I) se carga en el RE con péptidos transportados por {{TAP}}; HLA-DO es un modulador de {{HLA-DM}} en la vía exógena — no toca a la clase I.","d":"Falsa: HLA-DP pertenece a la superfamília de las {{inmunoglobulinas}}, como todo el MHC; las lectinas de tipo C son otra familia (MBL, selectinas, receptores de manosa).","e":"Falsa: la opción {{b}} es verdadera, así que 'todas son falsas' no puede ser."},"expl":"Clase I = surco cerrado, péptidos de 8-11 aa, carga en el RE vía TAP; clase II = surco abierto, péptidos de 13-25 aa, carga endosomal con ayuda de HLA-DM (modulada por HLA-DO).","nivel":"SALE_SEGURO","reina":"R3","clave":"razonada","conf":"ALTA","diapo":"TEMA 7 MHC — \"la longitud... sol ser de 8-11 residus\"","nota":null},{"k":"EX26-12","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"Gránulos preformados del eosinófilo — proteína catiónica eosinofílica","idioma":"catalan","enun":"Assenyala quin dels següents és un component preformat dels grànuls dels eosinòfils:","ops":{"a":"Lipoxines","b":"IL-5","c":"Proteïna catiònica eosinofílica","d":"Eotaxina","e":"IFNγ"},"cor":"c","razones":{"a":"Falsa: las lipoxinas son mediadores {{lipídicos}} sintetizados {{de novo}} a partir del ácido araquidónico durante la activación — no se almacenan en gránulos.","b":"Falsa: la IL-5 no está en los gránulos del eosinófilo — es la citocina (de origen {{Th2}}) que estimula la producción y activación de los propios {{eosinófilos}}.","c":"CORRECTA: la proteína catiónica eosinofílica (ECP, una {{RNasa}}) es una de las proteínas básicas {{preformadas}} de los gránulos del eosinófilo, junto con la proteína básica principal (PBP/MBP), la EPO y la EDN. Es unas {{10 veces}} más tóxica que la PBP.","d":"Falsa: la eotaxina es la {{quimiocina}} (CCL11) que atrae eosinófilos vía {{CCR3}} — la producen otros tejidos, no es contenido granular del eosinófilo.","e":"Falsa: el IFNγ es la citocina firma de {{Th1}} y NK; nada que ver con los gránulos del eosinófilo."},"expl":"Gránulos preformados del eosinófilo: PBP/MBP, ECP (10× más tóxica que la PBP), peroxidasa eosinofílica y EDN. Todo lo demás de la lista son mediadores de novo o señales externas.","nivel":"SALE_SEGURO","reina":"R20","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 — grànuls de l'eosinòfil (ECP \"10x més tòxica que la PBP\")","nota":null},{"k":"EX26-13","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T8 · Igs, BCR y TCR","sub":"Recombinación VDJ — dónde y cuándo ocurre","idioma":"catalan","enun":"Què és fals respecte de la recombinació VDJ?:","ops":{"a":"Afecta a la regió variable de les immunoglobulines i TCRs","b":"No requereix l'acció d'AID","c":"Es produeix només al fetge fetal i moll de l'os","d":"No afecta a la regió Fc de les immunoglobulines","e":"Va ser descoberta per Susumu Tonegawa"},"cor":"c","razones":{"a":"Verdadera: la recombinación V(D)J genera la región {{variable}} tanto de las Ig (linfocitos B) como de los {{TCR}} (linfocitos T).","b":"Verdadera: la V(D)J usa la recombinasa {{RAG1/RAG2}}; la enzima {{AID}} interviene después, en la hipermutación somática y el cambio de isotipo (centro germinal).","c":"CORRECTA (es la falsa): también ocurre en el {{timo}}, donde los timocitos reordenan los genes del {{TCR}}. Hígado fetal y médula ósea solo cubren la línea B.","d":"Verdadera: la V(D)J solo recombina segmentos {{V, D y J}} de la región variable; la región {{Fc}} (constante) se decide después por transcripción/cambio de isotipo.","e":"Verdadera: {{Susumu Tonegawa}} descubrió el reordenamiento somático de los genes de las Ig (Nobel {{1987}})."},"expl":"La V(D)J ocurre en todos los órganos linfoides primarios: hígado fetal y médula ósea (línea B) Y timo (línea T). Decir 'solo hígado fetal y médula' olvida el TCR.","nivel":"SALE_SEGURO","reina":"R6","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 — recombinació V(D)J","nota":null},{"k":"EX26-14","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T8 · Igs, BCR y TCR","sub":"Componentes de la recombinasa VDJ — RSS no es enzima","idioma":"catalan","enun":"Quin dels següents factors no forma part de la recombinasa?:","ops":{"a":"RSS","b":"TdT","c":"RAG1","d":"Artemis","e":"RAG2"},"cor":"a","razones":{"a":"CORRECTA (no forma parte): las RSS (secuencias señal de recombinación) son {{secuencias de DNA}} que flanquean los segmentos V, D y J — son el {{sustrato}} que la recombinasa reconoce, no un componente enzimático.","b":"Forma parte: la TdT (desoxinucleotidil-transferasa terminal) es la DNA-polimerasa {{independiente de molde}} que añade nucleótidos {{N}} en las uniones, aumentando la diversidad juncional.","c":"Forma parte: RAG1, junto con RAG2, es la {{endonucleasa}} que reconoce las RSS y corta el DNA para iniciar la recombinación.","d":"Forma parte: Artemis (con {{DNA-PK}}) abre las {{horquillas (hairpins)}} generadas por RAG en los extremos codificantes.","e":"Forma parte: RAG2 forma el heterodímero {{RAG1/RAG2}}, el corazón de la recombinasa V(D)J."},"expl":"El conjunto enzimático de la recombinasa incluye RAG1/2, Artemis, DNA-PK, Ku, DNA-ligasa IV y TdT; las RSS son las señales de DNA sobre las que actúa, no enzimas.","nivel":"SALE_SEGURO","reina":"R6","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 — recombinasa: RAG1/2, Artemis, TdT, RSS","nota":null},{"k":"EX26-15","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"Lectinas de tipo C — MBL y L-selectina","idioma":"catalan","enun":"Dels següents noms quin correspon a una lectina del tipus C?","ops":{"a":"LFA-1","b":"MBL","c":"PAF","d":"L-selectina","e":"(b. i d)"},"cor":"e","razones":{"a":"Falsa (sola): LFA-1 es una {{integrina}} (β2, CD11a/CD18) de adhesión fuerte, no una lectina.","b":"Cierta pero incompleta: la MBL (lectina de unión a manosa) es una {{colectina}} — lectina de tipo C soluble que reconoce {{manosa}} y activa la vía de las {{lectinas}} del complemento.","c":"Falsa (sola): el PAF (factor activador de plaquetas) es un mediador {{lipídico}} inflamatorio, no una proteína.","d":"Cierta pero incompleta: las selectinas tienen un dominio {{lectina de tipo C}} N-terminal dependiente de {{Ca²⁺}} con el que unen carbohidratos (sialil-Lewis X y afines).","e":"CORRECTA: tanto MBL como L-selectina son lectinas de tipo C (unión a carbohidratos dependiente de {{calcio}}): la MBL soluble y la selectina de membrana."},"expl":"Las lectinas de tipo C unen carbohidratos de forma Ca²⁺-dependiente e incluyen tanto proteínas solubles (colectinas: MBL, SP-A/D) como de membrana (selectinas, receptor de manosa, dectina).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 3 — PRRs solubles (MBL) · TEMA 11 — domini lectina de les selectines","nota":null},{"k":"EX26-16","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"Mediadores que inducen secreción de moco — IL-13 y leucotrienos","idioma":"catalan","enun":"Quina molècula de les següents provoca secreció de mucositat per l'epiteli corresponent?:","ops":{"a":"PGE","b":"IL-13","c":"Leucotriè","d":"(a. i b)","e":"(b. i c)"},"cor":"e","razones":{"a":"Falsa (sola): las prostaglandinas E producen {{vasodilatación}}, fiebre y dolor; no son el mediador clásico de la hipersecreción mucosa en las diapos del tema.","b":"Cierta pero incompleta: la IL-13 (citocina {{Th2}}) induce {{metaplasia de células caliciformes}} e hipersecreción de moco en el epitelio respiratorio — clave en el asma.","c":"Cierta pero incompleta: los leucotrienos (cisteinílicos: LTC4/D4/E4) causan {{broncoconstricción}} prolongada y {{secreción de moco}} (literal en las diapos de T3).","d":"Falsa: incluye la PGE, que no es la respuesta buscada.","e":"CORRECTA: tanto la {{IL-13}} como los {{leucotrienos}} inducen secreción de moco por el epitelio — combinación típica de la respuesta tipo 2/alérgica."},"expl":"La hipersecreción mucosa es marca de la respuesta tipo 2: IL-13 (metaplasia caliciforme) y leucotrienos cisteinílicos (moco + broncoconstricción). La PGE va por otra vía (vasodilatación, fiebre).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 3 — leucotriens: \"broncoconstricció prolongada, secreció de moc\"","nota":"Confianza MEDIA (heredada del mapeo): la exclusión de la PGE se basa en que las diapos solo atribuyen el moco a leucotrienos e IL-13."},{"k":"EX26-17","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T4 · Complemento","sub":"Inhibidores del complemento — C1INH","idioma":"catalan","enun":"Factor que promou la dissociació dels components enzimàtics de C1 respecte de C1q:","ops":{"a":"Factor H","b":"C1INH","c":"DAF","d":"Factor D","e":"Factor I"},"cor":"b","razones":{"a":"Falsa: el Factor H desplaza al factor {{Bb}} de la C3-convertasa {{alternativa}} y hace de cofactor del Factor I — actúa sobre C3b, no sobre C1.","b":"CORRECTA: el C1INH (una {{serpina}}) se une a C1r y C1s activados y los {{disocia de C1q}}, apagando la vía clásica (y las MASP de la vía de las lectinas). Su déficit causa el {{angioedema hereditario}}.","c":"Falsa: DAF (CD55) {{acelera la disociación de las convertasas}} (C4b2b y C3bBb) en la membrana propia; no toca al complejo C1.","d":"Falsa: el Factor D es una {{proteasa activadora}} de la vía alternativa (corta el Factor B) — es lo contrario de un inhibidor.","e":"Falsa: el Factor I es una proteasa que {{degrada C3b y C4b}} con ayuda de cofactores (Factor H, MCP, CR1); no actúa sobre C1."},"expl":"C1INH es el inhibidor de espectro más estrecho: solo vía clásica y de las lectinas — secuestra C1r₂s₂ separándolos de C1q. Su déficit = angioedema hereditario.","nivel":"SALE_SEGURO","reina":"R1","clave":"razonada","conf":"ALTA","diapo":"TEMA 4 — \"C1 inhibitor (C1-INH, serpin)\"","nota":null},{"k":"EX26-18","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"Estallido respiratorio — producto de la superóxido-dismutasa","idioma":"catalan","enun":"Quina de les següents espècies moleculars es producte directe de l'activitat de la Superòxid-Dismutasa?:","ops":{"a":"O₂·⁻","b":"OH⁻","c":"H₂O₂","d":"H₂O⁻ [?]","e":"·OH"},"cor":"c","razones":{"a":"Falsa: el anión superóxido (O₂·⁻) es el {{sustrato}} de la SOD, no su producto — lo genera antes la {{NADPH oxidasa}}.","b":"Falsa: el hidroxilo aniónico no es producto de la SOD; los derivados hidroxilo aparecen después vía reacción de {{Fenton}} (con hierro).","c":"CORRECTA: la SOD dismuta dos superóxidos en {{peróxido de hidrógeno}} (H₂O₂) y O₂. Después la {{mieloperoxidasa}} convierte el H₂O₂ en hipoclorito (HOCl).","d":"Falsa: 'H₂O⁻' no es una especie real de la cadena del estallido oxidativo (probable errata del examen).","e":"Falsa: el radical hidroxilo (·OH) se genera a partir del H₂O₂ por la reacción de {{Fenton}}, un paso posterior a la SOD."},"expl":"Cadena del estallido oxidativo: NADPH oxidasa → O₂·⁻ → (SOD) → H₂O₂ → (mieloperoxidasa + Cl⁻) → HOCl. La SOD produce directamente H₂O₂.","nivel":"SALE_SEGURO","reina":"R19","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 — esclat respiratori (superòxid dismutasa)","nota":"La opción d está transcrita con [?] en el corpus (posible errata de imprenta 'H₂O⁻'); no afecta a la respuesta."},{"k":"EX26-19","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T5 · Inmunógenos y antígenos","sub":"Epítopos conformacionales","idioma":"catalan","enun":"Què és fals respecte dels epítops conformacionals?:","ops":{"a":"Desapareixen quan la proteïna està en conformació nadiva","b":"Es mantenen quan la proteïna està en conformació nadiva","c":"Només poden ser reconeguts per un BCR però no per un TCR","d":"Desapareixen quan la proteïna es desnaturalitza","e":"Estan formats per aminoàcids no contigus a la seqüència proteica"},"cor":"a","razones":{"a":"CORRECTA (es la falsa): es justo al revés — el epítopo conformacional {{existe}} mientras la proteína está en conformación {{nativa}}; es el plegamiento el que junta los residuos que lo forman.","b":"Verdadera: la conformación {{nativa}} es la condición para que el epítopo conformacional esté presente.","c":"Verdadera: el TCR solo reconoce {{péptidos lineales}} presentados por MHC (la proteína ya está degradada); los epítopos conformacionales solo los ve el {{BCR}}/anticuerpo sobre el antígeno íntegro.","d":"Verdadera: al {{desnaturalizarse}} la proteína, los residuos no contiguos se separan y el epítopo conformacional se pierde.","e":"Verdadera: por definición están formados por aminoácidos {{no contiguos}} en secuencia que el plegamiento aproxima en el espacio."},"expl":"Epítopo conformacional (discontinuo) = residuos alejados en secuencia pero juntos en el plegamiento nativo: existe plegado, desaparece desnaturalizado, y solo lo reconocen anticuerpos/BCR (nunca el TCR).","nivel":"SALE_SEGURO","reina":"R22","clave":"razonada","conf":"ALTA","diapo":"TEMA 5 — \"Epitops discontinus o conformacionals\"","nota":null},{"k":"EX26-20","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T6 · APCs (presentadoras)","sub":"Efecto de los PAMPs sobre las APCs","idioma":"catalan","enun":"Què és fals respecte de l'efecte que els PAMPs tenen sobre les APCs:","ops":{"a":"Condicionen el tipus de coestimulació que ofereixen les APC","b":"Incrementen el nivell de coestimulació de l'APC","c":"Eliminant l'expressió de HLA de la superfície de l'APC","d":"Provoquen secreció de citocines per part de les APCs","e":"Determinen en última instància el tipus de polarització del limfòcits Th"},"cor":"c","razones":{"a":"Verdadera: según qué {{PRR}} se active, la APC expresa un repertorio distinto de moléculas coestimuladoras — el tipo de patógeno {{condiciona}} la señal 2.","b":"Verdadera: los PAMPs (vía TLRs y otros PRRs) inducen la {{maduración}} de la APC, que sube {{B7-1/B7-2 (CD80/CD86)}} y otras coestimuladoras.","c":"CORRECTA (es la falsa): ocurre lo contrario — la activación por PAMPs {{AUMENTA}} y estabiliza la expresión de {{MHC/HLA}} en superficie (la DC madura presenta más, no menos).","d":"Verdadera: los PAMPs disparan la secreción de {{citocinas}} por la APC (IL-12, IL-6, IL-1, IL-23...), que serán la {{señal 3}} para el linfocito T.","e":"Verdadera: esas citocinas de la APC deciden la {{polarización}} del Th (IL-12→Th1, IL-6/IL-23/TGF-β→Th17, etc.) — el PAMP inicial determina el desenlace."},"expl":"Los PAMPs maduran a la APC: más MHC en superficie, más coestimulación y secreción de citocinas polarizantes (señal 3). Decir que 'eliminan el HLA' invierte el efecto real.","nivel":"SALE_SEGURO","reina":"R17","clave":"razonada","conf":"ALTA","diapo":"TEMA 6 APCs — maduració de la DC per PAMPs","nota":null},{"k":"EX26-21","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"PRRs solubles — pentraxinas y proteínas de fase aguda","idioma":"catalan","enun":"Assenyala l'afirmació correcta:","ops":{"a":"Les pentraxines són PRRs de membrana plasmàtica","b":"La PCR és una proteïna de fase aguda","c":"Els receptors de pèptids formilats són receptors \"scavenger\"","d":"Les col·lectines són integrines de tipus C","e":"La LBP només actua sobre TLR4 facilitant el seu accés al LPS"},"cor":"b","razones":{"a":"Falsa: las pentraxinas (PCR, SAP) son PRRs {{solubles}}, circulan en plasma; no son receptores de membrana plasmática.","b":"CORRECTA: la PCR (proteína C reactiva) es la proteína de {{fase aguda}} por excelencia — su síntesis hepática aumenta hasta {{x1000}} durante la respuesta de fase aguda, y media opsonización.","c":"Falsa: los receptores de péptidos formilados (fMLP) son receptores acoplados a {{proteína G}} que median quimiotaxis de fagocitos; los scavenger son otra familia (captan lipoproteínas modificadas y polianiones).","d":"Falsa: las colectinas (como la MBL) son {{lectinas}} con dominio de colágeno + dominio lectina tipo C; no son integrinas (esas son moléculas de adhesión).","e":"Falsa: la LBP (proteína de unión a LPS) extrae el LPS y lo transfiere a {{CD14}}, que a su vez lo presenta al complejo TLR4/MD-2 — no actúa 'solo' sobre TLR4 directamente."},"expl":"Los PRRs solubles incluyen pentraxinas (PCR, SAP), colectinas (MBL) y ficolinas. La PCR es el prototipo de proteína de fase aguda: se multiplica x1000, opsoniza y activa complemento.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 3, slide 'Pentraxines: Proteïna C reactiva (PCR) — proteïna de fase aguda (x1000)' y slide LBP","nota":null},{"k":"EX26-22","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"NETosis, gránulos del neutrófilo y células NK","idioma":"catalan","enun":"Assenyala l'afirmació falsa:","ops":{"a":"Els grànuls dels neutròfils madurs contenen NADPH oxidasa","b":"La NETosi és un tipus d'ADCC","c":"La G-CSF promou la diferenciació cap a neutròfils","d":"Les NK són menys abundants que els neutròfils a la sang","e":"Les NKs deriven de CLPs"},"cor":"b","razones":{"a":"Verdadera: la {{NADPH oxidasa}} se ensambla en la membrana de los gránulos/fagosoma del neutrófilo maduro e inicia el estallido respiratorio.","b":"CORRECTA (es la falsa): la NETosis es una trampa extracelular de {{DNA}} y proteínas granulares que atrapa microbios y suele implicar la muerte del neutrófilo; NO tiene nada que ver con la ADCC (citotoxicidad celular dependiente de anticuerpo), que requiere {{anticuerpos}} unidos a receptores Fc.","c":"Verdadera: el G-CSF (factor estimulante de colonias de granulocitos) dirige la diferenciación mieloide hacia {{neutrófilos}}.","d":"Verdadera: los neutrófilos son los leucocitos más abundantes de la sangre ({{50-70}}%); las NK son una fracción minoritaria (~5-15% de linfocitos).","e":"Verdadera: las NK derivan del progenitor linfoide común ({{CLP}}), aunque pertenezcan funcionalmente a la inmunidad innata."},"expl":"La NETosis/ETosis es un mecanismo microbicida extracelular basado en redes de DNA + proteínas granulares; no depende de anticuerpos, por lo que no es ADCC. El profesor la ha usado dos veces en 2026 (Q2 y Q22).","nivel":"SALE_SEGURO","reina":"R21","clave":"razonada","conf":"ALTA","diapo":"TEMA 3, slide 'NETOSI (Neutrophil Extracellular Trap)/ETOSI'","nota":null},{"k":"EX26-23","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T9 · Ontogenia linfocitos B y T","sub":"Exclusión alélica de los receptores de antígeno","idioma":"catalan","enun":"La exclusió al·lèlica:","ops":{"a":"És un tipus de presentació creuada d'antígens exercida per DCs plasmacitoides","b":"S'observa als receptors d'antígens dels limfòcits","c":"S'observa al HLA als limfòcits B","d":"Totes són veritat","e":"(b. i c.) són correctes"},"cor":"b","razones":{"a":"Falsa: no tiene nada que ver con la presentación cruzada (esa es la vía por la que las DC presentan antígeno exógeno por MHC-{{I}}); la exclusión alélica es un fenómeno de reordenamiento génico.","b":"CORRECTA: la exclusión alélica afecta a los {{receptores de antígeno}} (BCR y TCR): una vez un alelo reordena productivamente, el otro cromosoma queda silenciado — así cada linfocito expresa una única especificidad ({{monoclonalidad}}).","c":"Falsa: el HLA se expresa de forma {{codominante}} — ambos alelos (materno y paterno) se expresan a la vez en todas las células; nunca hay exclusión alélica en el MHC.","d":"Falsa: la a y la c son falsas, así que 'todas son verdad' no puede serlo.","e":"Falsa: la c es falsa (el HLA es codominante), así que la combinación (b i c) cae."},"expl":"Exclusión alélica = solo un alelo de cadena pesada/ligera (o TCR) reordenado se expresa por linfocito, garantizando una única especificidad. Contraste clave con el HLA, que es codominante. Distractor recurrente del profesor (2017 q6, 2025 Q4, 2026 Q23).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 8, apartado 'exclusió al·lèlica' (l.739-749); TEMA 9 l.65","nota":null},{"k":"EX26-24","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T6 · APCs (presentadoras)","sub":"Célula dendrítica madura — migración y fenotipo","idioma":"catalan","enun":"Una DC madura","ops":{"a":"Migra del teixit drenat pel gangli al gangli regional corresponent","b":"Captura antígens principalment","c":"Expressa nivells baixos de coestimulació a la seva superfície","d":"Internalitza molt ràpidament l'MHC de classe II des de la seva superfície","e":"Totes són falses"},"cor":"a","razones":{"a":"CORRECTA: al madurar (tras contacto con PAMPs), la DC abandona el tejido periférico y migra por el vaso linfático {{aferente}} hasta el {{ganglio regional}} que drena ese tejido, donde activará linfocitos T vírgenes.","b":"Falsa: la que captura antígeno es la DC {{inmadura}}; al madurar la DC deja de captar y pasa a procesar y {{presentar}}.","c":"Falsa: la DC madura expresa niveles {{altos}} de moléculas coestimuladoras (B7/CD80-86, CD40) — es la mejor activadora de T vírgenes precisamente por eso.","d":"Falsa: en la DC madura el MHC de clase II queda {{estable}} en la superficie (deja de reciclarse rápidamente, que es lo propio de la DC inmadura).","e":"Falsa: la a es verdadera, así que 'todas son falsas' no se sostiene."},"expl":"Maduración de la DC = cambio de programa: deja de captar, migra tejido→ganglio (nunca al revés), sube coestimulación y estabiliza MHC-II en membrana. Concepto reina caído en 2020, B14, 2025 y 2026.","nivel":"SALE_SEGURO","reina":"R18","clave":"razonada","conf":"ALTA","diapo":"TEMA 6 (APCs), slides de maduración de la DC","nota":null},{"k":"EX26-25","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T5 · Inmunógenos y antígenos","sub":"Reacción cruzada — parátopo y epítopos compartidos","idioma":"catalan","enun":"La reacció creuada","ops":{"a":"Es produeix quan un anticòs és poc específic i s'uneix a antígens diferents","b":"Es produeix quan el paràtop d'un anticòs reconeix epítops continguts en molècules diferents","c":"Es produeix quan l'idiotip d'un anticòs li permet unir-se a epítops de molècules diferents","d":"Cap de les anteriors","e":"Totes les anteriors"},"cor":"b","razones":{"a":"Falsa: la reacción cruzada NO implica falta de especificidad — el anticuerpo sigue siendo específico de su {{epítopo}}; lo que ocurre es que ese mismo epítopo (o uno muy parecido) está presente en más de una molécula.","b":"CORRECTA: es la definición precisa — el {{parátopo}} (sitio de unión del anticuerpo) reconoce el mismo epítopo (o uno estructuralmente similar) contenido en {{moléculas distintas}}.","c":"Falsa: el idiotipo es el conjunto de {{idiotopos}} (determinantes antigénicos de la propia región V del anticuerpo cuando él mismo actúa como antígeno); no es el término que describe la unión al antígeno — ese es el parátopo.","d":"Falsa: la b sí es correcta.","e":"Falsa: la a y la c son incorrectas."},"expl":"Reacción cruzada = un mismo parátopo reconoce epítopos idénticos o muy similares presentes en moléculas diferentes; no es pérdida de especificidad. Concepto estrenado por el profesor en 2026 dentro del bloque reina de epítopos.","nivel":"SALE_SEGURO","reina":"R22","clave":"razonada","conf":"MEDIA","diapo":"TEMA 5 (Immunògens i Antígens)","nota":"Confianza MEDIA: la trampa está entre a y b — la a describe la reacción cruzada como 'poca especificidad', matiz que el profesor suele castigar; la formulación técnica correcta es la b (parátopo + epítopos en moléculas diferentes)."},{"k":"EX26-26","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T11 · Moléculas de adhesión","sub":"Selectinas — adhesión débil (rolling) del linfocito T virgen","idioma":"catalan","enun":"Quin dels següents és un factor d'adhesió feble que s'expressa a limfòcits T verges?:","ops":{"a":"LFA-1","b":"P-selectina","c":"VCAM-1","d":"L-selectina","e":"VLA-4"},"cor":"d","razones":{"a":"Falsa: LFA-1 es una {{integrina}} — media adhesión {{fuerte}} (tras activación por quimiocinas), no rodamiento débil.","b":"Falsa: la P-selectina (CD62P) sí es de adhesión débil, pero se expresa en {{endotelio}} activado y plaquetas, no en el linfocito T virgen.","c":"Falsa: VCAM-1 es un ligando endotelial de la superfamilia de las {{inmunoglobulinas}} (se une a VLA-4); está en el endotelio, no en el T virgen, y participa en adhesión fuerte.","d":"CORRECTA: la {{L-selectina}} (CD62L) se expresa constitutivamente en linfocitos {{vírgenes}} (y monocitos, neutrófilos y T de memoria central) y media el rodamiento (adhesión débil) sobre las adresinas (PNAd) de las HEV.","e":"Falsa: VLA-4 es una {{integrina}} del leucocito (adhesión fuerte vía VCAM-1), no un factor de adhesión débil."},"expl":"Cascada de extravasación: selectinas = rodamiento débil; integrinas (LFA-1, VLA-4) = adhesión fuerte. El T virgen lleva L-selectina (CD62L) para entrar al ganglio por las HEV.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 11, slide 'L-selectina (CD62L): s'expressa de forma constitutiva a limfòcits verges'","nota":null},{"k":"EX26-27","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T9 · Ontogenia linfocitos B y T","sub":"Linfocitos B-1 — origen fetal y antígenos T-independientes","idioma":"catalan","enun":"Assenyala l'afirmació correcta respecte dels limfòcits B-1:","ops":{"a":"Es localitzen als centres germinals","b":"Els seu BCR pot ser IgM o IgD","c":"Són d'origen fetal","d":"Els antígens que reconeixen solen ser T-dependents","e":"Sobre tot reconeixen antígens proteics"},"cor":"c","razones":{"a":"Falsa: los B-1 viven sobre todo en cavidades {{peritoneal}} y pleural y mucosas; los centros germinales son territorio de los B {{foliculares}} (B-2).","b":"Falsa: el BCR de los B-1 es esencialmente {{IgM}} (expresan poca o ninguna IgD); la coexpresión IgM+IgD es característica del B-2 maduro virgen.","c":"CORRECTA: los B-1 se generan durante la vida {{fetal}} (hígado fetal) y luego se automantienen por autorrenovación en el adulto — son la subpoblación B más 'innata'.","d":"Falsa: reconocen sobre todo antígenos {{T-independientes}} (polisacáridos, lípidos), sin necesidad de ayuda del linfocito Th.","e":"Falsa: sus antígenos típicos son {{polisacáridos}} y antígenos no proteicos repetitivos; producen los 'anticuerpos naturales' IgM de baja afinidad."},"expl":"Subpoblaciones B: foliculares (B-2, ganglio/bazo, T-dependientes), zona marginal y B-1 (origen fetal, cavidades serosas, IgM natural frente a antígenos T-independientes).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 9, slide 3 (subpoblaciones B: FOB / MZB / B-1)","nota":null},{"k":"EX26-28","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T10 · Citocinas y quimiocinas","sub":"Señalización de citocinas — vía JAK/STAT (IL-10)","idioma":"catalan","enun":"Assenyala el factor de transcripció responsable de la senyalització de la IL-10:","ops":{"a":"STAT","b":"c-Fos","c":"NFκB","d":"AP-1","e":"IRF"},"cor":"a","razones":{"a":"CORRECTA: la IL-10 señaliza por un receptor de citocinas de clase {{II}} que activa la vía {{JAK/STAT}} — en concreto {{STAT3}}, que se fosforila, dimeriza y entra al núcleo como factor de transcripción.","b":"Falsa: c-Fos es un componente de {{AP-1}}, factor de transcripción de la señalización del TCR (vía Ras/MAPK), no del receptor de IL-10.","c":"Falsa: NFκB se activa aguas abajo de {{TLRs}}, TNFR e IL-1R, no de los receptores de citocinas tipo JAK/STAT como el de IL-10.","d":"Falsa: AP-1 (Fos+Jun) pertenece a la señalización del {{TCR}} y de estrés celular, no a la de la IL-10.","e":"Falsa: los IRF (factores reguladores de interferón) operan sobre todo tras sensores de ácidos nucleicos/{{interferones}} para inducir genes antivíricos; no son el efector del receptor de IL-10."},"expl":"Los receptores de citocinas de clase I y II señalizan por JAK/STAT; la IL-10 usa STAT3. Concepto reina con 5 convocatorias (2017, 2020, B14, 2016, 2026).","nivel":"SALE_SEGURO","reina":"R13","clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (Citocines i quimiocines), apartado JAK/STAT","nota":null},{"k":"EX26-29","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T12 · Activación linfocitaria","sub":"Señalización del TCR — fosforilaciones/desfosforilaciones inhibidoras","idioma":"catalan","enun":"Quin dels següents factors/mecanismes podria inhibir l'activació dels limfòcits T?:","ops":{"a":"Fosforilació de CD3 als seus ITAMS","b":"Defosforilació de p56lck","c":"Fosforilació permanent de p59fyn i p56lck","d":"Defosforilació de NFAT","e":"Pujada del Ca²⁺ intracel·lular"},"cor":"c","razones":{"a":"Falsa (es activadora): la fosforilación de los {{ITAMs}} del CD3 por las cinasas Src es el primer paso de la señal 1 — recluta {{ZAP-70}} y propaga la activación.","b":"Falsa (es activadora según las diapos del profesor): la fosfatasa {{CD45}} 'defosforila i ACTIVA' p56lck — quitar el fosfato inhibidor de lck la enciende, no la apaga.","c":"CORRECTA: en el esquema del profesor, lck/fyn fosforiladas = inactivas (por eso CD45 las activa al desfosforilarlas); una fosforilación {{permanente}} de p59fyn y p56lck las mantendría bloqueadas (equivale al fosfato inhibidor que añade {{Csk}} en la tirosina C-terminal) → no habría señal 1.","d":"Falsa (es activadora): la desfosforilación de NFAT por la {{calcineurina}} (activada por Ca²⁺/calmodulina) es justo lo que permite a NFAT entrar al {{núcleo}} y transcribir IL-2.","e":"Falsa (es activadora): la subida del {{Ca²⁺}} intracelular (vía IP3) activa calcineurina→NFAT — es un paso central de la activación, no una inhibición."},"expl":"Clave del profesor: CD45 desfosforila y ACTIVA p56lck (el fosfato que quita es inhibidor). Por tanto lo inhibidor es mantener fyn/lck permanentemente fosforiladas; ITAMs fosforilados, NFAT desfosforilado y Ca²⁺ alto son todos pasos activadores.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 12, slides 4-6 ('CD45: associació a p56lck a la qual defosforila i activa')","nota":"DOS avisos: (1) ERRATA IMPRESA en la opción e — la palabra impresa estaba tachada a bolígrafo y corregida a mano como 'Pujada del Ca²⁺ intracel·lular'; se transcribe la versión corregida. (2) El mapeo inicial proponía b (desfosforilación de lck por SHP-1 = inhibidora, lectura Abbas); al verificar contra las diapos de T12 el profesor enseña explícitamente que CD45 'defosforila i activa' p56lck, lo que convierte la b en activadora y deja la c como única inhibidora coherente con su esquema. Confianza MEDIA por esta ambigüedad real (SHP-1 también desfosforila lck y la inhibe)."},{"k":"EX26-30","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"Estado antiviral — PKR inhibe la síntesis proteica","idioma":"catalan","enun":"Quin dels següents factors està implicat a l'estat antivíric inhibint la síntesi proteica?:","ops":{"a":"OAS","b":"PKR","c":"Mx","d":"PBP","e":"Cap dels anteriors"},"cor":"b","razones":{"a":"Falsa: la OAS (2'5'-oligoadenilato sintetasa) se activa por dsRNA y activa la {{RNasa L}}, que degrada mRNA y rRNA — degrada RNA, no bloquea directamente la traducción.","b":"CORRECTA: la PKR (proteína cinasa activada por RNA) se activa por dsRNA y fosforila {{eIF-2α}}, con lo que inhibe la {{traducción}} (síntesis proteica) de la célula infectada; también induce apoptosis.","c":"Falsa: las proteínas Mx interfieren la {{transcripción}} del RNA vírico (secuestran componentes de la replicación viral), no la síntesis proteica celular.","d":"Falsa: la PBP (proteína básica principal) es una proteína {{antiparasitaria}} de los gránulos del eosinófilo — nada que ver con el estado antiviral por interferones.","e":"Falsa: sí hay uno correcto — la PKR."},"expl":"Los IFN tipo I inducen el estado antiviral con tres efectores: OAS→RNasa L (degrada RNA), PKR→fosforila eIF-2α (para la síntesis proteica) y Mx (bloquea transcripción vírica). El dato del enunciado ('inhibiendo síntesis proteica') apunta unívocamente a PKR.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 3, slide 14 ('PKR... Fosforila eIF-2a, provocant així la inhibició de la traducció')","nota":"Concepto estrenado en 2026: los efectores del estado antiviral (PKR/OAS/Mx) no habían caído antes — PATRONES-EXAMEN los marca ahora como aprendibles (profundización de tema reina T3)."},{"k":"EX26-31","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"Inflamasoma — NLR + ASC + procaspasa-1","idioma":"catalan","enun":"Quin dels següents factors forma part de l'inflamasoma?:","ops":{"a":"Procaspasa","b":"LMP2","c":"MASP-1","d":"NLR","e":"(a. i d)"},"cor":"e","razones":{"a":"Correcta pero incompleta: la {{procaspasa-1}} es el componente efector del inflamasoma — al ensamblarse se autoactiva a caspasa-1, que corta pro-IL-1β y pro-IL-18.","b":"Falsa: LMP2 es una subunidad del {{inmunoproteasoma}} (vía endógena de presentación por MHC-I), inducida por IFNγ; nada que ver con el inflamasoma.","c":"Falsa: MASP-1 es una serín-proteasa asociada a la {{MBL}} en la vía de las lectinas del complemento.","d":"Correcta pero incompleta: el sensor del inflamasoma es un {{NLR}} (típicamente NLRP3), que detecta PAMPs/DAMPs citosólicos y nuclea el ensamblaje.","e":"CORRECTA: el inflamasoma = sensor {{NLR}} + adaptador {{ASC}} + {{procaspasa-1}} → caspasa-1 activa → maduración de IL-1β e IL-18. Como a y d son ambas componentes, la respuesta es la combinada."},"expl":"Inflamasoma (NLRP3): sensor NLR + adaptador ASC + procaspasa-1; la caspasa-1 activa madura IL-1β/IL-18 y puede causar piroptosis. LMP2 (inmunoproteasoma) y MASP-1 (complemento) son distractores de otros temas.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 3, slide 15 ('L'inflamasoma', Abbas 2014)","nota":null},{"k":"EX26-32","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T10 · Citocinas y quimiocinas","sub":"Quimiocinas — proteína G, migración, NO adhesión fuerte","idioma":"catalan","enun":"Què és fals en relació a les quimiocines?:","ops":{"a":"Intervenen en processos de migració cel·lular","b":"Senyalitzen a través de proteïnes G","c":"Poden activar adhesió forta a través d'integrines","d":"Intervenen en processos de degranulació","e":"Són factors d'adhesió forta"},"cor":"e","razones":{"a":"Verdadera: la función central de las quimiocinas es dirigir la {{migración}} celular siguiendo un gradiente de concentración (quimiotaxis).","b":"Verdadera: todos los receptores de quimiocinas son receptores de 7 dominios transmembrana acoplados a {{proteína G}} (no usan JAK/STAT).","c":"Verdadera: la señal de la quimiocina produce la activación 'inside-out' de las {{integrinas}} del leucocito, que pasan a alta afinidad y median la adhesión firme al endotelio.","d":"Verdadera: algunas quimiocinas (p. ej. IL-8/CXCL8, eotaxina) inducen {{degranulación}} y activación de granulocitos.","e":"CORRECTA (es la falsa): las quimiocinas NO son moléculas de adhesión — la adhesión fuerte la ejecutan las {{integrinas}} (LFA-1, VLA-4); la quimiocina solo da la orden de activarlas."},"expl":"Quimiocinas: gradiente + proteína G + activación de integrinas; ellas mismas no adhieren nada. Falsa típica del profesor con 4 convocatorias (2017, B14, 2016, 2026).","nivel":"SALE_SEGURO","reina":"R14","clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (Citocines i quimiocines), apartado quimiocinas","nota":"El enunciado impreso decía 'quimiciones' [sic]; se transcribe corregido a 'quimiocines'."},{"k":"EX26-33","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"TLRs y sus ligandos — TLR13 y RNA bacteriano","idioma":"catalan","enun":"Quin dels següents receptors s'activa per RNA bacterià?:","ops":{"a":"TLR9","b":"TLR7","c":"TLR6","d":"TLR13","e":"TLR1"},"cor":"d","razones":{"a":"Falsa: TLR9 reconoce {{DNA CpG}} no metilado (bacteriano/vírico), no RNA.","b":"Falsa: TLR7 reconoce {{ssRNA}} (RNA monocatenario) de origen {{vírico}}, no bacteriano.","c":"Falsa: TLR6 (con TLR2) reconoce {{diacil-lipopéptidos}} bacterianos — lípidos, no RNA.","d":"CORRECTA: el TLR13 (descrito en {{ratón}}) reconoce {{RNA bacteriano}} (rRNA 23S) — así aparece literalmente en la tabla de TLRs de las diapos.","e":"Falsa: TLR1 (con TLR2) reconoce {{triacil-lipopéptidos}} bacterianos."},"expl":"Tabla de TLRs (cae cualquier fila): TLR3 dsRNA vírico, TLR7/8 ssRNA vírico, TLR9 CpG-DNA, TLR13 (ratón) RNA bacteriano, TLR4 LPS, TLR1/2 triacil- y TLR2/6 diacil-lipopéptidos.","nivel":"SALE_SEGURO","reina":"R16","clave":"razonada","conf":"ALTA","diapo":"TEMA 3, tabla de TLRs ('TLR13 (mouse) — BACTERIAL RNA — BACTERIA', l.147)","nota":null},{"k":"EX26-34","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T10 · Citocinas y quimiocinas","sub":"Perfil de citocinas Th2 (IL-4, IL-5, IL-9)","idioma":"catalan","enun":"Quin dels següents tipus cel·lulars secreta IL-5, IL-4 i IL-9?:","ops":{"a":"Limfòcits Th2","b":"Macròfags M1","c":"Limfòcits Th1","d":"Neutròfils","e":"DCs"},"cor":"a","razones":{"a":"CORRECTA: el perfil {{Th2}} (factor de transcripción {{GATA-3}}) secreta IL-4, IL-5, IL-9 e IL-13 — activa mastocitos, basófilos y eosinófilos (IL-5) y la respuesta antiparasitaria/alérgica.","b":"Falsa: los macrófagos M1 (proinflamatorios) secretan {{IL-12}}, TNF, IL-1, IL-6 — no citocinas de tipo 2.","c":"Falsa: los Th1 (T-bet) secretan {{IFNγ}} e IL-2 — el perfil opuesto, para patógenos intracelulares.","d":"Falsa: los neutrófilos son fagocitos efectores; secretan algunas citocinas proinflamatorias y quimiocinas, pero no el trío {{IL-4/IL-5/IL-9}}.","e":"Falsa: las DC secretan citocinas polarizadoras (IL-12, IL-6, IL-23…) para dirigir al Th, pero no el perfil efector Th2."},"expl":"IL-4 + IL-5 + IL-9 (+IL-13) = firma Th2. Tabla de subpoblaciones Th = 'la estrella' del examen: Th1/IFNγ/T-bet, Th2/IL-4-5-9-13/GATA-3, Th17/IL-17/RORγt, Treg/FoxP3.","nivel":"SALE_SEGURO","reina":"R12","clave":"razonada","conf":"ALTA","diapo":"TEMA 10, l.84 ('IL-4, IL-5, IL-13, IL-9, IL-10, IL-3, GM-CSF' — perfil tipo 2)","nota":null},{"k":"EX26-35","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T3 · Inmunidad innata","sub":"Gránulos del eosinófilo — PBP/MBP vs ECP","idioma":"catalan","enun":"La PBP:","ops":{"a":"Es 10 cops més citotòxica que la Proteïna Catiònica Eosinofílica","b":"Està als grànuls dels eosinòfils","c":"Està als grànuls dels mastòcits","d":"Només es tòxica per als paràsits","e":"És uns proteïna de fase aguda"},"cor":"b","razones":{"a":"Falsa: la relación está INVERTIDA — es la {{ECP}} (proteína catiónica eosinofílica, RNasa3) la que es {{10 veces}} más tóxica que la PBP, literal de las diapos.","b":"CORRECTA: la PBP (proteína básica principal, {{MBP}}) es un componente preformado de los {{gránulos del eosinófilo}}, junto con la ECP y la peroxidasa eosinofílica.","c":"Falsa: los gránulos de los {{mastocitos}} contienen histamina, heparina y triptasa — la PBP es exclusiva del eosinófilo.","d":"Falsa: aunque su diana principal son los {{helmintos}}, la PBP también daña células del huésped (epitelio respiratorio en el asma) — no es tóxica 'solo' para parásitos.","e":"Falsa: las proteínas de fase aguda ({{PCR}}, SAP, LBP…) son de síntesis hepática inducible; la PBP es una proteína granular preformada del eosinófilo."},"expl":"Gránulos preformados del eosinófilo = PBP/MBP + ECP (+peroxidasa). Dato estrella: la ECP es 10× más tóxica que la PBP — el profesor lo preguntó dos veces el mismo año (Q12 y Q35) invirtiendo la relación como trampa.","nivel":"SALE_SEGURO","reina":"R20","clave":"razonada","conf":"ALTA","diapo":"TEMA 3, slide 53 (l.777-780: 'proteïna catiònica eosinòfila (RNAse3)… 10x més tòxica que la PBP')","nota":null},{"k":"EX26-36","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T2 · Anatomía del sistema inmune","sub":"Circulación y activación del Th en el ganglio linfático","idioma":"catalan","enun":"Un limfòcit Th dins d'un gangli limfàtic:","ops":{"a":"Migrarà cap a la zona fol·licular un cop estigui activat","b":"Promourà la reacció de centre germinal si es polaritza cap a Th fol·licular","c":"S'activarà a la zona paracortical quan el seu TCR reconegui l'antigen presentat per les DCs","d":"Si es polaritza cap a Th1 sortirà del gangli pel vas limfàtic eferent cap al teixit infectat","e":"Totes són veritat"},"cor":"e","razones":{"a":"Verdadera: tras activarse en el paracórtex, parte de los Th activados migran hacia el borde del {{folículo}} para dar ayuda a los linfocitos B (interacción T-B).","b":"Verdadera: el Th que se polariza a {{Tfh}} (Th folicular, CXCR5+) entra al folículo y sostiene la reacción de {{centro germinal}} (hipermutación somática + cambio de isotipo).","c":"Verdadera: la zona {{paracortical}} es la zona T del ganglio — allí las DC presentan el antígeno por MHC-II al TCR del Th virgen (señal 1 + coestimulación).","d":"Verdadera: el Th1 efector abandona el ganglio por el vaso linfático {{eferente}}, vuelve a la sangre por el conducto torácico y extravasa en el {{tejido infectado}}.","e":"CORRECTA: las cuatro afirmaciones describen correctamente el itinerario del Th en el ganglio — activación en paracórtex, migración al folículo, Tfh→centro germinal, efector→eferente."},"expl":"Itinerario del Th: entra por HEV al paracórtex (zona T) → activación por DC → o bien Tfh hacia el folículo/centro germinal, o bien efector (Th1) que sale por el linfático eferente hacia el tejido.","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"MEDIA","diapo":"TEMA 2, l.345 ('limfòcits T migraran cap als fol·licles (Limfòcits Th fol·liculars) ajudaran als…') y l.293 (vasos eferentes)","nota":"Confianza MEDIA: pregunta tipo 'totes són veritat' — cada opción es defendible individualmente y las diapos las respaldan, pero el formato invita a buscar una falsa inexistente."},{"k":"EX26-37","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T4 · Complemento","sub":"Orden temporal de la cascada del complemento","idioma":"catalan","enun":"Quina progressió temporal en l'ordre de participació a l'activació del complement és la correcta?:","ops":{"a":"C1s, C1r, C1q, C4b5b, Properdina","b":"C4b2b, C4b2b3b, C5bC6, C5bC6C7, C5bC6C7C8C9","c":"MBL, MASP-2, MASP-1, C4b2b, CR1","d":"C3b, Factor H, Factor D, DAF, Properdina","e":"C3b4b, C3b4b5b, C5bC6, C5bC6C7, C5bC6C7C8C9"},"cor":"b","razones":{"a":"Falsa: el orden del C1 está invertido — primero se une {{C1q}} al anticuerpo, que activa C1r y este a C1s; además 'C4b5b' no es un complejo real de la cascada.","b":"CORRECTA: {{C4b2b}} (C3-convertasa clásica/lectinas) → {{C4b2b3b}} (C5-convertasa) → C5b+C6 → C5bC6C7 → C5bC6C7C8C9 = {{MAC}} (complejo de ataque a membrana). Es la única secuencia con los complejos reales en orden.","c":"Falsa: mezcla la vía de las lectinas con {{CR1}}, que es un receptor/regulador del complemento (inhibidor), no un paso de la activación secuencial.","d":"Falsa: Factor H, DAF son {{reguladores/inhibidores}} — no forman parte de la progresión activadora; la properdina estabiliza (no es un paso final).","e":"Falsa: 'C3b4b' y 'C3b4b5b' no existen como convertasas — la C3-convertasa clásica es {{C4b2b}} y la alternativa {{C3bBb}}; la nomenclatura está inventada para confundir."},"expl":"Secuencia clave: C3-convertasa (C4b2b clásica/lectinas o C3bBb alterna) → C5-convertasa (C4b2b3b / C3bBb3b) → C5b recluta C6-C7-C8-C9 → MAC. Memorizar los nombres exactos de las convertasas evita todos los distractores.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 4 (El complement), slides de convertasas y MAC","nota":null},{"k":"EX26-38","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T2 · Anatomía del sistema inmune","sub":"Anatomía e historia — células M, estroma medular, Zinkernagel","idioma":"catalan","enun":"Assenyala l'afirmació falsa:","ops":{"a":"R. Zinkernagel va descobrir la restricció per MHC dels limfòcits T","b":"Les cèl·lules estromals del moll de l'os produeixen citocines","c":"Els tromboblastes són precursors de les plaquetes","d":"Les cèl·lules M es troben al peritoneu","e":"La melsa pot esdevenir un òrgan limfoide primari"},"cor":"d","razones":{"a":"Verdadera: Zinkernagel y Doherty descubrieron la {{restricción por MHC}} de los linfocitos T (Nobel 1996) — historia que el profesor mete en casi todos los exámenes.","b":"Verdadera: las células estromales de la médula ósea crean el nicho hematopoyético mediante contacto celular (SCF-c-kit) y {{citocinas}} (IL-7 para la línea B).","c":"Verdadera (según el enunciado del profesor): los precursores de las plaquetas en la serie trombocítica ({{megacarioblasto}}/tromboblasto → megacariocito → plaquetas); el término 'tromboblast' designa ese precursor.","d":"CORRECTA (es la falsa): las células M ('microfold') están en el {{epitelio}} del MALT — sobre las {{placas de Peyer}} del intestino — especializadas en captar antígeno luminal; NO están en el peritoneo.","e":"Verdadera: el bazo puede volverse hematopoyético en situaciones patológicas ({{hematopoyesis extramedular}}), asumiendo función de órgano linfoide/hematopoyético primario."},"expl":"Las células M viven en el epitelio asociado al folículo del MALT (placas de Peyer), transportando antígeno del lumen intestinal al tejido linfoide — situarlas en el peritoneo es la falsedad inequívoca.","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"MEDIA","diapo":"TEMA 2, l.435-440 ('a sobre de les PP es troben les cèl·lules M… especialitzades en captar')","nota":"Confianza MEDIA: la opción c es discutible ('tromboblast' no aparece en las diapos; el precursor canónico es el megacariocito) y la e depende de aceptar la hematopoyesis extramedular. Se elige d por ser la única inequívocamente falsa según TEMA 2."},{"k":"EX26-39","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T10 · Citocinas y quimiocinas","sub":"Polarización Th17 — IL-23","idioma":"catalan","enun":"Quina citocina promou la polarització cap a cèl·lules Th17?:","ops":{"a":"IL-18","b":"IL-17","c":"IFNγ","d":"IL-23","e":"IL-1β"},"cor":"d","razones":{"a":"Falsa: la IL-18 (familia IL-1) actúa con IL-12 potenciando la producción de {{IFNγ}} por NK y Th1 — eje tipo 1, no Th17.","b":"Falsa: la IL-17 es la citocina {{efectora}} QUE SECRETA el Th17 (recluta neutrófilos), no la que induce su polarización — trampa de dirección.","c":"Falsa: el IFNγ polariza hacia {{Th1}} y de hecho inhibe la diferenciación Th17.","d":"CORRECTA: la {{IL-23}} promueve y sobre todo {{mantiene/estabiliza}} la polarización Th17 (junto con TGF-β + IL-6 en la inducción inicial); es la respuesta correcta entre las opciones dadas.","e":"Falsa: la IL-1β es proinflamatoria general (fiebre, activación endotelial); puede contribuir al ambiente Th17 en humanos pero no es LA citocina polarizadora que enseña el profesor — esa es la IL-23."},"expl":"Inducción Th17 = TGF-β + IL-6; expansión/mantenimiento = IL-23 (factor de transcripción RORγt; efectora IL-17). Como TGF-β e IL-6 no están entre las opciones, la respuesta es IL-23.","nivel":"SALE_SEGURO","reina":"R12","clave":"razonada","conf":"ALTA","diapo":"TEMA 10, apartado de polarización Th","nota":null},{"k":"EX26-40","examen":"📝 Examen 1P · 20/03/2026","real":1,"origen":"EXAMEN-2026","tema":"T7 · MHC y presentación","sub":"Vías de presentación antigénica — GILT, TAP, calnexina, IFNγ","idioma":"catalan","enun":"Assenyala l'afirmació correcta:","ops":{"a":"GILT és una hidrolasa neutra","b":"TAP1/2 és una tiol-reductasa","c":"Ii es substrat de degradació de MECL-1","d":"La calnexina forma part del complex de càrrega","e":"La via exògena de presentació antigènica s'estimula per IFNγ"},"cor":"e","razones":{"a":"Falsa: GILT (Gamma-Interferon-induced Lysosomal Thiol reductase) es una {{tiol-reductasa}} lisosomal — rompe puentes disulfuro para desplegar proteínas en la vía exógena; no es una hidrolasa neutra.","b":"Falsa: TAP1/2 es el {{transportador}} de péptidos (familia ABC) que los pasa del citosol al retículo endoplasmático en la vía endógena — la tiol-reductasa es GILT (y ERp57 la óxido-reductasa del RE).","c":"Falsa: la cadena invariante {{Ii}} es degradada por las {{catepsinas S y L}} en el compartimento endosomal (dejando el CLIP); MECL-1 es una subunidad del inmunoproteasoma (vía endógena).","d":"Falsa: la {{calnexina}} actúa como chaperona ANTES, sobre la cadena MHC-Iα naciente, pero se disocia; el complejo de carga lo forman {{calreticulina}} + tapasina + ERp57 + TAP — la trampa de nombre parecido favorita del profesor.","e":"CORRECTA: el {{IFNγ}} estimula la vía exógena (induce HLA-DM, GILT — 'Gamma-Interferon-induced' —, catepsinas y la expresión de MHC de clase II vía CIITA), potenciando la presentación a los linfocitos Th."},"expl":"Pareja de trampas clásica: GILT = tiol-reductasa (no hidrolasa), TAP = transportador (no reductasa), calnexina NO está en el complejo de carga (calreticulina sí), y el IFNγ potencia la vía exógena — PATRONES-EXAMEN confirma la e como verdadera (R2).","nivel":"SALE_SEGURO","reina":"R2","clave":"razonada","conf":"ALTA","diapo":"TEMA 7, l.278-290 (calnexina vs complejo de carga) y l.368 ('la tiol-reductasa GILT, Gamma Interferon induced…'); slide 37 (IFNγ)","nota":null},{"k":"EX25-01","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T4 · Complemento","sub":"Funciones del complemento","idioma":"castellano","enun":"Señala la opción que NO será asociable al complemento:","ops":{"a":"Opsonización","b":"Inflamación","c":"Lisis celular","d":"Degranulación de mastocitos y basófilos","e":"Presentación antigénica"},"cor":"e","razones":{"a":"Falsa (SÍ es función): {{C3b}} depositado sobre el patógeno actúa como opsonina y facilita la fagocitosis a través de los receptores del complemento (CR1).","b":"Falsa (SÍ es función): las anafilotoxinas {{C3a y C5a}} son proinflamatorias — aumentan la permeabilidad vascular y reclutan leucocitos por quimiotaxis.","c":"Falsa (SÍ es función): el {{MAC}} (complejo de ataque a membrana, C5b-C9) forma poros en la membrana y lisa la célula diana.","d":"Falsa (SÍ es función): C3a y C5a degranulan {{mastocitos y basófilos}} (C5a es la anafilotoxina más potente).","e":"CORRECTA: la {{presentación antigénica}} la realizan las APCs mediante moléculas MHC — no es una función del sistema del complemento."},"expl":"Las funciones clásicas del complemento son cuatro: opsonización (C3b), inflamación/quimiotaxis y degranulación (anafilotoxinas C3a/C5a) y lisis (MAC). Presentar antígenos es cosa de las APCs con MHC, no del complemento.","nivel":"SALE_SEGURO","reina":"R23","clave":"razonada","conf":"ALTA","diapo":"TEMA 4 (funciones del complemento)","nota":null},{"k":"EX25-02","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T4 · Complemento","sub":"Convertasas — vía de las lectinas","idioma":"castellano","enun":"Señala la C3 convertasa de la vía de las lectinas:","ops":{"a":"C4bC2b","b":"C4bC2bC5a","c":"C4bC2bC6a","d":"C3bBb","e":"C3bBbC3b"},"cor":"a","razones":{"a":"CORRECTA: la vía de las lectinas comparte convertasas con la clásica — su C3 convertasa es {{C4b2b}} (las MASP escinden C4 y C2 igual que lo hace C1s).","b":"Falsa: C4bC2bC5a no existe como complejo; C5a es una {{anafilotoxina}} libre, nunca forma parte de una convertasa.","c":"Falsa: C6 no participa en ninguna convertasa — se incorpora más tarde al {{MAC}} (C5b6789).","d":"Falsa: C3bBb es la C3 convertasa de la vía {{alternativa}}, no de la de las lectinas.","e":"Falsa: C3bBbC3b es la C5 convertasa de la vía {{alternativa}}."},"expl":"Clásica y lectinas comparten convertasas: C3 convertasa = C4b2b y C5 convertasa = C4b2b3b. La alternativa usa C3bBb (C3) y C3bBb3b (C5). La vía de las lectinas solo cambia el inicio: MBL/ficolinas + MASP-1/2 en lugar de C1qrs.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 4 (vías de activación y convertasas)","nota":null},{"k":"EX25-03","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T3 · Inmunidad innata","sub":"Mecanismos microbicidas — estallido oxidativo","idioma":"castellano","enun":"De las siguientes opciones elige la que mejor contribuye a la acción microbicida:","ops":{"a":"Leucotrienos","b":"Proteína básica principal","c":"NADPH oxidasa","d":"IgE","e":"IgA"},"cor":"c","razones":{"a":"Falsa: los leucotrienos son mediadores lipídicos {{proinflamatorios}} (broncoconstricción, permeabilidad, quimiotaxis) — no matan directamente al microbio.","b":"Falsa: la proteína básica principal (PBP/MBP) de los gránulos del eosinófilo es sobre todo {{antiparasitaria}} (helmintos), no el mecanismo microbicida principal de los fagocitos.","c":"CORRECTA: la {{NADPH oxidasa}} inicia el estallido oxidativo — genera anión superóxido (O₂·⁻) que deriva en H₂O₂ y HOCl, los agentes microbicidas más potentes del fagocito.","d":"Falsa: la IgE no destruye microbios por sí misma; arma a {{mastocitos y eosinófilos}} vía FcεRI frente a parásitos y en la alergia.","e":"Falsa: la IgA actúa por {{neutralización}} en mucosas (impide la adhesión del patógeno), no es un mecanismo microbicida directo."},"expl":"El mecanismo microbicida por excelencia del fagocito es el estallido oxidativo: NADPH oxidasa → O₂·⁻ → (SOD) → H₂O₂ → (MPO) → HOCl. Las demás opciones son mediadores inflamatorios, antiparasitarios o anticuerpos neutralizantes.","nivel":"SALE_SEGURO","reina":"R19","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (estallido oxidativo)","nota":null},{"k":"EX25-04","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T9 · Ontogenia linfocitos B y T","sub":"Exclusión alélica","idioma":"castellano","enun":"¿Cuál de los siguientes mecanismos asegura la monoclonalidad de los receptores en la inmunidad adquirida?","ops":{"a":"Cambio de isotipo","b":"Generación de memoria inmunológica","c":"Exclusión alélica","d":"Maduración por afinidad","e":"Expansión clonal"},"cor":"c","razones":{"a":"Falsa: el cambio de isotipo modifica la región {{constante}} de la cadena pesada (IgM→IgG/A/E) sin tocar la especificidad ni el número de receptores distintos por célula.","b":"Falsa: la memoria inmunológica garantiza respuestas secundarias más rápidas e intensas — no tiene que ver con que cada linfocito exprese {{un solo receptor}}.","c":"CORRECTA: la {{exclusión alélica}} silencia el segundo alelo cuando el primero se reordena con éxito → cada linfocito expresa UN único BCR/TCR (monoespecificidad/monoclonalidad).","d":"Falsa: la maduración por afinidad selecciona en el centro germinal los clones B con mayor {{afinidad}} tras la hipermutación somática — mejora la calidad, no impone un receptor único.","e":"Falsa: la expansión clonal multiplica el clon seleccionado tras el reconocimiento antigénico — es consecuencia de la selección clonal, no el mecanismo que asegura {{un receptor por célula}}."},"expl":"La exclusión alélica impide que se reordene el segundo alelo cuando el primero ya produjo una cadena funcional: así cada linfocito lleva un único receptor de antígeno. Solo aplica a BCR/TCR — el HLA, en cambio, se expresa de forma codominante.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (ontogenia B — exclusión alélica)","nota":"Concepto reciclado casi literal en 2017 (q6) y 2026 (Q23)."},{"k":"EX25-05","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T6 · APCs (presentadoras)","sub":"Maduración de la célula dendrítica","idioma":"castellano","enun":"La maduración de una DC:","ops":{"a":"Implica su migración desde los órganos linfoides secundarios a los tejidos periféricos","b":"Aumenta su actividad captadora de antígenos","c":"Requiere la ausencia de PAMPs en el medio","d":"Aumenta su actividad procesadora de antígenos","e":"Implica la inhibición de la expresión de MHC de clase II"},"cor":"d","razones":{"a":"Falsa: la migración es al revés — del {{tejido periférico}} al ganglio linfático regional (órgano linfoide secundario), donde presentará a los T vírgenes.","b":"Falsa: al madurar la DC {{deja de captar}} antígeno (pierde capacidad endocítica); la captadora eficiente es la DC inmadura del tejido.","c":"Falsa: es justo lo contrario — la maduración se dispara por el reconocimiento de {{PAMPs}} vía PRRs (señal de peligro).","d":"CORRECTA: la DC madura aumenta su actividad {{procesadora y presentadora}} de antígenos: más MHC-II estable en membrana y más coestimulación (B7).","e":"Falsa: la maduración {{aumenta}} la expresión y estabilidad del MHC de clase II en la membrana, no la inhibe."},"expl":"DC inmadura = centinela captadora en el tejido; DC madura (tras PAMPs) = migra al ganglio, deja de captar, procesa y presenta con MHC-II alto y coestimulación alta, y es la única APC capaz de activar T vírgenes.","nivel":"SALE_SEGURO","reina":"R18","clave":"razonada","conf":"ALTA","diapo":"TEMA 6 (maduración de la DC)","nota":null},{"k":"EX25-06","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T4 · Complemento","sub":"Inhibidores del complemento — Factor S (vitronectina)","idioma":"castellano","enun":"De las siguientes moléculas señala la que tenga un efecto más amplio en cuanto a la inhibición del complemento:","ops":{"a":"Factor B","b":"C4bBP","c":"Factor S","d":"Cadena J","e":"Properdina"},"cor":"c","razones":{"a":"Falsa: el Factor B no inhibe nada — es un componente {{activador}} de la vía alternativa (su fragmento Bb forma la convertasa C3bBb).","b":"Falsa: C4bBP inhibe uniéndose a C4b, pero su espectro se limita a las vías {{clásica y de las lectinas}} (la alternativa no usa C4b).","c":"CORRECTA: el Factor S ({{vitronectina}}) bloquea la inserción del {{MAC}} en la membrana; como el MAC es el tramo final COMÚN a las tres vías, su efecto inhibidor es el más amplio.","d":"Falsa: la cadena J no tiene nada que ver con el complemento — {{polimeriza}} la IgA dimérica y la IgM pentamérica.","e":"Falsa: la properdina es el distractor clásico — {{ESTABILIZA}} la C3 convertasa alternativa (C3bBb), es decir, POTENCIA el complemento, no lo inhibe."},"expl":"Para 'espectro' de inhibición piensa en dónde actúa cada regulador: C1INH solo al inicio de clásica/lectinas (el MÁS estrecho); C4bBP clásica+lectinas; Factor H/I, DAF, CR1 las tres vías; Factor S (vitronectina) sobre el MAC — tramo final común → el efecto MÁS amplio.","nivel":"SALE_SEGURO","reina":"R1","clave":"razonada","conf":"MEDIA","diapo":"TEMA 4 (reguladores: 'S (vitronectin)')","nota":"Sin clave oficial. Razonamiento: entre las opciones, solo Factor S y C4bBP son inhibidores reales; el Factor S actúa sobre el MAC (común a las 3 vías) → más amplio. Confianza MEDIA porque también podría argumentarse a favor de reguladores pan-vía no listados, pero no aparecen entre las opciones."},{"k":"EX25-07","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T4 · Complemento","sub":"Proteasas del complemento","idioma":"castellano","enun":"¿Cuál de los siguientes factores NO es una proteasa?","ops":{"a":"MASP-2","b":"Catepsina L","c":"C1s","d":"C1q","e":"Factor D"},"cor":"d","razones":{"a":"Falsa (SÍ es proteasa): MASP-2 es la serín-proteasa asociada a MBL que escinde {{C4 y C2}} en la vía de las lectinas.","b":"Falsa (SÍ es proteasa): la catepsina L es una proteasa {{lisosomal}} (también degrada la cadena invariante Ii en la vía exógena del MHC-II).","c":"Falsa (SÍ es proteasa): C1s es la serín-proteasa del complejo C1 que escinde {{C4 y C2}} en la vía clásica.","d":"CORRECTA: C1q es la subunidad de {{reconocimiento}} del complejo C1 — una colectina que se une al Fc de IgM/IgG; la actividad enzimática la ponen C1r y C1s.","e":"Falsa (SÍ es proteasa): el Factor D escinde el {{Factor B}} unido a C3b para formar la convertasa alternativa C3bBb."},"expl":"En el complemento casi todo son serín-proteasas (C1r, C1s, MASP-1/2, Factor D, y las propias convertasas). La excepción de la lista es C1q: molécula de reconocimiento (colectina), sin actividad enzimática.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 4 (complejo C1, vía de las lectinas)","nota":null},{"k":"EX25-08","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T1 · Introducción a la inmunología","sub":"Cinética innata vs adaptativa","idioma":"castellano","enun":"Señala la afirmación correcta:","ops":{"a":"La primera respuesta adquirida tarda días en desarrollarse","b":"La respuesta innata precede siempre a la natural","c":"La respuesta innata se activa después de la adaptativa","d":"Solo hay respuesta innata en presencia de DAMPs"},"cor":"a","razones":{"a":"CORRECTA: la respuesta adaptativa primaria tarda {{días}} (selección clonal + expansión + diferenciación), mientras la innata actúa en minutos-horas.","b":"Falsa: es una trampa de sinónimos — innata y {{natural}} son la MISMA respuesta, una no puede preceder a la otra.","c":"Falsa: el orden es el inverso — la innata actúa {{primero}} y además condiciona/inicia la adaptativa (APCs, coestimulación).","d":"Falsa: la innata también se activa por {{PAMPs}} (patrones de patógeno); los DAMPs (daño) son solo una de las dos clases de señales que reconocen los PRRs."},"expl":"Cinética clave: innata = inmediata (horas), preexistente, vía PRRs que reconocen PAMPs y DAMPs; adaptativa primaria = días, porque exige selección y expansión clonal. 'Innata' y 'natural' son sinónimos.","nivel":"SALE_SEGURO","reina":"R11","clave":"razonada","conf":"ALTA","diapo":"TEMA 1 (innata vs adaptativa)","nota":"La reconstrucción no recoge la opción e (solo 4 opciones)."},{"k":"EX25-09","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T5 · Inmunógenos y antígenos","sub":"Inmunogenicidad y contexto PAMP (efecto adyuvante)","idioma":"castellano","enun":"Para que se produzca respuesta adaptativa frente a un antígeno derivado de bacterias…","ops":{"a":"El proceso de reconocimiento es dependiente de PAMPs","b":"El antígeno debe ir asociado a DAMPs","c":"Debe ser un hapteno bacteriano","d":"Los antígenos no requieren ser procesados","e":"Las células de Langerhans son esenciales"},"cor":"a","razones":{"a":"CORRECTA: los {{PAMPs}} bacterianos activan la APC vía PRRs → maduración y coestimulación; sin ese contexto de peligro no hay activación eficaz del linfocito T virgen (base del efecto adyuvante).","b":"Falsa: los DAMPs son señales de {{daño celular propio}}; un antígeno bacteriano ya trae sus propios PAMPs, no necesita asociarse a DAMPs.","c":"Falsa: un hapteno (<1 kDa) NO es inmunogénico por sí solo — necesita conjugarse a una molécula {{portadora}} (carrier). No es ningún requisito de la respuesta antibacteriana.","d":"Falsa: los antígenos proteicos SÍ requieren ser {{procesados}} y presentados en MHC para activar a los linfocitos T.","e":"Falsa: las células de Langerhans son las DCs de la {{epidermis}} — solo relevantes si la entrada es cutánea, no esenciales para cualquier antígeno bacteriano."},"expl":"La respuesta adaptativa a un antígeno bacteriano necesita el contexto innato: los PAMPs activan los PRRs de la APC, que madura, procesa el antígeno y ofrece señal 2 (coestimulación). Antígeno sin señal de peligro = tolerancia/anergia.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 5 / TEMA 3 (PAMPs y activación de la APC)","nota":"Enunciado truncado en la reconstrucción ('…'). Respuesta razonada: a es la única compatible con el efecto adyuvante de los PAMPs."},{"k":"EX25-10","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T3 · Inmunidad innata","sub":"PAMPs y PRRs","idioma":"castellano","enun":"Los PAMPs:","ops":{"a":"Son pequeños péptidos producidos por los patógenos","b":"Nunca son antigénicos","c":"Son patrones moleculares asociados a daño celular","d":"Son reconocidos por los PRRs","e":"Son reconocidos por los receptores Fc"},"cor":"d","razones":{"a":"Falsa: no son 'péptidos' — son estructuras moleculares conservadas de naturaleza variada: {{LPS}}, peptidoglicano, flagelina, RNA/DNA microbiano, manosas…","b":"Falsa: 'nunca' es el absoluto trampa — muchos PAMPs SÍ pueden actuar como {{antígenos}} (p. ej. polisacáridos bacterianos reconocidos por anticuerpos).","c":"Falsa: los patrones asociados a daño celular son los {{DAMPs}}; los PAMPs son patrones asociados a PATÓGENOS.","d":"CORRECTA: los PAMPs son reconocidos por los {{PRRs}} (receptores de reconocimiento de patrones: TLRs, NLRs, lectinas C, RLRs…).","e":"Falsa: los receptores Fc reconocen la fracción {{Fc de los anticuerpos}} unidos a su antígeno, no patrones microbianos directamente."},"expl":"PAMP = patrón molecular conservado y esencial del patógeno (LPS, flagelina, ácidos nucleicos microbianos), reconocido por los PRRs de la inmunidad innata. DAMP = lo mismo pero de daño celular propio.","nivel":"SALE_SEGURO","reina":"R11","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (PAMPs/PRRs)","nota":null},{"k":"EX25-11","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T10 · Citocinas y quimiocinas","sub":"Quimiocinas — eje CXCL13/CXCR5","idioma":"castellano","enun":"CXCL13:","ops":{"a":"Lo producen los linfocitos T en la zona folicular","b":"Lo producen los linfocitos T en la zona reticular","c":"Se une a CCR7","d":"Se une a CCR21","e":"Todas son falsas"},"cor":"e","razones":{"a":"Falsa: CXCL13 lo producen las {{FDCs}} (células dendríticas foliculares) y células estromales del folículo B, no los linfocitos T.","b":"Falsa: ni lo producen los linfocitos T ni la 'zona reticular' es la localización — se secreta en la zona {{B/folicular}} del ganglio.","c":"Falsa: CCR7 es el receptor de {{CCL19 y CCL21}} (organizan la zona T/paracórtex); CXCL13 no se le une.","d":"Falsa: {{CCR21}} no existe como receptor — es un distractor inventado (confusión con la quimiocina CCL21).","e":"CORRECTA: todas las anteriores son falsas — CXCL13 lo producen las FDCs del folículo y su receptor es {{CXCR5}}, que atrae a los linfocitos B."},"expl":"Ejes del ganglio: CXCL13 (FDCs/estroma folicular) → CXCR5 atrae B al folículo; CCL19/CCL21 (estroma de zona T) → CCR7 atrae T y DCs al paracórtex. 'CCR21' no existe.","nivel":"SALE_SEGURO","reina":"R15","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 ('las células residentes de la zona B secretan CXCL13')","nota":null},{"k":"EX25-12","examen":"📝 Examen 1P · 2025 (Wuolah)","real":1,"origen":"EXAMEN-2025","tema":"T2 · Anatomía del sistema inmune","sub":"Circulación linfática — vasos aferentes","idioma":"castellano","enun":"Los vasos linfáticos aferentes de los g
