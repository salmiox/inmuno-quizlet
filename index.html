y celular (fagocitos, NK); la adaptativa tiene humoral ({{anticuerpos}}) y celular (linfocitos T).","c":"Falsa: el {{complemento}} y las proteínas de fase aguda son componente humoral de la innata.","d":"Falsa: {{fagocitos}} (neutrófilos, macrófagos) y células {{NK}} son el componente celular de la innata.","e":"Falsa: la b es verdadera."},"expl":"Ambos brazos del sistema inmune tienen componente humoral y celular: innata = complemento + fagocitos/NK; adaptativa = anticuerpos + linfocitos T.","nivel":"SALE_SEGURO","reina":"R11","clave":"razonada","conf":"ALTA","diapo":"TEMA 1","nota":null},{"k":"B14A-09","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T1 · Introducción a la inmunología","sub":"Características de la inmunidad innata","idioma":"catalan","enun":"Quina de les següents frases descriu millor la immunitat innata?","ops":{"a":"Gran especificitat i diversitat de receptors","b":"Inespecificitat i diversitat alta de receptors","c":"Especificitat limitada i autoreactivitat","d":"Especificitat limitada no autoreactivitat i absència de memòria","e":"Especificitat limitada autoreactivitat i memòria"},"cor":"d","razones":{"a":"Falsa: gran especificidad y diversidad de receptores (generados por {{recombinación V(D)J}}) describe la inmunidad {{adaptativa}}.","b":"Falsa: la innata no es totalmente inespecífica (reconoce {{PAMPs}} mediante PRRs) y su diversidad de receptores es {{limitada}} (codificados en línea germinal, no recombinados).","c":"Falsa: la innata NO es autorreactiva — sus PRRs reconocen patrones {{microbianos}} ausentes en lo propio.","d":"CORRECTA: especificidad {{limitada}} (PRRs en línea germinal contra PAMPs), {{no autorreactividad}} y {{ausencia de memoria}} — la tríada clásica de la innata.","e":"Falsa: la innata no tiene ni autorreactividad ni {{memoria}} inmunológica (esa es la clave de la adaptativa y de las vacunas)."},"expl":"Innata = receptores germinales de diversidad limitada, reconocen PAMPs (no lo propio), respuesta inmediata y sin memoria. La misma pregunta reaparece en Biotec 2014-2º q8.","nivel":"SALE_SEGURO","reina":"R11","clave":"razonada","conf":"ALTA","diapo":"TEMA 1","nota":null},{"k":"B14A-10","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T1 · Introducción a la inmunología","sub":"Tipos de patógenos — enfermedades víricas","idioma":"catalan","enun":"Assenyala la patologia que estigui causada per un virus","ops":{"a":"Malària","b":"Tinya","c":"Leishmaniosi","d":"Poliomielitis","e":"Tuberculosi"},"cor":"d","razones":{"a":"Falsa: la malaria la causa {{Plasmodium}}, un protozoo (parásito intracelular de eritrocitos) transmitido por Anopheles.","b":"Falsa: la tiña es una micosis cutánea causada por {{hongos dermatofitos}} (Trichophyton, Microsporum).","c":"Falsa: la leishmaniosis la causa {{Leishmania}}, un protozoo intracelular de macrófagos transmitido por flebótomos.","d":"CORRECTA: la poliomielitis la causa el {{poliovirus}} (enterovirus, familia Picornaviridae).","e":"Falsa: la tuberculosis la causa {{Mycobacterium tuberculosis}}, una bacteria intracelular."},"expl":"Clasificar patógenos por tipo: virus (polio), bacterias (tuberculosis), protozoos (malaria, leishmania), hongos (tiña), helmintos — cada tipo condiciona la respuesta inmune eficaz.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 1","nota":null},{"k":"B14A-11","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T1 · Introducción a la inmunología","sub":"Características exclusivas de la adaptativa","idioma":"catalan","enun":"Quina de les següents característiques no és exclusiva de la immunitat adaptativa","ops":{"a":"Expansió clonal","b":"Discriminació entre lo propi i el no propi","c":"Contracció","d":"Memòria","e":"Alta diversitat"},"cor":"b","razones":{"a":"Falsa (sí es exclusiva): la expansión {{clonal}} requiere clones con receptor específico único — solo los linfocitos la hacen.","b":"CORRECTA (no es exclusiva): la innata también distingue propio de no propio — sus {{PRRs}} reconocen {{PAMPs}} microbianos ausentes en las células propias.","c":"Falsa (sí es exclusiva): la contracción es la {{apoptosis}} de los clones efectores tras eliminar el antígeno, fase propia de la respuesta linfocitaria.","d":"Falsa (sí es exclusiva): la {{memoria}} inmunológica (respuesta secundaria más rápida y potente) es sello de la adaptativa.","e":"Falsa (sí es exclusiva): la alta diversidad de receptores nace de la {{recombinación V(D)J}}, exclusiva de linfocitos."},"expl":"Trampa clásica repetida (Abril 2017 q26, Abril 2020 q21): la discriminación propio/no propio la hacen AMBAS inmunidades; lo exclusivo de la adaptativa es clonalidad, contracción, memoria y diversidad.","nivel":"SALE_SEGURO","reina":"R11","clave":"razonada","conf":"ALTA","diapo":"TEMA 1","nota":null},{"k":"B14A-12","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T2 · Anatomía del sistema inmune","sub":"Médula ósea — órgano primario y secundario","idioma":"catalan","enun":"Quin dels següents òrgans es un òrgan limfoide primari i secundari?","ops":{"a":"Intestí prim","b":"Tracte gàstric urinari","c":"MALT","d":"Timus","e":"Moll de l'ós"},"cor":"e","razones":{"a":"Falsa: el intestino delgado alberga MALT/placas de Peyer — tejido linfoide {{secundario}} solamente.","b":"Falsa: las mucosas del tracto gastrointestinal y urinario son sistema inmune de mucosas, linfoide {{secundario}} no encapsulado.","c":"Falsa: el MALT (tejido linfoide asociado a mucosas) es por definición {{secundario}}: allí se montan respuestas, no se generan linfocitos.","d":"Falsa: el timo es exclusivamente {{primario}} — solo madura (educa) linfocitos T; no se inician allí respuestas frente a antígenos.","e":"CORRECTA: la médula ósea es {{primaria}} (hematopoyesis y maduración de linfocitos B) y además actúa como {{secundaria}}: recibe células plasmáticas de los centros germinales, que residen y secretan anticuerpos allí."},"expl":"La médula ósea genera y educa los linfocitos B (primario) y a la vez es el destino final de las células plasmáticas de vida larga (función secundaria/efectora) — las diapos del T2 recogen esa migración.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 2, slides 3 i 31 (plasmàtiques migren al moll de l'os)","nota":"Las diapos clasifican la médula solo como primaria, pero mencionan que las células plasmáticas migran a ella; ninguna otra opción puede ser primaria, así que la e es la única defendible."},{"k":"B14A-13","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T2 · Anatomía del sistema inmune","sub":"Timo — órgano primario encapsulado no productor de HSCs","idioma":"catalan","enun":"Quina de les següents descripcions pot aplicar-se al timus?:","ops":{"a":"Òrgan limfoide secundari encapsulat","b":"Òrgan limfoide primari no encapsulat","c":"Òrgan limfoide primari no productor de HSCs (hematopoètic stem cells)","d":"Òrgan limfoide primari en situacions d'estrès","e":"Òrgan limfoide secundari no encapsulat"},"cor":"c","razones":{"a":"Falsa: el timo no es secundario — no se inician en él respuestas inmunes; es {{primario}} (maduración de linfocitos T).","b":"Falsa: es primario pero SÍ está {{encapsulado}} (cápsula de tejido conectivo, lobulillos con corteza y médula).","c":"CORRECTA: el timo es primario, encapsulado, y {{no produce HSCs}}: recibe {{pre-timocitos}} de la médula ósea por sangre y los educa (selección positiva y negativa).","d":"Falsa: quienes pueden actuar como hematopoyéticos en situaciones de estrés/demanda son {{hígado y bazo}}, no el timo.","e":"Falsa: el timo ni es secundario ni carece de cápsula."},"expl":"El timo es órgano linfoide primario encapsulado que NO genera precursores: la hematopoyesis es de la médula ósea; el timo solo educa los timocitos que le llegan.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 2, slides 9 i 16","nota":null},{"k":"B14A-14","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T2 · Anatomía del sistema inmune","sub":"Bazo — funciones (todas verdaderas)","idioma":"catalan","enun":"La melsa","ops":{"a":"És important en la coordinació de la resposta adaptativa contra patògens circulants","b":"Reconeix els limfòcits B a les a les zones fol·liculars","c":"Elimina eritròcits envellits","d":"Produeix CCL21 a la zona T","e":"Totes són veritat"},"cor":"e","razones":{"a":"Verdadera: el bazo monta la respuesta adaptativa (humoral y celular) contra antígenos transportados por la {{sangre}} — es el 'ganglio' de la circulación.","b":"Verdadera (redacción defectuosa, probablemente 'recull/reté'): los linfocitos B se sitúan en los {{folículos}} entre el seno marginal y el PALS, atraídos por CXCL13.","c":"Verdadera: la {{pulpa roja}} criba y elimina los eritrocitos {{envejecidos}} o dañados.","d":"Verdadera: las células estromales producen {{CCL19/CCL21}} que atraen linfocitos T (CCR7) hacia el {{PALS}} (zona T), igual que en el ganglio.","e":"CORRECTA: las cuatro afirmaciones son ciertas → 'totes són veritat'."},"expl":"El bazo: filtro de sangre (pulpa roja elimina eritrocitos viejos) + órgano secundario para patógenos circulantes (pulpa blanca con PALS-T vía CCL19/21 y folículos-B vía CXCL13).","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"MEDIA","diapo":"TEMA 2, slides 4, 19 i 23","nota":"La opción b tiene redacción defectuosa ('Reconeix... a les a les') — se interpreta como que los B se localizan/retienen en las zonas foliculares, lo cual es cierto; por eso la e."},{"k":"B14A-15","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T3 · Inmunidad innata","sub":"Receptores Fc — FcγRIII (CD16) y ADCC de las NK","idioma":"catalan","enun":"Quin dels següents receptors provoca la degradació de les NK/LAK?","ops":{"a":"FcγRI","b":"FcαRI","c":"FcεRIII","d":"PoliIg-Rc","e":"KIR"},"cor":"c","razones":{"a":"Falsa: FcγRI (CD64) es el receptor de {{alta afinidad}} para IgG de monocitos/macrófagos, no el que dispara la ADCC de las NK.","b":"Falsa: FcαRI (CD89) es el receptor para {{IgA}}, expresado en neutrófilos y monocitos.","c":"CORRECTA (errata por FcγRIII): el {{FcγRIII (CD16)}} de las NK reconoce IgG unida a la diana y desencadena la {{degranulación}} (perforina/granzimas) = {{ADCC}} (citotoxicidad celular dependiente de anticuerpo).","d":"Falsa: el receptor poli-Ig transporta {{IgA dimérica}} (transcitosis) a través del epitelio hacia las secreciones — no tiene nada que ver con NK.","e":"Falsa: los KIR son receptores {{inhibidores}} de las NK — al reconocer MHC-I propio FRENAN la degranulación, no la provocan."},"expl":"La ADCC de las NK/LAK se dispara por FcγRIII (CD16) al reconocer células recubiertas de IgG; los KIR hacen lo contrario (inhiben al detectar MHC-I).","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 3 (NK)","nota":"Doble errata del original: 'degradació' = degranulació, y 'FcεRIII' no existe — debe ser FcγRIII (CD16). Con esa lectura la c es la única coherente."},{"k":"B14A-16","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T4 · Complemento","sub":"Historia — Bordet descubre el complemento","idioma":"catalan","enun":"El complement va ser descobert per","ops":{"a":"Milstein y kohler","b":"Jerne","c":"Steinmann","d":"Bordet","e":"Pasteur"},"cor":"d","razones":{"a":"Falsa: Milstein y Köhler desarrollaron los {{anticuerpos monoclonales}} (hibridomas, Nobel 1984).","b":"Falsa: Jerne formuló la teoría de la {{selección clonal}}/redes idiotípicas (Nobel 1984).","c":"Falsa: Steinman descubrió las células {{dendríticas}} (Nobel 2011).","d":"CORRECTA: Jules {{Bordet}} demostró el factor sérico termolábil que 'complementa' a los anticuerpos en la lisis bacteriana (Nobel 1919).","e":"Falsa: Pasteur es el padre de las {{vacunas}} atenuadas (rabia, carbunco) y de la microbiología."},"expl":"Bordet = complemento; pregunta de historia reciclada (Abril 2020 q37 y Abril 2016 #2, allí con el distractor Jenner/Jerne).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 4 (introducció històrica)","nota":null},{"k":"B14A-17","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T4 · Complemento","sub":"Convertasas — C3 convertasa como punto común","idioma":"catalan","enun":"De les següents molècules, quina és comuna a la via clàssica i l'alternativa d'activació del complement?","ops":{"a":"C5 convertasa","b":"C3 convertasa","c":"MBL","d":"Cl","e":"Cap de les anteriors"},"cor":"b","razones":{"a":"Falsa (como respuesta esperada): ambas vías forman también C5 convertasas, pero el elemento definitorio de convergencia que se pregunta es la {{C3 convertasa}}, el paso central previo (ver nota).","b":"CORRECTA: las dos vías convergen en la formación de una {{C3 convertasa}} — clásica/lectinas: {{C4b2a}}; alternativa: {{C3bBb}} — que corta C3 en C3a + C3b.","c":"Falsa: la MBL (lectina de unión a manosa) inicia exclusivamente la vía de las {{lectinas}}.","d":"Falsa: C1 (C1q + C1r₂s₂) es el iniciador exclusivo de la vía {{clásica}} (se fija a IgG/IgM unida a antígeno).","e":"Falsa: sí hay elemento común, la C3 convertasa."},"expl":"Las tres vías convergen en una C3 convertasa (distinta composición, misma función: cortar C3); de ahí sale C3b, la opsonina, y el camino al MAC.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 4 (vies d'activació)","nota":"Estrictamente ambas vías tienen también C5 convertasa, pero la respuesta canónica de convergencia es la C3 convertasa (concepto reciclado en Biotec 2014-2º q7)."},{"k":"B14A-18","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T4 · Complemento","sub":"Enlace tioéster — C3b/C4b","idioma":"catalan","enun":"Quina de les següents molècules conté un enllaç tioester molt reactiu?","ops":{"a":"C2b","b":"C4b","c":"C5b","d":"C6","e":"C9"},"cor":"b","razones":{"a":"Falsa: C2 no pertenece a la familia con tioéster; sus fragmentos aportan la actividad {{proteasa}} de la convertasa clásica, no unión covalente a superficies.","b":"CORRECTA: {{C4b}} (como {{C3b}}) contiene un enlace {{tioéster}} interno que al exponerse reacciona covalentemente con -OH/-NH₂ de la superficie del patógeno, anclándolo.","c":"Falsa: C5b no tiene tioéster; su papel es nuclear el ensamblaje del {{MAC}} (C5b-6-7-8-9).","d":"Falsa: C6 es un componente estructural del {{MAC}}, sin enlace tioéster.","e":"Falsa: C9 polimeriza formando el {{poro}} del MAC; tampoco tiene tioéster."},"expl":"Solo C3 y C4 (y sus fragmentos b) tienen el tioéster interno reactivo que permite la unión covalente a la superficie microbiana — por eso C3b/C4b son las opsoninas que quedan fijadas.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 4 (C3/C4, tioester)","nota":null},{"k":"B14A-19","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T4 · Complemento","sub":"Proteasas del complemento — MASPs","idioma":"catalan","enun":"De les següents molècules quina té activitats proteasa?","ops":{"a":"Factor B","b":"DAF","c":"MASP 1","d":"C1q","e":"MBL"},"cor":"c","razones":{"a":"Falsa: el Factor B intacto es un {{zimógeno}} sin actividad; solo su fragmento {{Bb}} (tras el corte por el Factor D) es proteasa dentro de C3bBb.","b":"Falsa: DAF (CD55) es un {{regulador}} que acelera la disociación de las convertasas — no corta nada.","c":"CORRECTA: MASP-1 (y MASP-2) son las {{serina proteasas}} asociadas a MBL que cortan {{C4 y C2}} en la vía de las lectinas.","d":"Falsa: C1q es la subunidad de {{reconocimiento}} (se une al Fc de IgG/IgM); las proteasas del complejo C1 son {{C1r y C1s}}, no C1q.","e":"Falsa: la MBL es una {{lectina}} de reconocimiento de manosas; la actividad enzimática la ponen sus MASPs asociadas."},"expl":"En los complejos iniciadores, reconocimiento y catálisis van separados: C1q/MBL reconocen; C1r-C1s/MASP-1-2 son las proteasas. C1q NO es proteasa — distractor recurrente.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 4 (via de les lectines)","nota":null},{"k":"B14A-20","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T4 · Complemento","sub":"Reguladores del complemento — déficit de DAF (HPN)","idioma":"catalan","enun":"Quin dels següents efectes en deriva de la deficiència en DAF?","ops":{"a":"Immunodeficiència","b":"Autoreactivitat","c":"Resposta al·lèrgiques","d":"Autoreactivitat i al·lergia","e":"Cap de les anteriors"},"cor":"b","razones":{"a":"Falsa: sin DAF el complemento se activa DE MÁS, no de menos — no hay {{inmunodeficiencia}} (esa la darían déficits de C3 o del MAC).","b":"CORRECTA: DAF (CD55) protege las células propias disociando las {{convertasas}}; su déficit deja al complemento atacar las células propias (lisis de eritrocitos = {{hemoglobinuria paroxística nocturna}}, HPN) — es decir, {{autorreactividad}} del complemento.","c":"Falsa: la alergia depende de {{IgE}} y mastocitos, sin relación con DAF.","d":"Falsa: la parte de alergia sobra; solo hay ataque a lo propio.","e":"Falsa: sí hay un efecto listado — la autorreactividad (ataque del complemento a células propias)."},"expl":"DAF/CD55 (anclado por GPI) acelera la disociación de las C3 convertasas sobre células propias; su pérdida (mutación de GPI en la HPN) produce lisis mediada por complemento de los eritrocitos propios.","nivel":"SALE_SEGURO","reina":"R1","clave":"razonada","conf":"MEDIA","diapo":"TEMA 4 (reguladors: DAF, CR1, Factor H)","nota":"Sin clave oficial: se interpreta 'autoreactivitat' como ataque del complemento a células propias (HPN). Si el profesor reservara 'autorreactividad' para la inmunidad adaptativa, la e sería defendible — pero b encaja mejor con la intención de la pregunta."},{"k":"B14A-21","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T5 · Inmunógenos y antígenos","sub":"Inmunogenicidad — complejidad química","idioma":"catalan","enun":"Escull la més inmunogénica de les següents opcions","ops":{"a":"Triglicèrid","b":"Pèptid format per 50 serines","c":"Pèptid format per 100 glicines","d":"Hemoglobina nativa","e":"Glucosa"},"cor":"d","razones":{"a":"Falsa: los {{lípidos}} son muy poco inmunogénicos (poca complejidad estructural, no se presentan bien en MHC clásico).","b":"Falsa: un {{homopolímero}} (50 serinas idénticas) carece de complejidad/diversidad de epítopos — inmunogenicidad mínima.","c":"Falsa: mismo problema — 100 glicinas es un homopolímero monótono; el tamaño no compensa la falta de {{complejidad}} química.","d":"CORRECTA: la hemoglobina nativa es una {{proteína}} grande, con estructura terciaria/cuaternaria y gran diversidad de aminoácidos → máxima {{complejidad}} = máxima inmunogenicidad (aunque al ser propia requiera contexto extraño).","e":"Falsa: la glucosa es una molécula {{pequeña}} (hapteno como mucho) — demasiado simple para ser inmunogénica."},"expl":"Los determinantes de inmunogenicidad: tamaño grande + complejidad química (heteropolímero proteico) + degradabilidad; los homopolímeros y las moléculas simples fallan aunque sean grandes.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 5 (immunogenicitat)","nota":null},{"k":"B14A-22","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T5 · Inmunógenos y antígenos","sub":"Antígenos T-independientes tipo 2","idioma":"catalan","enun":"Els antígens TI-2","ops":{"a":"Solen tenir una vida mitja molt llarga","b":"Provoquen una resposta adaptativa dependent dels limfòcits Th","c":"Solen ser altament repetitius","d":"Tenen una acció mitogènica sobre els limfòcits B a altes dosis","e":"a) i c) són veritat"},"cor":"c","razones":{"a":"Dudosa: algunos polisacáridos capsulares persisten, pero la 'vida media larga' no es el rasgo definitorio que dan las diapos (ver nota).","b":"Falsa: son T-INDEPENDIENTES — activan al B {{sin contacto directo}} con el Th (a lo sumo con ayuda de citocinas de Th vecinos).","c":"CORRECTA: los TI-2 son macromoléculas {{altamente repetitivas}} (polisacáridos capsulares, p. ej. del {{neumococo}}) cuya multivalencia entrecruza muchos {{BCR}} a la vez.","d":"Falsa: la acción {{mitogénica}} a altas dosis es propia de los {{TI-1}} (como el LPS, activador policlonal), no de los TI-2.","e":"Dudosa: solo si el profesor contara la vida media larga como rasgo TI-2; las diapos solo recogen la repetitividad (ver nota)."},"expl":"TI-1 = mitógenos a dosis altas (LPS); TI-2 = polisacáridos muy repetitivos que entrecruzan masivamente el BCR y activan al B sin contacto con el Th.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 5 (antígens T-independents)","nota":"Sin clave. Las diapos solo definen TI-2 como 'macromolècules altament repetitives' → c. Si el profesor añadiera la persistencia/vida media larga (que citan algunos textos), la intención sería e — memorizar c como núcleo seguro."},{"k":"B14A-23","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T5 · Inmunógenos y antígenos","sub":"Epítopos conformacionales — solo linfocitos B","idioma":"catalan","enun":"Els epítops","ops":{"a":"Conformacionals només son reconeguts pels limfòcits B","b":"Són determinant antigènics immunogènics","c":"S'uneixen a la part constant del TCR","d":"S'uneixen al TCR de forma covalent","e":"Conformacionals només són reconeguts pels limfòcits T"},"cor":"a","razones":{"a":"CORRECTA: los epítopos {{conformacionales}} (dependen del plegamiento 3D nativo) solo los reconocen el {{BCR/anticuerpos}}; el linfocito T ve péptidos {{lineales}} procesados y presentados en MHC.","b":"Falsa: un epítopo es un determinante {{antigénico}} (se une a un receptor), pero no necesariamente {{inmunogénico}} (capaz de iniciar respuesta por sí solo) — un hapteno tiene epítopo sin ser inmunógeno.","c":"Falsa: el epítopo lo contacta la región {{variable}} del TCR (las {{CDR}}, regiones determinantes de complementariedad), no la constante.","d":"Falsa: la unión antígeno-receptor es siempre {{no covalente}} (puentes de hidrógeno, fuerzas electrostáticas, van der Waals, hidrofóbicas) y reversible.","e":"Falsa: es exactamente al revés — el T solo reconoce epítopos {{lineales}} (péptidos en MHC), nunca conformacionales."},"expl":"B/anticuerpos reconocen el antígeno nativo (epítopos conformacionales o lineales accesibles); T solo péptidos lineales procesados sobre MHC. Antigénico ≠ inmunogénico.","nivel":"SALE_SEGURO","reina":"R22","clave":"razonada","conf":"ALTA","diapo":"TEMA 5 (epítops)","nota":null},{"k":"B14A-24","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T6 · APCs (presentadoras)","sub":"La mejor APC — célula dendrítica","idioma":"catalan","enun":"De les següents opcions escull \"la millor\" APC","ops":{"a":"FDC","b":"mTEC","c":"Macròfag","d":"iDC","e":"limfòcid B"},"cor":"d","razones":{"a":"Falsa: la FDC (célula dendrítica folicular) NO es una APC clásica: no procesa ni presenta en MHC-II; retiene {{inmunocomplejos}} nativos en el folículo para los linfocitos B. Ni siquiera es de origen hematopoyético.","b":"Falsa: la mTEC presenta autoantígenos (vía {{AIRE}}) para la {{selección negativa}} tímica — función tolerogénica, no es 'la mejor APC' para iniciar respuestas.","c":"Falsa: el macrófago es APC profesional pero de segunda fila: presenta sobre todo a T {{efectores/memoria}} en el tejido, no activa bien a los vírgenes.","d":"CORRECTA: la célula dendrítica (aquí iDC, dendrítica {{intersticial/interdigitante}}) es la única capaz de activar eficazmente linfocitos T {{vírgenes}}: captura en tejido, madura, migra al ganglio y expresa máximo MHC y {{coestimulación}} (B7).","e":"Falsa: el linfocito B es APC profesional pero solo presenta eficientemente el antígeno que capta con su {{BCR}} específico; no inicia respuestas primarias como la DC."},"expl":"Jerarquía de APCs profesionales: DC >> macrófago y linfocito B; solo la DC madura activa T vírgenes. FDC y mTEC son distractores clásicos que no son APCs convencionales.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 6 (tipus d'APCs)","nota":"Nota al margen del apuntador: iDC = células dendríticas intersticiales. Errata 'limfòcid' = limfòcit."},{"k":"B14A-25","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T12 · Activación linfocitaria","sub":"Coestimulación — CD3 no es coestimuladora","idioma":"catalan","enun":"Quina de les següents molècules no és coestimuladora","ops":{"a":"B7","b":"CD40","c":"CD3","d":"CD28","e":"41BB"},"cor":"c","razones":{"a":"Falsa (sí lo es): B7 ({{CD80/CD86}}) en la APC es EL ligando coestimulador por excelencia — da la señal 2 al unirse a CD28.","b":"Falsa (sí lo es): CD40 (APC) con su ligando {{CD40L (CD154)}} del T es coestimulación bidireccional clave (licencia a la DC, cambio de isotipo en B).","c":"CORRECTA: CD3 forma parte del {{complejo TCR}} y transduce la {{señal 1}} (reconocimiento del péptido-MHC) mediante sus {{ITAMs}} — no es señal 2/coestimulación.","d":"Falsa (sí lo es): CD28 en el T es el receptor coestimulador principal, recibe la {{señal 2}} de B7.","e":"Falsa (sí lo es): 4-1BB (CD137) es un coestimulador de la familia del {{TNFR}} que sostiene la respuesta T ya iniciada."},"expl":"Señal 1 = TCR/CD3 con péptido-MHC; señal 2 = coestimulación (CD28-B7, CD40L-CD40, 4-1BB...). CD3 pertenece a la señal 1, no a la coestimulación.","nivel":"SALE_SEGURO","reina":"R17","clave":"razonada","conf":"ALTA","diapo":"TEMA 12 (activació T, dues senyals)","nota":null},{"k":"B14A-26","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T7 · MHC y presentación","sub":"Complejo de carga del MHC-I (PLC)","idioma":"catalan","enun":"Assenyala la molècula que no pertanyi al complex de càrrega de la via de presentació endògena","ops":{"a":"TAP1","b":"Tapasina","c":"Calreticulina","d":"Erp57","e":"Totes pertanyen al complex de càrrega"},"cor":"e","razones":{"a":"Pertenece: TAP1 (con TAP2) es el {{transportador}} que mete los péptidos del citosol al retículo endoplasmático.","b":"Pertenece: la tapasina es el {{puente}} que une TAP con la molécula de MHC-I vacía y edita la carga del péptido.","c":"Pertenece: la calreticulina es una {{chaperona}} lectina que estabiliza el MHC-I mientras se pliega y carga.","d":"Pertenece: ERp57 es la {{tiol-oxidorreductasa}} (isomerasa de disulfuros) asociada a calreticulina/tapasina en el complejo.","e":"CORRECTA: las cuatro (TAP, tapasina, calreticulina, ERp57) forman el {{peptide-loading complex}} del MHC de clase I — todas pertenecen."},"expl":"Complejo de carga del MHC-I en el RE: TAP1/TAP2 + tapasina + calreticulina + ERp57 (+ MHC-I). Memorizar los cuatro; la trampa es que aquí no falta ninguno.","nivel":"SALE_SEGURO","reina":"R3","clave":"razonada","conf":"ALTA","diapo":"TEMA 7, slides 24-25 (via endògena, TAP)","nota":null},{"k":"B14A-27","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T7 · MHC y presentación","sub":"Nomenclatura HLA — LFA-1 no es HLA","idioma":"catalan","enun":"Quina de les següents molècules no es una proteïna HLA?:","ops":{"a":"DP","b":"A","c":"LFA-I","d":"DR","e":"B"},"cor":"c","razones":{"a":"Falsa (sí es HLA): HLA-DP es una de las tres moléculas clásicas de MHC de {{clase II}} humanas.","b":"Falsa (sí es HLA): HLA-A es una de las moléculas de MHC de {{clase I}} clásicas (A, B, C).","c":"CORRECTA: LFA-1 es una {{integrina}} leucocitaria (CD11a/CD18) de {{adhesión}} — se une a ICAM-1 en la sinapsis inmunológica, pero no es un producto del locus HLA.","d":"Falsa (sí es HLA): HLA-DR es la molécula de {{clase II}} más expresada (la nota al margen del apuntador lo confirma).","e":"Falsa (sí es HLA): HLA-B es MHC de {{clase I}} clásico."},"expl":"HLA humano: clase I = A, B, C; clase II = DP, DQ, DR. LFA-1 es una integrina de adhesión, no una proteína HLA.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 7 (gens HLA)","nota":null},{"k":"B14A-28","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T7 · MHC y presentación","sub":"HLA-DM — catalizador del intercambio CLIP/péptido","idioma":"catalan","enun":"La molècula DM","ops":{"a":"Pertany a l'inmunoproteosoma","b":"Catalitza la càrrega del pèptid a l'HLA de classe II","c":"Correspon al fragment CLIP","d":"Forma un monòmer amb li al RE","e":"És una canepsina"},"cor":"b","razones":{"a":"Falsa: el inmunoproteasoma (subunidades {{LMP2/LMP7}} inducidas por IFNγ) es de la vía {{endógena}} (MHC-I); DM trabaja en la vía exógena.","b":"CORRECTA: HLA-DM, en el {{compartimento MIIC}}, cataliza la liberación del {{CLIP}} y el intercambio por el péptido antigénico de mayor afinidad — es el 'control de calidad' de la carga del MHC-II.","c":"Falsa: el CLIP es el fragmento residual de la {{cadena invariante (Ii)}} que ocupa el surco; DM es quien lo QUITA, no el propio CLIP.","d":"Falsa: quien se asocia con la cadena invariante Ii en el RE es el {{MHC-II}} naciente (y en trímeros, no 'monómero'); DM no forma complejo con Ii.","e":"Falsa (errata por 'catepsina'): las {{catepsinas}} (p. ej. catepsina S/L) son las proteasas endosómicas que degradan Ii hasta CLIP; DM no es una proteasa."},"expl":"Vía exógena: MHC-II + Ii en RE → endosoma → catepsinas dejan CLIP en el surco → HLA-DM cataliza CLIP fuera / péptido dentro. La nota del apuntador lo dice: DM actúa como control de calidad.","nivel":"SALE_SEGURO","reina":"R2","clave":"razonada","conf":"ALTA","diapo":"TEMA 7 (via exògena, HLA-DM)","nota":"Erratas del original: 'inmunoproteosoma' = immunoproteasoma; 'canepsina' = catepsina; 'amb li' = amb Ii (cadena invariant)."},{"k":"B14A-29","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T7 · MHC y presentación","sub":"Longitud de péptidos en MHC-II (DR)","idioma":"catalan","enun":"Els pèptids presentats per DR tenen una llargada","ops":{"a":"De 20-25 AAs","b":"De 8-10 AAs","c":"De 13-25 AAs","d":"De 13 a 18 AAs","e":"Il·limitada"},"cor":"c","razones":{"a":"Falsa: 20-25 excluye los péptidos más habituales (en torno a {{13-17}} residuos) — el rango empieza demasiado alto.","b":"Falsa: 8-10 aminoácidos es la longitud del {{MHC de clase I}}, cuyo surco está cerrado por los extremos.","c":"CORRECTA: HLA-DR (clase II) tiene el surco {{abierto}} por ambos extremos y acomoda péptidos largos, en el rango de {{13-25}} aminoácidos (las diapos dan 10-30 como límite amplio).","d":"Falsa: 13-18 se queda corto — se han descrito péptidos presentados por clase II claramente más largos (hasta 25-30).","e":"Falsa: aunque el surco esté abierto, la longitud NO es ilimitada: los péptidos más largos son recortados por {{peptidasas}}."},"expl":"Clase I: surco cerrado, 8-11 AAs. Clase II (DR): surco abierto, péptidos largos ~13-25 (diapos: 10-30, recortados por peptidasas si exceden).","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 7, slide 15 (pèptids de classe II, 10-30 residus)","nota":"Las diapos actuales dicen 10-30 residuos; ninguna opción coincide exactamente. Se elige c (13-25) por ser el rango clásico de los textos y el único compatible; descartar 8-10 (clase I) es lo esencial."},{"k":"B14A-30","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T7 · MHC y presentación","sub":"Presentación cruzada de antígenos","idioma":"catalan","enun":"La presentació creuada d'antígens","ops":{"a":"Permet efectuar una resposta contra patògens que no infecten les APCs","b":"Permet presentar antígens citoplasmàtics per la via exògena","c":"Permet la presentació d'antígens endocitats per la via endògena","d":"La realitzen les APCs","e":"Totes són veritat"},"cor":"e","razones":{"a":"Verdadera: es la frase literal de las diapos — la presentación cruzada permite combatir patógenos que {{no infectan las APCs}} (la DC capta el antígeno del exterior y aun así activa CD8).","b":"Dudosa: en sentido amplio existe el cruce inverso — antígenos {{citoplasmáticos}} llegando al MHC-II (p. ej. por {{autofagia}}); si el profesor lo incluyó en 'presentación cruzada', es verdadera (ver nota).","c":"Verdadera: es la definición estricta — antígenos {{endocitados}} (exógenos) presentados por la vía {{endógena}} (MHC de clase I) a linfocitos T CD8.","d":"Verdadera: la realizan APCs, sobre todo las células {{dendríticas}} (algunas subpoblaciones especializadas).","e":"CORRECTA (respuesta más probable): con a, c y d claramente verdaderas, la intención del examinador es 'todas', asumiendo la definición amplia bidireccional de la b."},"expl":"Presentación cruzada (sentido estricto): antígeno exógeno endocitado → retrotranslocación al citosol → MHC-I → CD8; permite responder a virus que no infectan DCs. En sentido amplio también citosol → MHC-II (autofagia).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"BAJA","diapo":"TEMA 7, slide 31 (presentació creuada)","nota":"Sin clave y pregunta ambigua: a, c y d son indiscutibles, así que la única respuesta única posible es e — lo que obliga a dar por buena la b (definición amplia). Si el profesor solo aceptara el sentido estricto (exógeno→MHC-I), la mejor sería la a (frase literal de la diapo)."},{"k":"B14A-31","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T8 · Igs, BCR y TCR","sub":"Estructura de inmunoglobulinas — fragmento cola","idioma":"catalan","enun":"Assenyala l'afirmació incorrecta","ops":{"a":"Els CDR son les regions hipervariables dels anticossos i TCRs","b":"Els BCRs no tenen fragment cua","c":"Les IgAs es troben en forma monomèrica al sèrum","d":"Les IgMs són pentamèriques al sèrum","e":"Les immunoglobulines naturals solen ser IgMs"},"cor":"b","razones":{"a":"Verdadera: las {{CDR}} (regiones determinantes de complementariedad) son las tres asas hipervariables de los dominios V, tanto de anticuerpos como de TCRs.","b":"INCORRECTA (y por tanto la respuesta): según las propias diapos del curso, la IgD del BCR se dibuja CON {{fragmento cola}} junto a {{Igα/Igβ}} — decir que los BCRs no tienen fragmento cola contradice el material del profesor.","c":"Verdadera: en el suero la IgA circula mayoritariamente como {{monómero}}; la forma {{dimérica}} (con cadena J y componente secretor) es la de las secreciones (sIgA).","d":"Verdadera: la IgM sérica es un {{pentámero}} (19S) unido por la cadena J.","e":"Verdadera: los anticuerpos naturales (preinmunes, polirreactivos, p. ej. anti-grupos sanguíneos) suelen ser {{IgM}}."},"expl":"Todas las demás son afirmaciones de libro; la b choca con las diapos del curso (IgD de membrana con 'Fragment cua' + Igα/Igβ), así que es la señalable como incorrecta.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 8, slide 23 (IgD: fragment cua, Ig-α/Ig-β)","nota":"Sin clave y matizable: en Abbas el 'tailpiece' es de las formas SECRETADAS y las de membrana lo sustituyen por dominio transmembrana; pero la diapo del curso dibuja la IgD del BCR con fragmento cola, y a/c/d/e son indiscutiblemente verdaderas — por descarte, b."},{"k":"B14A-32","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T8 · Igs, BCR y TCR","sub":"Coexpresión IgM/IgD en el B maduro","idioma":"catalan","enun":"Quina de les següents combinacions de BCRs és donen en un limfòcit","ops":{"a":"IgM+IgD+","b":"IgM-IgD-","c":"IgM-IgD+","d":"IgM+IgD-","e":"Cap de les anteriors"},"cor":"a","razones":{"a":"CORRECTA: el linfocito B {{maduro virgen}} coexpresa {{IgM e IgD}} de membrana con la MISMA especificidad, gracias al {{splicing alternativo}} del transcrito VDJ-Cμ-Cδ.","b":"Falsa como respuesta esperada: un B sin ninguna Ig de superficie sería un precursor (pro-B/pre-B) o una célula plasmática — no el fenotipo de BCR que se pregunta.","c":"Falsa: IgD sin IgM no es un estadio normal del desarrollo B (la IgD aparece {{después}} de la IgM, nunca sola en el virgen).","d":"Matiz: el B {{inmaduro}} recién salido de médula es IgM+IgD-, pero la combinación canónica y buscada del B maduro es IgM+IgD+.","e":"Falsa: la a es correcta."},"expl":"El sello del B maduro virgen es la doble expresión IgM+IgD+ por splicing alternativo (misma región V, dos isotipos). Repetida en Abril 2020 q34.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 8 / TEMA 9 (desenvolupament B)","nota":null},{"k":"B14A-33","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T8 · Igs, BCR y TCR","sub":"Propiedades de isotipos — la IgD no es la más abundante","idioma":"catalan","enun":"Assenyala l'afirmació incorrecta","ops":{"a":"Les IgEs son les úniques immunoglobulines que no fixen complement i tenen 4 dominis CH","b":"Les IgG4 no fixen complement ni s'uneixen a receptors Fc","c":"Les IgG1 fixen complement i travessen la placenta","d":"Les IgDs son les immunoglobulines més abundants al sèrum","e":"Les IgAs són essencials per la immunitat de les mucoses"},"cor":"d","razones":{"a":"Verdadera (en el marco del curso): la IgE no fija complemento y tiene un dominio extra {{CH4}}; se une a los FcεRI de {{mastocitos y basófilos}}.","b":"Verdadera (según lo enseñado): la {{IgG4}} es la subclase que no activa complemento (y con función efectora Fc mínima).","c":"Verdadera: la {{IgG1}} es la subclase más eficaz — fija complemento y cruza la {{placenta}} (todas las IgG cruzan vía FcRn, IgG1 la que mejor).","d":"INCORRECTA (respuesta): la más abundante en suero es la {{IgG}} (~75%); la IgD está en concentraciones {{mínimas}} (cuarta/quinta), es esencialmente Ig de superficie del B virgen.","e":"Verdadera: la {{sIgA}} dimérica (con componente secretor) es el anticuerpo de las secreciones y la inmunidad de mucosas."},"expl":"Orden de abundancia sérica: IgG > IgA > IgM > IgD > IgE. La IgD casi no se secreta — es el BCR del linfocito virgen; decir que es la más abundante es el error a señalar.","nivel":"SALE_SEGURO","reina":"R4","clave":"razonada","conf":"ALTA","diapo":"TEMA 8, slides 16-24 (propietats dels isotips)","nota":null},{"k":"B14A-34","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T9 · Ontogenia linfocitos B y T","sub":"Recombinación somática en médula vs maduración por afinidad (CG)","idioma":"catalan","enun":"Quin dels següents conceptes no s'aplica a la recombinació somàtica dels BCRs al moll de l'ós?","ops":{"a":"Exclusió al·lostèrica","b":"Maduració per afinitat","c":"Nucleòtids P","d":"Regala 12/23","e":"Re-edició del receptor"},"cor":"b","razones":{"a":"Se aplica (errata por 'al·lèlica'): la {{exclusión alélica}} garantiza que solo un alelo de cadena pesada/ligera se exprese por célula — propia del reordenamiento en médula.","b":"NO se aplica (respuesta): la maduración por afinidad ocurre en el {{centro germinal}} del órgano secundario, tras el contacto con antígeno, mediante {{hipermutación somática}} + selección — no en la médula ósea.","c":"Se aplica: los {{nucleótidos P}} (palindrómicos) se generan al abrir las horquillas durante la unión V(D)J en la médula.","d":"Se aplica (errata por 'Regla'): la {{regla 12/23}} de los RSS dicta qué segmentos pueden recombinarse entre sí.","e":"Se aplica: la {{edición del receptor}} (nuevos reordenamientos de cadena ligera) rescata a los B inmaduros autorreactivos en la propia médula."},"expl":"En médula: V(D)J con regla 12/23, nucleótidos P/N, exclusión alélica y edición del receptor. La maduración por afinidad es un proceso POST-antigénico del centro germinal.","nivel":"PUEDE_SALIR","reina":"R6","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (recombinació V(D)J)","nota":"Erratas OCR del original: 'exclusió al·lostèrica' = al·lèlica; 'Regala 12/23' = Regla 12/23."},{"k":"B14A-35","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T9 · Ontogenia linfocitos B y T","sub":"Pre-TCR — inducción del reordenamiento de la cadena α","idioma":"catalan","enun":"Quina de les següents activitats és induïda pel preTCR?","ops":{"a":"Recombinació de la cadena α","b":"Recombinació de la cadena β","c":"Recombinació de la cadena κ","d":"Recombinació de la cadena λ","e":"Augment de l'expressió de la cadena perTα"},"cor":"a","razones":{"a":"CORRECTA: la señal del pre-TCR (β + {{pTα}}) valida la cadena β y dispara la proliferación, la transición {{DN→DP}} y el inicio de la recombinación de la cadena {{α}} del TCR.","b":"Falsa: la cadena β ya está reordenada ANTES de formar el pre-TCR; su señal precisamente la DETIENE ({{exclusión alélica}} de β).","c":"Falsa: κ es una cadena {{ligera de inmunoglobulina}} — línea B, no T.","d":"Falsa: λ es la otra cadena {{ligera de Ig}}, también de linfocitos B.","e":"Falsa: tras la señal del pre-TCR la {{pTα}} (pre-T alfa, la cadena sustituta) deja de necesitarse y su expresión {{disminuye}}, no aumenta."},"expl":"Checkpoint β: β reordenada + pTα = pre-TCR → señal que ordena parar β (exclusión alélica), proliferar, pasar a DP y recombinar α. Paralelo exacto al pre-BCR con cadena ligera sustituta.","nivel":"SALE_SEGURO","reina":"R8","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (desenvolupament T, pre-TCR)","nota":"Errata OCR: 'perTα' = pTα (pre-T alfa)."},{"k":"B14A-36","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T9 · Ontogenia linfocitos B y T","sub":"Selección negativa B — linfocitos B inmaduros","idioma":"catalan","enun":"La selecció negativa","ops":{"a":"Afecta als limfòcits DN","b":"Afecta als limfòcits pre-B","c":"Afecta als limfòcits B immadurs","d":"Afecta als limfòcits B madurs","e":"A totes les anteriors"},"cor":"c","razones":{"a":"Falsa: los DN (dobles negativos) son timocitos tempranos sin TCR completo — no pueden ser testados contra lo propio todavía.","b":"Falsa: el pre-B solo tiene {{pre-BCR}} (cadena pesada + cadena ligera sustituta), sin especificidad definitiva que evaluar.","c":"CORRECTA: en la línea B, la selección negativa actúa sobre el B {{inmaduro}} de la médula ósea, que ya expresa {{IgM de membrana}} completa: si reconoce autoantígeno → {{edición del receptor}}, deleción o anergia.","d":"Falsa: el B maduro ya superó los controles centrales; en periferia operan otros mecanismos de tolerancia, no 'la selección negativa' medular.","e":"Falsa: solo el estadio inmaduro (IgM+ recién ensamblada) es el sustrato de la selección negativa."},"expl":"La selección negativa B ocurre en la médula ósea sobre el B inmaduro (primer estadio con BCR IgM completo); sus salidas: edición del receptor, deleción clonal o anergia.","nivel":"SALE_SEGURO","reina":"R9","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (tolerància central B)","nota":null},{"k":"B14A-37","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T11 · Moléculas de adhesión","sub":"Moléculas de adhesión — VLA-4 es integrina","idioma":"catalan","enun":"De les següents molècules assenyala la que sigui una integrina","ops":{"a":"iCAM-I","b":"VLA-4","c":"VCAM","d":"MAdCAM","e":"E-selectina"},"cor":"b","razones":{"a":"Falsa: ICAM-1 es de la superfamilia de las {{inmunoglobulinas}} — es el LIGANDO endotelial de la integrina LFA-1.","b":"CORRECTA: VLA-4 ({{α4β1}}) es una {{integrina}} del leucocito (heterodímero αβ) que se une a VCAM-1 para la adhesión firme.","c":"Falsa: VCAM-1 es superfamilia {{Ig}} en el endotelio — ligando de VLA-4, no integrina.","d":"Falsa: MAdCAM-1 es la adresina {{mucosa}} (superfamilia Ig + dominios mucina), ligando de la integrina α4β7.","e":"Falsa: la E-selectina es una {{selectina}} (lectina tipo C) del endotelio inflamado — media el rodamiento, no la adhesión firme."},"expl":"Familias de adhesión: selectinas (rodamiento) — integrinas del leucocito (LFA-1, VLA-4, α4β7: adhesión firme) — ligandos de superfamilia Ig en endotelio (ICAM, VCAM, MAdCAM).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 11 (famílies de molècules d'adhesió)","nota":null},{"k":"B14A-38","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T10 · Citocinas y quimiocinas","sub":"IL-2 — receptor de citocinas de clase I","idioma":"catalan","enun":"La IL-2","ops":{"a":"Té un receptor de classe I","b":"És una quimiocina","c":"Té un receptor de classe II","d":"És una citocina Th2","e":"És una citocina hematopoètica"},"cor":"a","razones":{"a":"CORRECTA: el receptor de IL-2 pertenece a la familia de receptores de citocinas de {{clase I}} (hematopoyetina), con la cadena {{γ común}} (γc) compartida, y señaliza por {{JAK/STAT}}.","b":"Falsa: las quimiocinas son citocinas quimiotácticas pequeñas con receptores {{acoplados a proteína G}}; la IL-2 no dirige migración por gradiente.","c":"Falsa: los receptores de clase II son los de los {{interferones}} (y IL-10), no el de IL-2.","d":"Falsa: la IL-2 la producen sobre todo los T recién activados (perfil {{Th0/Th1}}); las citocinas Th2 son {{IL-4, IL-5, IL-13}}.","e":"Falsa: las hematopoyéticas son {{GM-CSF, G-CSF, M-CSF, IL-3, IL-7}}...; la IL-2 es el factor de crecimiento/proliferación de linfocitos T."},"expl":"IL-2 = factor de proliferación T, receptor trimérico (α CD25 + β + γc) de clase I, señalización JAK/STAT (STAT5). Repetida en Abril 2020 q11 y Abril 2016 #25.","nivel":"SALE_SEGURO","reina":"R13","clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (classes de receptors de citocines)","nota":null},{"k":"B14A-39","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T10 · Citocinas y quimiocinas","sub":"Quimiocinas — migración por gradiente vía GPCR","idioma":"catalan","enun":"Les quimiocines","ops":{"a":"No són citocines","b":"Provoquen migració cel·lular dependent de gradient de concentració","c":"Senyalitzen a través de les STATs","d":"Són reconegudes pels receptors citoplasmàtics","e":"Totes són falses"},"cor":"b","razones":{"a":"Falsa: las quimiocinas SÍ son una subfamilia de {{citocinas}} — citocinas quimiotácticas de bajo peso molecular (familias CC, CXC...).","b":"CORRECTA: su función definitoria es la {{quimiotaxis}} — migración celular siguiendo el {{gradiente}} de concentración de la quimiocina (p. ej. CXCL13 atrae B al folículo).","c":"Falsa: las STATs son de los receptores de citocinas clase I/II con {{JAK}}; los receptores de quimiocinas señalizan por {{proteína G}}.","d":"Falsa: sus receptores son de {{membrana}} (7 dominios transmembrana acoplados a proteína G), no citoplasmáticos.","e":"Falsa: la b es verdadera."},"expl":"Quimiocinas: citocinas quimiotácticas, receptores 7TM acoplados a proteína G (no JAK/STAT), función = migración por gradiente. Repetida en Abril 2017 q21 y Abril 2016 #24.","nivel":"SALE_SEGURO","reina":"R14","clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (quimiocines)","nota":null},{"k":"B14A-40","examen":"📜 Biotec 2014 · 1er ex.","real":0,"origen":"BIOTEC-2014-1","tema":"T12 · Activación linfocitaria","sub":"Señalización del TCR — fosfatasas inhibidoras","idioma":"catalan","enun":"Quin factor dels següents té una acció inhibidora sobre l'activació del TCR?","ops":{"a":"Activació de CD45","b":"Augment de Ca2+ intracel·lular","c":"Fosforilació de LAT","d":"Fosforilació de IκB","e":"Defosforilació dels ITAMs de CD3"},"cor":"e","razones":{"a":"Falsa (es activadora): CD45 es la fosfatasa que quita el fosfato {{inhibidor}} de {{Lck}}, activándola — paso INICIAL positivo de la señalización.","b":"Falsa (es activadora): la subida de {{Ca²⁺}} intracelular activa la calcineurina → {{NFAT}} entra al núcleo → transcripción de IL-2.","c":"Falsa (es activadora): LAT fosforilado por {{ZAP-70}} es el andamio que recluta PLCγ y las vías Ras/MAPK.","d":"Falsa (es activadora): fosforilar {{IκB}} lo marca para degradación y LIBERA a {{NF-κB}}, que entra al núcleo — resultado activador.","e":"CORRECTA: los {{ITAMs}} de CD3 fosforilados son el punto de partida de la señal (reclutan ZAP-70); su {{desfosforilación}} (por fosfatasas inhibidoras tipo SHP) apaga la señalización del TCR."},"expl":"Cascada TCR: CD45 activa Lck → Lck fosforila ITAMs de CD3 → ZAP-70 → LAT → PLCγ (Ca²⁺/NFAT, DAG/PKC-NF-κB) y Ras/MAPK. Todo lo que fosforile hacia delante activa; quitar fosfatos de los ITAMs inhibe.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 12 (senyalització TCR)","nota":"Trampa doble: la fosforilación de IκB parece 'inhibidora' por el nombre, pero libera NF-κB (activador); y CD45 es fosfatasa pero activa la vía."},{"k":"B14B-01","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T1 · Introducción a la inmunología","sub":"Inmunidad innata — características generales","idioma":"catalan","enun":"En relació a la resposta innata, quina de les següents afirmacions és falsa?","ops":{"a":"La immunitat innata no té memòria","b":"El reconeixement de PAMPS es fa a través de PRRs (pattern-recognition receptors)","c":"Els PRRs poden ser molècules solubles o receptors de membrana","d":"La resposta innata és absent al inici d'una infecció","e":"La resposta de la immunitat innata és menys específica que la de la immunitat adquirida"},"cor":"d","razones":{"a":"Verdadera (no es la falsa): la innata carece de {{memoria}} inmunológica — responde igual en cada exposición; la memoria es exclusiva de la adaptativa.","b":"Verdadera: los PAMP (patrones moleculares asociados a patógenos) se reconocen mediante {{PRRs}} (receptores de reconocimiento de patrones).","c":"Verdadera: los PRRs pueden ser de membrana (TLRs), citosólicos (NLRs) o {{solubles}} (pentraxinas como la proteína C reactiva, colectinas, ficolinas).","d":"CORRECTA (es la falsa): la innata es justo la {{primera línea}} de defensa — actúa de forma {{inmediata}} (minutos-horas) desde el inicio de la infección; la que tarda días en montarse es la adaptativa.","e":"Verdadera: la innata usa receptores de {{diversidad limitada}} codificados en línea germinal → menos específica que la adaptativa (BCR/TCR con diversidad casi ilimitada)."},"expl":"La inmunidad innata es inmediata (primera línea), sin memoria y de especificidad limitada (PRRs germinales que reconocen PAMPs); la adaptativa es tardía, específica y con memoria.","nivel":"SALE_SEGURO","reina":"R11","clave":"razonada","conf":"ALTA","diapo":"TEMA 1 / TEMA 3 (innata vs adaptativa)","nota":null},{"k":"B14B-02","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T3 · Inmunidad innata","sub":"Mediadores y células de la innata — neutrófilos, mastocitos","idioma":"catalan","enun":"Quina de les següents afirmacions és correcta?","ops":{"a":"La histamina provoca vasodilatació i bronciconstricció","b":"L'àcid araquidònic és precursor dels leucotriens i IL-5","c":"Els neutròfils destrueixen els bacteris mitjançant l'esclat oxidatiu i enzims proteolítics","d":"Els epiteli del tracte respiratori no presenta cap barrera química per a les infeccions","e":"Les cèl·lules NK i macròfags expressen receptors KIR"},"cor":"c","razones":{"a":"Falsa (según la tabla del profesor): la histamina aumenta la {{permeabilidad vascular}} y contrae el músculo liso; el mediador que produce vasodilatación + broncoconstricción en esa tabla es la {{prostaglandina D2}}.","b":"Falsa: el ácido araquidónico es precursor de prostaglandinas y {{leucotrienos}} (mediadores lipídicos), pero la IL-5 es una {{citocina}} proteica sintetizada de novo — no deriva de un lípido.","c":"CORRECTA: los neutrófilos matan bacterias fagocitados mediante el {{estallido oxidativo}} (NADPH oxidasa → ROS, mieloperoxidasa) y {{enzimas proteolíticas}} de sus gránulos (elastasa, catepsinas, lisozima).","d":"Falsa: el epitelio respiratorio SÍ tiene barreras químicas — {{moco}}, lisozima, {{defensinas}}, además del aclaramiento mucociliar.","e":"Falsa: los KIR (killer-cell immunoglobulin-like receptors) son receptores de {{NK}} (y algunos linfocitos T) que reconocen MHC-I; los {{macrófagos}} no los expresan."},"expl":"El neutrófilo es el gran bactericida de la innata: fagocitosis + estallido oxidativo (ROS/HOCl) + enzimas de los gránulos. Los KIR son exclusivos de NK/T, no de macrófagos.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 3, tabla de mediadores de mastocitos/basófilos + estallido oxidativo","nota":"La opción a es la trampa: en fisiología general la histamina sí broncoconstriñe, pero en la tabla del profesor su función es permeabilidad vascular + contracción de músculo liso, y la pareja 'vasodilatación + broncoconstricción' corresponde a PGD2. La c es inatacable. Histamina repite en Biotec 2014-1º q7."},{"k":"B14B-03","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T3 · Inmunidad innata","sub":"Basófilos","idioma":"catalan","enun":"Els basòfils","ops":{"a":"Tenen capacitat inflamatòria i fagocítica limitada als ganglis limfàtics","b":"Expressen catalasa","c":"Destrueixen els patògens mitjançant proteïna bàsica","d":"Presenten antígens de forma MHC-independent","e":"Totes són certes"},"cor":"a","razones":{"a":"CORRECTA (mejor opción): los basófilos tienen capacidad inflamatoria (degranulación de {{histamina}}, mediadores lipídicos) y una capacidad {{fagocítica limitada}}, y pueden migrar a los {{ganglios linfáticos}} en respuestas Th2 (revisión Pal et al. 2020 citada en la diapo).","b":"Falsa: la catalasa es una enzima del metabolismo del peróxido en el {{estallido oxidativo}} (típica de neutrófilos/bacterias catalasa+); no es un marcador de los gránulos del basófilo, que contienen {{histamina}} y proteasas.","c":"Falsa: la proteína básica principal ({{MBP}}) y la proteína catiónica son las armas del {{eosinófilo}} (tóxicas para helmintos), no el mecanismo destructor propio del basófilo.","d":"Falsa: cuando los basófilos presentan antígeno lo hacen vía {{MHC de clase II}} a linfocitos T CD4+ (MHC-dependiente), no de forma MHC-independiente.","e":"Falsa: b, c y d son falsas, así que 'todas son ciertas' cae automáticamente."},"expl":"El basófilo es un granulocito <1% de los leucocitos, con FcεRI, gránulos de histamina y papel en respuestas Th2/alérgicas; puede entrar en ganglios y actuar como APC vía MHC-II, pero no mata con MBP (eso es el eosinófilo).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"BAJA","diapo":"TEMA 3, slides 25-27 (mastocitos y basófilos; cita Pal et al. Front. Immunol. 2020)","nota":"Sin clave y con redacción ambigua en a ('limitada als ganglis' probablemente quiere decir 'capacidad fagocítica limitada + presencia en ganglios'). Se elige a por descarte: b, c y d son claramente falsas. El REPE de 2016 #37 solo confirma 'contienen histamina y leucotrienos, receptores Fc', que no discrimina aquí. Confianza BAJA."},{"k":"B14B-04","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T10 · Citocinas y quimiocinas","sub":"Citocinas que conectan innata y adaptativa","idioma":"catalan","enun":"No hi ha cap citocina que participi a la immunitat innata i l'adaptativa:","ops":{"a":"Només la IL-4","b":"Només la TNFα","c":"Només l'INFγ","d":"Hi ha citocines que connecten ambdós tipus d'immunitat, com per exemple l'IL-6","e":"Només l'EPO"},"cor":"d","razones":{"a":"Falsa: la premisa del enunciado es falsa y además la IL-4 no es la única 'puente' — es sobre todo una citocina de la respuesta {{Th2}} adaptativa.","b":"Falsa: el TNFα (factor de necrosis tumoral alfa) sí actúa en ambas, pero no es 'el único' — hay {{varias}} citocinas compartidas.","c":"Falsa: el IFNγ (interferón gamma) lo producen tanto células {{NK}} (innata) como linfocitos Th1/CD8 (adaptativa), pero tampoco es el único.","d":"CORRECTA: varias citocinas conectan innata y adaptativa; la {{IL-6}} es el ejemplo clásico — producida por macrófagos en la inflamación/fase aguda (innata) y a la vez estimula la diferenciación de linfocitos B/T (adaptativa). También lo hacen TNFα, IL-1, IFNγ, IL-12.","e":"Falsa: la EPO ({{eritropoyetina}}) es un factor hematopoyético que estimula la eritropoyesis — no es una citocina inmunitaria puente."},"expl":"Muchas citocinas actúan en ambas ramas del sistema inmune: IL-6, TNFα, IL-1, IL-12 o IFNγ conectan la respuesta innata (macrófagos, NK, inflamación) con la adaptativa (diferenciación linfocitaria).","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (citocinas de la innata y de la adaptativa)","nota":null},{"k":"B14B-05","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T4 · Complemento","sub":"Funciones del complemento","idioma":"catalan","enun":"Quina de les següents afirmacions no s'ajusta a l'acció del complement:","ops":{"a":"Opsonització","b":"Quimiotaxi","c":"Inflamació","d":"Permeabilització vascular","e":"Presentació antigènica"},"cor":"e","razones":{"a":"Es función del complemento: {{C3b}} depositado sobre el patógeno lo marca para fagocitosis vía receptores del complemento ({{CR1}}) — opsonización.","b":"Es función del complemento: {{C5a}} (y C3a) atraen neutrófilos y monocitos al foco — quimiotaxis.","c":"Es función del complemento: las anafilotoxinas {{C3a y C5a}} degranulan mastocitos y activan la respuesta inflamatoria.","d":"Es función del complemento: las anafilotoxinas aumentan la {{permeabilidad vascular}} (vía histamina de mastocitos y acción directa sobre el endotelio).","e":"CORRECTA (no es acción del complemento): la presentación antigénica la hacen las {{APCs}} (células presentadoras de antígeno) mediante {{MHC}} — el complemento no presenta antígenos (como mucho facilita la captación del inmunocomplejo, pero la presentación no es una de sus acciones)."},"expl":"Funciones del complemento: opsonización (C3b), quimiotaxis e inflamación con aumento de permeabilidad vascular (C3a/C5a), lisis por MAC y aclaramiento de inmunocomplejos. Presentar antígeno es cosa de las APCs con MHC.","nivel":"PUEDE_SALIR","reina":"R23","clave":"razonada","conf":"ALTA","diapo":"TEMA 4 (funciones biológicas del complemento)","nota":"Este concepto se recicló casi igual en el examen 2025 (Q1, funciones del complemento)."},{"k":"B14B-06","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T4 · Complemento","sub":"Vía alternativa del complemento — activación","idioma":"catalan","enun":"La via alternativa del complement acostuma a activar-la","ops":{"a":"IgA","b":"IgG i IgD","c":"La interacció entre proteïnes de superfície del patogen reconegudes per una IgG o IgM","d":"El factor D","e":"El DAF"},"cor":"d","razones":{"a":"Falsa (para este profesor): la vía alternativa se activa {{sin anticuerpos}} sobre superficies microbianas; aunque textos clásicos citan la IgA agregada como activadora, la diapo la define expresamente como vía independiente de anticuerpo.","b":"Falsa: IgG activa la vía {{clásica}} (vía C1q), y la {{IgD}} no fija complemento en absoluto.","c":"Falsa: patógeno + IgG/IgM = descripción de la vía {{clásica}} (C1q se une al Fc del anticuerpo unido al antígeno), no de la alternativa.","d":"CORRECTA: en la vía alternativa, tras la hidrólisis espontánea de C3 y la unión de C3b a la membrana microbiana, el {{factor D}} (serina-proteasa plasmática) corta el {{factor B}} unido a C3b generando C3bBb, la C3 convertasa alternativa — es la proteasa que pone en marcha la vía.","e":"Falsa: el DAF (factor acelerador de la degradación) es un {{inhibidor}} — disocia las convertasas en las células propias; su déficit causa hemoglobinuria paroxística nocturna."},"expl":"La vía alternativa se inicia por hidrólisis espontánea de C3 (tickover) sobre superficies microbianas, sin anticuerpos: C3b + factor B, cortado por el factor D, forman C3bBb (C3 convertasa alternativa), estabilizada por properdina.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 4, slide 17 (La via alternativa)","nota":"Pregunta con enunciado laxo: estrictamente el factor D no 'activa' la vía (la inicia el tickover de C3), pero es la única opción que pertenece a la maquinaria alternativa según la diapo. Algunos textos clásicos aceptan que la IgA agregada activa la vía alternativa — si el profesor siguiera ese criterio la respuesta sería a. Confianza MEDIA."},{"k":"B14B-08","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T1 · Introducción a la inmunología","sub":"Innata vs adaptativa — diversidad y tolerancia","idioma":"catalan","enun":"Una diversitat limitada de receptors específics i simultàniament, no reacció als antígens propis són característiques","ops":{"a":"Exclusives de la immunitat adaptativa","b":"Exclusives de la immunitat innata","c":"Compartides per la immunitat adquirida i la innata","d":"Totes les afirmacions són correctes","e":"Cap de les anteriors afirmacions és veritat"},"cor":"b","razones":{"a":"Falsa: la adaptativa tiene justo lo contrario en el primer rasgo — diversidad {{casi ilimitada}} de receptores (BCR/TCR por recombinación V(D)J).","b":"CORRECTA: la COMBINACIÓN de ambas cosas solo la cumple la innata — sus PRRs son de {{diversidad limitada}} (codificados en línea germinal) y reconocen {{PAMPs}} microbianos, ausentes de las células propias → no reacciona contra lo propio de forma innata.","c":"Falsa: la 'no reacción a lo propio' sí es compartida (la adaptativa la logra por {{tolerancia}}), pero la diversidad limitada NO — la adaptativa es hiperdiversa; al exigirse las dos características simultáneamente, no son compartidas.","d":"Falsa: a, b y c no pueden ser correctas a la vez (se contradicen).","e":"Falsa: b sí es verdadera."},"expl":"Clave del matiz: la tolerancia a lo propio es común a ambas inmunidades, pero la diversidad limitada de receptores es exclusiva de la innata; la pareja de rasgos 'simultáneamente' solo describe a la innata.","nivel":"SALE_SEGURO","reina":"R11","clave":"razonada","conf":"ALTA","diapo":"TEMA 1 (características innata vs adaptativa)","nota":"Familia más reciclada del histórico: repite en Biotec 2014-1º q9/q11 y Abril 2017 q26."},{"k":"B14B-09","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T3 · Inmunidad innata","sub":"Inmunidad innata — reconocimiento de PAMPs","idioma":"catalan","enun":"Assenyala la resposta correcta:","ops":{"a":"El sistema immunitari innat no inclou mecanismes cel·lulars de defensa","b":"La capacitat defensiva de la immunitat natural descansa principalment en el reconeixement dels PAMPs","c":"La diversitat de receptors dels sistema immunitari adaptatiu és notablement inferior a la de la immunitat innata.","d":"Tots els processos de defensa de la immunitat innata s'inicien a partir de la histamina","e":"El sistema immunitari innat no inclou mecanismes humorals de defensa"},"cor":"b","razones":{"a":"Falsa: la innata tiene un potente componente celular — {{neutrófilos}}, macrófagos, NK, eosinófilos, mastocitos, células dendríticas.","b":"CORRECTA: la defensa innata se basa en que los {{PRRs}} reconocen {{PAMPs}} (patrones moleculares conservados de los microbios: LPS, peptidoglicano, RNA viral...), lo que dispara fagocitosis, inflamación y citocinas.","c":"Falsa: es al revés — la diversidad del sistema {{adaptativo}} (V(D)J) es enormemente {{superior}} a la de los receptores germinales de la innata.","d":"Falsa: la histamina es UN mediador (de {{mastocitos}}/basófilos) — la innata también se inicia por fagocitosis, complemento, interferones... no todo pasa por histamina.","e":"Falsa: la innata tiene brazos humorales — {{complemento}}, pentraxinas (proteína C reactiva), colectinas, lisozima, defensinas."},"expl":"La inmunidad innata combina mecanismos celulares (fagocitos, NK) y humorales (complemento, pentraxinas), y su capacidad de reconocimiento descansa en la detección de PAMPs por PRRs.","nivel":"SALE_SEGURO","reina":"R11","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (PAMPs/PRRs; componentes celular y humoral)","nota":null},{"k":"B14B-10","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T1 · Introducción a la inmunología","sub":"Conceptos generales — barreras, expansión clonal, PAMP","idioma":"catalan","enun":"Assenyala la resposta correcta:","ops":{"a":"PAMP significa Paghogen Associated Mimetic Pattern","b":"La contracció del sistema immune esdevé abans de la seva expansió clonal","c":"El sistema immunitari està format únicament per cèl·lules circulants","d":"Les barreres anatòmiques químiques formen part de la immunitat innata","e":"Totes són correctes"},"cor":"d","razones":{"a":"Falsa: PAMP = Pathogen-Associated {{Molecular}} Pattern (patrón MOLECULAR asociado a patógeno), no 'Mimetic'.","b":"Falsa: el orden de la respuesta adaptativa es reconocimiento → {{expansión clonal}} → fase efectora → {{contracción}} (apoptosis de efectores) → memoria; la contracción viene DESPUÉS de la expansión.","c":"Falsa: el sistema inmune incluye también células {{residentes en tejidos}} (macrófagos tisulares, mastocitos, células dendríticas) y órganos linfoides — no solo células circulantes.","d":"CORRECTA: las barreras anatómicas y sus componentes químicos (pH gástrico, {{lisozima}}, {{defensinas}}, ácidos grasos de la piel, moco) son la primera línea de la inmunidad {{innata}}.","e":"Falsa: a, b y c son falsas."},"expl":"Las barreras anatómicas (físicas y químicas) son parte integral de la inmunidad innata; en la adaptativa el ciclo es expansión clonal primero y contracción después.","nivel":"SALE_SEGURO","reina":"R11","clave":"razonada","conf":"ALTA","diapo":"TEMA 1 / TEMA 3 (barreras; fases de la respuesta)","nota":"Errata de OCR en a: 'Paghogen' por 'Pathogen' (el error buscado por el profesor es 'Mimetic' en lugar de 'Molecular')."},{"k":"B14B-11","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T2 · Anatomía del sistema inmune","sub":"Organización del ganglio linfático — quimiocinas de zona T","idioma":"catalan","enun":"L'organització estructural i funcional dels ganglis limfàtics","ops":{"a":"Es produeixen gràcies a la secreció de CCR7 a la zona paracortical","b":"Es produeixen gràcies a la secreció de CCR7 a la zona cortical","c":"Es produeixen gràcies a la secreció de CCR7 a la zona medul·lar","d":"Totes són veritat","e":"Totes són falses"},"cor":"a","razones":{"a":"CORRECTA (intención del profesor): las quimiocinas del eje CCR7 ({{CCL19 y CCL21}}) las secretan las células estromales e iDCs de la zona {{paracortical}} (zona T) del ganglio, y atraen a los linfocitos T que expresan el receptor CCR7 — eso organiza la zona T.","b":"Falsa: la zona {{cortical}} superficial (folículos) es territorio B, organizado por el eje {{CXCL13–CXCR5}}, no por CCL19/21–CCR7.","c":"Falsa: la {{médula}} del ganglio contiene cordones medulares con macrófagos y células plasmáticas — no es donde se secretan las quimiocinas de zona T.","d":"Falsa: solo puede ser cierta una localización.","e":"Falsa en la intención de la pregunta (la localización correcta es la paracortical), aunque estrictamente CCR7 es un receptor y no se secreta — ver nota."},"expl":"La compartimentación del ganglio depende de quimiocinas: CCL19/CCL21 (ligandos de CCR7) en la zona paracortical atraen linfocitos T; CXCL13 (ligando de CXCR5) en los folículos atrae linfocitos B.","nivel":"SALE_SEGURO","reina":"R15","clave":"razonada","conf":"MEDIA","diapo":"TEMA 2 (quimiocinas CCL19/CCL21–CCR7 en zona T; CXCL13–CXCR5 en zona B)","nota":"Errata conceptual del enunciado: CCR7 es un RECEPTOR y no se secreta — lo que se secreta en la paracortical son sus ligandos CCL19/CCL21. Se asume que el profesor testaba la ZONA (paracortical = T). Si se leyera literalmente, la respuesta sería e. Confianza MEDIA."},{"k":"B14B-12","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T2 · Anatomía del sistema inmune","sub":"MALT — placas de Peyer","idioma":"catalan","enun":"Les plaques de Peyer","ops":{"a":"Formen part dels ganglis mesentèrics","b":"Es troben a la submucosa de l'intestí","c":"Estan formades només per fol·licles primaris","d":"Estan formades només per cèl·lules T i iDCs","e":"Són ganglis limfàtics associats al tracte intestinal"},"cor":"b","razones":{"a":"Falsa: los ganglios mesentéricos son órganos encapsulados {{separados}} de la pared intestinal; las placas de Peyer están EN la propia pared del intestino ({{íleon}}).","b":"CORRECTA: son agregados linfoides del MALT (tejido linfoide asociado a mucosas) situados en la {{submucosa}}/lámina propia del intestino delgado, cubiertos por epitelio con {{células M}} que captan antígenos de la luz.","c":"Falsa: contienen folículos primarios Y {{secundarios}} (con centros germinales activos por la estimulación antigénica constante de la flora), predominantemente de linfocitos {{B}}.","d":"Falsa: son ricas en linfocitos {{B}} (folículos) además de zonas T interfoliculares y células dendríticas — no son solo T + iDCs.","e":"Falsa: NO son ganglios linfáticos — carecen de {{cápsula}} y de vasos linfáticos {{aferentes}}; el antígeno les llega por las células M desde la luz, no por linfa aferente."},"expl":"Las placas de Peyer son MALT no encapsulado de la submucosa del íleon: folículos B (primarios y secundarios) con células M captando antígeno luminal; no son ganglios (sin cápsula ni linfáticos aferentes).","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (MALT / placas de Peyer)","nota":null},{"k":"B14B-13","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T2 · Anatomía del sistema inmune","sub":"Órganos hematopoyéticos — hígado fetal, timo","idioma":"catalan","enun":"Quina d'aquestes afirmacions és correcta?","ops":{"a":"El timus és un òrgan hematopoètic productor de CLPs","b":"L'anatomia del timus recorda la de la melsa","c":"Les cTECs són d'origen hematopoètic","d":"Al fetus del fetge és un òrgan hematopoètic","e":"Totes són falses"},"cor":"d","razones":{"a":"Falsa: los CLP (progenitores linfoides comunes) se generan en la {{médula ósea}}; el timo no produce CLPs — RECIBE precursores y madura linfocitos {{T}}.","b":"Falsa: el timo es lobulado con {{córtex y médula}} por lóbulo; el bazo se organiza en pulpa {{roja y blanca}} alrededor de arteriolas — anatomías muy distintas.","c":"Falsa: las cTECs (células epiteliales tímicas corticales) son de origen {{epitelial}} (endodérmico), no hematopoyético; las de origen hematopoyético en el timo son DCs y macrófagos.","d":"CORRECTA: durante la vida fetal el {{hígado}} (y también el bazo) es el principal órgano {{hematopoyético}} antes de que la médula ósea tome el relevo.","e":"Falsa: d es verdadera."},"expl":"La hematopoyesis migra durante el desarrollo: saco vitelino → hígado (y bazo) fetal → médula ósea. El timo no es hematopoyético: solo madura los precursores T que le llegan; sus células epiteliales (cTEC/mTEC) no son hematopoyéticas.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (hematopoyesis y órganos linfoides primarios)","nota":"Errata de OCR en d: 'Al fetus del fetge' debería leerse 'Al fetus, el fetge...'."},{"k":"B14B-14","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T2 · Anatomía del sistema inmune","sub":"Órganos linfoides — características comunes","idioma":"catalan","enun":"Tots els òrgans limfoides:","ops":{"a":"Estan encapsulats i tenen zones diferents pels limfòcits T i pels B dins del mateix òrgan","b":"Tenen una funció eminentment hematopoètica","c":"Són responsables de l'orquestració de la resposta adaptativa","d":"Tenen còrtex i medul·la vermella, així com vasos limfàtics aferents i eferents","e":"Cap de les anteriors afirmacions és aplicable a tots els òrgans limfoides"},"cor":"e","razones":{"a":"Falsa como universal: el {{MALT}} (placas de Peyer, amígdalas mucosas) NO está encapsulado, y el timo no tiene zonas B/T.","b":"Falsa: solo la {{médula ósea}} (y el hígado fetal) es hematopoyética; ganglios, bazo y timo no fabrican células sanguíneas.","c":"Falsa como universal: la orquestación de la respuesta adaptativa corresponde a los {{secundarios}} (ganglios, bazo, MALT); los primarios (médula, timo) se dedican al {{desarrollo}}/maduración linfocitaria, no a montar respuestas.","d":"Falsa: la 'médula roja' es del {{bazo}} (pulpa roja) y el bazo justamente NO tiene vasos linfáticos {{aferentes}} (el antígeno le llega por sangre); el ganglio sí tiene aferentes y eferentes.","e":"CORRECTA: ninguna característica de las anteriores se aplica a TODOS los órganos linfoides — cada afirmación falla en al menos un órgano (MALT sin cápsula, bazo sin aferentes, primarios sin función de respuesta...)."},"expl":"Los órganos linfoides son heterogéneos: primarios (médula, timo) generan/maduran linfocitos; secundarios (ganglio, bazo, MALT) montan la respuesta; el bazo no tiene linfáticos aferentes y el MALT no tiene cápsula — no hay rasgo común a todos.","nivel":"PUEDE_SALIR","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (órganos linfoides primarios y secundarios)","nota":null},{"k":"B14B-15","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T2 · Anatomía del sistema inmune","sub":"Bazo — PALS; circulación linfocitaria","idioma":"catalan","enun":"Assenyala l'opció correcta:","ops":{"a":"CCL19 es produeix per les cèl·lules estromals de la zona B del Gangli limfàtic","b":"Els limfòcits surten del gangli limfàtic pels vasos limfàtics aferents","c":"Les zones PALS de la melsa contenen majoritàriament limfòcits T","d":"Les mTECs no expressen MHC de classe I","e":"Totes les afirmacions són correctes"},"cor":"c","razones":{"a":"Falsa: CCL19 (y CCL21) la producen las células estromales de la zona {{T}} (paracortical); la zona B produce {{CXCL13}}.","b":"Falsa: los linfocitos SALEN por los vasos linfáticos {{eferentes}} (del hilio); los {{aferentes}} son de entrada de linfa y antígenos.","c":"CORRECTA: las PALS (vainas linfoides {{periarteriolares}}) de la pulpa blanca del bazo son la zona {{T}} — mayoritariamente linfocitos T alrededor de la arteriola central; los folículos B están adyacentes.","d":"Falsa: las mTECs (células epiteliales tímicas medulares) expresan MHC de clase {{I y II}} — imprescindible para la selección {{negativa}} de timocitos (con AIRE expresando antígenos tisulares).","e":"Falsa: a, b y d son falsas."},"expl":"En el bazo, la pulpa blanca se organiza alrededor de la arteriola central: PALS = zona T; folículos = zona B. En el ganglio, la salida de linfocitos es por el linfático eferente.","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (bazo: PALS y pulpa blanca)","nota":"PALS repite en Abril 2017 q3 y Abril 2016 #12."},{"k":"B14B-16","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T5 · Inmunógenos y antígenos","sub":"Epítopo = determinante antigénico","idioma":"catalan","enun":"L'epitop","ops":{"a":"És més immunogènic que el determinant antigènic","b":"És sinònim d'immunogen","c":"Per generar resposta immunitària ha de ser continu","d":"Cal que sigui proteic per ser reconegut per un anticòs","e":"És sinònim de determinant antigènic"},"cor":"e","razones":{"a":"Falsa: no puede ser 'más inmunogénico que' el determinante antigénico porque son {{la misma cosa}} — la comparación no tiene sentido.","b":"Falsa: el inmunógeno es la molécula {{completa}} capaz de inducir respuesta inmune; el epítopo es solo la {{porción}} del antígeno que reconoce el anticuerpo o el TCR.","c":"Falsa: los anticuerpos también reconocen epítopos {{discontinuos}} (conformacionales), formados por residuos alejados en secuencia pero próximos en el plegamiento 3D.","d":"Falsa: los anticuerpos reconocen también {{polisacáridos}}, lípidos y ácidos nucleicos — no solo proteínas (la restricción proteica es del {{TCR}}/MHC).","e":"CORRECTA: epítopo y {{determinante antigénico}} son sinónimos — la región concreta del antígeno reconocida por el paratopo del anticuerpo o por el TCR."},"expl":"Epítopo = determinante antigénico: la porción mínima del antígeno reconocida por el receptor. Puede ser lineal (continuo) o conformacional (discontinuo), y para los anticuerpos no necesita ser proteico.","nivel":"SALE_SEGURO","reina":"R22","clave":"razonada","conf":"ALTA","diapo":"TEMA 5 (immunògens i antígens: epítops)","nota":"Repite en Biotec 2014-1º q23 y Abril 2016 #34."},{"k":"B14B-17","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T5 · Inmunógenos y antígenos","sub":"Antígenos T-dependientes y T-independientes","idioma":"catalan","enun":"Assenyala la resposta correcta","ops":{"a":"La unió d'un antigen a un anticòs depèn de la regió Fc de l'anticòs","b":"Tots els determinants antigènics són T-dependents","c":"Tots els antígens T-dependents són superantígens","d":"Les respostes T-independents són produïdes per antígens molt estables","e":"Cap resposta és correcta"},"cor":"d","razones":{"a":"Falsa: el antígeno se une por las regiones variables del fragmento {{Fab}} (paratopo/CDRs); la región {{Fc}} media las funciones efectoras (complemento, receptores Fc).","b":"Falsa: existen antígenos {{T-independientes}} (polisacáridos con epítopos repetitivos, LPS) que activan linfocitos B sin ayuda T.","c":"Falsa: los superantígenos son un grupo aparte que une de forma inespecífica {{MHC-II}} con la cadena Vβ del TCR fuera del surco — no son sinónimo de antígeno T-dependiente (que son los {{proteicos}} convencionales).","d":"CORRECTA: los antígenos T-independientes (polisacáridos poliméricos con epítopos repetitivos) son {{resistentes a la degradación}} — muy estables; por eso persisten retenidos en los macrófagos del seno subcapsular y dan respuestas prolongadas (lo dice literalmente la diapo).","e":"Falsa: d es correcta."},"expl":"Los antígenos T-independientes son polisacáridos poliméricos con epítopos repetitivos, resistentes a la degradación (muy estables), que activan B sin colaboración T; los T-dependientes son proteicos y requieren ayuda T.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 5, slide 14 (Tipus d'antígens: T-independents — 'Resistents a la degradació')","nota":null},{"k":"B14B-18","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T3 · Inmunidad innata","sub":"PRRs — qué es y qué no es un PRR","idioma":"catalan","enun":"Quines de les següents molècules no són PRRs?","ops":{"a":"Component secretor","b":"Pentraxina","c":"NLRs","d":"TLR3","e":"Proteïna C reactiva"},"cor":"a","razones":{"a":"CORRECTA (no es PRR): el componente secretor es un fragmento del {{receptor poli-Ig}} que queda unido a la {{IgA dimérica}} secretada y la protege de las proteasas en la mucosa — es transporte de inmunoglobulinas, no reconocimiento de patrones.","b":"Es PRR: las pentraxinas son PRRs {{solubles}} plasmáticos (la familia incluye la proteína C reactiva y la amiloide sérica P).","c":"Es PRR: los NLR (receptores tipo NOD) son PRRs {{citosólicos}} que detectan peptidoglicano y señales de daño (inflamasoma).","d":"Es PRR: TLR3 es un Toll-like receptor {{endosómico}} que reconoce RNA de doble cadena viral.","e":"Es PRR: la proteína C reactiva es una {{pentraxina}} que se une a fosforilcolina de superficies bacterianas y opsoniza/activa complemento."},"expl":"PRRs hay de membrana (TLRs), citosólicos (NLRs, RLRs) y solubles (pentraxinas como la PCR, colectinas). El componente secretor pertenece al transporte de IgA a mucosas, no es un receptor de patrones.","nivel":"SALE_SEGURO","reina":"R5","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (PRRs) / TEMA 8 (componente secretor)","nota":"Variante de la familia 'qué no es PRR' (Abril 2016 #36 usó properdina)."},{"k":"B14B-19","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T3 · Inmunidad innata","sub":"TLRs y sus ligandos","idioma":"catalan","enun":"Quin dels següents Toll-like receptors reconeix diacil-lipopèptids bacterians?","ops":{"a":"TLR4","b":"TLR8","c":"TLR7","d":"TLR6","e":"TLR9"},"cor":"d","razones":{"a":"Falsa: TLR4 reconoce el {{LPS}} (lipopolisacárido) de bacterias gramnegativas, con MD-2 y CD14.","b":"Falsa: TLR8 es endosómico y reconoce {{RNA de cadena sencilla}} viral (como TLR7).","c":"Falsa: TLR7 es
