 endosómico y reconoce {{ssRNA}} viral.","d":"CORRECTA: TLR6, formando heterodímero con {{TLR2}}, reconoce los {{diacil}}-lipopéptidos bacterianos (el heterodímero TLR2/{{TLR1}} reconoce los TRIacil-lipopéptidos).","e":"Falsa: TLR9 es endosómico y reconoce DNA con motivos {{CpG}} no metilados."},"expl":"Los lipopéptidos los reconoce TLR2 en heterodímero: TLR2/6 → diacil-lipopéptidos; TLR2/1 → triacil-lipopéptidos. Los TLR endosómicos (3, 7, 8, 9) reconocen ácidos nucleicos y TLR4 el LPS.","nivel":"SALE_SEGURO","reina":"R16","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (tabla de TLRs y ligandos)","nota":"TLRs repiten en Abril 2020 q3, Biotec 2014-1º q5 y Abril 2016 #3."},{"k":"B14B-20","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T3 · Inmunidad innata","sub":"Mediadores lipídicos — leucotrienos","idioma":"catalan","enun":"Quin dels següents tipus cel·lulars alliberen leucotriens?","ops":{"a":"Macròfags","b":"NKs","c":"Limfòcits B","d":"Eosinòfils","e":"Totes són correctes"},"cor":"d","razones":{"a":"Falsa (según las diapos): aunque en la literatura los macrófagos pueden producir LTB4, en las tablas del profesor los leucotrienos aparecen como mediadores de {{mastocitos/basófilos}} y {{eosinófilos}}, no del macrófago.","b":"Falsa: las células NK actúan por {{citotoxicidad}} (perforina/granzimas) e IFNγ — no liberan mediadores lipídicos como leucotrienos.","c":"Falsa: los linfocitos B producen {{anticuerpos}} y citocinas, no leucotrienos.","d":"CORRECTA: los eosinófilos (igual que mastocitos y basófilos) sintetizan al activarse mediadores lipídicos — {{leucotrienos C4, D4, E4}} — que producen {{broncoconstricción}} prolongada, secreción de moco y aumento de permeabilidad vascular.","e":"Falsa: NK y linfocitos B no liberan leucotrienos, así que 'todas' cae."},"expl":"Los leucotrienos (LTC4/D4/E4) son mediadores lipídicos derivados del ácido araquidónico, sintetizados tras la activación por mastocitos, basófilos y eosinófilos: broncoconstricción prolongada, moco y permeabilidad vascular.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"MEDIA","diapo":"TEMA 3 (tabla de gránulos/mediadores de eosinófilos — 'Mediadors lipídics: Leucotriens C4, D4, E4')","nota":"En Abbas los macrófagos también producen leucotrienos, pero en las tablas del profesor los leucotrienos figuran solo en mastocitos/basófilos y eosinófilos → se responde según la diapo. Confianza MEDIA."},{"k":"B14B-21","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T4 · Complemento","sub":"Complemento — tioéster, convertasas, C1INH","idioma":"catalan","enun":"Assenyala la resposta correcta:","ops":{"a":"MASP 1 i MASP2 generen la C5 convertasa de la via de les lectines","b":"C3a té activitat inhibidora de la via alternativa del complement","c":"Les diferents vies del complement comparteixen la mateixa C3 convertasa","d":"C1INH inhibeix totes les vies d'activació del complement","e":"C3 i C4 exposen un enllaç tioèster després de la seva escissió en les fraccions corresponents"},"cor":"e","razones":{"a":"Falsa: MASP-1 y MASP-2 (proteasas asociadas a MBL) cortan C4 y C2 generando la {{C3 convertasa}} de la vía de las lectinas (C4b2a) — la C5 convertasa se forma después añadiendo C3b.","b":"Falsa: C3a es una {{anafilotoxina}} (inflamación, degranulación de mastocitos) — no tiene actividad inhibidora de ninguna vía.","c":"Falsa: clásica y lectinas comparten la C3 convertasa {{C4b2a}}, pero la alternativa usa {{C3bBb}} — no es la misma para las tres.","d":"Falsa: el C1INH es el inhibidor de espectro MÁS {{estrecho}} — solo bloquea la vía {{clásica y la de las lectinas}} (disocia C1r2s2 e inhibe MASPs); no toca la alternativa.","e":"CORRECTA: al escindirse, C3b y C4b exponen un enlace {{tioéster}} interno reactivo que les permite unirse {{covalentemente}} a la superficie del microbio (o hidrolizarse en agua si no encuentran diana)."},"expl":"C3b y C4b se anclan covalentemente a las superficies gracias al enlace tioéster que exponen tras su escisión. C1INH solo inhibe clásica + lectinas (el de espectro más estrecho), y cada vía tiene su C3 convertasa (C4b2a vs C3bBb).","nivel":"SALE_SEGURO","reina":"R1","clave":"razonada","conf":"ALTA","diapo":"TEMA 4, slide 17 (tioéster en la vía alternativa; inhibidores)","nota":"El tioéster repite en Biotec 2014-1º q18; el distractor C1INH es la familia R1 (Abril 2016 #14, 2017 q25/q38, 2026 Q17)."},{"k":"B14B-22","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T5 · Inmunógenos y antígenos","sub":"Condiciones de inmunogenicidad","idioma":"catalan","enun":"Quina de les següents molècules té més possibilitats de ser inmunogènica?","ops":{"a":"Proteïna, alt pes molecular, desnaturalitzada, particulada","b":"Proteïna, alt pes molecular soluble, nativa","c":"Polisacàrid, alt pes molecular, soluble, natiu","d":"Polisacàrid, baix pes molecular, soluble, desnaturalitzant","e":"Lípid, baix pes molecular, particulat, desnaturalitzat"},"cor":"a","razones":{"a":"CORRECTA: reúne los cuatro factores pro-inmunogénicos — naturaleza {{proteica}} (la más inmunogénica), {{alto peso molecular}}, forma {{particulada}} (mejor fagocitada por APCs que la soluble) y {{desnaturalizada}}/agregada (más procesable y captable que la nativa soluble).","b":"Falsa: proteína y alto peso ayudan, pero {{soluble}} y nativa la hacen menos captable por las APCs que la forma particulada — segundo puesto.","c":"Falsa: los {{polisacáridos}} son menos inmunogénicos que las proteínas (respuestas T-independientes, sin memoria robusta).","d":"Falsa: polisacárido + {{bajo peso molecular}} + soluble = combinación pobre en inmunogenicidad.","e":"Falsa: los {{lípidos}} son los peores inmunógenos (apenas inmunogénicos por sí solos), y además de bajo peso molecular."},"expl":"Jerarquía de inmunogenicidad: proteínas > polisacáridos > lípidos/ácidos nucleicos; y a igualdad, mayor tamaño, forma particulada/agregada y complejidad aumentan la inmunogenicidad frente a lo pequeño, soluble y nativo.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 5 (factores que determinan la inmunogenicidad)","nota":"Misma lógica que Abril 2020 q16 (allí la más inmunogénica era la proteína desnaturalizada y particulada a dosis repetidas intradérmicas) y Biotec 2014-1º q21."},{"k":"B14B-23","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T8 · Igs, BCR y TCR","sub":"Cambio de isotipo (switch)","idioma":"catalan","enun":"En relació al canvi d'isotip de les immunoglobulines, quina de les següents afirmacions és falsa?","ops":{"a":"Permet adequar la capacitat efectora dels anticossos a cada situació","b":"És conseqüència de un nou procés de recombinació gènica amb la participació dels productes dels gens RAG-1 i RAG-2","c":"Activació del limfòcit B amb participació de limfòcits T. Depèn de les citocines presents al medi","d":"Durant la resposta immunitària el primer isotip sempre és IgM.","e":"L'isotip present en un sèrum ens permet conèixer si una resposta és recent o no."},"cor":"b","razones":{"a":"Verdadera (no es la falsa): el switch cambia solo la región {{constante}} de la cadena pesada → misma especificidad con nueva función {{efectora}} (complemento, placenta, mucosas...).","b":"CORRECTA (es la falsa): el switch NO usa RAG-1/RAG-2 (eso es la recombinación {{V(D)J}} en médula/timo) — usa la enzima {{AID}} (desaminasa de citidina inducida por activación) sobre las regiones switch en el centro germinal.","c":"Verdadera: el switch requiere colaboración {{T}} (CD40L–CD40) y el isotipo resultante lo dictan las {{citocinas}} del medio (IL-4→IgE, TGF-β→IgA, IFNγ→subclases IgG).","d":"Verdadera: el primer isotipo de toda respuesta primaria es siempre {{IgM}} (el locus μ es el primero en la línea).","e":"Verdadera: predominio de {{IgM}} indica respuesta reciente/primaria; predominio de IgG indica respuesta más tardía o secundaria — base de la serología."},"expl":"El cambio de isotipo depende de AID (no de RAG-1/2), ocurre en el centro germinal con ayuda T (CD40-CD40L) y dirigido por citocinas; conserva la especificidad cambiando solo la función efectora.","nivel":"SALE_SEGURO","reina":"R6","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (canvi d'isotip / AID)","nota":null},{"k":"B14B-24","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T8 · Igs, BCR y TCR","sub":"Isotipos que fijan complemento","idioma":"catalan","enun":"Quines de les següents immunoglobulines no fixen el complement?","ops":{"a":"IgG1 λ1","b":"IgM λ2","c":"IgD λ1","d":"IgG3 λ1","e":"IgM λ3"},"cor":"c","razones":{"a":"Fija: la {{IgG1}} es una de las subclases IgG que activa bien la vía clásica (además cruza placenta y hace ADCC).","b":"Fija: la {{IgM}} es el activador más potente de la vía clásica (su forma pentamérica une C1q con una sola molécula).","c":"CORRECTA (no fija): la {{IgD}} no activa el complemento — como tampoco lo hacen {{IgE}}, IgA (vía clásica) e IgG4. El tipo de cadena ligera (λ) es irrelevante: el complemento se fija por la región {{Fc}} de la cadena pesada.","d":"Fija: la {{IgG3}} es la subclase IgG que mejor activa el complemento.","e":"Fija: es IgM otra vez — el subtipo de lambda no cambia nada."},"expl":"Activan la vía clásica: IgM (la mejor), IgG3, IgG1 (y débilmente IgG2). No fijan complemento: IgD, IgE, IgA e IgG4. La cadena ligera (κ/λ) no interviene — la fijación depende del Fc pesado.","nivel":"SALE_SEGURO","reina":"R4","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (propiedades efectoras de los isotipos)","nota":null},{"k":"B14B-25","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T8 · Igs, BCR y TCR","sub":"Fragmentación proteolítica de anticuerpos — pepsina vs papaína","idioma":"catalan","enun":"Esteu introduint un anticòs que reconeix un antigen hepàtic, però no voleu que una vegada administrat a l'individu, l'anticòs activi el complement. Per això heu decidit produir fragments F(ab') d'aquest anticòs. Quin dels següents enzims proteolítics utilitzareu?","ops":{"a":"Papaïna","b":"Pepsina","c":"Lisozim","d":"MASP-1","e":"Elastasa"},"cor":"b","razones":{"a":"Falsa: la papaína corta POR ENCIMA de la bisagra y genera {{2 Fab + 1 Fc}} — los fragmentos son Fab (no F(ab')), y además libera un Fc entero.","b":"CORRECTA: la {{pepsina}} corta por debajo de la {{bisagra}} y genera un fragmento {{F(ab')2}} bivalente mientras degrada el Fc en péptidos — sin Fc no hay unión de C1q ni activación del complemento: justo lo que se pide.","c":"Falsa: el lisozima no es una proteasa de anticuerpos — hidroliza el {{peptidoglicano}} de la pared bacteriana.","d":"Falsa: MASP-1 es la serina-proteasa de la vía de las {{lectinas}} del complemento — no se usa para fragmentar anticuerpos.","e":"Falsa: la elastasa es una proteasa de los gránulos del {{neutrófilo}} (degrada elastina/tejido), no la herramienta clásica de fragmentación de Ig."},"expl":"Papaína → 2 Fab + Fc (corte sobre la bisagra); pepsina → F(ab')2 + Fc degradado (corte bajo la bisagra). Para conservar la unión al antígeno eliminando las funciones del Fc (complemento, receptores Fc), se usa pepsina.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (fragmentos proteolíticos de las Ig)","nota":null},{"k":"B14B-26","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T8 · Igs, BCR y TCR","sub":"Componente secretor e IgA","idioma":"catalan","enun":"Assenyala la resposta correcta","ops":{"a":"Les IgDs tenen 4 dominis CH","b":"El complement secretor facilita la secreció de IgAs per les mucoses","c":"MPO participa a la recombinació VDJ","d":"La regla de recombinació gènicial 12/23 afecta a la hipermutació somàtica","e":"Només les IgEs poden dimeritzar"},"cor":"b","razones":{"a":"Falsa: la IgD tiene {{3}} dominios CH (como IgG e IgA); los isotipos con {{4}} dominios CH son IgM e IgE.","b":"CORRECTA: el {{componente secretor}} (fragmento del receptor {{poli-Ig}} del enterocito) media la transcitosis de la IgA dimérica hacia la luz mucosa y la protege de las proteasas — facilita la secreción de IgA por las mucosas.","c":"Falsa: la MPO ({{mieloperoxidasa}}) es la enzima del estallido oxidativo del neutrófilo (genera HOCl) — nada que ver con V(D)J; la recombinación usa {{RAG1/RAG2}}, Artemis, TdT.","d":"Falsa: la regla {{12/23}} (espaciadores de las RSS) gobierna qué segmentos pueden unirse en la recombinación {{V(D)J}}, no la hipermutación somática (que depende de AID).","e":"Falsa: la que dimeriza es la {{IgA}} (dímero con cadena J en secreciones); la IgE es monomérica."},"expl":"La IgA dimérica (cadena J) se transporta a través del epitelio mucoso por el receptor poli-Ig; su fragmento extracelular queda como componente secretor unido a la IgA secretada, estabilizándola.","nivel":"SALE_SEGURO","reina":"R5","clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (IgA secretora, receptor poli-Ig)","nota":"Errata de la fuente en b: 'complement secretor' debe leerse 'component secretor'. Concepto reciclado en Abril 2017 q11-12, Abril 2020 q12 y 2026 Q9."},{"k":"B14B-27","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T8 · Igs, BCR y TCR","sub":"Estructura de las inmunoglobulinas — CDRs","idioma":"catalan","enun":"Sobre les immunoglobulines, quina de les següents afirmacions és veritat?","ops":{"a":"Tant la funció efectora com la de reconeixement antigènic de les immunoglobulines es troba al fragment Fab.","b":"El component secretor i la cadena J formen part de l'estructura pentamèrica de IgM.","c":"A través de les regions determinants de la complementarietat és reconeix l'antigen.","d":"Les IgG són les úniques immunoglobulines que poden fixar el complement.","e":"La IgD és la immunoglobulina implicada a les respostes al·lèrgiques."},"cor":"c","razones":{"a":"Falsa: el reconocimiento antigénico está en el Fab, pero la función efectora reside en el fragmento {{Fc}} (fijación de complemento, unión a receptores Fc, placenta).","b":"Falsa: la IgM pentamérica lleva {{cadena J}}, pero el {{componente secretor}} es de la IgA secretora (y de la IgM transportada a mucosas) — no forma parte de la estructura pentamérica sérica de la IgM.","c":"CORRECTA: el antígeno se reconoce a través de las {{CDR}} (regiones determinantes de complementariedad) — los tres bucles hipervariables de VH y VL que forman el {{paratopo}}.","d":"Falsa: también fija complemento la {{IgM}} (de hecho es el activador más potente de la vía clásica).","e":"Falsa: la Ig de la alergia es la {{IgE}} (unida a FcεRI de mastocitos/basófilos); la IgD es receptor de membrana del B naïve."},"expl":"Las CDR1-3 de las regiones variables (pesada + ligera) forman el paratopo que contacta con el epítopo; el Fc concentra las funciones efectoras. IgM también fija complemento e IgE es la de la alergia.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (estructura de las Ig, regiones hipervariables)","nota":null},{"k":"B14B-28","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T8 · Igs, BCR y TCR","sub":"TCR — estructura y diferencias con las Ig","idioma":"catalan","enun":"Sobre el receptor d'antigen del limfòcit T (TCR), quina de les següents afirmacions és falsa?","ops":{"a":"Està format per un heterodímer d'una cadena β (o δ) i una α (o γ).","b":"Està ancorat a la membrana citoplasmàtica del limfòcit T.","c":"L'estructura i expressió gènica del TCR és anàloga a la de les immunoglobulines.","d":"La forma secretada del TCR és l'efectora de la resposta immunitària adaptativa.","e":"No tenen lloc mutacions somàtiques en TCR"},"cor":"d","razones":{"a":"Verdadera (no es la falsa): el TCR es un heterodímero {{αβ}} (mayoritario) o {{γδ}} (minoritario).","b":"Verdadera: el TCR es siempre una proteína {{de membrana}}, asociada al complejo CD3 para señalizar.","c":"Verdadera: sus dominios son de la superfamilia de las {{Ig}} y sus genes se ensamblan por recombinación {{V(D)J}} igual que los de las inmunoglobulinas.","d":"CORRECTA (es la falsa): el TCR {{NO tiene forma secretada}} — a diferencia del BCR, que sí se secreta como {{anticuerpo}}; el T efector actúa por contacto y citocinas, nunca secretando su receptor.","e":"Verdadera: el TCR NO sufre {{hipermutación somática}} ni maduración por afinidad — esas son exclusivas del BCR en el centro germinal."},"expl":"Diferencias clave TCR vs BCR: el TCR nunca se secreta, no hace hipermutación somática ni cambio de clase, y solo reconoce péptido+MHC; comparte con las Ig la estructura de dominios y la recombinación V(D)J.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (TCR)","nota":null},{"k":"B14B-29","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T9 · Ontogenia linfocitos B y T","sub":"Recombinación somática — definición y localización","idioma":"catalan","enun":"La recombinació somàtica","ops":{"a":"Consisteix en la generació de diversitat de receptors antigènics mitjançant la combinació de fragments gènics de forma combinatorial en limfòcits B i T","b":"Només és pot produir un cop per cromosoma cada precursor de limfòcit","c":"Només es dóna als òrgans limfoides secundaris, concretament, al centre germinal","d":"A i B són correctes","e":"Totes són correctes"},"cor":"a","razones":{"a":"CORRECTA: la recombinación somática {{V(D)J}} genera la diversidad de BCR y TCR combinando segmentos {{V, D y J}} de forma combinatoria en precursores de linfocitos B Y T.","b":"Falsa: hay {{varias oportunidades}} de reordenamiento — si el primer intento es improductivo se puede reordenar el segundo alelo, y en cadenas ligeras probar {{kappa y después lambda}} (además de la edición del receptor).","c":"Falsa: ocurre en los órganos linfoides {{PRIMARIOS}} (médula ósea para B, timo para T); lo que ocurre en el centro germinal es la {{hipermutación somática}} y el switch — proceso distinto.","d":"Falsa: b es falsa, así que 'A y B' cae.","e":"Falsa: b y c son falsas."},"expl":"No confundir: recombinación somática V(D)J = órganos primarios, genera el repertorio; hipermutación somática = centro germinal, afina la afinidad. Y el reordenamiento tiene múltiples oportunidades (2 alelos, κ→λ).","nivel":"SALE_SEGURO","reina":"R6","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (recombinación V(D)J y oportunidades de reordenamiento)","nota":null},{"k":"B14B-30","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T8 · Igs, BCR y TCR","sub":"Electroforesis del suero — fracción gamma","idioma":"catalan","enun":"En quina fracció proteica del sèrum es troben els anticossos?","ops":{"a":"Albúmina","b":"α1-globulina","c":"α2-globulina","d":"β-globulina","e":"γ-globulina"},"cor":"e","razones":{"a":"Falsa: la albúmina es la proteína {{transportadora}} mayoritaria del plasma — no contiene anticuerpos.","b":"Falsa: en α1 migran proteínas como la {{α1-antitripsina}} — no las Ig.","c":"Falsa: en α2 migran {{haptoglobina}}, ceruloplasmina, α2-macroglobulina.","d":"Falsa: en β migran {{transferrina}} y componentes del complemento (C3) — solo algo de IgA/IgM puede solaparse, pero no es la fracción de los anticuerpos.","e":"CORRECTA: los anticuerpos migran en la fracción {{gamma}} de la electroforesis — de ahí el nombre histórico '{{gammaglobulinas}}' (experimento clásico de Tiselius y Kabat: inmunizar hace crecer el pico gamma)."},"expl":"En la electroforesis de proteínas séricas los anticuerpos migran en la fracción gamma (gammaglobulinas); una respuesta de anticuerpos intensa eleva ese pico.","nivel":"HAY_QUE_SABERLO","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 8 (naturaleza de los anticuerpos — gammaglobulinas)","nota":null},{"k":"B14B-31","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T9 · Ontogenia linfocitos B y T","sub":"Recombinación somática — TdT y nucleótidos N","idioma":"catalan","enun":"A la recombinació somàtica","ops":{"a":"La seqüència de recombinació de fragments gènics a la cadena lleugera de les IgGs és D-J, i després V-DJ.","b":"La generació de nucleòtids N es deu a l'activitat de l'enzim TdT","c":"L'exclusió al·lèlica es produeix per la inducció de l'expressió de RAG1","d":"Es produeix la maduració per afinitat dels limfòcits B i T","e":"Totes són veritat"},"cor":"b","razones":{"a":"Falsa: las cadenas {{ligeras}} NO tienen segmentos {{D}} — solo V y J; el orden D-J → V-DJ es de la cadena {{pesada}}.","b":"CORRECTA: la {{TdT}} (desoxinucleotidil-transferasa terminal) es una polimerasa {{sin molde}} que añade nucleótidos {{N}} aleatorios en las uniones, aumentando la diversidad juncional.","c":"Falsa: la exclusión alélica se logra {{suprimiendo}} la expresión de RAG (y remodelando cromatina) cuando ya hay un reordenamiento productivo — no induciéndola.","d":"Falsa doblemente: la maduración por afinidad no ocurre en la recombinación somática (es del {{centro germinal}}) y además solo afecta a los linfocitos {{B}} — los T no maduran por afinidad.","e":"Falsa: a, c y d son falsas."},"expl":"TdT añade nucleótidos N sin molde en las uniones V(D)J (diversidad juncional). Las cadenas ligeras carecen de segmentos D, y la exclusión alélica apaga RAG tras el reordenamiento productivo.","nivel":"SALE_SEGURO","reina":"R6","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (maquinaria V(D)J: TdT, exclusión alélica)","nota":"TdT/nucleótidos N repite en Abril 2017 q9 y Abril 2020 q25."},{"k":"B14B-32","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T9 · Ontogenia linfocitos B y T","sub":"Ontogenia B/T — pre-B, γδ, doble receptor","idioma":"catalan","enun":"Triar la frase correcta","ops":{"a":"En els adults els limfòcits T γδ són tan abundants com els αβ.","b":"Diem que un precursor és pre-B quan expressa a la seva superfície les cadenes pesades i lleugeres definitives del BCR","c":"La selecció positiva dels precursors de limfòcits B es produeix als centres germinals","d":"No hi ha cap limfòcit que co-expressi dos receptors d'antigen diferents","e":"B i D són correctes"},"cor":"d","razones":{"a":"Falsa: los T {{γδ}} son minoritarios en sangre adulta (≈{{5%}} o menos); los αβ son la inmensa mayoría.","b":"Falsa: el pre-B expresa la cadena pesada μ con la cadena ligera {{sustituta}} (VpreB + λ5) formando el {{pre-BCR}}; cuando ya lleva pesada + ligera definitivas es un B {{inmaduro}} (IgM de membrana).","c":"Falsa: la selección de los precursores B ocurre en la {{médula ósea}}; el centro germinal es escenario de la maduración por afinidad de B ya maduros y activados.","d":"CORRECTA (intención del profesor): por la {{exclusión alélica}} (e isotípica) cada linfocito expresa un único receptor de especificidad única — principio de 'un linfocito, un receptor'.","e":"Falsa: b es falsa, así que la combinación cae."},"expl":"La exclusión alélica garantiza un solo receptor funcional por linfocito (base de la especificidad clonal). El estadio pre-B se define por el pre-BCR (cadena pesada + cadena ligera sustituta), no por el BCR definitivo.","nivel":"PUEDE_SALIR","reina":"R8","clave":"razonada","conf":"MEDIA","diapo":"TEMA 9 (pre-BCR, exclusión alélica)","nota":"Respuesta por descarte (a, b, c claramente falsas). Matiz de literatura: existen excepciones reales al 'un linfocito, un receptor' (linfocitos T con dos cadenas α, B duales κ/λ), pero a nivel de curso se asume la exclusión alélica estricta. Confianza MEDIA."},{"k":"B14B-33","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T9 · Ontogenia linfocitos B y T","sub":"Selección negativa tímica — quién la ejecuta","idioma":"catalan","enun":"La selecció negativa al timus","ops":{"a":"Es produeix gràcies a les mTECS, cTECs, macròfags i DCs","b":"Depèn de l'expressió de CCL21 i CCL19","c":"Es produeix durant una infecció","d":"Passa per l'acció de les cTECs sobre timòcits CD4-CD8-","e":"Actua sobre timòcits DC4+CD8+"},"cor":"a","razones":{"a":"CORRECTA (según el criterio del profesor): la selección negativa la ejecutan las células que presentan autoantígenos con MHC — {{mTECs}} (con {{AIRE}}), células dendríticas, macrófagos y también cTECs; las que NO participan son las {{FDCs}} (células dendríticas foliculares).","b":"Falsa: CCL19/CCL21 son quimiocinas de {{migración}} (eje CCR7, entrada y posicionamiento en zona T/médula tímica) — no son el mecanismo de la selección negativa, que es el reconocimiento de {{autoantígenos}} con alta avidez.","c":"Falsa: la selección tímica es un proceso {{constitutivo}} del desarrollo T — ocurre siempre, no depende de que haya infección.","d":"Falsa: los timocitos {{DN}} (CD4-CD8-) están en fase de reordenamiento del TCR — aún no pueden ser seleccionados por reconocimiento; y la acción clásica de las cTECs sobre {{DP}} es la selección positiva.","e":"Incompleta/no elegida: la selección negativa sí actúa sobre timocitos {{DP}} (CD4+CD8+) y también sobre SP en la médula, pero la opción a es la que recoge el dato que el profesor marca en sus claves (los tipos celulares que la ejecutan)."},"expl":"La selección negativa elimina timocitos autorreactivos de alta avidez y la ejecutan células presentadoras de autoantígenos del timo: mTECs (AIRE), DCs, macrófagos y cTECs. Las FDCs no participan. Afecta a timocitos DP y SP.","nivel":"SALE_SEGURO","reina":"R9","clave":"razonada","conf":"MEDIA","diapo":"TEMA 9 (selección tímica)","nota":"Sin clave. Se elige a apoyándose en la clave anotada de Abril 2016 #11 ('això ho fa les cTEC i les mTEC' — el profesor incluye las cTECs entre las ejecutoras). La e (actúa sobre DP, con errata 'DC4+') también es defendible — en Abbas la selección negativa afecta a DP y SP. Confianza MEDIA. Repite en Abril 2017 q29 y Abril 2016 #11."},{"k":"B14B-34","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T9 · Ontogenia linfocitos B y T","sub":"Selección negativa — FDCs no participan; pre-TCR","idioma":"catalan","enun":"Assenyala la resposta incorrecta","ops":{"a":"Timòcits pro-T i pre-T poden distingir-se entre ells per l'expressió en superfície del pre-TCR en els pre-T","b":"La cadena preTα té una acció positiva sobre la reordenació de la cadena α","c":"Les cadenes α i β del TCR només té una funció estructural de reconeixement","d":"Les FDCs no participen a la selecció negativa tímica","e":"mTECs i FDCs participen a la selecció negativa tímica"},"cor":"e","razones":{"a":"Verdadera (no es la incorrecta): el {{pre-TCR}} (cadena β + {{pTα}}) marca el paso a pre-T; el pro-T aún no lo expresa.","b":"Verdadera: la señal del pre-TCR (β-selección) detiene el reordenamiento de β (exclusión alélica) e {{induce}} el reordenamiento de la cadena {{α}} — acción positiva sobre α.","c":"Verdadera para el profesor: las cadenas α y β solo {{reconocen}} (función estructural/de reconocimiento) — la señalización la aporta el complejo {{CD3}} con sus ITAMs.","d":"Verdadera: las {{FDCs}} (células dendríticas foliculares) viven en los folículos B de los órganos secundarios y retienen inmunocomplejos — NO están en el timo ni participan en la selección negativa.","e":"CORRECTA (es la incorrecta): las mTECs sí participan, pero las {{FDCs NO}} participan en la selección negativa tímica — contradice directamente a la d, que es la verdadera."},"expl":"Las FDCs no son células tímicas: presentan antígeno nativo a linfocitos B en los folículos/centros germinales. La selección negativa tímica corre a cargo de mTECs, DCs, macrófagos (y cTECs según el profesor).","nivel":"SALE_SEGURO","reina":"R9","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (pre-TCR y selección tímica)","nota":"El par d/e es autodelator (se contradicen: una debe ser la incorrecta). Coincide con la clave 2016 #11: 'FDC no participen en la selecció negativa del timus'."},{"k":"B14B-35","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T6 · APCs (presentadoras)","sub":"APCs profesionales","idioma":"catalan","enun":"assenyala la resposta correcta:","ops":{"a":"totes les APCs professionals deriven del llinatge limfoide.","b":"No hi ha cap APC que expressi de forma constitutiva HCA","c":"Els macròfags interactuen amb limfòcits T CD4+ verges induint la seva activació.","d":"Els leucòcits són APCs professionals","e":"Cap de les anteriors és veritat."},"cor":"e","razones":{"a":"Falsa: células dendríticas y macrófagos derivan del linaje {{mieloide}}; solo los linfocitos B (APC profesional) son linfoides — no todas son linfoides.","b":"Falsa: las células dendríticas y los linfocitos B expresan {{MHC de clase II}} de forma {{constitutiva}} (los macrófagos lo inducen con la activación).","c":"Falsa: la activación de linfocitos T CD4+ {{vírgenes}} (naïve) es tarea casi exclusiva de la {{célula dendrítica}} madura en el ganglio; los macrófagos presentan sobre todo a T ya {{efectores}}/memoria en el tejido.","d":"Falsa: no TODOS los leucocitos son APCs profesionales — los neutrófilos, eosinófilos o NK no lo son; las APCs profesionales son solo {{DCs, macrófagos y linfocitos B}}.","e":"CORRECTA: las cuatro afirmaciones anteriores son falsas."},"expl":"APCs profesionales = células dendríticas, macrófagos y linfocitos B. Solo la DC madura activa eficazmente T naïve; DCs y B expresan MHC-II constitutivamente.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 6 (APCs professionals)","nota":"Errata de OCR en b: 'HCA' es casi seguro 'MHC' (de clase II). La opción b sigue siendo falsa con esa lectura."},{"k":"B14B-36","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T6 · APCs (presentadoras)","sub":"Monocitos, macrófagos y presentación cruzada","idioma":"catalan","enun":"Assenyala la resposta falsa","ops":{"a":"Els monòcits poden diferenciar-se a DCs o bé macròfags en funció de les citocines presents","b":"Els macròfags connecten la immunitat innata i adaptativa propiciant respostes antibacterianes","c":"Les iDCs no poden presentar antígens de forma creuada","d":"Els macròfags participen en processos de remodel·lació tissular i fagocitosi","e":"Els timòcits SP CD4+ i CD8+ es diferencien al timus en limfòcits T madurs"},"cor":"c","razones":{"a":"Verdadera (no es la falsa): el monocito se diferencia a macrófago (M-CSF) o a DC ({{GM-CSF + IL-4}}) según las citocinas del entorno.","b":"Verdadera: el macrófago fagocita (innata), presenta antígeno vía MHC-II y responde al {{IFNγ}} del Th1 con más capacidad bactericida — puente innata-adaptativa.","c":"CORRECTA (es la falsa): las células dendríticas SÍ pueden hacer {{presentación cruzada}} — cargar antígenos {{exógenos}} captados (también por las iDCs en el tejido) sobre MHC de clase {{I}} para activar T CD8+; decir que no pueden es falso.","d":"Verdadera: los macrófagos limpian células muertas, remodelan {{tejido}} (reparación, fibrosis) y fagocitan patógenos.","e":"Verdadera: los timocitos {{SP}} (simple positivos) CD4+ o CD8+ completan su maduración en el timo antes de exportarse como T maduros naïve."},"expl":"La presentación cruzada (antígeno exógeno → MHC-I → activación de CD8) es una capacidad característica de las células dendríticas; la iDC capta el antígeno en el tejido y, madurada, lo cross-presenta en el ganglio.","nivel":"PUEDE_SALIR","reina":"R18","clave":"razonada","conf":"ALTA","diapo":"TEMA 6 (DCs i presentació creuada)","nota":"Respuesta sólida por descarte: a, b, d y e son inequívocamente verdaderas, luego la falsa solo puede ser c."},{"k":"B14B-37","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T11 · Moléculas de adhesión","sub":"Moléculas de adhesión — selectinas","idioma":"catalan","enun":"Les selectines","ops":{"a":"Són lligands de les integrines","b":"Són lipoproteïnes amb dominis SH2","c":"Són PRRs","d":"Són responsables de la interacció forta entre limfòcits i endoteli i de la seva extravasació","e":"Són lectines de tipus C que reconeixen aderssines"},"cor":"e","razones":{"a":"Falsa: los ligandos de las integrinas son las moléculas de la superfamilia de las Ig ({{ICAM-1, VCAM-1}}) — las selectinas van por otro sistema (carbohidratos).","b":"Falsa: son {{glicoproteínas}} transmembrana con dominio lectina extracelular; los dominios {{SH2}} son módulos de señalización intracelular (unen fosfotirosinas) — nada que ver.","c":"Falsa: no reconocen patrones microbianos — reconocen {{carbohidratos propios}} del endotelio/leucocito; no son receptores de reconocimiento de patrones.","d":"Falsa: las selectinas median la unión {{débil}} y el {{rodamiento}} (rolling); la adhesión FUERTE y la extravasación dependen de las {{integrinas}} activadas por quimiocinas.","e":"CORRECTA: son lectinas de tipo {{C}} (dependientes de calcio) que reconocen carbohidratos sialilados de las {{adresinas}} (p. ej. sialil-Lewis-X, GlyCAM-1/CD34 para la L-selectina)."},"expl":"Cascada de extravasación: selectinas (lectinas C ↔ adresinas glucídicas) = rodamiento débil → quimiocinas activan integrinas → adhesión firme (integrina ↔ ICAM/VCAM) → diapédesis.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 11 (selectines, integrines, adressines)","nota":"Errata de OCR en e: 'aderssines' = 'adressines'. Selectinas repiten en Abril 2017 q16 y Abril 2016 #32 — la pregunta única anual de T11 sale casi siempre de esta tabla."},{"k":"B14B-38","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T6 · APCs (presentadoras)","sub":"Presentación y citotoxicidad — CD8/NK","idioma":"catalan","enun":"Assenyala la resposta correcta:","ops":{"a":"Els determinants antigènics de bactèries intracel·lulars es carreguen a l'MHC de classe II a l'interior del Reticle Endoplasmàtic","b":"Les DCs madures no tenen capacitat d'activar limfòcits T naïve","c":"Els limfòcits B mai poden activar limfòcits T verges","d":"Limfòcits T CD8+ i cèl·lules NK tenen una alta activitat citolítica","e":"Cap de les anteriors és correcta"},"cor":"d","razones":{"a":"Falsa por partida doble: en el retículo endoplasmático el MHC-II tiene el surco bloqueado por la cadena {{invariante}} (Ii) — la carga de péptidos exógenos/vesiculares ocurre en el {{compartimento endosomal-lisosomal}} (MIIC), no en el RE.","b":"Falsa: es exactamente al revés — la DC {{madura}} es LA activadora por excelencia de los T {{naïve}} (MHC alto + coestimulación B7 + CCR7 para llegar al ganglio).","c":"Falsa: los linfocitos B son APCs profesionales y pueden presentar y activar T CD4+ ('mai'/'nunca' lo hace falso; son especialmente relevantes con antígeno {{específico}} captado por su BCR).","d":"CORRECTA: los T {{CD8+}} citotóxicos y las células {{NK}} comparten la maquinaria citolítica — gránulos de {{perforina y granzimas}} + vía Fas-FasL → apoptosis de la célula diana.","e":"Falsa: d es correcta."},"expl":"CTL (CD8+) y NK son las dos grandes células citolíticas: matan por exocitosis de gránulos (perforina/granzimas) y Fas-FasL; difieren en el reconocimiento (TCR-MHC-I específico vs receptores activadores/inhibidores innatos).","nivel":"SALE_SEGURO","reina":"R18","clave":"razonada","conf":"ALTA","diapo":"TEMA 6 / TEMA 7 (presentación; citotoxicidad)","nota":null},{"k":"B14B-39","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T7 · MHC y presentación","sub":"Vía exógena de presentación (MHC-II)","idioma":"catalan","enun":"Quina de les següents molècules no pertany a la via exògena de presentació de l'antigen:","ops":{"a":"HLA-DP","b":"CLIP","c":"li","d":"Erp57","e":"Catepsina S"},"cor":"d","razones":{"a":"Pertenece: HLA-DP es una de las moléculas clásicas de {{MHC de clase II}} (DP, DQ, DR) — presentadoras de la vía exógena.","b":"Pertenece: {{CLIP}} es el fragmento de la cadena invariante que queda ocupando el surco del MHC-II hasta que {{HLA-DM}} cataliza su intercambio por el péptido.","c":"Pertenece: la cadena invariante {{Ii}} bloquea el surco del MHC-II en el RE y lo dirige al compartimento endosomal (la 'li' del enunciado es Ii).","d":"CORRECTA (no pertenece): {{ERp57}} es la tiol-oxidorreductasa del complejo de carga del {{MHC de clase I}} (con tapasina, TAP y calreticulina) — vía ENDÓGENA, no exógena.","e":"Pertenece: la {{catepsina S}} (con la L) degrada la cadena invariante en el compartimento lisosomal dejando el CLIP — proteasa de la vía exógena."},"expl":"Vía exógena (MHC-II): Ii → catepsinas S/L → CLIP → HLA-DM intercambia por péptido. Vía endógena (MHC-I): proteasoma → TAP → complejo de carga con tapasina, calreticulina y ERp57. ERp57 es el intruso aquí.","nivel":"SALE_SEGURO","reina":"R2","clave":"razonada","conf":"ALTA","diapo":"TEMA 7 (vía exógena y complejo de carga MHC-I)","nota":"Errata de OCR en c: 'li' = 'Ii' (cadena invariante). Concepto individual más repetido del 1P: Abril 2020 q28, Abril 2016 #16, Abril 2017 q4/q7/q8."},{"k":"B14B-40","examen":"📜 Biotec 2014 · 2º ex.","real":0,"origen":"BIOTEC-2014-2","tema":"T10 · Citocinas y quimiocinas","sub":"TNFα e IL-1 — citocinas proinflamatorias","idioma":"catalan","enun":"Quina d'aquestes afirmacions s'aplica al TNFα i IL-1?","ops":{"a":"Participen a l'activació de l'endoteli i estimulen l'activitat bactericida de macròfags","b":"Tenen una marcada acció eritropoiètica","c":"Totes dues tenen receptors de la família del receptor TNF","d":"Són característics de la resposta Th2.","e":"Totes són falses"},"cor":"a","razones":{"a":"CORRECTA: TNFα e IL-1 son las citocinas proinflamatorias que {{activan el endotelio}} (inducen selectinas E/P, ICAM/VCAM y quimiocinas para reclutar leucocitos) y potencian la actividad {{bactericida}}/inflamatoria de los fagocitos; también causan fiebre y fase aguda.","b":"Falsa: la acción eritropoyética es de la {{EPO}} (eritropoyetina); TNFα crónico más bien produce caquexia y anemia inflamatoria.","c":"Falsa: solo el TNFα señaliza por receptores de la familia {{TNFR}}; el receptor de la IL-1 pertenece a la familia {{IL-1R/TLR}} (dominio intracelular TIR, señaliza vía MyD88-NF-κB).","d":"Falsa: son citocinas de la inmunidad {{innata}}/inflamación (macrófagos); las características de Th2 son {{IL-4, IL-5, IL-13}}.","e":"Falsa: a es verdadera."},"expl":"TNFα e IL-1 (con IL-6) son el trío proinflamatorio del macrófago: activación endotelial para el reclutamiento leucocitario, fiebre, fase aguda hepática y potenciación de los fagocitos. Sus receptores son de familias distintas (TNFR vs IL-1R/TIR).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (citocinas proinflamatorias TNF, IL-1, IL-6)","nota":null},{"k":"REC-01","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T4 · Complemento","sub":"Proteasas del sistema inmune (complemento y gránulos)","idioma":"castellano","enun":"¿Cuál de las siguientes proteínas no es una proteasa?","ops":{"a":"Catepsina B","b":"Lisozima","c":"MASP1","d":"C1r,s","e":"C3b4b"},"cor":"b","razones":{"a":"Falsa (sí es proteasa): la catepsina B es una {{proteasa lisosomal}} de los fagocitos, implicada entre otras cosas en el procesamiento antigénico.","b":"CORRECTA: la lisozima NO es una proteasa — es una {{glucosidasa (muramidasa)}} que rompe el {{peptidoglicano}} de la pared bacteriana (enlace NAM-NAG), no enlaces peptídicos de proteínas.","c":"Falsa (sí es proteasa): MASP1 es una {{serina proteasa}} asociada a MBL en la vía de las lectinas del complemento.","d":"Falsa (sí son proteasas): C1r y C1s son las {{serina proteasas}} del complejo C1 de la vía clásica; C1s escinde C4 y C2.","e":"Falsa (sí es proteasa): las convertasas del complemento (C4b2a, C3bBb) tienen actividad {{proteolítica}} — escinden C3/C5."},"expl":"El truco de esta familia es identificar la que no corta proteínas: la lisozima degrada peptidoglicano (azúcares), mientras que catepsinas, MASPs, C1r/C1s y las convertasas son todas proteasas. En la variante de Biotec 2014 el intruso era C1q (proteína de reconocimiento, sin actividad enzimática).","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 4 (complemento: C1r/C1s, MASPs, convertasas); TEMA 3 (lisozima)","nota":"La opción e aparece como 'C3b4b' en el OCR — probablemente errata por una convertasa (C4b2a/C3bBb); en cualquier caso es proteasa y no cambia la respuesta. [REPE: proteasas también en Biotec 2014-1º q19, allí la respuesta era C1q]"},{"k":"REC-02","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T3 · Inmunidad innata","sub":"Gránulos del eosinófilo","idioma":"castellano","enun":"¿Qué contienen los eosinófilos en sus gránulos?","ops":{"a":"PBP","b":"IL-12","c":"INFgamma","d":"IL-5","e":"Perforina"},"cor":"a","razones":{"a":"CORRECTA: los gránulos del eosinófilo contienen la {{proteína básica principal (PBP/MBP)}} y la {{proteína catiónica del eosinófilo (ECP)}}, tóxicas para helmintos.","b":"Falsa: la IL-12 es una citocina secretada sobre todo por {{células dendríticas y macrófagos}} activados; no es un contenido granular del eosinófilo.","c":"Falsa: el IFN-gamma (interferón gamma) lo producen {{Th1 y células NK}}; no está en los gránulos del eosinófilo.","d":"Falsa: la IL-5 no está DENTRO de los gránulos del eosinófilo — es la citocina (de {{Th2}}) que {{estimula y activa}} a los eosinófilos.","e":"Falsa: la perforina es propia de los gránulos de {{linfocitos T CD8 citotóxicos y células NK}}, no del eosinófilo."},"expl":"Los gránulos del eosinófilo contienen proteínas catiónicas preformadas — PBP/MBP y ECP — responsables de su toxicidad antihelmíntica. Ojo al distractor IL-5: es la citocina que activa al eosinófilo, no su contenido granular.","nivel":"SALE_SEGURO","reina":"R20","clave":"razonada","conf":"ALTA","diapo":"TEMA 3 (eosinófilo)","nota":"[REPE: cayó doble en 2026 (Q12, Q35) y en 2017 q31 — apuesta muy fuerte]"},{"k":"REC-03","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T12 · Activación linfocitaria","sub":"Señalización del TCR — ZAP-70","idioma":"castellano","enun":"¿Cuál de las siguientes es una kinasa con región SH2?","ops":{"a":"Zap-70","b":"JAK","c":"STAT","d":"Lat","e":"C45"},"cor":"a","razones":{"a":"CORRECTA: ZAP-70 es una {{tirosina kinasa}} con {{dos dominios SH2}} en tándem con los que se ancla a los ITAMs fosforilados de la cadena {{zeta (ζ) del CD3}}.","b":"Falsa: las JAK son tirosina kinasas de los receptores de citocinas, pero su reclutamiento no depende de dominios SH2 propios (usan dominio {{FERM}}); la kinasa-SH2 canónica del temario es ZAP-70.","c":"Falsa: los STAT sí tienen dominio {{SH2}}, pero NO son kinasas — son {{factores de transcripción}} que fosforilan las JAK.","d":"Falsa: LAT es una proteína {{adaptadora (scaffold)}} transmembrana sin actividad kinasa; al fosforilarse recluta otras moléculas de señalización.","e":"Falsa: CD45 es una {{fosfatasa}} (quita fosfatos, lo contrario de una kinasa) que activa a Lck desfosforilándola."},"expl":"En la cascada del TCR: Lck fosforila los ITAMs de CD3ζ, ZAP-70 (kinasa con doble SH2) se une a ellos y fosforila LAT (adaptador). STAT tiene SH2 pero no es kinasa; CD45 es fosfatasa.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 12 (ZAP-70 asociada a la cadena ζ del CD3)","nota":"Opción e 'C45' = errata de OCR por CD45. [REPE: ZAP-70 también en Abril 2017 q23 y Abril 2020 q7]"},{"k":"REC-04","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T2 · Anatomía del sistema inmune","sub":"Anatomía del timo","idioma":"castellano","enun":"Marca la correcta sobre el timo:","ops":{"a":"Está compuesto por corteza y médula","b":"Las mTCS y cTCS crean AIRE","c":"Los linfocitos B están en PALS","d":"El timo sustituye al bazo como órgano hematopoiético en la etapa adulta","e":"Todas las anteriores son correctas"},"cor":"a","razones":{"a":"CORRECTA: cada lobulillo tímico tiene {{corteza}} (externa, selección {{positiva}} sobre timocitos DP) y {{médula}} (interna, selección {{negativa}}).","b":"Falsa: AIRE lo expresan SOLO las {{mTECs (células epiteliales tímicas medulares)}}; las cTECs (corticales) NO lo expresan — hacen la selección positiva.","c":"Falsa: el PALS es la vaina linfoide periarteriolar del {{bazo}} y es zona de linfocitos {{T}}, no de B (y además no está en el timo).","d":"Falsa: en el adulto la hematopoyesis reside en la {{médula ósea}}; el timo de hecho {{involuciona}} con la edad, no asume hematopoyesis.","e":"Falsa: solo la opción a es correcta, por lo que 'todas' no puede serlo."},"expl":"Timo = órgano linfoide primario con corteza (selección positiva, cTECs) y médula (selección negativa, mTECs con AIRE). El PALS pertenece al bazo y la hematopoyesis adulta a la médula ósea.","nivel":"SALE_SEGURO","reina":"R9","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (timo); TEMA 9 (selección tímica, AIRE)","nota":"'mTCS y cTCS' = errata de OCR por mTECs y cTECs. [REPE: timo también en Biotec 2014-1º q13]"},{"k":"REC-05","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T2 · Anatomía del sistema inmune","sub":"Órganos linfoides primarios","idioma":"castellano","enun":"Respecto a los órganos linfoides primarios podemos decir que todos:","ops":{"a":"Están irrigados por vasos linfáticos","b":"Se encargan de diferenciar las células precursoras linfoides","c":"Coordinan la respuesta adquirida","d":"Todas las anteriores son falsas"},"cor":"b","razones":{"a":"Falsa: los órganos linfoides primarios (timo, médula ósea) carecen de {{vasos linfáticos aferentes}} — a diferencia del ganglio linfático, que sí los recibe.","b":"CORRECTA: la función definitoria de los órganos primarios (médula ósea, timo, hígado fetal) es la {{generación y maduración}} de linfocitos a partir de {{precursores linfoides}}.","c":"Falsa: coordinar la respuesta adquirida frente al antígeno es función de los órganos linfoides {{secundarios}} (ganglios, bazo, MALT).","d":"Falsa: la opción b es verdadera, así que 'todas falsas' no se sostiene."},"expl":"Primarios (médula ósea, timo, hígado fetal) = donde los linfocitos se generan y maduran sin antígeno; secundarios = donde se montan las respuestas frente al antígeno. Esta división es la pregunta más básica de T2.","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (órganos limfoides primaris: fetge fetal, moll de l'os i timus)","nota":"Solo trae 4 opciones en la fuente."},{"k":"REC-06","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T2 · Anatomía del sistema inmune","sub":"Centro germinal — composición celular","idioma":"castellano","enun":"En los centros germinales:","ops":{"a":"Nunca hay linfocitos T","b":"Sólo hay linfocitos B","c":"En su mayoría hay centrocitos, centroblastos y FDCs","d":"Es donde se produce la selección positiva de los linfocitos T","e":"Todas las anteriores son falsas"},"cor":"c","razones":{"a":"Falsa: en el centro germinal SÍ hay linfocitos T — los {{T foliculares helper (Tfh)}}, imprescindibles para seleccionar a los centrocitos.","b":"Falsa: además de B hay {{Tfh}}, {{FDCs (células dendríticas foliculares)}} y macrófagos de cuerpos tingibles.","c":"CORRECTA: el centro germinal está poblado mayoritariamente por {{centroblastos}} (zona oscura, proliferan e hipermutan), {{centrocitos}} (zona clara, se seleccionan) y {{FDCs}} que retienen el antígeno.","d":"Falsa: la selección positiva de los linfocitos T ocurre en la {{corteza del timo}}, nunca en el centro germinal (allí se seleccionan B de alta afinidad).","e":"Falsa: la c es cierta."},"expl":"El centro germinal (folículo secundario) es el escenario de la hipermutación somática y el cambio de isotipo: centroblastos proliferando en la zona oscura, centrocitos compitiendo por antígeno en las FDCs de la zona clara, con ayuda Tfh.","nivel":"SALE_SEGURO","reina":"R24","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (reacció de centre germinal: centroblasts/centrocits)","nota":"[REPE: centros germinales también en Abril 2017 q30; 2025 dedicó ráfaga Q12-Q16 a esta anatomía]"},{"k":"REC-07","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T10 · Citocinas y quimiocinas","sub":"Eje quimiocina-receptor CXCL13–CXCR5","idioma":"castellano","enun":"El CXCR5 es el receptor de:","ops":{"a":"CXCL13","b":"CC21","c":"CD8","d":"CCL13","e":"CC13"},"cor":"a","razones":{"a":"CORRECTA: CXCR5 es el receptor de {{CXCL13}}, quimiocina producida por las {{FDCs del folículo}} que atrae a los linfocitos {{B}} hacia la zona B.","b":"Falsa: 'CC21' escrito así no existe; CCL21 (junto a CCL19) es ligando de {{CCR7}} y organiza la {{zona T/paracórtex}}, no se une a CXCR5.","c":"Falsa: CD8 es un {{correceptor del TCR}} que se une a MHC de clase I — no es una quimiocina ni ligando de CXCR5.","d":"Falsa: CCL13 es una quimiocina de la familia {{CC}}; los receptores CXCR solo unen quimiocinas {{CXC}}, y el ligando de CXCR5 es CXCL13.","e":"Falsa: 'CC13' no es nomenclatura válida de quimiocina; es un distractor por confusión con CXCL13/CCL13."},"expl":"Pareja de memoria obligada: CXCL13 (de las FDCs) ↔ CXCR5 (en linfocitos B) organiza el folículo; CCL19/CCL21 ↔ CCR7 organiza la zona T. El profesor recicla esta pareja y sus distractores con nomenclatura inventada.","nivel":"SALE_SEGURO","reina":"R15","clave":"razonada","conf":"ALTA","diapo":"TEMA 2 (les cèl·lules residents de la zona B secreten CXCL13, lligand de CXCR5)","nota":"[REPE: también Abril 2017 q15 y Abril 2016 #29]"},{"k":"REC-08","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T12 · Activación linfocitaria","sub":"Moléculas de superficie del linfocito B — B7","idioma":"castellano","enun":"Los linfocitos B expresan:","ops":{"a":"CD 28","b":"CD4","c":"CD8","d":"B7","e":"Todas las anteriores"},"cor":"d","razones":{"a":"Falsa: CD28 es la molécula coestimuladora del linfocito {{T}} — recibe la señal 2 al unirse a B7; el B no la expresa, la provoca.","b":"Falsa: CD4 es el correceptor de los linfocitos {{T helper}} (une MHC de clase {{II}}); no es un marcador del linfocito B.","c":"Falsa: CD8 es el correceptor de los linfocitos {{T citotóxicos}} (une MHC de clase {{I}}); tampoco lo expresa el B.","d":"CORRECTA: el linfocito B, como {{célula presentadora de antígeno (APC)}}, expresa {{B7 (CD80/CD86)}} al activarse, con la que da la señal coestimuladora al CD28 del T.","e":"Falsa: solo la d es correcta."},"expl":"El linfocito B es una APC profesional: expresa MHC-II y, al activarse, B7 (CD80/86) para coestimular al T vía CD28. CD28, CD4 y CD8 son moléculas del linfocito T, no del B.","nivel":"SALE_SEGURO","reina":"R17","clave":"razonada","conf":"ALTA","diapo":"TEMA 6/TEMA 12 (coestimulación B7-CD28)","nota":null},{"k":"REC-09","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T7 · MHC y presentación","sub":"Evasión viral de la presentación — bloqueo de TAP","idioma":"catalan","enun":"El bloqueig de la presentació d'antigens virals mitjançant el bloqueig de les molècules TAP, és propi del següent virus:","ops":{"a":"Virus VIH","b":"Virus varicel·la zòster","c":"Virus herpes símplex","d":"Citomegalovirus","e":"Virus Epstein-Bar"},"cor":"c","razones":{"a":"Falsa: el VIH evade la respuesta sobre todo por {{variación antigénica}} y disminuyendo MHC-I vía {{Nef}}, no bloqueando TAP.","b":"Falsa: el virus varicela-zóster interfiere con la presentación por otros mecanismos; el bloqueo clásico de TAP del temario no es suyo.","c":"CORRECTA: el virus herpes simple (HSV) produce la proteína {{ICP47}}, que bloquea el transportador {{TAP}} e impide que los péptidos entren al retículo endoplásmico → no hay carga de {{MHC de clase I}}.","d":"Falsa: el citomegalovirus (CMV) evade la vía MHC-I por otras proteínas (p. ej. degradando o reteniendo MHC-I en el retículo), no por el bloqueo de TAP que pregunta el profesor.","e":"Falsa: el virus de Epstein-Barr evade principalmente inhibiendo el {{proteasoma}} (EBNA1 resiste la degradación), no bloqueando TAP."},"expl":"Respuesta fija del temario: HSV → ICP47 → bloquea TAP → los péptidos no entran al RE → MHC-I vacío → la célula infectada se esconde de los CD8. Ha caído por lo menos tres veces con la misma respuesta.","nivel":"PUEDE_SALIR","reina":null,"clave":"razonada","conf":"ALTA","diapo":"TEMA 7 (TAP1:TAP2)","nota":"[REPE: también Abril 2020 q30 y preguntas cortas q23 — siempre HSV]"},{"k":"REC-10","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T12 · Activación linfocitaria","sub":"Subpoblaciones Th — factores de transcripción","idioma":"catalan","enun":"Un limfòcit T expressa el factor de transcripció T-bet. De quin tipus de limfòcit es tracta?","ops":{"a":"Limfòcit TCD4+ Th1","b":"Limfòcit TCD4+ Th2","c":"Limfòcit TCD4+ Th17","d":"Limfòcit TCD4+ Treg","e":"Limfòcit TCD4+ Th3"},"cor":"a","razones":{"a":"CORRECTA: {{T-bet}} es el factor de transcripción maestro de {{Th1}} (inducido por IL-12/STAT4; produce {{IFN-gamma}} y activa macrófagos).","b":"Falsa: el factor maestro de Th2 es {{GATA-3}} (citocinas IL-4, IL-5, IL-13).","c":"Falsa: el factor maestro de Th17 es {{RORγt}} (citocinas IL-17, activa neutrófilos).","d":"Falsa: el factor maestro de las Treg es {{FoxP3}} (producen IL-10 y TGF-β).","e":"Falsa: las Th3 son reguladoras productoras de {{TGF-β}}; no se definen por T-bet."},"expl":"Tabla estrella del examen: Th1–T-bet–IFN-γ (macrófagos) / Th2–GATA-3–IL-4,5,13 / Th17–RORγt–IL-17 (neutrófilos) / Treg–FoxP3–IL-10,TGF-β. Se pregunta cualquier casilla en cualquier dirección.","nivel":"SALE_SEGURO","reina":"R12","clave":"razonada","conf":"ALTA","diapo":"TEMA 10/TEMA 12 (subpoblacions Th)","nota":null},{"k":"REC-11","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T9 · Ontogenia linfocitos B y T","sub":"Hipermutación somática — AID","idioma":"catalan","enun":"Quin dels següents enzims o factors està directament implicat en la hipermutació somàtica?","ops":{"a":"RAG-1","b":"ADA","c":"AIRE","d":"GATA-3","e":"AID"},"cor":"e","razones":{"a":"Falsa: RAG-1 (con RAG-2) es la {{endonucleasa}} de la recombinación {{V(D)J}} en precursores B/T — actúa antes del encuentro con antígeno, no en el centro germinal.","b":"Falsa: la ADA (adenosina desaminasa) es una enzima del metabolismo de purinas; su déficit causa {{inmunodeficiencia combinada grave (SCID)}}, sin relación con la hipermutación.","c":"Falsa: AIRE es el factor de transcripción de las {{mTECs}} del timo que permite expresar antígenos periféricos para la {{selección negativa}}.","d":"Falsa: GATA-3 es el factor de transcripción maestro de {{Th2}}, no una enzima mutadora.","e":"CORRECTA: la AID ({{citidina desaminasa inducida por activación}}) desamina citosinas del DNA de las regiones V en el {{centro germinal}} — imprescindible tanto para la {{hipermutación somática}} como para el cambio de isotipo."},"expl":"AID = la enzima del centro germinal (hipermutación somática + cambio de clase); RAG-1/2 = la enzima del reordenamiento V(D)J en médula ósea/timo. Separar estos dos escenarios es un clásico del examen.","nivel":"SALE_SEGURO","reina":"R6","clave":"razonada","conf":"ALTA","diapo":"TEMA 9/TEMA 12 (hipermutació somàtica, AID)","nota":null},{"k":"REC-12","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T9 · Ontogenia linfocitos B y T","sub":"Tolerancia central — mecanismos","idioma":"catalan","enun":"Quin dels següents mecanismes no és un mecanisme de tolerància central dels limfòcits B i/o T?","ops":{"a":"Anèrgia","b":"Selecció negativa","c":"Revisió del receptor","d":"Generació de cèl·lules T reguladores","e":"Mort per negligència"},"cor":"e","razones":{"a":"Falsa (sí es tolerancia central): en la tolerancia central B, el reconocimiento de autoantígeno {{soluble/monovalente}} en la médula ósea induce {{anergia}}.","b":"Falsa (sí es tolerancia central): la {{selección negativa}} (deleción clonal de autorreactivos de alta afinidad) es EL mecanismo central por excelencia, en timo y médula ósea.","c":"Falsa (sí es tolerancia central): la {{edición/revisión del receptor}} permite al B inmaduro autorreactivo reordenar una nueva {{cadena ligera}} y escapar de la deleción.","d":"Falsa (sí es tolerancia central): en la médula tímica se generan las {{Treg naturales (tTreg)}} a partir de timocitos con afinidad intermedia por lo propio.","e":"CORRECTA (no es un mecanismo de tolerancia): la {{muerte por negligencia}} es la apoptosis del timocito que NO reconoce MHC propio (falla la {{selección positiva}}) — elimina células inútiles, no autorreactivas, así que no es tolerancia."},"expl":"Tolerancia central = deleción (selección negativa), edición del receptor, anergia (B con antígeno soluble) y generación de Treg naturales. La muerte por negligencia pertenece a la selección positiva fallida: elimina timocitos que no ven MHC, no autorreactivos.","nivel":"SALE_SEGURO","reina":"R9","clave":"razonada","conf":"MEDIA","diapo":"TEMA 9 (selecció tímica i tolerància central)","nota":"Sin clave en la fuente; respuesta razonada según Abbas. Confianza MEDIA porque algún temario clasifica la anergia solo como periférica — pero en B la anergia central por antígeno soluble está en Abbas, y la muerte por negligencia nunca se lista como mecanismo de tolerancia."},{"k":"REC-13","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T9 · Ontogenia linfocitos B y T","sub":"Tolerancia — afirmaciones","idioma":"catalan","enun":"Quina de les següents afirmacions sobre els mecanismes de tolerància és certa?","ops":{"a":"Pel que fa a la tolerància central de limfòcits B, la unió a una molècula pròpia multivalent, present en una membrana cel·lular, comporta anèrgia de la cèl·lula.","b":"La molècula CTLA-4 actua durant la deleció de limfòcits T autoreactius","c":"Només una minoria de timòcits arriben a l'estadiatge de limfòcit T (<5%)","d":"Podem considerar que la tolerància és sinònim de supressió immunològica","e":"Les cèl·lules Tregs (T reguladores) produeixen fonamentalment IL-1 i TNF-alfa."},"cor":"c","razones":{"a":"Falsa: el autoantígeno {{multivalente de membrana}} produce {{deleción o edición del receptor}}, no anergia; la anergia central B la induce el antígeno {{soluble/monovalente}}.","b":"Falsa: CTLA-4 actúa en la tolerancia {{periférica}} — compite con CD28 por {{B7}} e induce anergia/inhibición; no participa en la deleción tímica.","c":"CORRECTA: las selecciones positiva y negativa son tan exigentes que solo sobrevive {{menos del 5%}} (~2-5%) de los timocitos; el resto muere por {{apoptosis}} (negligencia o deleción).","d":"Falsa: la tolerancia es la {{ausencia de respuesta específica frente a lo propio}} manteniendo la respuesta frente a lo extraño; la inmunosupresión es inespecífica — no son sinónimos.","e":"Falsa: las Treg producen citocinas {{inhibidoras: IL-10 y TGF-beta}}; IL-1 y TNF-alfa son proinflamatorias."},"expl":"Del 100% de timocitos que entran, <5% sale como linfocito T maduro. Regla de la tolerancia B central: multivalente-membrana → deleción/edición; soluble → anergia. CTLA-4 y las Treg (IL-10/TGF-β) son tolerancia periférica.","nivel":"SALE_SEGURO","reina":"R9","clave":"razonada","conf":"ALTA","diapo":"TEMA 9 (selecció tímica)","nota":"Marcada [¿SCOPE?] en el corpus (tolerancia roza el 2P), pero el contenido — selección tímica, CTLA-4, Treg — es de T9/T12 básico. Incluida."},{"k":"REC-14","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T12 · Activación linfocitaria","sub":"Subpoblaciones Th — Th17 y neutrófilos","idioma":"castellano","enun":"Cuál de las siguientes poblaciones de linfocitos T CD4 tiene función activadora de neutrófilos?","ops":{"a":"Th0","b":"Th1","c":"Th2","d":"Th3","e":"Th17"},"cor":"e","razones":{"a":"Falsa: Th0 es el estadio {{indiferenciado}} tras la activación, aún sin perfil efector definido.","b":"Falsa: Th1 (IFN-gamma) activa {{macrófagos}}, no neutrófilos — su diana son los patógenos {{intracelulares}}.","c":"Falsa: Th2 (IL-4, IL-5, IL-13) activa {{eosinófilos, mastocitos}} y respuesta frente a {{helmintos}}/alergia.","d":"Falsa: Th3 es un perfil {{regulador}} productor de TGF-beta, sin función activadora de neutrófilos.","e":"CORRECTA: Th17, mediante {{IL-17}} (y IL-22), induce quimiocinas y G-CSF que reclutan y activan {{neutrófilos}} — clave frente a {{bacterias extracelulares y hongos}}."},"expl":"Cada perfil Th tiene su célula diana: Th1→macrófagos, Th2→eosinófilos/mastocitos, Th17→neutrófilos. La tríada inductora de Th17 (IL-6 + IL-23 + TGF-β) y su factor RORγt completan la pregunta reciclada.","nivel":"SALE_SEGURO","reina":"R12","clave":"razonada","conf":"ALTA","diapo":"TEMA 10 (Th17: IL-17A, IL-17F)","nota":"[REPE: Th17 también en preguntas cortas q13 y G49]"},{"k":"REC-15","examen":"📜 Recopilatorio (sin año)","real":0,"origen":"RECOPILATORIO","tema":"T12 · Activación linfocitaria","sub":"Respuesta B a antígenos T-dependientes","idioma":"castellano","enun":"En respuesta de linfocitos B a antígenos T-dependientes, cuál de las siguientes afirmaciones es falsa?","ops":{"a":"No se genera en pacientes atímicos","b":"No se genera en ausencia de linfocitos T","c":"No es una activación policlonal","d":"Se puede inducir durante la infancia","e":"Requiere que el antígeno tenga epítopos repetidos"},"cor":"e","razones":{"a":"Verdadera (no es la falsa): sin timo no hay linfocitos {{T maduros}}, y sin ayuda T no hay respuesta T-dependiente (p. ej. síndrome de {{DiGeorge}}).","b":"Verdadera (no es la falsa): por definición la respuesta T-dependiente exige la ayuda del {{T helper}} (CD40L-CD40 + citocinas).","c":"Verdadera (no es la falsa): es una activación {{específica de antígeno}} (clones concretos), no policlonal.","d":"Verdadera (no es la falsa): las respuestas T-dependientes (antígenos {{proteicos}}, vacunas conjugadas) funcionan ya en {{lactantes}}; las que fallan en <2 años son las T-independientes frente a polisacáridos.","e":"FALSA (la respuesta): los {{epítopos repetidos}} con entrecruzamiento masivo del BCR son el requisito de los antígenos {{T-INdependientes}} (TI-2, polisacáridos); el antígeno T-dependiente típico es una proteína sin necesidad de repetición."},"expl":" function wireCommon(card,q){

    const on=starred.has(q.k);b.classList.toggle("on",on);b.textContent=on?"★":"☆";updateCount();};

  resp.querySelectorAll(".cloze").forEach(c=>c.onclick=()=>c.classList.toggle("revealed"));
  resp.querySelector(".reveal-words").onclick=e=>{
    const cs=resp.querySelectorAll(".cloze");
    const any=[...cs].some(c=>!c.classList.contains("revealed"));
    cs.forEach(c=>c.classList.toggle("revealed",any));

function pintaLote(){

  const cent=$("centinela");
  app.insertBefore(frag,cent);
  pintadas=hasta;
  if(cent)cent.textContent=pintadas<LISTA.length
    ? `⌛ ${pintadas} de ${LISTA.length} · sigue bajando para ver más`
    : (LISTA.length?"— fin de la lista —":"");

    const a=EX.ans[q.k];
    if(a===undefined){bl++;b.bl++;}
    else if(a===q.cor){ac++;b.ac++;registra(q.k,true);}
    else{fa++;b.fa++;registra(q.k,false);}
  });
  const punt=ac-0.25*fa,nota=punt/EX.list.length*10,tmin=Math.round((Date.now()-EX.t0)/60000);
  const rows=Object.keys(pt).sort((a,c)=>a.localeCompare(c,undefined,{numeric:true})).map(b=>{const x=pt[b];
    return `<tr><td style="text-align:left">${esc(b)}</td><td>${x.n}</td><td>${x.ac}</td><td>${x.fa}</td><td>${x.bl}</td><td>${((x.ac-0.25*x.fa)/x.n*10).toFixed(1)}</td></tr>`;}).join("");
  const res=document.createElement("div");res.className="result";
  res.innerHTML=`<h2>Resultado del simulacro</h2>
    <div class="nota ${nota>=5?"ok":"ko"}">${nota.toFixed(2)} / 10 ${nota>=5?"· ✅ APROBADO":"· ❌ suspenso (se aprueba con ≥5)"}</div>
    <div>${ac} aciertos · ${fa} fallos (−0,25 cada uno) · ${bl} en blanco → ${punt.toFixed(2)} puntos sobre ${EX.list.length} · ⏱ ${tmin} min</div>
    <table><tr><th>Tema</th><th>Preg</th><th>✓</th><th>✗</th><th>—</th><th>Nota</th></tr>${rows}</table>
    <div style="margin-top:12px;font-size:13.5px;color:#67788c">Abajo tienes cada pregunta con su razonamiento abierto (las palabras clave siguen tapadas: destápalas al repasar).</div>`;
  app.prepend(res);
  [...app.querySelectorAll(".card")].forEach(card=>{
    const q=EX.list.find(x=>x.k===card.dataset.k);if(!q)return;
    marcaOpciones(card,q,EX.ans[q.k]);
    if(EX.ans[q.k]===undefined)card.querySelector(".meta").insertAdjacentHTML("beforeend",'<span class="blanco">en blanco</span>');
    card.querySelector(".hint").style.display="none";
    card.querySelector(".resp").classList.add("show");
  });
  window.scrollTo(0,0);
  $("exprog").textContent=`Corregido: ${nota.toFixed(2)}/10`;
}
$("excorregir").onclick=()=>{
  const sin=EX.list.length-Object.keys(EX.ans).length;
  if(!EX.done&&sin>0&&!confirm(`Te quedan ${sin} preguntas en blanco (valen 0, no restan). ¿Corregir ya?`))return;
  corrige();
};
$("exsalir").onclick=()=>{
  if(!EX.done&&Object.keys(EX.ans).length&&!confirm("Vas a salir sin corregir y se perderá el simulacro. ¿Seguro?"))return;
  clearInterval(EX.timer);setMode("study");
};
function setMode(m){
  MODE=m;clearInterval(EX.timer);
  $("mStudy").classList.toggle("active",m==="study");
  $("mExam").classList.toggle("active",m==="exam");
  $("exbar").style.display="none";
  ["fOrigen","fNivel","fTema","fClave","fMarc","fFall","fOrden","reshuffle","count","pos"].forEach(id=>{
    const el=$(id);if(el)el.style.display=(m==="study"&&(id!=="reshuffle"||fOr.value==="rand"))?"":"none";});
  m==="study"?renderStudy():renderExamSetup();
  window.scrollTo(0,0);
}
$("mStudy").onclick=()=>setMode("study");
$("mExam").onclick=()=>setMode("exam");
function updatePos(){
  if(MODE!=="study")return;
  const cards=app.querySelectorAll(".card"),pos=$("pos"),n=cards.length;
  if(!n){pos.textContent="";return;}
  const y=window.scrollY+$("hdr").offsetHeight+10;
  let lo=0,hi=n-1,cur=0;
  while(lo<=hi){const mid=(lo+hi)>>1;
    if(cards[mid].offsetTop<=y){cur=mid;lo=mid+1;}else{hi=mid-1;}}
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4)cur=n-1;
  pos.textContent=`📍 ${cur+1} / ${LISTA.length} · quedan ${LISTA.length-1-cur}`;
}
let _tick=false;
window.addEventListener("scroll",()=>{if(!_tick){_tick=true;requestAnimationFrame(()=>{updatePos();_tick=false;});}},{passive:true});
[fOg,fNv,fT,fC,fM,fF].forEach(s=>s.onchange=()=>renderStudy());
fOr.onchange=()=>{const r=fOr.value==="rand";$("reshuffle").style.display=r?"":"none";if(r)buildShuffle();window.scrollTo(0,0);renderStudy();};
$("reshuffle").onclick=()=>{buildShuffle();window.scrollTo(0,0);renderStudy();};
renderStudy();
</script></body></html>
